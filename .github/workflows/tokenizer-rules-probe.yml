name: Tokenizer Rules Build

on:
  push:
    branches:
      - docs/tokenizer-softcode-hardening-20260815
    paths:
      - .github/workflows/tokenizer-rules-probe.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/tokenizer-softcode-hardening-20260815
          fetch-depth: 1

      - name: Build tokenizer rules UI
        run: |
          python3 scripts/tmp_build_tokenizer_rules_ui.py
          node --check stage-assets/tokenizer-rules-probe/ch_17_tokenizer_ui.expanded.js
          node --check src/ch_17_tokenizer_ui.js
          node --check src/ch_19_tokenizer_service.js

      - name: Validate tokenizer and release contracts
        run: |
          python3 scripts/validate_es5.py .
          node scripts/test_tokenizer_core.js
          bash scripts/release_preflight.sh --settings-tabs-beta

      - name: Commit final implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tokenizer-rules-probe.yml
          git rm scripts/tmp_build_tokenizer_rules_ui.py
          git rm -rf stage-assets/tokenizer-rules-probe
          git add src/ch_17_tokenizer_ui.js src/ch_19_tokenizer_service.js module-manifest.json scripts/manifest_contract.py scripts/release_preflight.sh
          git commit -m "feat: add isolated multi-config tokenizer rules"
          git push origin HEAD:docs/tokenizer-softcode-hardening-20260815
