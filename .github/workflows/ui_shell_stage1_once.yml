name: UI Shell Stage1 Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/ui_shell_stage1_once.yml

permissions:
  contents: write

jobs:
  ui-shell-stage1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build registry-only UI shell
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/ui-shell-stage1.txt) 2>&1
          python3 tools/ui_shell_stage1_20260815.py
          node --check ClipHub.js
          node --check src/ch_15_app.js
          node --check src/ch_16_ui_shell.js
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict | tee /tmp/ui-shell-color.txt
          grep '^HIGH=0 WARN=0 ' /tmp/ui-shell-color.txt
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check

      - name: Validate migration boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import subprocess

          root = pathlib.Path('.')
          manifest = json.loads((root / 'module-manifest.json').read_text(encoding='utf-8'))
          assert manifest['moduleSetVersion'] == '20260815.11'
          assert manifest['sourceRef'] == 'beta-regex-settings-tabs-20260814'
          assert len(manifest['modules']) == 17

          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()

          for item in manifest['modules']:
              path = root / item['path']
              assert path.is_file(), path
              assert blob_sha(path.read_bytes()) == item['sha'], item['path']

          shell = (root / 'src/ch_16_ui_shell.js').read_text(encoding='utf-8')
          app = (root / 'src/ch_15_app.js').read_text(encoding='utf-8')
          entry = (root / 'ClipHub.js').read_text(encoding='utf-8')

          assert 'MODULE_VERSION: 1' in shell
          assert 'migrationStage: "registry_only"' in shell
          assert 'primaryWindowMode: false' in shell
          assert 'legacyWindowBridge: true' in shell
          assert 'hostAttached: false' in shell
          assert 'registerPage({ id: "home"' in shell
          assert 'registerPage({ id: "settings"' in shell
          assert 'registerPage({ id: "regex_rules"' in shell
          assert 'registerPage({ id: "editor"' in shell
          assert 'registerPage({ id: "translation"' in shell
          assert 'registerPage({ id: "tokenizer"' in shell
          assert 'MODULE_VERSION: 21' in app
          assert '"Translation", "UIShell"' in app
          assert 'uiShell: uiShell' in app
          assert '"ch_16_ui_shell.js"' in entry

          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {
              'ClipHub.js',
              'module-manifest.json',
              'scripts/release_preflight.sh',
              'src/ch_15_app.js',
              'src/ch_16_ui_shell.js',
          }
          assert changed == expected, (changed, expected)

          forbidden = {
              'src/ch_03_database.js',
              'src/ch_06_repository.js',
              'src/ch_07_theme.js',
              'src/ch_08_window.js',
              'src/ch_09_list.js',
              'src/ch_10_editor.js',
              'src/ch_11_filter.js',
              'src/ch_12_translation.js',
              'src/ch_13_settings.js',
              'src/ch_17_tokenizer_ui.js',
          }
          assert not (changed & forbidden), changed & forbidden
          print('UI shell stage1 boundary validation: passed')
          print('No existing visual/window/business module changed')
          PY

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shell-stage1-log
          path: /tmp/ui-shell-stage1.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: Commit UI shell stage1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/ui_shell_stage1_once.yml
          git rm -f tools/ui_shell_stage1_20260815.py
          git add ClipHub.js module-manifest.json scripts/release_preflight.sh \
                  src/ch_15_app.js src/ch_16_ui_shell.js
          git diff --cached --check
          git commit -m "建立单主窗口UIShell页面栈基础"
          git push origin HEAD:beta-regex-settings-tabs-20260814
