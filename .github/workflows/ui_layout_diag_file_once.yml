name: UI Layout Diag File Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/ui_layout_diag_file_once.yml

permissions:
  contents: write

jobs:
  capture-ui-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture current packed UI functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, json, pathlib, re
          root = pathlib.Path('.')
          def expanded(path):
              text = path.read_text(encoding='utf-8')
              a = re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);', text, re.S)
              if a is None: return text
              pieces = re.findall(r'"(?:\\.|[^"\\])*"', a.group(1))
              return gzip.decompress(base64.b64decode(''.join(json.loads(x) for x in pieces))).decode('utf-8')
          def extract(text, name):
              m = re.search(r'(^|\n)([ \t]*)function\s+' + re.escape(name) + r'\s*\(', text, re.M)
              if m is None: return '<missing>'
              start = m.start(2); brace = text.find('{', m.end()); depth = 0; quote = None; esc = False; lc = False; bc = False; i = brace
              while i < len(text):
                  c = text[i]; n = text[i+1] if i+1 < len(text) else ''
                  if lc:
                      if c == '\n': lc = False
                  elif bc:
                      if c == '*' and n == '/': bc = False; i += 1
                  elif quote is not None:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == quote: quote = None
                  else:
                      if c == '/' and n == '/': lc = True; i += 1
                      elif c == '/' and n == '*': bc = True; i += 1
                      elif c in ('\"', "'"): quote = c
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0: return text[start:i+1]
                  i += 1
              return '<unterminated>'
          manifest = json.loads((root/'module-manifest.json').read_text(encoding='utf-8'))
          filter_src = expanded(root/'src/ch_11_filter.js')
          settings_src = expanded(root/'src/ch_13_settings.js')
          out = []
          out += ['moduleSetVersion=' + str(manifest.get('moduleSetVersion')), 'sourceRef=' + str(manifest.get('sourceRef')), 'moduleCount=' + str(len(manifest.get('modules', [])))]
          for label, src in [('filter', filter_src), ('settings', settings_src)]:
              m = re.search(r'MODULE_NAME:\s*[\"\']([^\"\']+)[\"\']\s*,\s*MODULE_VERSION:\s*(\d+)', src, re.S)
              out.append(label + 'Module=' + (m.group(1)+':'+m.group(2) if m else 'unknown'))
          for label, src, names in [
              ('FILTER', filter_src, ['headerMetrics','buildSearchHeader','createPanelCache']),
              ('SETTINGS', settings_src, ['makeSettingsTabBar','makeSettingsSubpageHeader','makeSection','makeSectionTitle','buildPage','settingsRootTabsActive','setSettingsTab'])
          ]:
              out.append('\n=== ' + label + ' ===')
              for name in names:
                  out.append('\n--- ' + name + ' ---\n' + extract(src, name))
          (root/'ui_layout_diag_current.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
      - name: Commit diagnostic snapshot and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/ui_layout_diag_file_once.yml
          git add ui_layout_diag_current.txt
          git commit -m "记录当前UI布局框架基线"
          git push origin HEAD:beta-regex-settings-tabs-20260814
