name: Beta Stage16B1 Finalize
on:
  push:
    branches:
      - beta-pagination-stage10-20260808
    paths:
      - .github/stage16b1-ping.txt
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Stage16B.1 wrapper to Filter60
        shell: bash
        run: |
          set -euo pipefail
          git show 338a811e538ab526b59eed05102d4f4b66f19953:src/ch_11_filter.js > /tmp/stage16b_loader.js
          python - <<'PY'
          import base64,gzip,glob,json,pathlib
          wrapper=pathlib.Path('src/ch_11_filter.js').read_text(encoding='utf-8')
          base=pathlib.Path('/tmp/stage16b_loader.js').read_text(encoding='utf-8')
          if 'Stage 16B.1 safe Holder rebind ES5 loader' not in wrapper:
              raise SystemExit('Stage16B.1 wrapper header missing')
          if 'BASE_BLOB_SHA1 = "160cbf0aa482868042c89dad33eae990ccd93488"' not in wrapper:
              raise SystemExit('baseline sha pin missing')
          start=wrapper.index('    function replaceOnce(')
          end=wrapper.index('\n    try {\n        eval(transformBaselineLoader', start)
          pure=wrapper[start:end]
          harness='var __base='+json.dumps(base)+';\n'+pure+'\nvar __loader=transformBaselineLoader(__base);\nrequire("fs").writeFileSync("/tmp/stage16b1_loader.js",__loader);\n'
          pathlib.Path('/tmp/stage16b1_wrapper_harness.js').write_text(harness,encoding='utf-8')
          parts=sorted(glob.glob('stage-assets/pagination-stage9/ch11_full_v8s_*.b64'))
          if len(parts)!=8: raise SystemExit('expected 8 packed parts')
          packed=''.join(pathlib.Path(p).read_text(encoding='utf-8').strip() for p in parts)
          stable=gzip.decompress(base64.b64decode(packed)).decode('utf-8')
          pathlib.Path('/tmp/filter56_stable.json').write_text(json.dumps(stable),encoding='utf-8')
          PY
          node --check src/ch_11_filter.js
          node /tmp/stage16b1_wrapper_harness.js
          node --check /tmp/stage16b1_loader.js
          python - <<'PY'
          import json,pathlib
          loader=pathlib.Path('/tmp/stage16b1_loader.js').read_text(encoding='utf-8')
          stable=json.loads(pathlib.Path('/tmp/filter56_stable.json').read_text(encoding='utf-8'))
          start=loader.index('    function replaceOnceStrict(')
          end=loader.index('\n    try {',start)
          pure=loader[start:end]
          harness=(
              'var __source='+json.dumps(stable)+';\n'+pure+'\n'+
              'var __out=transformRecycleFixSource(transformRecycleSource(transformCardHolderSource(transformSource(__source))));\n'+
              'require("fs").writeFileSync("/tmp/filter60.js",__out);\n'
          )
          pathlib.Path('/tmp/filter60_harness.js').write_text(harness,encoding='utf-8')
          PY
          node /tmp/filter60_harness.js
          node --check /tmp/filter60.js
          ! grep -Eq '(^|[^A-Za-z0-9_])(let|const|class)[[:space:]]|=>' /tmp/filter60.js
          grep -Fq 'MODULE_VERSION: 60' /tmp/filter60.js
          grep -Fq 'holderRebindAttemptCount' /tmp/filter60.js
          grep -Fq 'holderRebindEligibleCount' /tmp/filter60.js
          grep -Fq 'holderRebindIneligibleCount' /tmp/filter60.js
          grep -Fq 'holderRebindFailureCount' /tmp/filter60.js
          grep -Fq 'holderRebindFailureStages' /tmp/filter60.js
          grep -Fq 'source_package_changed' /tmp/filter60.js
          grep -Fq 'pinned_changed' /tmp/filter60.js
          grep -Fq 'selected_changed' /tmp/filter60.js
          grep -Fq 'tag_presence_changed' /tmp/filter60.js
          grep -Fq 'holder.contentView.setText(String(resultPreviewText(row)))' /tmp/filter60.js
          grep -Fq 'var VIRTUAL_BEFORE_SCREENS = 3;' /tmp/filter60.js
          grep -Fq 'var VIRTUAL_AFTER_SCREENS = 5;' /tmp/filter60.js
          grep -Fq 'var VIRTUAL_UPDATE_DELAY_MS = 24;' /tmp/filter60.js
          test "$(grep -Fo '.newSingleThreadExecutor();' /tmp/filter60.js | wc -l)" -eq 1
          ! grep -Fq 'resultTagBadgeViews' /tmp/filter60.js
          ! grep -Fq 'refreshRenderedTagBadges' /tmp/filter60.js
      - name: Publish module set 20260808.14
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('module-manifest.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          if m.get('moduleSetVersion')!='20260808.13': raise SystemExit('expected .13 manifest baseline')
          if m.get('sourceRef')!='beta-pagination-stage10-20260808': raise SystemExit('wrong sourceRef')
          data=pathlib.Path('src/ch_11_filter.js').read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          found=False
          for mod in m['modules']:
              if mod['name']=='ch_11_filter.js':
                  mod['sha']=sha
                  found=True
          if not found: raise SystemExit('filter module missing')
          m['moduleSetVersion']='20260808.14'
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('filter_blob='+sha)
          PY
          grep -Fq '"moduleSetVersion": "20260808.14"' module-manifest.json
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f --ignore-unmatch \
            .github/workflows/beta_stage16b1_ping.yml \
            .github/workflows/beta_stage16b1_finalize.yml \
            .github/stage16b1-ping.txt \
            .github/stage16b1-finalize.txt \
            .github/stage16b1-trigger.txt \
            stage16b1_ping_result.txt \
            stage16b_source_diag.txt \
            stage16b_filter58_runtime_diag.js \
            .github/workflows/beta_stage16b_source_diag.yml \
            .github/workflows/beta_stage16b_overlap_recycle.yml
          git add module-manifest.json src/ch_11_filter.js
          git diff --cached --check
          git commit -m "修复 Beta Holder 安全重绑定并增加失败诊断"
          git push
