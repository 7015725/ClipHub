name: UI Control Consistency Stage1-2 Retry

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/ui_control_consistency_stage1_2_retry.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0

      - name: Guard starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e13d9c0b6d5e3bcb494bf638b18cb85c86b8f590"
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('module-manifest.json').read_text(encoding='utf-8'))
          assert manifest['sourceRef'] == 'beta-regex-settings-tabs-20260814'
          assert manifest['moduleSetVersion'] == '20260815.17'
          assert manifest['entryMinVersion'] == 7
          print('Retry start guard: passed')
          PY

      - name: Stage 1 - Regex P0/P1 control consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import base64
          import gzip
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('.')
          settings_path = root / 'src/ch_13_settings.js'
          manifest_path = root / 'module-manifest.json'
          preflight_path = root / 'scripts/release_preflight.sh'

          def blob_sha(data: bytes) -> str:
              return hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()

          def unpack_loader(path: Path):
              loader = path.read_text(encoding='utf-8')
              assignment = re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);', loader, re.S)
              assert assignment is not None, 'packed assignment missing'
              pieces = re.findall(r'"(?:\\.|[^"\\])*"', assignment.group(1))
              encoded = ''.join(json.loads(piece) for piece in pieces)
              source = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
              expected = re.search(r'\bvar\s+SOURCE_SHA256\s*=\s*["\']([0-9a-fA-F]{64})["\']', loader)
              assert expected is not None, 'SOURCE_SHA256 missing'
              actual = hashlib.sha256(source.encode('utf-8')).hexdigest()
              assert actual == expected.group(1).lower(), (actual, expected.group(1))
              return loader, assignment, source

          def repack_loader(loader: str, assignment, source: str) -> str:
              raw = gzip.compress(source.encode('utf-8'), compresslevel=9, mtime=0)
              packed = base64.b64encode(raw).decode('ascii')
              chunks = [packed[i:i + 120] for i in range(0, len(packed), 120)]
              expression = '\n        ' + ' +\n        '.join(json.dumps(chunk) for chunk in chunks) + '\n    '
              loader = loader[:assignment.start(1)] + expression + loader[assignment.end(1):]
              sha = hashlib.sha256(source.encode('utf-8')).hexdigest()
              loader, count = re.subn(
                  r'(\bvar\s+SOURCE_SHA256\s*=\s*["\'])[0-9a-fA-F]{64}(["\'])',
                  lambda m: m.group(1) + sha + m.group(2), loader, count=1)
              assert count == 1
              return '\n'.join(line.rstrip() for line in loader.splitlines()) + '\n'

          def between(source: str, start_marker: str, end_marker: str):
              start = source.find(start_marker)
              end = source.find(end_marker, start)
              if start < 0 or end < 0:
                  raise RuntimeError('boundary missing: ' + start_marker + ' -> ' + end_marker)
              return start, end, source[start:end]

          loader, assignment, source = unpack_loader(settings_path)
          assert source.count('MODULE_VERSION: 34') == 1

          # Snapshot behavior-critical drag algorithm before any visual patch.
          drag_start, drag_end, drag_before = between(
              source,
              'function bindRegexRuleDrag(handle, rowRoot, ruleId) {',
              '\n    function deleteRegexRuleConfirmed(ruleId, deleteView) {')
          assert 'Math.abs(delta) >= dp(28)' in drag_before
          assert 'Math.min(dp(64)' in drag_before

          start, end, block = between(
              source,
              '    function makeRegexRuleRow(rule, colors) {',
              '\n    function buildRegexRulesPage(colors) {')
          original_block = block
          assert block.count('        var handle = makeText("↕", 14, colors.textTertiary, true);') == 1
          block = block.replace(
              '        var handle = makeText("↕", 14, colors.textTertiary, true);\n',
              '        var handle = makeText("↕", 14, colors.textTertiary, true);\n'
              '        var handleHit = new LinearLayout(appContext);\n'
              '        var layout = ClipHub.Theme.getMetrics();\n', 1)
          assert block.count('colors.stroke, 11));') >= 1
          block = block.replace(
              '        root.setBackground(roundedBackground(colors.surfaceMuted,\n            colors.stroke, 11));',
              '        root.setBackground(roundedBackground(colors.surfaceMuted,\n            colors.stroke, layout.cardRadiusDp));', 1)
          assert block.count('titleRow.addView(handle, new LinearLayout.LayoutParams(dp(28), dp(30)));') == 1
          block = block.replace(
              '        titleRow.addView(handle, new LinearLayout.LayoutParams(dp(28), dp(30)));',
              '        handleHit.setOrientation(LinearLayout.HORIZONTAL);\n'
              '        handleHit.setGravity(Gravity.CENTER);\n'
              '        handleHit.setContentDescription("拖动排序");\n'
              '        handleHit.addView(handle, new LinearLayout.LayoutParams(dp(28), dp(30)));\n'
              '        titleRow.addView(handleHit, new LinearLayout.LayoutParams(dp(40), dp(40)));', 1)
          assert block.count('new LinearLayout.LayoutParams(dp(64), dp(32))') == 1
          block = block.replace(
              'new LinearLayout.LayoutParams(dp(64), dp(32))',
              'new LinearLayout.LayoutParams(dp(64), dp(40))', 1)
          assert block.count('dp(34)') == 4, block.count('dp(34)')
          block = block.replace('dp(34)', 'dp(40)')
          assert block.count('bindRegexRuleDrag(handle, root, rule.id);') == 1
          block = block.replace('bindRegexRuleDrag(handle, root, rule.id);',
                                'bindRegexRuleDrag(handleHit, root, rule.id);', 1)
          assert block != original_block
          source = source[:start] + block + source[end:]

          start, end, editor_block = between(
              source,
              '    function buildRegexEditorPage(colors) {',
              '\n    function buildRegexTestPage(colors) {')
          assert editor_block.count('"#FFB42323"') == 1
          editor_block = editor_block.replace('"#FFB42323"', 'colors.danger', 1)
          source = source[:start] + editor_block + source[end:]

          start, end, test_block = between(
              source,
              '    function buildRegexTestPage(colors) {',
              '\n    var buildPage = function () {')
          assert test_block.count('dp(34)') == 4, test_block.count('dp(34)')
          test_block = test_block.replace('dp(34)', 'dp(40)')
          source = source[:start] + test_block + source[end:]

          # Behavior-critical drag function must be unchanged.
          drag_start2, drag_end2, drag_after = between(
              source,
              'function bindRegexRuleDrag(handle, rowRoot, ruleId) {',
              '\n    function deleteRegexRuleConfirmed(ruleId, deleteView) {')
          assert drag_after == drag_before

          source = source.replace('MODULE_VERSION: 34', 'MODULE_VERSION: 35', 1)
          assert 'bindRegexRuleDrag(handleHit, root, rule.id);' in source
          assert 'new LinearLayout.LayoutParams(dp(40), dp(40))' in source
          assert 'colors.stroke, layout.cardRadiusDp' in source
          assert 'Math.abs(delta) >= dp(28)' in source
          assert 'Math.min(dp(64)' in source

          loader = repack_loader(loader, assignment, source)
          settings_path.write_text(loader, encoding='utf-8')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['moduleSetVersion'] == '20260815.17'
          manifest['moduleSetVersion'] = '20260815.18'
          for item in manifest['modules']:
              if item['name'] == 'ch_13_settings.js':
                  item['sha'] = blob_sha(settings_path.read_bytes())
                  break
          else:
              raise RuntimeError('settings manifest item missing')
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          preflight = preflight_path.read_text(encoding='utf-8')
          assert preflight.count("EXPECTED_MODULE_SET='20260815.17'") == 1
          preflight = preflight.replace("EXPECTED_MODULE_SET='20260815.17'", "EXPECTED_MODULE_SET='20260815.18'", 1)
          assert preflight.count('"ch_13_settings.js": ("ch_13_settings", 34),') == 1
          preflight = preflight.replace('"ch_13_settings.js": ("ch_13_settings", 34),', '"ch_13_settings.js": ("ch_13_settings", 35),', 1)
          anchor = '        assert "REGEX_TEST_TEXT_CHAR_BUDGET = 786432" in settings_source\n'
          assert preflight.count(anchor) == 1
          preflight = preflight.replace(anchor, anchor +
              '        assert "var handleHit = new LinearLayout(appContext);" in settings_source\n'
              '        assert "bindRegexRuleDrag(handleHit, root, rule.id);" in settings_source\n'
              '        assert "colors.stroke, layout.cardRadiusDp" in settings_source\n'
              '        assert "Math.abs(delta) >= dp(28)" in settings_source\n', 1)
          preflight_path.write_text(preflight, encoding='utf-8')
          print('Stage 1 patch generated')
          PY

          python3 scripts/validate_es5.py .
          bash scripts/release_preflight.sh --settings-tabs-beta
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {'src/ch_13_settings.js', 'module-manifest.json', 'scripts/release_preflight.sh'}
          assert changed == expected, (changed, expected)
          print('Stage 1 boundary allowlist: passed')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ch_13_settings.js module-manifest.json scripts/release_preflight.sh
          git commit -m "收口Regex控件尺寸与触摸边界"

      - name: Stage 2 - Translation P1 theme color consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          translation_path = root / 'src/ch_12_translation.js'
          manifest_path = root / 'module-manifest.json'
          preflight_path = root / 'scripts/release_preflight.sh'

          def blob_sha(data: bytes) -> str:
              return hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()

          source = translation_path.read_text(encoding='utf-8')
          assert source.count('MODULE_VERSION: 17') == 1
          assert source.count('danger ? "#FFB42323"') == 1
          assert source.count('(danger ? "#FFFFEEEE" : colors.accentSoft)') == 1
          fallback_anchor = '            textTertiary: "#FF9992A3", icon: "#FF3D3748"\n'
          assert source.count(fallback_anchor) == 1
          source = source.replace(fallback_anchor,
              '            textTertiary: "#FF9992A3", icon: "#FF3D3748",\n'
              '            danger: "#FFD84A5B", dangerSoft: "#FFFFECEF"\n', 1)
          source = source.replace('danger ? "#FFB42323"', 'danger ? colors.danger', 1)
          source = source.replace('(danger ? "#FFFFEEEE" : colors.accentSoft)', '(danger ? colors.dangerSoft : colors.accentSoft)', 1)
          source = source.replace('MODULE_VERSION: 17', 'MODULE_VERSION: 18', 1)
          translation_path.write_text(source, encoding='utf-8')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['moduleSetVersion'] == '20260815.18'
          manifest['moduleSetVersion'] = '20260815.19'
          for item in manifest['modules']:
              if item['name'] == 'ch_12_translation.js':
                  item['sha'] = blob_sha(translation_path.read_bytes())
                  break
          else:
              raise RuntimeError('translation manifest item missing')
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          preflight = preflight_path.read_text(encoding='utf-8')
          assert preflight.count("EXPECTED_MODULE_SET='20260815.18'") == 1
          preflight = preflight.replace("EXPECTED_MODULE_SET='20260815.18'", "EXPECTED_MODULE_SET='20260815.19'", 1)
          assert preflight.count('"ch_12_translation.js": ("ch_12_translation", 17),') == 1
          preflight = preflight.replace('"ch_12_translation.js": ("ch_12_translation", 17),', '"ch_12_translation.js": ("ch_12_translation", 18),', 1)
          anchor = '        translation_source = actual_sources["ch_12_translation.js"]\n'
          assert preflight.count(anchor) == 1
          preflight = preflight.replace(anchor, anchor +
              '        assert "danger ? colors.danger" in translation_source\n'
              '        assert "danger ? colors.dangerSoft" in translation_source\n', 1)
          preflight_path.write_text(preflight, encoding='utf-8')
          print('Stage 2 patch generated')
          PY

          python3 scripts/validate_es5.py .
          bash scripts/release_preflight.sh --settings-tabs-beta
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {'src/ch_12_translation.js', 'module-manifest.json', 'scripts/release_preflight.sh'}
          assert changed == expected, (changed, expected)
          print('Stage 2 boundary allowlist: passed')
          PY
          git diff --check

          git rm -f .github/workflows/ui_control_consistency_stage1_2_once.yml
          git rm -f .github/workflows/ui_control_consistency_stage1_2_retry.yml
          git add src/ch_12_translation.js module-manifest.json scripts/release_preflight.sh
          git diff --cached --check
          git commit -m "统一翻译危险状态主题色并清理实施脚本"

      - name: Final branch boundary check and push
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          restricted = {
              'src/ch_03_database.js',
              'src/ch_06_repository.js',
              'src/ch_08_window.js',
              'src/ch_11_filter.js',
              'src/ch_15_app.js',
              'src/ch_16_ui_shell.js',
              'src/ch_17_tokenizer_ui.js',
              'src/ch_09_list.js',
              'src/ch_10_editor.js',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'ee6a8a4a03bd4d26d2ae79180011bf37b50bba51..HEAD'],
              text=True).splitlines())
          touched = changed & restricted
          assert not touched, touched
          print('Restricted production files untouched:', sorted(restricted))
          PY
          git status --short
          git push origin HEAD:beta-regex-settings-tabs-20260814
