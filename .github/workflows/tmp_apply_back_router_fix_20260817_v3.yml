name: Temp Apply Back Router Fix 20260817 V3

on:
  push:
    branches:
      - cleanup/tokenizer-no-regression-20260817
    paths:
      - .github/workflows/tmp_apply_back_router_fix_20260817_v3.yml

permissions:
  contents: write

jobs:
  apply:
    if: "${{ startsWith(github.event.head_commit.message, 'chore: apply back router fix workflow v3') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/tokenizer-no-regression-20260817
          fetch-depth: 0

      - name: Apply reviewed patch and relax format-only assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/tmp_apply_back_router_fix_20260817.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply system Back gesture identity and UIShell request guard\n'
          start = source.index(marker)
          run_marker = '        run: |\n'
          start = source.index(run_marker, start) + len(run_marker)
          end = source.index('\n      - name: Validate focused Back contracts', start)
          Path('/tmp/apply_back_router_fix.sh').write_text(
              textwrap.dedent(source[start:end]), encoding='utf-8')
          PY
          bash /tmp/apply_back_router_fix.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/test_system_back_gesture_contract.js')
          text = p.read_text(encoding='utf-8')
          start = text.index("requireText(nav, 'ClipHub.UIShell.dispatchBack(")
          end = text.index(');', start) + 2
          replacement = (
              'requireText(nav, "ClipHub.UIShell.dispatchBack(");\n'
              'requireText(nav, "\\\"navigation_system_back\\\", request");'
          )
          text = text[:start] + replacement + text[end:]
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate focused Back contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_es5.py .
          node --check src/ch_12_translation.js
          node --check src/ch_16_ui_shell.js
          python3 scripts/test_primary_window_system_back.py
          node scripts/test_system_back_gesture_contract.js
          node scripts/test_ui_shell_navigation.js
          node scripts/test_editor_ime_back_rearm.js

      - name: Run full tokenizer no-regression suite
        run: bash scripts/run_tokenizer_regression_suite.sh

      - name: Run release preflight
        run: bash scripts/release_preflight.sh --settings-tabs-beta

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ch_12_translation.js src/ch_16_ui_shell.js \
            scripts/test_system_back_gesture_contract.js \
            scripts/test_primary_window_system_back.py \
            scripts/run_tokenizer_regression_suite.sh \
            scripts/manifest_contract.py scripts/release_preflight.sh \
            module-manifest.json
          git diff --cached --check
          git commit -m 'fix: guard child system back gesture commits'
          git push origin HEAD:cleanup/tokenizer-no-regression-20260817
