name: Navigation Contract Gate

on:
  pull_request:
    branches:
      - fix/editor-embedded-back-capture-20260818

permissions:
  contents: read

jobs:
  navigation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax and navigation contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/ch_12_translation.js
          node --check src/ch_16_ui_shell.js
          node --check probes/navigation_architecture_test_page.js
          node scripts/test_navigation_contract_v1.js
          node scripts/test_navigation_stage2_3_contract.js
          node scripts/test_navigation_stage4_back_dispatcher.js
          node scripts/test_navigation_stage5_ime_priority.js
          node scripts/test_navigation_stage6_page_registry.js
          node scripts/test_navigation_stage7_page_contract.js
          node scripts/test_navigation_stage8_no_page_hardcoding.js
          node scripts/test_navigation_stage9_factory_core.js
          node scripts/test_navigation_stage9_zero_core_page.js
          node scripts/test_navigation_stage10_source_root.js
          node scripts/test_editor_ime_back_rearm.js
          node scripts/test_child_back_route_contract.js
          node scripts/test_runtime_diagnostics.js
          node scripts/audit_navigation_page_id_hardcoding.js
          python3 scripts/test_primary_window_system_back.py
          python3 scripts/test_primary_window_legacy_routes.py
          python3 scripts/test_manifest_contract.py
          git diff --check origin/fix/editor-embedded-back-capture-20260818...HEAD
