name: Navigation Contract Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  navigation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release and navigation contracts
        shell: bash
        run: |
          set -euo pipefail
          mode='--current'
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            mode='--main'
          fi
          bash scripts/release_preflight.sh "$mode"
          git diff --check origin/main...HEAD
