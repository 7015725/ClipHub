name: Beta Stage16B Overlap Recycle Trigger
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - stage16b_trigger.txt
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Execute Stage16B builder
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          wf=pathlib.Path('.github/workflows/beta_stage16b_overlap_recycle.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          end_marker="\n          PY\n"
          body=wf.split(marker,1)[1].split(end_marker,1)[0]
          lines=[]
          for line in body.splitlines():
              if line.startswith('          '): line=line[10:]
              lines.append(line)
          script='\n'.join(lines)+'\n'
          exec(compile(script,'stage16b_builder.py','exec'),{'__name__':'__main__'})
          PY
          node --check src/ch_11_filter.js
          node /tmp/stage16b_harness.js
          node --check /tmp/filter59.js
          ! grep -Eq '(^|[^A-Za-z0-9_])(let|const|class)[[:space:]]|=>' /tmp/filter59.js
          grep -Fq 'MODULE_VERSION: 59' /tmp/filter59.js
          grep -Fq 'var resultCardHolders = [];' /tmp/filter59.js
          grep -Fq 'function rebindResultCardHolder(holder, row, colors)' /tmp/filter59.js
          grep -Fq 'holderRecycleReuseCount' /tmp/filter59.js
          grep -Fq 'resultCardHolders.length === oldCount' /tmp/filter59.js
          grep -Fq 'String(origin || "") === "result_scroll"' /tmp/filter59.js
          grep -Fq 'String(origin || "") === "hydration_apply"' /tmp/filter59.js
          ! grep -Fq 'String(origin || "") === "ajax_append"' /tmp/filter59.js
          grep -Fq 'sameRangeNoLayoutCount' /tmp/filter59.js
          grep -Fq 'slowRebuildSamples' /tmp/filter59.js
          grep -Fq 'var VIRTUAL_BEFORE_SCREENS = 3;' /tmp/filter59.js
          grep -Fq 'var VIRTUAL_AFTER_SCREENS = 5;' /tmp/filter59.js
          grep -Fq 'var VIRTUAL_UPDATE_DELAY_MS = 24;' /tmp/filter59.js
          test "$(grep -Fo '.newSingleThreadExecutor();' /tmp/filter59.js | wc -l)" -eq 1
          ! grep -Fq 'resultTagBadgeViews' /tmp/filter59.js
          ! grep -Fq 'refreshRenderedTagBadges' /tmp/filter59.js
          grep -Fq '"moduleSetVersion": "20260808.13"' module-manifest.json
          git diff --check
      - name: Commit Filter59 atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/beta_stage16b_overlap_recycle.yml .github/workflows/beta_stage16b_overlap_recycle_trigger.yml .github/workflows/beta_stage16b_source_diag.yml stage16b_source_diag.txt stage16b_filter58_runtime_diag.js stage16b_trigger.txt
          git add src/ch_11_filter.js module-manifest.json
          git diff --cached --check
          git commit -m "启用 Beta overlap CardHolder 同轮回收"
          git push
