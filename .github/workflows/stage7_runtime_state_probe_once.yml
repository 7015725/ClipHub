name: Stage7 Runtime State Probe Once
on:
  push:
    branches:
      - beta-regex-settings-tabs-20260814
    paths:
      - 'tools/stage7_runtime_state_probe_20260815.py'
      - '.github/workflows/stage7_runtime_state_probe_once.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0
      - name: Print runtime state fields
        run: python3 tools/stage7_runtime_state_probe_20260815.py
