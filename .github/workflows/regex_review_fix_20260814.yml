name: Regex Review Fix 20260814

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/regex-review-fix-20260814-trigger.txt

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode deterministic review patcher
        shell: bash
        run: |
          set -euo pipefail
          cat .github/regex-review-fix-20260814/part*.b64 | base64 -d | gzip -d > tools/apply_regex_review_fix_20260814.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_regex_review_fix_20260814.py')
          text = path.read_text(encoding='utf-8')
          old = '''    text = replace_once(text,
                  "        regexScanState.matched = regexMatchedIds.length;\\n",
                  "        regexScanState.matched = regexMatchedIds.length;\\n"
                  "        regexScanState.oversizeSkipped = Number(oversizeSkipped || 0);\\n",
                  "filter publish oversize state")
          '''
          new = '''    text = replace_once(text,
                  "        regexScanState.total = Number(total);\\n"
                  "        regexScanState.matched = regexMatchedIds.length;\\n",
                  "        regexScanState.total = Number(total);\\n"
                  "        regexScanState.matched = regexMatchedIds.length;\\n"
                  "        regexScanState.oversizeSkipped = Number(oversizeSkipped || 0);\\n",
                  "filter publish oversize state")
          '''
          if text.count(old) != 1:
              raise SystemExit('temporary patcher publish anchor shape changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile tools/apply_regex_review_fix_20260814.py

      - name: Apply locked no-regression fix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_regex_review_fix_20260814.py

      - name: Verify change scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = {
              'src/ch_03_database.js',
              'src/ch_06_repository.js',
              'src/ch_11_filter.js',
              'src/ch_13_settings.js',
              'module-manifest.json',
              'scripts/release_preflight.sh',
              'tools/regex_beta_patches/repository_regex_feature.jsfrag',
              'tools/regex_beta_patches/filter_regex_feature.jsfrag',
              'tools/regex_beta_patches/settings_regex_feature.jsfrag',
              'probes/cliphub_regex_safety_policy_probe_072.js',
              'probes/cliphub_regex_oversize_scan_probe_073.js',
              'probes/cliphub_regex_inline_more_probe_074.js',
              'probes/cliphub_regex_feature_schema_probe_075.js',
          }
          changed = set(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True).splitlines()))
          unexpected = changed - allowed
          missing = {
              'src/ch_03_database.js', 'src/ch_06_repository.js',
              'src/ch_11_filter.js', 'src/ch_13_settings.js',
              'module-manifest.json'
          } - changed
          if unexpected:
              raise SystemExit('unexpected changed files: ' + repr(sorted(unexpected)))
          if missing:
              raise SystemExit('required changes missing: ' + repr(sorted(missing)))
          print('scope_ok=' + ','.join(sorted(changed)))
          PY

      - name: Run static release gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict | tee /tmp/color-audit.txt
          grep '^HIGH=0 WARN=0 ' /tmp/color-audit.txt
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check

      - name: Commit verified fix and remove temporary executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ch_03_database.js \
                  src/ch_06_repository.js \
                  src/ch_11_filter.js \
                  src/ch_13_settings.js \
                  module-manifest.json \
                  scripts/release_preflight.sh \
                  tools/regex_beta_patches/repository_regex_feature.jsfrag \
                  tools/regex_beta_patches/filter_regex_feature.jsfrag \
                  tools/regex_beta_patches/settings_regex_feature.jsfrag \
                  probes/cliphub_regex_safety_policy_probe_072.js \
                  probes/cliphub_regex_oversize_scan_probe_073.js \
                  probes/cliphub_regex_inline_more_probe_074.js \
                  probes/cliphub_regex_feature_schema_probe_075.js
          git rm .github/workflows/regex_review_fix_20260814.yml \
                 .github/regex-review-fix-20260814-trigger.txt \
                 .github/regex-review-fix-20260814/part00.b64 \
                 .github/regex-review-fix-20260814/part01.b64 \
                 .github/regex-review-fix-20260814/part02.b64 \
                 .github/regex-review-fix-20260814/part03.b64 \
                 .github/regex-review-fix-20260814/part04.b64 \
                 .github/regex-review-fix-20260814/part05.b64
          git diff --cached --check
          git diff --cached --stat
          git commit -m "收紧 Regex 执行边界并保持 Settings Tabs 无回归"
          git push origin HEAD:beta-regex-settings-tabs-20260814
