name: Apply Current Preflight Mode

on:
  pull_request:
    branches:
      - fix/editor-embedded-back-capture-20260818

permissions:
  contents: write

jobs:
  apply-current-preflight:
    if: github.head_ref == 'refactor/navigation-contract-v2-20260818'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/navigation-contract-v2-20260818
          fetch-depth: 0
      - name: Apply
        shell: bash
        run: |
          if grep -Fq "Current release preflight: passed" scripts/release_preflight.sh; then
            exit 0
          fi
          python3 scripts/apply_current_preflight_mode.py
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/release_preflight.sh
          git commit -m "ci: make current release preflight branch-agnostic"
          git push origin HEAD:refactor/navigation-contract-v2-20260818
      - name: Validate current mode
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/manifest_contract.py validate --current
          bash scripts/release_preflight.sh --current
