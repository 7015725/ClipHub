name: Tokenizer Regex Raw Source

on:
  push:
    branches:
      - docs/tokenizer-softcode-hardening-20260815
    paths:
      - .github/workflows/tokenizer-regex-raw-source.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/tokenizer-softcode-hardening-20260815
          fetch-depth: 1

      - name: Make regex tokenizer operate on raw source gaps
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit('%s anchor count=%d' % (label, count))
              return text.replace(old, new, 1)

          def blob_sha(text):
              data = text.encode('utf-8')
              return hashlib.sha1(
                  b'blob ' + str(len(data)).encode('ascii') + b'\0' + data
              ).hexdigest()

          # ch_18: raw gap mode for regex source processing; normal mode keeps fallback.
          core_path = Path('src/ch_18_tokenizer_core.js')
          core = core_path.read_text(encoding='utf-8')

          core = replace_once(
              core,
              '''    function splitGap(text, start, end, splitMatches, out) {\n''',
              '''    function emitGap(text, start, end, out, gapMode) {\n        var raw;\n        if (start >= end) { return; }\n        if (String(gapMode || "fallback") === "raw") {\n            raw = text.substring(start, end);\n            if (!/^\\s*$/.test(raw)) {\n                out.push(makeToken(raw, start, end, "word", "raw-gap", null));\n            }\n            return;\n        }\n        fallback(text, start, end, out);\n    }\n\n    function splitGap(text, start, end, splitMatches, out, gapMode) {\n''',
              'core emitGap')

          core = replace_once(
              core,
              '''            if (item.start > cursor) { fallback(text, cursor, item.start, out); }\n''',
              '''            if (item.start > cursor) {\n                emitGap(text, cursor, item.start, out, gapMode);\n            }\n''',
              'core splitGap inner gap')

          core = replace_once(
              core,
              '''        if (cursor < end) { fallback(text, cursor, end, out); }\n''',
              '''        if (cursor < end) { emitGap(text, cursor, end, out, gapMode); }\n''',
              'core splitGap tail')

          core = replace_once(
              core,
              '''        var matchBudget = Number(settings.matchBudget || MATCH_BUDGET);\n        var rules;\n''',
              '''        var matchBudget = Number(settings.matchBudget || MATCH_BUDGET);\n        var gapMode = String(settings.gapMode || "fallback") === "raw" ?\n            "raw" : "fallback";\n        var rules;\n''',
              'core gapMode option')

          core = replace_once(
              core,
              '''            if (item.start > cursor) { splitGap(value, cursor, item.start, splitResult.matches, out); }\n''',
              '''            if (item.start > cursor) {\n                splitGap(value, cursor, item.start, splitResult.matches, out, gapMode);\n            }\n''',
              'core match gap')

          core = replace_once(
              core,
              '''        if (cursor < value.length) { splitGap(value, cursor, value.length, splitResult.matches, out); }\n''',
              '''        if (cursor < value.length) {\n            splitGap(value, cursor, value.length, splitResult.matches, out, gapMode);\n        }\n''',
              'core final gap')

          core = replace_once(
              core,
              '''            acceptedMatchCount: accepted.length\n''',
              '''            acceptedMatchCount: accepted.length,\n            gapMode: gapMode\n''',
              'core result gapMode')

          core = replace_once(
              core,
              '''        MODULE_VERSION: 1,\n''',
              '''        MODULE_VERSION: 2,\n''',
              'core module version')

          core_path.write_text(core, encoding='utf-8')

          # ch_19: regex page always requests raw gaps; normal page keeps normal fallback.
          service_path = Path('src/ch_19_tokenizer_service.js')
          service = service_path.read_text(encoding='utf-8')
          service = replace_once(
              service,
              '''        var settings = copyOptions(options);\n        var mode = String(settings.mode || "normal");\n        if (settings.__explicitRules === true) {\n''',
              '''        var settings = copyOptions(options);\n        var mode = String(settings.mode || "normal");\n        settings.gapMode = mode === "regex" ? "raw" : "fallback";\n        if (settings.__explicitRules === true) {\n''',
              'service raw regex gap mode')
          service = replace_once(
              service,
              '''        MODULE_VERSION: 4,\n''',
              '''        MODULE_VERSION: 5,\n''',
              'service module version')
          service_path.write_text(service, encoding='utf-8')

          # Core regression tests: normal behavior unchanged, regex mode uses original-text gaps.
          test_path = Path('scripts/test_tokenizer_core.js')
          test = test_path.read_text(encoding='utf-8')
          insert_anchor = '''var defaults = core.getDefaultRules();\n'''
          raw_tests = r'''var rawMatch = core.tokenizeWithRules(
    '定位代码和函数，进行二次分析，注意边界。',
    [
        {
            id: 'custom.raw.analysis',
            pattern: '二次分析',
            priority: 1200,
            mode: 'match'
        }
    ],
    { includeBuiltins: false, gapMode: 'raw' }
);
assert.deepStrictEqual(texts(rawMatch), [
    '定位代码和函数，进行', '二次分析', '，注意边界。'
]);
assert.strictEqual(rawMatch.tokens[0].source, 'raw-gap');
assert.strictEqual(rawMatch.tokens[1].ruleId, 'custom.raw.analysis');
assert.strictEqual(rawMatch.gapMode, 'raw');

var rawSplit = core.tokenizeWithRules(
    '定位代码和函数，进行二次分析，注意边界。',
    [
        {
            id: 'custom.raw.delimiter',
            pattern: '[，。]+',
            priority: 1200,
            mode: 'split',
            keepDelimiter: false
        }
    ],
    { includeBuiltins: false, gapMode: 'raw' }
);
assert.deepStrictEqual(texts(rawSplit), [
    '定位代码和函数', '进行二次分析', '注意边界'
]);
assert.ok(rawSplit.tokens.every(function (item) {
    return item.source === 'raw-gap';
}));

'''
          test = replace_once(test, insert_anchor, raw_tests + insert_anchor,
                              'core raw source tests')
          test = replace_once(
              test,
              '''assert.strictEqual(core.MODULE_VERSION, 1);\n''',
              '''assert.strictEqual(core.MODULE_VERSION, 2);\n''',
              'core test module version')
          test_path.write_text(test, encoding='utf-8')

          # Manifest and release contracts.
          manifest_path = Path('module-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion') != '20260815.33':
              raise SystemExit('unexpected moduleSetVersion: %s' % manifest.get('moduleSetVersion'))
          manifest['moduleSetVersion'] = '20260815.34'
          for item in manifest.get('modules', []):
              if item.get('name') == 'ch_18_tokenizer_core.js':
                  item['sha'] = blob_sha(core)
              elif item.get('name') == 'ch_19_tokenizer_service.js':
                  item['sha'] = blob_sha(service)
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8')

          contract_path = Path('scripts/manifest_contract.py')
          contract = contract_path.read_text(encoding='utf-8')
          contract = replace_once(
              contract,
              '"moduleSetVersion": "20260815.33"',
              '"moduleSetVersion": "20260815.34"',
              'manifest contract module set')
          contract_path.write_text(contract, encoding='utf-8')

          preflight_path = Path('scripts/release_preflight.sh')
          preflight = preflight_path.read_text(encoding='utf-8')
          preflight = replace_once(
              preflight,
              "EXPECTED_MODULE_SET='20260815.33'",
              "EXPECTED_MODULE_SET='20260815.34'",
              'preflight module set')
          preflight = replace_once(
              preflight,
              '"ch_18_tokenizer_core.js": ("ch_18_tokenizer_core", 1),',
              '"ch_18_tokenizer_core.js": ("ch_18_tokenizer_core", 2),',
              'preflight core version')
          preflight = replace_once(
              preflight,
              '"ch_19_tokenizer_service.js": ("ch_19_tokenizer_service", 4),',
              '"ch_19_tokenizer_service.js": ("ch_19_tokenizer_service", 5),',
              'preflight service version')
          assertion_anchor = '        assert "settings.regexMode" in tokenizer_service_source\n'
          preflight = replace_once(
              preflight,
              assertion_anchor,
              assertion_anchor +
              '        assert \'settings.gapMode = mode === "regex" ? "raw" : "fallback"\' in tokenizer_service_source\n' +
              '        assert \'"raw-gap"\' in tokenizer_core_source\n' +
              '        assert "function emitGap(text, start, end, out, gapMode)" in tokenizer_core_source\n',
              'preflight raw source assertions')
          preflight_path.write_text(preflight, encoding='utf-8')
          PY

          node --check src/ch_18_tokenizer_core.js
          node --check src/ch_19_tokenizer_service.js
          python3 scripts/validate_es5.py .
          node scripts/test_tokenizer_core.js
          bash scripts/release_preflight.sh --settings-tabs-beta

      - name: Commit raw-source regex tokenizer
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tokenizer-regex-raw-source.yml
          git add src/ch_18_tokenizer_core.js src/ch_19_tokenizer_service.js scripts/test_tokenizer_core.js module-manifest.json scripts/manifest_contract.py scripts/release_preflight.sh
          git commit -m "fix: make regex tokenizer use raw source text"
          git push origin HEAD:docs/tokenizer-softcode-hardening-20260815
