name: Tokenizer Regex Raw Source

on:
  push:
    branches:
      - docs/tokenizer-softcode-hardening-20260815
    paths:
      - .github/workflows/tokenizer-regex-raw-source.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/tokenizer-softcode-hardening-20260815
          fetch-depth: 1

      - name: Patch raw-source regex tokenizer
        run: python3 scripts/tmp_fix_tokenizer_regex_raw_source.py

      - name: Validate contracts
        run: |
          node --check src/ch_18_tokenizer_core.js
          node --check src/ch_19_tokenizer_service.js
          python3 scripts/validate_es5.py .
          node scripts/test_tokenizer_core.js
          bash scripts/release_preflight.sh --settings-tabs-beta

      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tokenizer-regex-raw-source.yml
          git rm scripts/tmp_fix_tokenizer_regex_raw_source.py
          git add src/ch_18_tokenizer_core.js src/ch_19_tokenizer_service.js scripts/test_tokenizer_core.js module-manifest.json scripts/manifest_contract.py scripts/release_preflight.sh
          git commit -m "fix: make regex tokenizer use raw source text"
          git push origin HEAD:docs/tokenizer-softcode-hardening-20260815
