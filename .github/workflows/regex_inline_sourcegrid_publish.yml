name: Regex Inline SourceGrid Publish

on:
  push:
    branches: [beta-regex-filter-20260813]
    paths:
      - .github/regex-inline-sourcegrid-publish-trigger.txt

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify locked Beta baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('.')
          manifest = json.loads((root / 'module-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion') != '20260813.07':
              raise SystemExit('unexpected moduleSetVersion: ' + str(manifest.get('moduleSetVersion')))
          if manifest.get('sourceRef') != 'beta-regex-filter-20260813':
              raise SystemExit('unexpected sourceRef')
          data = (root / 'src/ch_11_filter.js').read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          if blob != '51b4d16fcae87ce885f5d812b6bc84a8943070d6':
              raise SystemExit('unexpected Filter78 baseline blob: ' + blob)
          print('baseline_ok')
          PY

      - name: Generate source-style Regex grid Filter79
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_regex_inline_source_grid_v3.py

      - name: Verify generated Filter79 contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, re
          p = pathlib.Path('src/ch_11_filter.js')
          data = p.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          loader = data.decode('utf-8')
          m = re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);', loader, re.S)
          if m is None:
              raise SystemExit('packed Filter assignment missing')
          pieces = re.findall(r'"(?:\\.|[^"\\])*"', m.group(1))
          encoded = ''.join(json.loads(piece) for piece in pieces)
          source = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          source_sha = hashlib.sha256(source.encode('utf-8')).hexdigest()
          print('generated_filter_blob=' + blob)
          print('generated_source_sha256=' + source_sha)
          if source_sha != '579887b6e073abc92c820f05eb665d4a24000db25910510567c371dcc17c986c':
              raise SystemExit('packed source SHA mismatch: ' + source_sha)
          required = [
              'MODULE_VERSION: 79',
              'function makeRegexSourceStyleGrid(',
              'adaptiveSourceGridMetrics(items.length)',
              'addRegexInlineSection(content, colors, bundle);',
              'refreshRegexInlineSelection(bundle, colors)',
              'commitRegexDraft();',
              'function startRegexScan(',
              'function regexResultPageResult(',
              'MAX_REGEX_CACHE_ENTRIES = 8',
              'MAX_REGEX_CACHE_IDS = 16000',
              'regexScanGeneration'
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit('required contract missing: ' + marker)
          forbidden = [
              'return makeRegexPickerDrawerBundle(colors);',
              'content.addView(makeRegexAdvancedEntry(colors), params);',
              'state.lastBackLayer = "regex_picker";'
          ]
          for marker in forbidden:
              if marker in source:
                  raise SystemExit('legacy child-page contract remains: ' + marker)
          manifest = json.loads(pathlib.Path('module-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion') != '20260813.08':
              raise SystemExit('manifest did not advance to .08')
          if manifest.get('sourceRef') != 'beta-regex-filter-20260813':
              raise SystemExit('manifest sourceRef changed')
          entries = [x for x in manifest['modules'] if x.get('name') == 'ch_11_filter.js']
          if len(entries) != 1 or entries[0].get('sha') != blob:
              raise SystemExit('manifest Filter SHA mismatch')
          print('filter79_contracts_ok')
          PY

          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict | tee /tmp/regex-inline-color.txt
          grep '^HIGH=0 WARN=0 ' /tmp/regex-inline-color.txt
          bash scripts/release_preflight.sh --regex-beta
          git diff --check

      - name: Commit verified Filter79 module set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ch_11_filter.js \
                  module-manifest.json \
                  scripts/release_preflight.sh \
                  tools/regex_beta_patches/filter_regex_feature.jsfrag
          git diff --cached --check
          git diff --cached --stat
          git commit -m "高级筛选内嵌 Regex 来源应用式网格"
          git push origin HEAD:beta-regex-filter-20260813
