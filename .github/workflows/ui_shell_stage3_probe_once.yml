name: UI Shell Stage3 Probe Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/ui_shell_stage3_probe_once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect focused Stage3 lifecycle anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,json,re
          from pathlib import Path
          def unpack(path):
              text=Path(path).read_text(encoding='utf-8')
              m=re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);',text,re.S)
              if not m: return text
              parts=re.findall(r'"(?:\\.|[^"\\])*"',m.group(1))
              return gzip.decompress(base64.b64decode(''.join(json.loads(x) for x in parts))).decode('utf-8')
          cases={
            'EDITOR':(unpack('src/ch_10_editor.js'),['function requestExit','function clearViews','function updatePanelSizeForMode','function installEditorLayoutObserver','function saveEditor','function saveCurrent']),
            'TOKENIZER':(unpack('src/ch_17_tokenizer_ui.js'),['function mountFromEditor','function returnToEditor','function installEditorEntry','function emitAction','editorPanelRoot =','state.mounted']),
          }
          for name,(src,pats) in cases.items():
              lines=src.splitlines(); hits=[]
              print('\n===== %s ====='%name)
              for pat in pats:
                  for i,line in enumerate(lines,1):
                      if pat in line:
                          print('%s @ %d: %s'%(pat,i,line.strip())); hits.append(i)
              ranges=[]
              for n in sorted(set(hits)):
                  a=max(1,n-20); b=min(len(lines),n+110)
                  if ranges and a <= ranges[-1][1]+4: ranges[-1]=(ranges[-1][0],max(ranges[-1][1],b))
                  else: ranges.append((a,b))
              for a,b in ranges[:12]:
                  print('\n--- %d-%d ---'%(a,b))
                  for n in range(a,b+1): print('%05d: %s'%(n,lines[n-1]))
          PY
