name: UI Shell Stage3 Probe Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/ui_shell_stage3_probe_once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract tokenizer lifecycle functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,json,re
          from pathlib import Path
          text=Path('src/ch_17_tokenizer_ui.js').read_text(encoding='utf-8')
          m=re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);',text,re.S)
          parts=re.findall(r'"(?:\\.|[^"\\])*"',m.group(1))
          src=gzip.decompress(base64.b64decode(''.join(json.loads(x) for x in parts))).decode('utf-8')
          def extract(name):
              marker='    function '+name+'('
              a=src.index(marker); brace=src.index('{',a); depth=0; quote=None; esc=False; line=False; block=False; i=brace
              while i < len(src):
                  ch=src[i]; nxt=src[i+1] if i+1<len(src) else ''
                  if line:
                      if ch=='\n': line=False
                      i+=1; continue
                  if block:
                      if ch=='*' and nxt=='/': block=False; i+=2; continue
                      i+=1; continue
                  if quote:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: quote=None
                      i+=1; continue
                  if ch in ('"',"'"): quote=ch; i+=1; continue
                  if ch=='/' and nxt=='/': line=True; i+=2; continue
                  if ch=='/' and nxt=='*': block=True; i+=2; continue
                  if ch=='{': depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0:
                          print('\n===== '+name+' =====\n'+src[a:i+1])
                          return
                  i+=1
              raise RuntimeError(name)
          for n in ['clearEditorBinding','mountFromEditor','returnToEditor','installWindowHooks','getState']:
              extract(n)
          PY
