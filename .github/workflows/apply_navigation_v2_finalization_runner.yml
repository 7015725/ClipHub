name: Run Navigation v2 finalization

on:
  pull_request:
    branches:
      - fix/editor-embedded-back-capture-20260818
    paths:
      - .github/workflows/apply_navigation_v2_finalization_runner.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'refactor/navigation-contract-v2-20260818'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/navigation-contract-v2-20260818
          fetch-depth: 0

      - name: Apply Navigation v2 finalization
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_navigation_v2_finalization.py

      - name: Run focused and release gates
        shell: bash
        run: |
          set -euo pipefail
          node --check src/ch_12_translation.js
          node --check src/ch_16_ui_shell.js
          node --check probes/cliphub_navigation_contract_probe_065.js
          node --check probes/navigation_architecture_test_page.js
          node scripts/test_navigation_stage2_3_contract.js
          node scripts/test_navigation_stage4_back_dispatcher.js
          node scripts/test_navigation_stage5_ime_priority.js
          node scripts/test_navigation_stage6_page_registry.js
          node scripts/test_navigation_stage7_page_contract.js
          node scripts/test_navigation_stage8_no_page_hardcoding.js
          node scripts/test_navigation_stage9_factory_core.js
          node scripts/test_navigation_stage9_zero_core_page.js
          node scripts/test_navigation_stage9_runtime_simulation.js
          node scripts/test_navigation_stage10_source_root.js
          node scripts/test_navigation_stage10_legacy_hook_bridge.js
          node scripts/test_system_back_gesture_contract.js
          node scripts/test_navigation_predictive_snapshot_contract.js
          node scripts/test_editor_ime_back_rearm.js
          node scripts/test_child_back_route_contract.js
          node scripts/test_runtime_diagnostics.js
          node scripts/audit_navigation_page_id_hardcoding.js
          python3 scripts/test_primary_window_system_back.py
          python3 scripts/test_primary_window_legacy_routes.py
          python3 scripts/test_manifest_contract.py
          bash scripts/release_preflight.sh --current
          git diff --check

      - name: Commit final Navigation v2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply_navigation_v2_finalization.yml
          git rm .github/workflows/apply_navigation_v2_finalization_pr.yml
          git rm .github/workflows/apply_navigation_v2_finalization_runner.yml
          git rm scripts/apply_navigation_v2_finalization.py
          git add -A
          git commit -m "refactor: finalize Navigation Contract v2 predictive transaction"
          git push origin HEAD:refactor/navigation-contract-v2-20260818
