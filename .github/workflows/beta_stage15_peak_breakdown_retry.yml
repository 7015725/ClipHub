name: Beta Stage15 Peak Breakdown Retry
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/workflows/beta_stage15_peak_breakdown_retry.yml
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Re-run Filter 57 builder
        shell: bash
        run: |
          set -euo pipefail
          git show 2e73b30fe1d7cebedec3ef7f2ef7b321acb03cbc:.github/workflows/beta_stage15_peak_breakdown.yml > /tmp/stage15.yml
          python - <<'PY'
          import pathlib
          text=pathlib.Path('/tmp/stage15.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          end_marker="\n          PY\n"
          body=text.split(marker,1)[1].split(end_marker,1)[0]
          lines=[]
          for line in body.splitlines():
              if line.startswith('          '): line=line[10:]
              lines.append(line)
          script='\n'.join(lines)+'\n'
          exec(compile(script,'stage15_builder.py','exec'),{'__name__':'__main__'})
          PY
          node --check /tmp/filter57.js
          node --check src/ch_11_filter.js
          ! grep -Eq '(^|[^A-Za-z0-9_])(let|const|class)[[:space:]]|=>' /tmp/filter57.js
          grep -Fq 'MODULE_VERSION: 57' /tmp/filter57.js
          grep -Fq 'slowRebuildSamples' /tmp/filter57.js
          grep -Fq 'signatureTotalMs' /tmp/filter57.js
          grep -Fq 'cardCreateTotalMs' /tmp/filter57.js
          grep -Fq 'keyedReconcileMaxMs' /tmp/filter57.js
          grep -Fq '"moduleSetVersion": "20260808.11"' module-manifest.json
          git diff --check
      - name: Commit Filter 57 atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/beta_stage15_peak_breakdown.yml .github/workflows/beta_stage15_peak_breakdown_retry.yml
          git add src/ch_11_filter.js module-manifest.json stage-assets/pagination-stage9/ch11_full_v8s_*.b64
          git diff --cached --check
          git commit -m "增加 Beta 重建峰值分段诊断"
          git push
