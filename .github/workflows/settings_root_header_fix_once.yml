name: Settings Root Header Fix Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/settings_root_header_fix_once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0
      - name: Apply Settings root header baseline fix
        run: python3 tools/settings_root_header_fix_tmp.py
      - name: Validate full beta contracts
        run: |
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict
          node scripts/test_ui_shell_navigation.js
          node scripts/test_runtime_diagnostics.js
          python3 scripts/test_primary_window_legacy_routes.py
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = {'src/ch_13_settings.js','module-manifest.json','scripts/release_preflight.sh'}
          assert changed == expected, (changed, expected)
          print('Production allowlist: passed')
          PY
      - name: Commit validated production changes and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/settings_root_header_fix_tmp.py .github/workflows/settings_root_header_fix_once.yml
          git add src/ch_13_settings.js module-manifest.json scripts/release_preflight.sh
          git diff --cached --check
          git commit -m "按首页参数统一Settings根Header位置"
          git push origin HEAD:beta-regex-settings-tabs-20260814
