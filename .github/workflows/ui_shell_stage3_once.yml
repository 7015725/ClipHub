name: UI Shell Stage3 Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/ui_shell_stage3_once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Stage3 migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/ui_shell_stage3_20260815.py')
          s=p.read_text(encoding='utf-8')
          # Drop an unnecessary legacy attach-hook replacement. The embedded bind is
          # explicitly cleared before any fallback Window path can be reused.
          start=s.index('# Existing legacy binding must explicitly remain non-embedded.')
          end=s.index('# Clearing a binding always drops the embedded marker.', start)
          s=s[:start]+s[end:]
          s=s.replace('scheduleEnsureEditorEntry();','scheduleEnsureEntry();')

          # Replace the three tokenizer patch helpers with exact function-aware anchors
          # captured from TokenizerUI2.
          a=s.index('def patch_mount_tokenizer(fn):')
          b=s.index('# State + public direct-bind API.', a)
          exact=r'''def patch_mount_tokenizer(fn):
              return replace_once(fn,
          ''' + "'''" + r'''            state.mountCount += 1;
            emitAction("open", {});''' + "'''" + r''',
          ''' + "'''" + r'''            state.mountCount += 1;
            if (editorEmbeddedInPrimary) {
                syncTokenizerShell("tokenizer", "分词", function () {
                    return returnToEditor("shell_back");
                });
            }
            emitAction("open", {});''' + "'''" + r''',
          "tokenizer shell mount")
          tok = patch_function(tok, "mountFromEditor", patch_mount_tokenizer)

          def patch_return_tokenizer(fn):
              return replace_once(fn,
          ''' + "'''" + r'''        state.unmountCount += 1;
        emitAction("back", { reason: String(reason || "back") });''' + "'''" + r''',
          ''' + "'''" + r'''        state.unmountCount += 1;
        if (editorEmbeddedInPrimary) {
            var editorState = ClipHub.Editor &&
                typeof ClipHub.Editor.getState === "function" ?
                ClipHub.Editor.getState() : {};
            syncTokenizerShell("editor",
                String(editorState.mode) === "new" ?
                    "新增剪贴板" : "编辑剪贴板",
                function () {
                    return ClipHub.Editor &&
                        typeof ClipHub.Editor.requestExit === "function" ?
                        ClipHub.Editor.requestExit("shell_back") : false;
                });
        }
        emitAction("back", { reason: String(reason || "back") });''' + "'''" + r''',
          "tokenizer shell return")
          tok = patch_function(tok, "returnToEditor", patch_return_tokenizer)

          '''
          # Dedent our generated Python fragment because the YAML heredoc itself is
          # already emitted at the expected script indentation.
          import textwrap
          exact=textwrap.dedent(exact)
          s=s[:a]+exact+s[b:]

          # getState has no editorBound field in TokenizerUI2; add the marker after mounted.
          old='''def patch_tok_state(fn):\n    return replace_once(fn,\n''' + "'''" + '''            mounted: state.mounted === true,\n            editorBound: editorPanelRoot !== null,''' + "'''" + ''',\n''' + "'''" + '''            mounted: state.mounted === true,\n            editorBound: editorPanelRoot !== null,\n            embeddedInPrimary: editorEmbeddedInPrimary === true,''' + "'''" + ''',\n"tokenizer state embedded")\ntok = patch_function(tok, "getState", patch_tok_state)\n'''
          new='''def patch_tok_state(fn):\n    return replace_once(fn,\n''' + "'''" + '''            mounted: state.mounted === true,''' + "'''" + ''',\n''' + "'''" + '''            mounted: state.mounted === true,\n            embeddedInPrimary: editorEmbeddedInPrimary === true,''' + "'''" + ''',\n"tokenizer state embedded")\ntok = patch_function(tok, "getState", patch_tok_state)\n'''
          if old not in s: raise AssertionError('tokenizer state patch source anchor')
          s=s.replace(old,new,1)

          # Public direct-bind API is inserted beside mount/unmount, which is stable.
          api_start=s.index("api_anchor = '''        ensureEditorEntry: function () {")
          api_end=s.index("tok = replace_once(tok, api_anchor, api_new, \"tokenizer public bind api\")",api_start)
          api_end=s.index('\n',api_end)+1
          api='''api_anchor = ''' + "'''" + '''        mount: mountFromEditor,\n        unmount: function () { return returnToEditor("api_unmount"); },''' + "'''" + '''\napi_new = api_anchor + ''' + "'''" + '''\n        bindEditorRoot: function (contentView, rootView, embedded) {\n            return runOnMainSync(function () {\n                return bindEditorRoot(contentView, rootView, embedded === true);\n            }, 2500);\n        },\n        unbindEditorRoot: function (discardMounted) {\n            return runOnMainSync(function () {\n                clearEditorBinding(discardMounted === true);\n                return true;\n            }, 2500);\n        },''' + "'''" + '''\ntok = replace_once(tok, api_anchor, api_new, "tokenizer public bind api")\n'''
          s=s[:api_start]+api+s[api_end:]
          p.write_text(s,encoding='utf-8')
          PY
          python3 tools/ui_shell_stage3_20260815.py

      - name: Validate expanded runtime sources
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/cliphub-stage3-expanded
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python3 - "$OUT" <<'PY'
          import base64,gzip,json,re,sys
          from pathlib import Path
          out=Path(sys.argv[1])
          for path in sorted(Path('src').glob('*.js')):
              text=path.read_text(encoding='utf-8')
              m=re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);',text,re.S)
              source=text
              if m:
                  pieces=re.findall(r'"(?:\\.|[^"\\])*"',m.group(1))
                  source=gzip.decompress(base64.b64decode(
                      ''.join(json.loads(x) for x in pieces))).decode('utf-8')
              (out/path.name).write_text(source,encoding='utf-8')
          PY
          for f in "$OUT"/*.js; do node --check "$f" >/dev/null; done
          echo 'All expanded runtime JavaScript syntax: passed'

      - name: Validate ES5 color manifest and release contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict | tee /tmp/stage3-color.txt
          grep '^HIGH=0 WARN=0 ' /tmp/stage3-color.txt
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check

      - name: Validate Stage3 regression boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=c013ef1fcc61521c1d81b128e2b4dbcecfdef4c2
          git diff --name-only "$BASE" -- > /tmp/stage3-files.txt
          echo '===== CHANGED FROM .13 STABLE ====='
          cat /tmp/stage3-files.txt
          python3 - <<'PY'
          from pathlib import Path
          files=set(Path('/tmp/stage3-files.txt').read_text().splitlines())
          transient={
            '.github/workflows/ui_shell_stage3_probe_once.yml',
            '.github/workflows/ui_shell_stage3_once.yml',
            'tools/ui_shell_stage3_20260815.py',
          }
          persistent=files-transient
          expected={
            'module-manifest.json',
            'scripts/release_preflight.sh',
            'src/ch_10_editor.js',
            'src/ch_16_ui_shell.js',
            'src/ch_17_tokenizer_ui.js',
          }
          assert persistent == expected, {
            'unexpected': sorted(persistent-expected),
            'missing': sorted(expected-persistent),
          }
          forbidden={
            'src/ch_03_database.js','src/ch_06_repository.js',
            'src/ch_07_theme.js','src/ch_08_window.js','src/ch_09_list.js',
            'src/ch_11_filter.js','src/ch_12_translation.js',
            'src/ch_13_settings.js','src/ch_15_app.js'
          }
          assert not (persistent & forbidden), sorted(persistent & forbidden)
          print('Stage3 persistent boundary: passed')
          PY
          if [ -n "$(git diff --name-only "$BASE" -- src/ch_08_window.js src/ch_09_list.js src/ch_11_filter.js src/ch_12_translation.js src/ch_13_settings.js)" ]; then
            echo 'ERROR: forbidden module diff detected' >&2
            exit 1
          fi

      - name: Commit Stage3 migration and clean probes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/ui_shell_stage3_probe_once.yml
          git rm -f .github/workflows/ui_shell_stage3_once.yml
          git rm -f tools/ui_shell_stage3_20260815.py
          git add module-manifest.json scripts/release_preflight.sh \
            src/ch_10_editor.js src/ch_16_ui_shell.js src/ch_17_tokenizer_ui.js
          git diff --cached --check
          git commit -m "迁移编辑标签分词到首页主窗口"
          git push origin HEAD:beta-regex-settings-tabs-20260814
