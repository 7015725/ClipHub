name: UI Layout Framework V2 Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/ui_layout_framework_v2_once.yml

permissions:
  contents: write

jobs:
  unify-ui-layout-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and validate UI layout framework
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/ui-layout-v2-run.txt) 2>&1
          python3 tools/ui_layout_framework_fix_v2.py
          node --check src/ch_07_theme.js
          node --check src/ch_11_filter.js
          node --check src/ch_13_settings.js
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict | tee /tmp/ui-layout-v2-color.txt
          grep '^HIGH=0 WARN=0 ' /tmp/ui-layout-v2-color.txt
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import pathlib
          import re
          import subprocess

          root = pathlib.Path('.')

          def blob_sha(data):
              return hashlib.sha1(
                  b'blob ' + str(len(data)).encode('ascii') + b'\0' + data
              ).hexdigest()

          def expanded(path):
              text = path.read_text(encoding='utf-8')
              assignment = re.search(
                  r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);', text, re.S
              )
              if assignment is None:
                  return text
              pieces = re.findall(r'"(?:\\.|[^"\\])*"', assignment.group(1))
              encoded = ''.join(json.loads(piece) for piece in pieces)
              return gzip.decompress(base64.b64decode(encoded)).decode('utf-8')

          manifest = json.loads(
              (root / 'module-manifest.json').read_text(encoding='utf-8')
          )
          assert manifest['moduleSetVersion'] == '20260815.09'
          assert manifest['sourceRef'] == 'beta-regex-settings-tabs-20260814'
          assert len(manifest['modules']) == 16
          for item in manifest['modules']:
              path = root / item['path']
              assert path.is_file(), path
              assert blob_sha(path.read_bytes()) == item['sha'], item['path']

          theme = expanded(root / 'src/ch_07_theme.js')
          filter_source = expanded(root / 'src/ch_11_filter.js')
          settings = expanded(root / 'src/ch_13_settings.js')
          fragment = (root / 'tools/regex_beta_patches/settings_regex_feature.jsfrag').read_text(encoding='utf-8')

          assert 'MODULE_VERSION: 5' in theme
          assert 'getLayoutMetrics: getLayoutMetrics' in theme
          assert 'pageRadiusDp: 24' in theme
          assert 'MODULE_VERSION: 83' in filter_source
          assert 'metrics = ClipHub.Theme.getLayoutMetrics(' in filter_source
          assert 'baseDp = Math.max(touchDp, widthDp * 0.018);' not in filter_source
          assert 'layout.pageRadiusDp' in filter_source
          assert 'MODULE_VERSION: 32' in settings
          assert settings.count('function settingsLayoutMetrics()') == 1
          assert 'filterState.panelWidthDp' in settings
          assert 'layoutMetrics = settingsLayoutMetrics();' in settings
          assert 'settingsTabBarPresent: rootTabsActive' in settings
          assert 'REGEX_TEST_TEXT_CHAR_BUDGET = 786432' in settings
          assert 'function bindRegexRuleDrag(' in settings
          assert 'filterRegexRuleIds' in settings
          assert 'filterRegexMatchMode' in settings
          assert 'function setSettingsTab(tab, origin)' in settings
          assert 'metrics = settingsLayoutMetrics();' in fragment

          changed = set(
              subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          )
          expected = {
              'module-manifest.json',
              'scripts/release_preflight.sh',
              'src/ch_07_theme.js',
              'src/ch_11_filter.js',
              'src/ch_13_settings.js',
              'tools/regex_beta_patches/settings_regex_feature.jsfrag',
          }
          assert changed == expected, (changed, expected)
          for untouched in (
              'src/ch_03_database.js',
              'src/ch_06_repository.js',
              'src/ch_08_window.js',
              'src/ch_09_list.js',
              'src/ch_10_editor.js',
              'src/ch_12_translation.js',
              'src/ch_15_app.js',
              'src/ch_17_tokenizer_ui.js',
          ):
              assert untouched not in changed, untouched
          print('UI layout boundary validation: passed')
          PY

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-layout-framework-v2-log
          path: /tmp/ui-layout-v2-run.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Commit UI layout framework
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/ui_layout_framework_v2_once.yml
          git rm -f .github/workflows/ui_layout_framework_once.yml
          git rm -f tools/ui_layout_framework_20260815.py
          git rm -f tools/ui_layout_framework_fix_v2.py
          if [ -f ui_layout_diag_current.txt ]; then
            git rm -f ui_layout_diag_current.txt
          fi
          git add module-manifest.json scripts/release_preflight.sh \
                  src/ch_07_theme.js src/ch_11_filter.js src/ch_13_settings.js \
                  tools/regex_beta_patches/settings_regex_feature.jsfrag
          git diff --cached --check
          git commit -m "统一首页与设置Regex布局框架"
          git push origin HEAD:beta-regex-settings-tabs-20260814
