name: Beta Stage12 Safe Diagnostics
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/workflows/beta_stage12_safe_diag.yml
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode Filter 52 and write focused report
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,glob,pathlib,re
          parts=sorted(glob.glob('stage-assets/pagination-stage9/ch11_full_v7_*.b64'))
          src=gzip.decompress(base64.b64decode(''.join(pathlib.Path(p).read_text().strip() for p in parts))).decode()
          lines=src.splitlines()
          out=[]
          def section(title, pattern, before=30, after=100, all_matches=False):
              hits=[i for i,l in enumerate(lines) if pattern in l]
              if not hits:
                  out.append('\n===== %s : NOT FOUND =====\n'%title); return
              if not all_matches: hits=hits[:1]
              for i in hits:
                  a=max(0,i-before); b=min(len(lines),i+after)
                  out.append('\n===== %s @ L%d =====\n'%(title,i+1))
                  out.extend('%05d %s\n'%(j+1,lines[j]) for j in range(a,b))
          section('apply hydration result','function applyHydrationResult',40,180)
          section('collect hydration request','function collectHydrationRequest',30,180)
          section('submit hydration request','function submitHydrationRequest',30,160)
          section('dehydrate data window','function dehydrateDataWindowOutside',30,160)
          section('rebuild virtual window','function rebuildVirtualWindow',30,240)
          section('schedule virtual update','function scheduleVirtualUpdate',30,120)
          section('measure virtual cards','function measureVirtualCards',30,160)
          section('capture scroll anchor','function captureScrollAnchor',30,160)
          out.append('\n===== ALL scheduleVirtualUpdate CALLS =====\n')
          for i,l in enumerate(lines):
              if 'scheduleVirtualUpdate(' in l and 'function scheduleVirtualUpdate' not in l:
                  out.append('%05d %s\n'%(i+1,l))
          out.append('\n===== ALL rebuildVirtualWindow CALLS =====\n')
          for i,l in enumerate(lines):
              if 'rebuildVirtualWindow(' in l and 'function rebuildVirtualWindow' not in l:
                  out.append('%05d %s\n'%(i+1,l))
          out.append('\n===== ALL force=true LITERALS =====\n')
          for i,l in enumerate(lines):
              if 'true' in l and ('rebuildVirtualWindow' in l or 'scheduleVirtualUpdate' in l or 'force' in l):
                  out.append('%05d %s\n'%(i+1,l))
          pathlib.Path('stage12_safe_diag.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit report and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/beta_stage12_safe_diag.yml
          git add stage12_safe_diag.txt
          git commit -m "诊断 Beta 滚动剩余热点"
          git push
