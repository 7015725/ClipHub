name: Fix Settings33 Syntax Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/fix_settings33_syntax_once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair packed Settings source and strengthen preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib,json,re
          from pathlib import Path

          def blob_sha(text):
              data=text.encode('utf-8')
              return hashlib.sha1(('blob %d\0' % len(data)).encode('utf-8')+data).hexdigest()

          def unpack(path):
              loader=Path(path).read_text(encoding='utf-8')
              m=re.search(r'\bvar\s+(PACKED_B64|encoded)\s*=\s*(.*?);',loader,re.S)
              assert m, path
              parts=re.findall(r'"(?:\\.|[^"\\])*"',m.group(2))
              source=gzip.decompress(base64.b64decode(''.join(json.loads(x) for x in parts))).decode('utf-8')
              return loader,m.group(1),source

          def repack(path,loader,var_name,source):
              digest=hashlib.sha256(source.encode('utf-8')).hexdigest()
              packed=base64.b64encode(gzip.compress(source.encode('utf-8'),compresslevel=9,mtime=0)).decode('ascii')
              chunks=[packed[i:i+120] for i in range(0,len(packed),120)]
              lines=[]
              for i,chunk in enumerate(chunks):
                  lines.append('        "'+chunk+'"'+(' +' if i<len(chunks)-1 else ''))
              replacement='var '+var_name+' =\n'+'\n'.join(lines)+';'
              m=re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);',loader,re.S)
              assert m
              loader=loader[:m.start()]+replacement+loader[m.end():]
              loader,n=re.subn(r'(\bvar\s+SOURCE_SHA256\s*=\s*[\'\"])[0-9a-fA-F]{64}([\'\"])',r'\g<1>'+digest+r'\2',loader,count=1)
              assert n==1
              Path(path).write_text(loader,encoding='utf-8')
              return loader

          path='src/ch_13_settings.js'
          loader,var_name,source=unpack(path)
          assert re.search(r'MODULE_NAME:\s*"ch_13_settings"\s*,\s*MODULE_VERSION:\s*33',source,re.S)

          broken='''            content.addView(handleRow, new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT, dp(16)));\n        }());'''
          fixed='''            content.addView(handleRow, new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT, dp(16)));\n            }\n        }());'''
          assert source.count(broken)==1, source.count(broken)
          source=source.replace(broken,fixed,1)

          root_start=source.index('    function buildRootPage() {')
          root_end=source.index('    /* REGEX_BETA_SETTINGS_BEGIN */',root_start)
          root=source[root_start:root_end]
          header_anchor='        header.setOrientation(LinearLayout.HORIZONTAL);\n'
          assert root.count(header_anchor)==1, root.count(header_anchor)
          root=root.replace(header_anchor,'        if (!embeddedInPrimary) {\n'+header_anchor,1)
          source=source[:root_start]+root+source[root_end:]

          source,n=re.subn(r'(MODULE_NAME:\s*"ch_13_settings"\s*,\s*MODULE_VERSION:\s*)33',r'\g<1>34',source,count=1,flags=re.S)
          assert n==1
          new_loader=repack(path,loader,var_name,source)

          manifest_path=Path('module-manifest.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['moduleSetVersion']=='20260815.12'
          manifest['moduleSetVersion']='20260815.13'
          for item in manifest['modules']:
              if item['name']=='ch_13_settings.js':
                  item['sha']=blob_sha(new_loader)
                  break
          else:
              raise AssertionError('settings manifest entry missing')
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=Path('scripts/release_preflight.sh')
          s=p.read_text(encoding='utf-8')
          assert s.count("EXPECTED_MODULE_SET='20260815.12'")==1
          s=s.replace("EXPECTED_MODULE_SET='20260815.12'","EXPECTED_MODULE_SET='20260815.13'",1)
          assert s.count('"ch_13_settings.js": ("ch_13_settings", 33)')==1
          s=s.replace('"ch_13_settings.js": ("ch_13_settings", 33)','"ch_13_settings.js": ("ch_13_settings", 34)',1)
          marker='python3 scripts/validate_es5.py .\n'
          assert s.count(marker)==1
          syntax='''python3 scripts/validate_es5.py .\n\n# Packed modules must be syntax-checked after expansion; checking only the loader\n# wrapper cannot detect syntax errors inside gzip/base64 payloads.\nPACKED_SYNTAX_DIR="$AUDIT_DIR/expanded-js"\nmkdir -p "$PACKED_SYNTAX_DIR"\npython3 - "$PACKED_SYNTAX_DIR" <<'PYJS'\nimport base64\nimport gzip\nimport json\nimport re\nimport sys\nfrom pathlib import Path\n\nout = Path(sys.argv[1])\nfor path in sorted(Path('src').glob('*.js')):\n    text = path.read_text(encoding='utf-8')\n    match = re.search(r'\\bvar\\s+(?:PACKED_B64|encoded)\\s*=\\s*(.*?);', text, re.S)\n    source = text\n    if match is not None:\n        pieces = re.findall(r'"(?:\\\\.|[^"\\\\])*"', match.group(1))\n        source = gzip.decompress(base64.b64decode(\n            ''.join(json.loads(piece) for piece in pieces))).decode('utf-8')\n    (out / path.name).write_text(source, encoding='utf-8')\nPYJS\nfor expanded_js in "$PACKED_SYNTAX_DIR"/*.js; do\n  node --check "$expanded_js" >/dev/null\ndone\necho 'Expanded JS syntax verification: passed'\n'''
          s=s.replace(marker,syntax,1)
          p.write_text(s,encoding='utf-8')
          print('Repaired both Settings33 syntax defects -> Settings34')
          print('moduleSetVersion -> 20260815.13')
          PY

      - name: Validate expanded runtime JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,json,re
          from pathlib import Path
          out=Path('/tmp/expanded-runtime'); out.mkdir(exist_ok=True)
          for path in sorted(Path('src').glob('*.js')):
              text=path.read_text(encoding='utf-8')
              m=re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);',text,re.S)
              source=text
              if m:
                  parts=re.findall(r'"(?:\\.|[^"\\])*"',m.group(1))
                  source=gzip.decompress(base64.b64decode(''.join(json.loads(x) for x in parts))).decode('utf-8')
              (out/path.name).write_text(source,encoding='utf-8')
          PY
          for f in /tmp/expanded-runtime/*.js; do node --check "$f" >/dev/null; done
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict | tee /tmp/color.txt
          grep '^HIGH=0 WARN=0 ' /tmp/color.txt
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check

      - name: Commit syntax repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/expanded_js_syntax_probe_once.yml
          git rm -f .github/workflows/fix_settings33_syntax_once.yml
          git add module-manifest.json scripts/release_preflight.sh src/ch_13_settings.js
          git diff --cached --check
          git commit -m "修复Settings33解包源码语法错误"
          git push origin HEAD:beta-regex-settings-tabs-20260814
