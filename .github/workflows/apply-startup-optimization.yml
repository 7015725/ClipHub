name: Apply ClipHub startup optimization

on:
  push:
    branches:
      - agent/optimize-cliphub-window-startup-v1-20260805
    paths:
      - .github/workflows/apply-startup-optimization.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optimize-cliphub-window-startup-v1-20260805
          fetch-depth: 0

      - name: Decode one-shot patcher
        shell: bash
        run: |
          mkdir -p tools
          cat <<'PAYLOAD' | base64 -d | gzip -d > tools/apply_startup_optimization.py
          
          PAYLOAD
          python -m py_compile tools/apply_startup_optimization.py

      - name: Apply optimization
        run: python tools/apply_startup_optimization.py

      - name: Validate Rhino ES5 syntax
        shell: bash
        run: |
          node --check ClipHub.js
          node --check src/ch_09_list.js
          node --check src/ch_11_filter.js
          node --check src/ch_15_app.js
          python -m json.tool module-manifest.json >/dev/null

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: optimize ClipHub window startup"
          git push origin HEAD:agent/optimize-cliphub-window-startup-v1-20260805
