name: Stage9 RC Audit Once

on:
  push:
    branches:
      - beta-regex-settings-tabs-20260814
    paths:
      - '.github/workflows/stage9_rc_audit_once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Verify ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor origin/main HEAD
          echo "MAIN=$(git rev-parse origin/main)"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "MERGE_BASE=$(git merge-base origin/main HEAD)"
          echo "AHEAD=$(git rev-list --count origin/main..HEAD)"
          echo "BEHIND=$(git rev-list --count HEAD..origin/main)"

      - name: Run formal beta preflight
        run: bash scripts/release_preflight.sh --settings-tabs-beta

      - name: Audit branch hardcodes
        run: |
          set -euo pipefail
          echo '=== beta branch literal occurrences ==='
          git grep -n 'beta-regex-settings-tabs-20260814' -- . || true
          echo
          echo '=== release-critical branch literal occurrences ==='
          git grep -n 'beta-regex-settings-tabs-20260814' -- ClipHub.js module-manifest.json scripts tasks '*.txt' 2>/dev/null || true

      - name: Audit merge diff and residue
        run: |
          set -euo pipefail
          echo '=== changed files main...HEAD ==='
          git diff --name-status origin/main...HEAD
          echo
          echo '=== likely beta implementation residue ==='
          git diff --name-only origin/main...HEAD | grep -E '^(\.github/.*trigger\.txt|\.github/workflows/regex_.*\.yml|probes/cliphub_(regex|comprehensive_performance_probe_07[67])|tools/apply_regex_|tools/regex_beta_patches/)' || true
          echo
          echo '=== references to likely residue paths ==='
          for path in \
            .github/regex-filter-layout-cleanup-trigger.txt \
            .github/regex-inline-sourcegrid-publish-trigger.txt \
            .github/workflows/regex_drag_hotfix.yml \
            .github/workflows/regex_filter_layout_cleanup.yml \
            .github/workflows/regex_inline_sourcegrid_publish.yml \
            tools/apply_regex_filter_beta.py \
            tools/apply_regex_filter_layout_cleanup_v1.py \
            tools/apply_regex_inline_filter_layout.py \
            tools/apply_regex_inline_source_grid_v2.py \
            tools/apply_regex_inline_source_grid_v3.py \
            tools/apply_regex_inline_source_grid_v4.py \
            tools/apply_regex_inline_source_grid_v5.py; do
              base=$(basename "$path")
              echo "--- $path ---"
              git grep -n -F "$base" -- . ":!$path" || true
          done

      - name: Audit promotion requirements
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          branch = 'beta-regex-settings-tabs-20260814'
          manifest = json.loads(Path('module-manifest.json').read_text(encoding='utf-8'))
          cliphub = Path('ClipHub.js').read_text(encoding='utf-8')
          preflight = Path('scripts/release_preflight.sh').read_text(encoding='utf-8')

          m = re.search(r'var DEFAULT_REF = "([^"]+)";', cliphub)
          print('manifest.sourceRef=', manifest.get('sourceRef'))
          print('manifest.moduleSetVersion=', manifest.get('moduleSetVersion'))
          print('manifest.entryMinVersion=', manifest.get('entryMinVersion'))
          print('ClipHub.DEFAULT_REF=', m.group(1) if m else '<missing>')
          print('preflight_main_current_version=', '20260809.05' in preflight)
          print('preflight_settings_beta_version=', str(manifest.get('moduleSetVersion')) in preflight)

          blockers = []
          if manifest.get('sourceRef') != branch:
              blockers.append('beta manifest sourceRef unexpected before promotion')
          if not m or m.group(1) != branch:
              blockers.append('beta ClipHub DEFAULT_REF unexpected before promotion')
          if '20260809.05' not in preflight:
              blockers.append('unable to locate current --main baseline expectation')

          if blockers:
              raise SystemExit('AUDIT BLOCKER: ' + '; '.join(blockers))
          print('PROMOTION_REQUIRED: sourceRef beta->main')
          print('PROMOTION_REQUIRED: ClipHub DEFAULT_REF beta->main')
          print('PROMOTION_REQUIRED: release_preflight --main expected versions -> RC versions')
          print('STAGE9_RC_AUDIT_PASS')
          PY

      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
