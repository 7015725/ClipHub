name: Beta Stage12 Same Range Fast Path
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/workflows/beta_stage12_apply.yml
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Filter 51
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,glob,hashlib,json,pathlib,re,math
          base_sha='605fdf2bc41d4db6a2ac4deacd060e0a331043fb205e7eef1b45c67f4973da7e'
          part_paths=sorted(glob.glob('stage-assets/pagination-stage9/ch11_full_v5_*.b64'))
          if len(part_paths)!=8: raise SystemExit('expected 8 v5 parts, got %d'%len(part_paths))
          packed_text=''.join(pathlib.Path(p).read_text(encoding='utf-8').strip() for p in part_paths)
          source=gzip.decompress(base64.b64decode(packed_text)).decode('utf-8')
          if hashlib.sha256(source.encode()).hexdigest()!=base_sha: raise SystemExit('v5 source sha mismatch')
          if source.count('        MODULE_VERSION: 50,')!=1: raise SystemExit('Filter 50 export identity mismatch')
          source=source.replace('        MODULE_VERSION: 50,','        MODULE_VERSION: 51,')
          old='''        range = virtualTargetRange(preferredIndex);\n        hydration = hydrateDataWindowRange(\n            range.start, range.end,\n            String(origin || "virtual_rebuild") + "_hydrate");\n        virtualState.firstVisibleIndex = range.first;\n        virtualState.lastVisibleIndex = range.last;\n'''
          new='''        range = virtualTargetRange(preferredIndex);\n        virtualState.firstVisibleIndex = range.first;\n        virtualState.lastVisibleIndex = range.last;\n        if (force !== true &&\n                String(origin || "") === "result_scroll" &&\n                range.start === Number(\n                    virtualState.firstRenderedIndex) &&\n                range.end === Number(\n                    virtualState.lastRenderedIndex)) {\n            virtualState.topSpacerPx = setVirtualSpacerHeight(\n                virtualTopSpacer,\n                virtualHeightRange(0, range.start));\n            virtualState.bottomSpacerPx = setVirtualSpacerHeight(\n                virtualBottomSpacer,\n                virtualHeightRange(range.end + 1,\n                    previewRows.length));\n            virtualState.lastOrigin =\n                "result_scroll_same_range_fast";\n            virtualState.lastError = null;\n            return false;\n        }\n        hydration = hydrateDataWindowRange(\n            range.start, range.end,\n            String(origin || "virtual_rebuild") + "_hydrate");\n'''
          if source.count(old)!=1: raise SystemExit('rebuildVirtualWindow anchor mismatch')
          source=source.replace(old,new)
          for text in ['var VIRTUAL_BEFORE_SCREENS = 3;','var VIRTUAL_AFTER_SCREENS = 5;','var VIRTUAL_UPDATE_DELAY_MS = 24;']:
              if source.count(text)!=1: raise SystemExit('frozen constant mismatch: '+text)
          if source.count('newSingleThreadExecutor()')!=1: raise SystemExit('worker count changed')
          fn=source.index('function rebuildVirtualWindow')
          fast=source.index('result_scroll_same_range_fast',fn)
          hydrate=source.index('hydration = hydrateDataWindowRange(',fn)
          if fast>hydrate: raise SystemExit('fast path is not before hydration')
          source_sha=hashlib.sha256(source.encode()).hexdigest()
          gz=gzip.compress(source.encode('utf-8'),compresslevel=9,mtime=0)
          b64=base64.b64encode(gz).decode('ascii')
          packed_sha=hashlib.sha256(b64.encode('utf-8')).hexdigest()
          chunk=math.ceil(len(b64)/8)
          v6=[]
          for i in range(8):
              path='stage-assets/pagination-stage9/ch11_full_v6_%02d.b64'%i
              pathlib.Path(path).write_text(b64[i*chunk:(i+1)*chunk]+'\n',encoding='utf-8')
              v6.append(path)
          loader_path=pathlib.Path('src/ch_11_filter.js')
          loader=loader_path.read_text(encoding='utf-8')
          loader=loader.replace('/* ClipHub Stage 11.1 async hydration worker ES5 loader. */','/* ClipHub Stage 12 same-range scroll fast-path ES5 loader. */')
          parts='    var PARTS = [\n'+',\n'.join('        "'+p+'"' for p in v6)+'\n    ];'
          loader,n=re.subn(r'    var PARTS = \[.*?\n    \];',parts,loader,count=1,flags=re.S)
          if n!=1: raise SystemExit('loader PARTS anchor mismatch')
          loader,n=re.subn(r'(    var PACKED_SHA256 =\n        ")[0-9a-f]+(";)',r'\g<1>'+packed_sha+r'\2',loader,count=1)
          if n!=1: raise SystemExit('loader packed sha anchor mismatch')
          loader,n=re.subn(r'(    var SOURCE_SHA256 =\n        ")[0-9a-f]+(";)',r'\g<1>'+source_sha+r'\2',loader,count=1)
          if n!=1: raise SystemExit('loader source sha anchor mismatch')
          loader,n=re.subn(r'    var CACHE_NAME = "[^"]+";','    var CACHE_NAME = "ch_11_filter_stage12_v6_full.b64";',loader,count=1)
          if n!=1: raise SystemExit('loader cache anchor mismatch')
          loader=loader.replace('?stage11_1v5=','?stage12v6=')
          loader=loader.replace('Stage 11.1 packed source SHA-256 mismatch','Stage 12 packed source SHA-256 mismatch')
          loader=loader.replace('Stage 11.1 source SHA-256 mismatch','Stage 12 source SHA-256 mismatch')
          loader=loader.replace('ch_11_filter.js Stage 11.1 loader failed','ch_11_filter.js Stage 12 loader failed')
          loader_path.write_text(loader,encoding='utf-8')
          def blob_sha(path):
              data=pathlib.Path(path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          mp=pathlib.Path('module-manifest.json')
          manifest=json.loads(mp.read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion')!='20260808.04': raise SystemExit('expected moduleSet .04')
          manifest['moduleSetVersion']='20260808.05'
          manifest['sourceRef']='beta-pagination-stage10-20260808'
          for m in manifest['modules']:
              if m['name']=='ch_11_filter.js': m['sha']=blob_sha('src/ch_11_filter.js')
          mp.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=pathlib.Path('ClipHub_分页阶段11首页预览按需正文测试入口.txt')
          if p.exists():
              s=p.read_text(encoding='utf-8').replace('20260808.04','20260808.05')
              p.write_text(s,encoding='utf-8')
          pathlib.Path('/tmp/ch11_filter_v51.js').write_text(source,encoding='utf-8')
          pathlib.Path('stage12_build_report.txt').write_text(
              'ok=true\nfilter=51\nmoduleSetVersion=20260808.05\nsource_sha='+source_sha+'\npacked_sha='+packed_sha+'\nloader_blob='+blob_sha('src/ch_11_filter.js')+'\n',encoding='utf-8')
          PY
          node --check /tmp/ch11_filter_v51.js
          node --check src/ch_11_filter.js
          cp ClipHub_分页阶段11首页预览按需正文测试入口.txt /tmp/stage11.js
          node --check /tmp/stage11.js
          ! grep -Eq '(^|[^A-Za-z0-9_])(let|const|class)[[:space:]]|=>' /tmp/ch11_filter_v51.js
          grep -Fq 'MODULE_VERSION: 51,' /tmp/ch11_filter_v51.js
          grep -Fq 'var VIRTUAL_BEFORE_SCREENS = 3;' /tmp/ch11_filter_v51.js
          grep -Fq 'var VIRTUAL_AFTER_SCREENS = 5;' /tmp/ch11_filter_v51.js
          grep -Fq 'var VIRTUAL_UPDATE_DELAY_MS = 24;' /tmp/ch11_filter_v51.js
          grep -Fq 'result_scroll_same_range_fast' /tmp/ch11_filter_v51.js
          grep -Fq '"moduleSetVersion": "20260808.05"' module-manifest.json
          git diff --check
      - name: Commit Filter 51 and cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/beta_stage12_apply.yml stage12_build_report.txt
          git add src/ch_11_filter.js module-manifest.json stage-assets/pagination-stage9/ch11_full_v6_*.b64 ClipHub_分页阶段11首页预览按需正文测试入口.txt
          git commit -m "优化 Beta 同范围滚动主线程路径"
          git push