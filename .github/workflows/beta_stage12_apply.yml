name: Beta Stage12 Build Diagnostics
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/workflows/beta_stage12_apply.yml
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose exact anchors
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,glob,pathlib,re
          parts=sorted(glob.glob('stage-assets/pagination-stage9/ch11_full_v5_*.b64'))
          packed=''.join(pathlib.Path(p).read_text(encoding='utf-8').strip() for p in parts)
          src=gzip.decompress(base64.b64decode(packed)).decode('utf-8')
          lines=src.splitlines()
          report=[]
          for i,line in enumerate(lines,1):
              if 'MODULE_VERSION' in line or 'newSingleThreadExecutor' in line or 'Executors' in line and 'concurrent' not in line:
                  report.append('%05d %s'%(i,line))
          test=pathlib.Path('ClipHub_分页阶段11首页预览按需正文测试入口.txt').read_text(encoding='utf-8')
          report.append('--- TEST IDENTITY ---')
          for i,line in enumerate(test.splitlines(),1):
              if 'FILTER' in line and ('VERSION' in line or 'MODULE' in line) or '20260808.04' in line:
                  report.append('%05d %s'%(i,line))
          pathlib.Path('stage12_build_report.txt').write_text('\n'.join(report)+'\n',encoding='utf-8')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage12_build_report.txt
          git commit -m "补充 Stage12 真实锚点报告" || exit 0
          git push