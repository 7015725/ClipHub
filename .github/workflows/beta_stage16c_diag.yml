name: Beta Stage16C Diagnostic
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/stage16c-diag-trigger.txt
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute Stage16C Filter64 builder
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          text=pathlib.Path('.github/workflows/beta_stage16c_fix.yml').read_text(encoding='utf-8')
          start_marker='      - name: Build Filter64\n        shell: bash\n        run: |\n'
          end_marker='      - name: Commit Stage16C atomically\n'
          if start_marker not in text or end_marker not in text:
              raise SystemExit('Stage16C builder block markers missing')
          body=text.split(start_marker,1)[1].split(end_marker,1)[0]
          lines=[]
          for line in body.splitlines():
              if line.startswith('          '): line=line[10:]
              lines.append(line)
          pathlib.Path('/tmp/stage16c_build.sh').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          bash /tmp/stage16c_build.sh
      - name: Commit Stage16C atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/stage16c-diag-trigger.txt .github/stage16c-fix-trigger.txt
          rm -f .github/workflows/beta_stage16c_diag.yml .github/workflows/beta_stage16c_fix.yml
          rm -f stage16c_diag.txt
          git add -A
          git diff --cached --check
          git commit -m "优化 Beta Holder 兼容键复用命中率"
          git push
