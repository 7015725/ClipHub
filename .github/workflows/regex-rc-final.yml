name: Regex RC final verification

on:
  push:
    branches:
      - beta-regex-filter-20260813-rc-impl

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: beta-regex-filter-20260813-rc-impl
      - name: Align encoded loader integrity audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/audit_color_api.py')
          text = path.read_text(encoding='utf-8')
          old = '''    sha_match = re.search(\n        r"\\bvar\\s+SOURCE_SHA256\\s*=\\s*['\\\"]([0-9a-fA-F]{64})['\\\"]",\n        source,\n    )\n    if sha_match is None:\n        raise ValueError(f"{relative}: packed source SHA is missing")\n    pieces = re.findall(r'"(?:\\\\.|[^"\\\\])*"', assignment.group(1))\n    if not pieces:\n        raise ValueError(f"{relative}: packed source is empty")\n    encoded = "".join(json.loads(piece) for piece in pieces)\n    expanded = gzip.decompress(base64.b64decode(encoded)).decode("utf-8")\n    actual = hashlib.sha256(expanded.encode("utf-8")).hexdigest()\n    expected = sha_match.group(1).lower()\n    if actual != expected:\n        raise ValueError(\n            f"{relative}: packed source SHA mismatch: {actual} != {expected}"\n        )\n    return relative + "::packed", expanded\n'''
          new = '''    sha_match = re.search(\n        r"\\bvar\\s+SOURCE_SHA256\\s*=\\s*['\\\"]([0-9a-fA-F]{64})['\\\"]",\n        source,\n    )\n    pieces = re.findall(r'"(?:\\\\.|[^"\\\\])*"', assignment.group(1))\n    if not pieces:\n        raise ValueError(f"{relative}: packed source is empty")\n    encoded = "".join(json.loads(piece) for piece in pieces)\n    expanded = gzip.decompress(base64.b64decode(encoded)).decode("utf-8")\n    if sha_match is not None:\n        actual = hashlib.sha256(expanded.encode("utf-8")).hexdigest()\n        expected = sha_match.group(1).lower()\n        if actual != expected:\n            raise ValueError(\n                f"{relative}: packed source SHA mismatch: {actual} != {expected}"\n            )\n    else:\n        blob_match = re.search(\n            r"规范源码 Git blob:\\s*([0-9a-fA-F]{40})", source\n        )\n        if blob_match is None:\n            raise ValueError(f"{relative}: packed source integrity marker is missing")\n        raw = expanded.encode("utf-8")\n        actual_blob = hashlib.sha1(\n            f"blob {len(raw)}\\0".encode("utf-8") + raw\n        ).hexdigest()\n        expected_blob = blob_match.group(1).lower()\n        if actual_blob != expected_blob:\n            raise ValueError(\n                f"{relative}: packed source Git blob mismatch: "\n                f"{actual_blob} != {expected_blob}"\n            )\n    return relative + "::packed", expanded\n'''
          if text.count(old) != 1:
              raise SystemExit('audit_color_api packed_source anchor count != 1')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict
          git diff --check
          git add scripts/audit_color_api.py
          git commit -m 'build(regex): align encoded loader color audit integrity'
          git push origin HEAD:beta-regex-filter-20260813-rc-impl
      - name: Run strict RC and no-touch gates
        shell: bash
        run: |
          set -euo pipefail
          BASE=b23543f816fbeb777e5ceded12557433fd6aeae5
          test -z "$(git status --porcelain)"
          test -z "$(git diff "$BASE" -- src/ch_03_database.js src/ch_08_window.js src/ch_09_list.js src/ch_10_editor.js src/ch_12_translation.js src/ch_15_app.js ClipHub.js tasks)"
          changed="$(git diff --name-only "$BASE" HEAD | grep -v '^\.github/workflows/regex-rc-' || true)"
          printf '%s\n' "$changed" | python3 -c 'import sys; allowed_prefix=("tools/regex_beta_patches/","probes/","scripts/"); allowed_exact={"src/ch_06_repository.js","src/ch_11_filter.js","src/ch_13_settings.js","module-manifest.json"}; bad=[x.strip() for x in sys.stdin if x.strip() and x.strip() not in allowed_exact and not x.strip().startswith(allowed_prefix)]; assert not bad,bad'
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict
          git diff --check
          bash scripts/release_preflight.sh --regex-rc
      - name: Remove verification harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/regex-rc-final.yml
          git add -A
          git commit -m 'chore: remove regex RC verification harness'
          git push origin HEAD:beta-regex-filter-20260813-rc-impl
