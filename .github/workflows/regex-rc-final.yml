name: Regex RC verification

on:
  push:
    branches:
      - beta-regex-filter-20260813-rc-impl

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: beta-regex-filter-20260813-rc-impl
      - name: Verify hard boundaries and canonical synchronization
        shell: bash
        run: |
          set -euo pipefail
          BASE=b23543f816fbeb777e5ceded12557433fd6aeae5
          test -z "$(git status --porcelain)"
          test -z "$(git diff "$BASE" -- src/ch_03_database.js src/ch_08_window.js src/ch_09_list.js src/ch_10_editor.js src/ch_12_translation.js src/ch_15_app.js ClipHub.js tasks)"
          changed="$(git diff --name-only "$BASE" HEAD | grep -v '^\.github/workflows/regex-rc-' || true)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | python3 -c 'import sys; allowed_prefix=("tools/regex_beta_patches/","probes/","scripts/"); allowed_exact={"src/ch_06_repository.js","src/ch_11_filter.js","src/ch_13_settings.js","module-manifest.json"}; bad=[x.strip() for x in sys.stdin if x.strip() and x.strip() not in allowed_exact and not x.strip().startswith(allowed_prefix)]; assert not bad,bad'
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, json, re
          root = Path('.')
          def source(path):
              text = (root / path).read_text(encoding='utf-8')
              match = re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);', text, re.S)
              if match is None:
                  return text
              pieces = re.findall(r'"(?:\\.|[^"\\])*"', match.group(1))
              assert pieces, path
              payload = ''.join(json.loads(piece) for piece in pieces)
              return gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          manifest = json.loads((root / 'module-manifest.json').read_text(encoding='utf-8'))
          assert manifest['moduleSetVersion'] == '20260813.06', manifest['moduleSetVersion']
          assert manifest['entryMinVersion'] == 6, manifest['entryMinVersion']
          assert manifest['sourceRef'] == 'beta-regex-filter-20260813', manifest['sourceRef']
          assert len(manifest['modules']) == 15, len(manifest['modules'])
          db = source('src/ch_03_database.js')
          repo = source('src/ch_06_repository.js')
          filt = source('src/ch_11_filter.js')
          settings = source('src/ch_13_settings.js')
          app = source('src/ch_15_app.js')
          assert 'var SCHEMA_VERSION = 2;' in db
          assert 'db.setVersion(3)' not in db
          assert 'CREATE TABLE IF NOT EXISTS regex_rules' in db
          assert re.search(r'MODULE_NAME:\s*"ch_06_repository"\s*,\s*MODULE_VERSION:\s*18', repo, re.S)
          assert re.search(r'MODULE_NAME:\s*"ch_11_filter"\s*,\s*MODULE_VERSION:\s*78', filt, re.S)
          assert re.search(r'MODULE_NAME:\s*"ch_13_settings"\s*,\s*MODULE_VERSION:\s*26', settings, re.S)
          assert re.search(r'MODULE_NAME:\s*"ch_15_app"\s*,\s*MODULE_VERSION:\s*20', app, re.S)
          assert 'options.searchKeyword' in repo and 'options.titleKeyword' in repo
          assert 'assessRegexRisk' in repo
          assert 'REGEX_SCAN_CHUNK_TEXT_CHAR_BUDGET' in repo
          assert 'cancelRegexTest' in settings
          assert 'settingsPage !== "regex_test"' in settings
          assert 'clearPendingRegexDeleteConfirm' in settings
          assert 'MAX_REGEX_CACHE_ENTRIES = 8' in filt
          assert 'regexRulePickerLabel' in filt
          for frag, canonical in (
              ('tools/regex_beta_patches/repository_regex_feature.jsfrag', repo),
              ('tools/regex_beta_patches/filter_regex_feature.jsfrag', filt),
              ('tools/regex_beta_patches/settings_regex_feature.jsfrag', settings),
          ):
              fragment = (root / frag).read_text(encoding='utf-8').strip()
              assert fragment in canonical, frag
          print('Regex canonical synchronization: passed')
          print('No-touch schema/module contracts: passed')
          PY
          python3 scripts/validate_es5.py .
          git diff --check
          bash scripts/release_preflight.sh --regex-rc
      - name: Remove verification harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/regex-rc-final.yml
          git add -A
          git commit -m 'chore: remove regex RC verification harness'
          git push origin HEAD:beta-regex-filter-20260813-rc-impl
