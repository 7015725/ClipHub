name: Beta Stage16B4 Diagnostic
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/stage16b4-diag-trigger.txt
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute Stage16B4 builder
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          text=pathlib.Path('.github/workflows/beta_stage16b4_fix.yml').read_text(encoding='utf-8')
          start_marker='      - name: Build Filter63\n        shell: bash\n        run: |\n'
          end_marker='      - name: Commit Stage16B4 atomically\n'
          if start_marker not in text or end_marker not in text:
              raise SystemExit('Stage16B4 builder block missing')
          body=text.split(start_marker,1)[1].split(end_marker,1)[0]
          lines=[]
          for line in body.splitlines():
              if line.startswith('          '): line=line[10:]
              lines.append(line)
          pathlib.Path('/tmp/stage16b4_build.sh').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          bash /tmp/stage16b4_build.sh
      - name: Commit Filter63
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/stage16b4-diag-trigger.txt .github/stage16b4-fix-trigger.txt
          rm -f .github/workflows/beta_stage16b4_diag.yml .github/workflows/beta_stage16b4_fix.yml
          rm -f stage16b4_diag.txt
          git add -A
          git diff --cached --check
          git commit -m "修复 Beta Holder 标签颜色并记录完整刷新序列"
          git push
