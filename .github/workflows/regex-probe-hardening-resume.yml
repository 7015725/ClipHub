name: Resume Regex probe hardening

on:
  push:
    branches:
      - beta-regex-filter-20260813-rc-impl

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: beta-regex-filter-20260813-rc-impl
      - name: Apply durable probe files from reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          TARGET=beta-regex-filter-20260813
          EXPECTED=0d1d1dee4b9f6e1495a1d812875dc8cb93dfd115
          BASE=b23543f816fbeb777e5ceded12557433fd6aeae5
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "$TARGET"
          test "$(git rev-parse origin/$TARGET)" = "$EXPECTED"
          git show cd2b77721a4a32a3230ac44058be62f78674dd4f:.github/workflows/regex-probe-hardening.yml > /tmp/probe-source.yml
          git checkout -B regex-probe-hardening origin/$TARGET
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap
          source = Path('/tmp/probe-source.yml').read_text(encoding='utf-8').splitlines()
          wanted = {
              'probes/cliphub_regex_066.js',
              'probes/cliphub_regex_067.js',
              'probes/cliphub_regex_068.js',
              'probes/cliphub_regex_069.js',
              'probes/cliphub_regex_070.js',
              'probes/cliphub_regex_tester_lifecycle_probe_066.md',
              'probes/cliphub_regex_delete_confirm_rebuild_probe_067.md',
          }
          found = set()
          i = 0
          pattern = re.compile(r"cat > ([^ ]+) <<'EOF'")
          while i < len(source):
              match = pattern.search(source[i])
              if match and match.group(1) in wanted:
                  path = match.group(1)
                  i += 1
                  block = []
                  while i < len(source) and source[i].strip() != 'EOF':
                      block.append(source[i])
                      i += 1
                  if i >= len(source):
                      raise SystemExit('unterminated heredoc: ' + path)
                  content = textwrap.dedent('\n'.join(block)) + '\n'
                  Path(path).write_text(content, encoding='utf-8')
                  found.add(path)
              i += 1
          if found != wanted:
              raise SystemExit('missing probe payloads: ' + repr(sorted(wanted - found)))
          PY
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict
          git diff --check
          git add probes/cliphub_regex_066.js probes/cliphub_regex_067.js \
            probes/cliphub_regex_068.js probes/cliphub_regex_069.js probes/cliphub_regex_070.js \
            probes/cliphub_regex_tester_lifecycle_probe_066.md \
            probes/cliphub_regex_delete_confirm_rebuild_probe_067.md
          git commit -m 'test(regex): harden lifecycle and boundary probes'
          test -z "$(git diff "$BASE" -- src/ch_03_database.js src/ch_08_window.js src/ch_09_list.js src/ch_10_editor.js src/ch_12_translation.js src/ch_15_app.js ClipHub.js tasks)"
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict
          git diff --check
          bash scripts/release_preflight.sh --regex-rc
          git fetch origin "$TARGET"
          test "$(git rev-parse origin/$TARGET)" = "$EXPECTED"
          git push origin HEAD:"$TARGET"
      - name: Verify target and runtime no-touch contract
        shell: bash
        run: |
          set -euo pipefail
          TARGET=beta-regex-filter-20260813
          BASE=b23543f816fbeb777e5ceded12557433fd6aeae5
          git fetch origin "$TARGET"
          git checkout -B verify-target origin/$TARGET
          test "$(git log -1 --format=%s)" = 'test(regex): harden lifecycle and boundary probes'
          test -z "$(git diff "$BASE" -- src/ch_03_database.js src/ch_08_window.js src/ch_09_list.js src/ch_10_editor.js src/ch_12_translation.js src/ch_15_app.js ClipHub.js tasks)"
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict
          git diff --check
          bash scripts/release_preflight.sh --regex-rc
      - name: Remove temporary staging workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout beta-regex-filter-20260813-rc-impl
          rm -f .github/workflows/regex-probe-hardening-resume.yml
          git add -A
          git commit -m 'chore: remove regex probe hardening resume harness'
          git push origin HEAD:beta-regex-filter-20260813-rc-impl
