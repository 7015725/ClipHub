name: ShortX Icon Reflection Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/shortx_icon_reflection_once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0

      - name: Guard baseline
        run: |
          python3 - <<'PY'
          import subprocess
          baseline = '1ceceb3373049e9308877a21b02510d3a419664e'
          allowed = {
              '.github/shortx_icon_reflection_patch_once.py',
              '.github/workflows/shortx_icon_reflection_once.yml',
          }
          changed = set(filter(None, subprocess.check_output(
              ['git','diff','--name-only',baseline + '..HEAD'], text=True).splitlines()))
          assert changed == allowed, {'expected': sorted(allowed), 'actual': sorted(changed)}
          print('Baseline guard passed')
          PY

      - name: Apply ShortX reflected icons
        run: |
          python3 .github/shortx_icon_reflection_patch_once.py

      - name: Full beta regression gate
        run: |
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict
          node scripts/test_ui_shell_navigation.js
          node scripts/test_runtime_diagnostics.js
          python3 scripts/test_primary_window_legacy_routes.py
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check

      - name: Verify exact production boundary
        run: |
          python3 - <<'PY'
          import subprocess
          expected = {
              'src/ch_07_theme.js',
              'module-manifest.json',
              'scripts/release_preflight.sh',
          }
          changed = set(filter(None, subprocess.check_output(
              ['git','diff','--name-only'], text=True).splitlines()))
          assert changed == expected, {'expected': sorted(expected), 'actual': sorted(changed)}
          print('Production allowlist passed:', sorted(changed))
          PY

      - name: Commit production and clean temporary files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ch_07_theme.js module-manifest.json scripts/release_preflight.sh
          git rm -f .github/shortx_icon_reflection_patch_once.py .github/workflows/shortx_icon_reflection_once.yml
          git commit -m '改用ShortX内置Remix Icon反射体系'
          git push
