name: Apply Google Translation Integration

on:
  push:
    branches:
      - cleanup/tokenizer-no-regression-20260817
    paths:
      - .github/workflows/apply_google_translation_patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/tokenizer-no-regression-20260817
          fetch-depth: 0

      - name: Apply guarded translation patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/apply_google_translation_repo.py
          python3 /tmp/apply_google_translation_repo.py

      - name: Validate ES5 and packed contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/ch_12_translation.js
          node --check src/ch_13_settings.js
          python3 scripts/validate_es5.py .
          python3 scripts/manifest_contract.py validate --settings-tabs-beta
          bash scripts/release_preflight.sh --settings-tabs-beta

      - name: Commit guarded implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- src/ch_12_translation.js src/ch_13_settings.js module-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ch_12_translation.js src/ch_13_settings.js module-manifest.json
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add Google translation mode'
          git push origin HEAD:cleanup/tokenizer-no-regression-20260817
