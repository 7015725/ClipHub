name: Stage8 Finalize Once
on:
  push:
    branches:
      - beta-regex-settings-tabs-20260814
    paths:
      - '.github/workflows/stage8_finalize_once.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Wire Stage8 contract into preflight
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/release_preflight.sh')
          text = path.read_text(encoding='utf-8')
          old = '''if [ "$MODE" = '--settings-tabs-beta' ]; then
            node scripts/test_ui_shell_navigation.js
            node scripts/test_runtime_diagnostics.js
          fi'''.replace('          ', '')
          new = '''if [ "$MODE" = '--settings-tabs-beta' ]; then
            node scripts/test_ui_shell_navigation.js
            node scripts/test_runtime_diagnostics.js
            python3 scripts/test_primary_window_legacy_routes.py
          fi'''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('Stage8 preflight anchor mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove temporary Stage8 audit tooling
        run: |
          rm -f .github/workflows/stage8_legacy_route_audit_once.yml
          rm -f tools/stage8_legacy_route_audit_20260815.py
          rm -f .github/workflows/stage8_finalize_once.yml
      - name: Validate Stage8
        run: |
          python3 scripts/test_primary_window_legacy_routes.py
          python3 scripts/validate_es5.py .
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check
      - name: Validate persistent boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=76e0ba2a12ddfdcb119e2fa8f712c969b8a28e91
          expected=$(printf '%s\n' \
            scripts/release_preflight.sh \
            scripts/test_primary_window_legacy_routes.py | sort)
          actual=$({ git diff --name-only "$BASE"; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "$actual"
          test "$actual" = "$expected"

          git diff --quiet "$BASE" -- ClipHub.js module-manifest.json tasks/ClipHub_全局剪贴板开关.js
          for path in src/ch_*.js; do
            git diff --quiet "$BASE" -- "$path"
          done

          test ! -e .github/workflows/stage8_legacy_route_audit_once.yml
          test ! -e tools/stage8_legacy_route_audit_20260815.py
          test ! -e .github/workflows/stage8_finalize_once.yml
          grep -q 'python3 scripts/test_primary_window_legacy_routes.py' scripts/release_preflight.sh
          echo 'Stage8 persistent boundary: passed'
      - name: Commit and push Stage8 final tree
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "Stage8固化Primary Window Legacy路由边界"
          git push origin HEAD:beta-regex-settings-tabs-20260814
