name: Apply release review P2 data reliability fixes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - agent/fix-release-review-p1

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/release-review-p2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-review-p2
          fetch-depth: 0

      - name: Apply controlled P2 patch
        run: python3 scripts/apply_release_review_p2.py

      - name: Validate JavaScript syntax
        run: |
          node --check ClipHub.js
          for file in src/ch_*.js; do node --check "$file"; done

      - name: Validate ES5 and source contracts
        run: |
          if [ -f scripts/validate_es5.py ]; then
            python3 scripts/validate_es5.py
          fi
          git diff --check
          grep -q 'moduleSetVersion": "20260726.08"' module-manifest.json
          grep -q 'sourceRef": "agent/release-review-p2"' module-manifest.json
          grep -q 'getLatestActiveItem' src/ch_06_repository.js
          grep -q 'restoreItemIfDeletedAt' src/ch_06_repository.js

      - name: Remove one-time files and commit
        run: |
          rm -f scripts/apply_release_review_p2.py
          rm -f .github/workflows/apply-release-review-p2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden clipboard merge and delete undo invariants"
          git push origin HEAD:agent/release-review-p2
