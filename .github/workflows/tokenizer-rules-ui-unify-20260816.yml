name: Tokenizer Rules UI Unification

on:
  push:
    branches:
      - docs/tokenizer-softcode-hardening-20260815
    paths:
      - .github/workflows/tokenizer-rules-ui-unify-20260816.yml

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/tokenizer-softcode-hardening-20260815
          fetch-depth: 1

      - name: Apply unified Tokenizer rules UI
        run: |
          python3 scripts/tmp_unify_tokenizer_rules_ui_20260816.py

      - name: Validate packed Tokenizer UI syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path
          loader = Path('src/ch_17_tokenizer_ui.js').read_text(encoding='utf-8')
          match = re.search(r'    var PACKED_B64\s*=\s*(.*?)\n    ;\n', loader, re.S)
          if not match:
              raise SystemExit('PACKED_B64 missing')
          chunks = re.findall(r'"([A-Za-z0-9+/=]+)"', match.group(1))
          source = gzip.decompress(base64.b64decode(''.join(chunks))).decode('utf-8')
          Path('/tmp/ch_17_tokenizer_ui.expanded.js').write_text(source, encoding='utf-8')
          PY
          node --check src/ch_16_ui_shell.js
          node --check src/ch_17_tokenizer_ui.js
          node --check /tmp/ch_17_tokenizer_ui.expanded.js

      - name: Run regressions and release gates
        run: |
          python3 scripts/validate_es5.py .
          node scripts/test_ui_shell_navigation.js
          node scripts/test_runtime_diagnostics.js
          node scripts/test_tokenizer_core.js
          bash scripts/release_preflight.sh --settings-tabs-beta

      - name: Commit unified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tokenizer-rules-ui-unify-20260816.yml
          git rm scripts/tmp_unify_tokenizer_rules_ui_20260816.py
          git add src/ch_16_ui_shell.js src/ch_17_tokenizer_ui.js \
            scripts/test_ui_shell_navigation.js scripts/test_runtime_diagnostics.js \
            module-manifest.json scripts/manifest_contract.py scripts/release_preflight.sh
          git diff --cached --check
          git commit -m "feat: unify tokenizer rule management UI"
          git push origin HEAD:docs/tokenizer-softcode-hardening-20260815
