name: inspect-pagination-signature
on:
  push:
    branches: [beta-regex-filter-20260813]
    paths: ['.github/workflows/inspect-pagination-signature.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-regex-filter-20260813
      - shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,json,re,pathlib
          p=pathlib.Path('src/ch_11_filter.js')
          s=p.read_text(encoding='utf-8')
          m=re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);',s,re.S)
          pieces=re.findall(r'"(?:\\.|[^"\\])*"',m.group(1))
          c=gzip.decompress(base64.b64decode(''.join(json.loads(x) for x in pieces))).decode('utf-8')
          names=['syncPaginationSettings','resetResultPaging','loadPaginationPage','performLoadMoreClick','startRegexScan','completeRegexScan','publishRegex','criteriaSignature']
          out=[]
          for name in names:
              idx=c.find('function '+name)
              if idx<0:
                  idx=c.find(name)
              if idx>=0:
                  start=max(0,idx-600)
                  end=min(len(c),idx+7000)
                  out.append('\n===== '+name+' =====\n'+c[start:end])
          pathlib.Path('tmp_filter_pagination_snippets.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          git config user.name 7015725
          git config user.email 62368672+7015725@users.noreply.github.com
          git add tmp_filter_pagination_snippets.txt
          git commit -m 'temp inspect pagination signature'
          git push origin HEAD:beta-regex-filter-20260813
