name: Beta Stage16B Source Diagnostic
# trigger-v3
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/workflows/beta_stage16b_source_diag.yml
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract transformed Filter58 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,glob,pathlib,json
          loader=pathlib.Path('src/ch_11_filter.js').read_text(encoding='utf-8')
          parts=sorted(glob.glob('stage-assets/pagination-stage9/ch11_full_v8s_*.b64'))
          packed=''.join(pathlib.Path(p).read_text(encoding='utf-8').strip() for p in parts)
          stable=gzip.decompress(base64.b64decode(packed)).decode('utf-8')
          start=loader.index('    function replaceOnceStrict(')
          end=loader.index('\n    try {',start)
          pure=loader[start:end]
          harness='var __source='+json.dumps(stable)+';\n'+pure+'\nvar __out=transformCardHolderSource(transformSource(__source));\nrequire("fs").writeFileSync("stage16b_filter58_runtime_diag.js",__out);\n'
          pathlib.Path('/tmp/stage16b_diag_harness.js').write_text(harness,encoding='utf-8')
          PY
          node /tmp/stage16b_diag_harness.js
          node --check stage16b_filter58_runtime_diag.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage16b_filter58_runtime_diag.js
          git commit -m "生成 Stage16B Filter58 运行源码诊断"
          git push
