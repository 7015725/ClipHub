name: Beta Stage16B Source Diagnostic
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/workflows/beta_stage16b_source_diag.yml
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract transformed Filter58 sections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,glob,pathlib,json,re
          loader=pathlib.Path('src/ch_11_filter.js').read_text(encoding='utf-8')
          parts=sorted(glob.glob('stage-assets/pagination-stage9/ch11_full_v8s_*.b64'))
          packed=''.join(pathlib.Path(p).read_text(encoding='utf-8').strip() for p in parts)
          stable=gzip.decompress(base64.b64decode(packed)).decode('utf-8')
          # Execute the pure transform functions in node, because current runtime source is Filter56 + Stage15 + Stage16A transforms.
          start=loader.index('    function replaceOnceStrict(')
          end=loader.index('\n    try {',start)
          pure=loader[start:end]
          harness='var __source='+json.dumps(stable)+';\n'+pure+'\nvar __out=transformCardHolderSource(transformSource(__source));\nrequire("fs").writeFileSync("/tmp/filter58.js",__out);\n'
          pathlib.Path('/tmp/stage16b_diag_harness.js').write_text(harness,encoding='utf-8')
          PY
          node /tmp/stage16b_diag_harness.js
          node --check /tmp/filter58.js
          python - <<'PY'
          import pathlib
          src=pathlib.Path('/tmp/filter58.js').read_text(encoding='utf-8')
          names=['makeSourceIcon','makePinnedBadge','buildCardActionGrid','bindSwipeGesture','makeResultCard','keyedReconcileVirtualWindow','rebuildVirtualWindow','virtualRenderSignature']
          out=[]
          for name in names:
              marker='    function '+name+'('
              start=src.find(marker)
              if start<0:
                  out.append('===== '+name+' MISSING =====\n')
                  continue
              end=src.find('\n    function ',start+len(marker))
              if end<0: end=min(len(src),start+24000)
              out.append('===== '+name+' =====\n'+src[start:end]+'\n')
          # Also include variable declarations around rendered arrays.
          for pat in ['var virtualRenderedItemIds','var resultCardViews','var resultActionViews']:
              pos=src.find(pat)
              if pos>=0:
                  out.append('===== VARS '+pat+' =====\n'+src[max(0,pos-800):pos+1800]+'\n')
          pathlib.Path('stage16b_source_diag.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage16b_source_diag.txt
          git commit -m "生成 Stage16B 只读源码诊断"
          git push
