name: UI Unify Implementation

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/ui_unify_stage0_diag.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded UI patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ui_unify_20260815.py

      - name: Validate static contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/ch_10_editor.js
          node --check src/ch_12_translation.js
          node --check src/ch_17_tokenizer_ui.js
          node --check /tmp/tokenizer_ui_source.js
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict | tee /tmp/ui-unify-color.txt
          grep '^HIGH=0 WARN=0 ' /tmp/ui-unify-color.txt
          bash scripts/release_preflight.sh --regex-beta
          git diff --check
          grep -Fq 'MODULE_VERSION: 25' src/ch_10_editor.js
          grep -Fq 'MODULE_VERSION: 14' src/ch_12_translation.js
          grep -Fq 'translationOriginalViewportDp' src/ch_12_translation.js
          grep -Fq 'buildDragHandle(pageColumn);' /tmp/tokenizer_ui_source.js
          grep -Fq 'returnToEditor("header_back")' /tmp/tokenizer_ui_source.js
          grep -Fq 'emitAction("rule", {})' /tmp/tokenizer_ui_source.js
          grep -Fq 'emitAction("help", {})' /tmp/tokenizer_ui_source.js
          grep -Fq '"moduleSetVersion": "20260815.02"' module-manifest.json

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/ui_unify_stage0_diag.yml ui_unify_stage0_diag.txt tools/ui_unify_20260815.py
          git add src/ch_10_editor.js src/ch_12_translation.js src/ch_17_tokenizer_ui.js module-manifest.json
          git diff --cached --check
          git diff --cached --stat
          git commit -m "统一编辑翻译分词页面视觉并保持行为边界"
          git push origin HEAD:beta-regex-settings-tabs-20260814
