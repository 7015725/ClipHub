name: Beta Stage16B3 Diagnostic
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/stage16b3-diag-trigger.txt
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Filter61 and inspect clear paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,glob,json,pathlib,re,subprocess
          loader=pathlib.Path('src/ch_11_filter.js').read_text(encoding='utf-8')
          if 'Stage 16B.2 Holder rebind fix and alignment diagnostics' not in loader:
              raise SystemExit('expected Stage16B.2 baseline')
          m=re.search(r'var PATCH_B64 =\n((?:\s*"[A-Za-z0-9+/=]+"\s*\+?\n?)+);',loader)
          if not m: raise SystemExit('PATCH_B64 missing')
          patch=base64.b64decode(''.join(re.findall(r'"([A-Za-z0-9+/=]+)"',m.group(1)))).decode('utf-8')
          baseline=subprocess.check_output(['git','show','338a811e538ab526b59eed05102d4f4b66f19953:src/ch_11_filter.js'],text=True)
          s=baseline.index('    function replaceOnceStrict('); e=baseline.index('\n    try {',s)
          pure=baseline[s:e]
          packed=''.join(pathlib.Path(p).read_text(encoding='utf-8').strip() for p in sorted(glob.glob('stage-assets/pagination-stage9/ch11_full_v8s_*.b64')))
          stable=gzip.decompress(base64.b64decode(packed)).decode('utf-8')
          harness='var __source='+json.dumps(stable)+';\n'+pure+'\n'+patch+'\nvar __out=transformStage16B2Source(transformRecycleFixSource(transformRecycleSource(transformCardHolderSource(transformSource(__source)))));\nrequire("fs").writeFileSync("/tmp/filter61.js",__out);\n'
          pathlib.Path('/tmp/stage16b3_diag.js').write_text(harness,encoding='utf-8')
          PY
          node /tmp/stage16b3_diag.js
          node --check /tmp/filter61.js
          python - <<'PY'
          import pathlib,re
          src=pathlib.Path('/tmp/filter61.js').read_text(encoding='utf-8')
          out=[]
          out.append('MODULE61='+str(src.count('MODULE_VERSION: 61')))
          out.append('newTagls='+str(src.count('newTagls'))+' newTags='+str(src.count('newTags')))
          for needle in ['resultCardViews = [];','resultCardHolders = [];','resultActionViews = [];','virtualRenderedItemIds = [];','virtualRenderedSignatures = [];']:
              out.append('\n===== '+needle+' =====')
              for i,m in enumerate(re.finditer(re.escape(needle),src)):
                  a=max(0,m.start()-900); b=min(len(src),m.end()+1100)
                  out.append('\n--- #%d at %d ---\n%s' % (i+1,m.start(),src[a:b]))
          out.append('\n===== FULL_REFRESH FUNCTION =====')
          m=re.search(r'rebuildVirtualWindow\(\s*"full_refresh", true, preferredIndex\);',src)
          if m:
              fs=src.rfind('\n    function ',0,m.start())
              fe=src.find('\n    function ',m.end())
              out.append(src[fs:fe])
          else:
              out.append('full_refresh call missing')
          pathlib.Path('stage16b3_diag.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage16b3_diag.txt
          git commit -m "记录 Stage16B.3 清理与刷新路径诊断"
          git push
