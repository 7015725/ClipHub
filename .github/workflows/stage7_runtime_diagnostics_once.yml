name: Stage7 Runtime Diagnostics Once
on:
  push:
    branches:
      - beta-regex-settings-tabs-20260814
    paths:
      - 'tools/stage7_runtime_diagnostics_20260815.py'
      - '.github/workflows/stage7_runtime_diagnostics_once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Align patcher with Stage6 contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/stage7_runtime_diagnostics_20260815.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('UI shell stage5 contracts: passed',
                              'UI shell stage6 contracts: passed')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply Stage7 runtime diagnostics
        run: |
          python3 tools/stage7_runtime_diagnostics_20260815.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/release_preflight.sh')
          text = path.read_text(encoding='utf-8')
          text = text.replace('assert "MODULE_VERSION: 5" in ui_shell_source',
                              'assert "MODULE_VERSION: 6" in ui_shell_source')
          text = text.replace("assert 'MODULE_VERSION: 5' in ui_shell_source",
                              "assert 'MODULE_VERSION: 6' in ui_shell_source")
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-time Stage7 tooling
        run: |
          rm -f .github/workflows/stage7_runtime_state_probe_once.yml
          rm -f tools/stage7_runtime_state_probe_20260815.py
          rm -f .github/workflows/stage7_runtime_diagnostics_once.yml
          rm -f tools/stage7_runtime_diagnostics_20260815.py
      - name: Validate syntax and formal preflight
        run: |
          node --check src/ch_15_app.js
          node --check src/ch_16_ui_shell.js
          node --check scripts/test_ui_shell_navigation.js
          node --check scripts/test_runtime_diagnostics.js
          python3 scripts/validate_es5.py .
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check
      - name: Validate Stage7 persistent boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=5c172ff793dab66673f2fd5a404834d6f7a92b29
          expected=$(printf '%s\n' \
            module-manifest.json \
            scripts/release_preflight.sh \
            scripts/test_runtime_diagnostics.js \
            src/ch_15_app.js \
            src/ch_16_ui_shell.js | sort)
          actual=$(git diff --name-only "$BASE" | sort)
          printf '%s\n' "$actual"
          test "$actual" = "$expected"

          for path in \
            src/ch_03_database.js \
            src/ch_06_repository.js \
            src/ch_07_theme.js \
            src/ch_08_window.js \
            src/ch_09_list.js \
            src/ch_10_editor.js \
            src/ch_11_filter.js \
            src/ch_12_translation.js \
            src/ch_13_settings.js \
            src/ch_17_tokenizer_ui.js; do
            git diff --quiet "$BASE" -- "$path"
          done

          test ! -e .github/workflows/stage7_runtime_state_probe_once.yml
          test ! -e tools/stage7_runtime_state_probe_20260815.py
          test ! -e .github/workflows/stage7_runtime_diagnostics_once.yml
          test ! -e tools/stage7_runtime_diagnostics_20260815.py

          grep -q '"moduleSetVersion": "20260815.17"' module-manifest.json
          grep -q 'MODULE_VERSION: 22' src/ch_15_app.js
          grep -q 'MODULE_VERSION: 6' src/ch_16_ui_shell.js
          grep -q 'getRuntimeDiagnostics: getRuntimeDiagnostics' src/ch_16_ui_shell.js
          grep -q 'runtimeDiagnostics: runtimeDiagnostics' src/ch_15_app.js
          echo 'Stage7 persistent boundary: passed'
      - name: Commit and push Stage7 final tree
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "Stage7增加Primary Window运行时诊断快照"
          git push origin HEAD:beta-regex-settings-tabs-20260814
