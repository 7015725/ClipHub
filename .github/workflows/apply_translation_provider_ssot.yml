        var rows = ClipHub.Database.queryAll("SELECT key, value FROM settings", []);
        var output = defaultsCopy();
        var index;
        var key;
        var providerStored = false;
        for (index = 0; index < rows.length; index += 1) {
            key = String(rows[index].key || "");
            if (key === "translation.provider") {
                providerStored = true;
            }
            if (DEFAULTS.hasOwnProperty(key)) {
                output[key] = deserialize(key, rows[index].value);
            }
        }
        if (!providerStored) {
            if (String(output["translation.mode"] || "builtin") === "google") {
                output["translation.provider"] = "google";
            } else if (String(output["translation.engine"] || "baidu") ===
                    "youdao") {
                output["translation.provider"] = "youdao";
            } else {
                output["translation.provider"] = "baidu";
            }
            persist("translation.provider", output["translation.provider"]);
        }
        values = output;
        return getAll();
    }
