name: Apply Translation Provider SSOT

on:
  push:
    branches:
      - cleanup/tokenizer-no-regression-20260817
    paths:
      - .github/workflows/apply_translation_provider_ssot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/tokenizer-no-regression-20260817
          fetch-depth: 0

      - name: Apply guarded provider SSOT patch
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/translation_provider_ssot.log
          exec > >(tee "$LOG") 2>&1
          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "translation provider SSOT apply failed rc=$rc"
              git reset --hard HEAD || true
              cp "$LOG" stage_translation_provider_apply_failure.txt || true
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add stage_translation_provider_apply_failure.txt || true
              if ! git diff --cached --quiet; then
                git commit -m 'chore: record translation provider apply failure' || true
                git push origin HEAD:cleanup/tokenizer-no-regression-20260817 || true
              fi
            fi
          }
          trap on_exit EXIT

          python3 scripts/apply_translation_provider_ssot.py

          node --check src/ch_12_translation.js
          node --check src/ch_13_settings.js
          python3 scripts/validate_es5.py .
          python3 scripts/test_translation_provider_contract.py
          python3 scripts/manifest_contract.py validate --settings-tabs-beta
          bash scripts/run_tokenizer_regression_suite.sh
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check

          rm -f stage_translation_provider_stage1.txt
          rm -f stage_translation_provider_apply_failure.txt
          git rm .github/workflows/apply_translation_provider_ssot.yml
          git rm scripts/apply_translation_provider_ssot.py

          expected="$(printf '%s\n' \
            .github/workflows/apply_translation_provider_ssot.yml \
            module-manifest.json \
            scripts/apply_translation_provider_ssot.py \
            scripts/test_translation_provider_contract.py \
            src/ch_12_translation.js \
            src/ch_13_settings.js \
            stage_translation_provider_stage1.txt | sort)"
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          printf 'Expected final scope:\n%s\n' "$expected"
          printf 'Actual final scope:\n%s\n' "$actual"
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ch_12_translation.js src/ch_13_settings.js module-manifest.json
          git add scripts/test_translation_provider_contract.py
          git add -u stage_translation_provider_stage1.txt
          git add -u .github/workflows/apply_translation_provider_ssot.yml
          git add -u scripts/apply_translation_provider_ssot.py
          git commit -m 'refactor: unify translation provider selection'
          git push origin HEAD:cleanup/tokenizer-no-regression-20260817
