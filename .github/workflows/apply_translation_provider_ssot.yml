              raise SystemExit('ch12 still reads legacy translation mode/engine')
          if 'config.mode === "google"' in ch12 or 'config.engine' in ch12:
              raise SystemExit('ch12 still routes on legacy mode/engine')
          ch12_path.write_text(ch12, encoding='utf-8')

          # ---- unpack and patch ch_13_settings.js real source ----
          ch13_path = Path('src/ch_13_settings.js')
          loader = ch13_path.read_text(encoding='utf-8')
          sha_match = re.search(r'var SOURCE_SHA256 = "([0-9a-f]{64})";', loader)
          packed_match = re.search(r'    var PACKED_B64\s*=\s*(.*?);\s*\n', loader, re.S)
          if sha_match is None or packed_match is None:
              raise SystemExit('settings packed loader anchors missing')
          pieces = re.findall(r'"(?:\\.|[^"\\])*"', packed_match.group(1))
          encoded = ''.join(json.loads(piece) for piece in pieces)
          source = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          old_source_sha = hashlib.sha256(source.encode('utf-8')).hexdigest()
          if old_source_sha != sha_match.group(1):
              raise SystemExit('settings source sha mismatch before patch')
          print('settings source sha before=' + old_source_sha)

