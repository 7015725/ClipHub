name: Apply Translation Provider SSOT

on:
  push:
    branches:
      - cleanup/tokenizer-no-regression-20260817
    paths:
      - .github/workflows/apply_translation_provider_ssot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/tokenizer-no-regression-20260817
          fetch-depth: 0

      - name: Apply guarded provider SSOT patch and validate
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/translation_provider_ssot.log
          exec > >(tee "$LOG") 2>&1
          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "translation provider SSOT apply failed rc=$rc"
              git reset --hard HEAD || true
              cp "$LOG" stage_translation_provider_apply_failure.txt || true
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add stage_translation_provider_apply_failure.txt || true
              if ! git diff --cached --quiet; then
                git commit -m 'chore: record translation provider apply failure' || true
                git push origin HEAD:cleanup/tokenizer-no-regression-20260817 || true
              fi
            fi
          }
          trap on_exit EXIT

          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import re
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit('%s anchor count=%d' % (label, count))
              return text.replace(old, new, 1)

          # ---- ch_12_translation.js ----
          ch12_path = Path('src/ch_12_translation.js')
          ch12 = ch12_path.read_text(encoding='utf-8')

          old = '''    function translationSettings() {
        var settings = ClipHub.Settings;
        var engine;
        var mode;
        if (!settings || typeof settings.get !== "function") {
            throw new Error("翻译设置尚未初始化");
        }
        engine = String(settings.get("translation.engine", "baidu"));
        mode = String(settings.get("translation.mode", "builtin"));
        return {
            mode: mode === "google" ? "google" : "builtin",
            engine: engine === "youdao" ? "youdao" : "baidu",
            baiduAppId: String(settings.get("translation.baidu.app_id", "")),
            baiduSecret: String(settings.get("translation.baidu.app_secret", "")),
            youdaoAppKey: String(settings.get("translation.youdao.app_key", "")),
            youdaoSecret: String(settings.get("translation.youdao.app_secret", "")),
            maxChars: Math.max(1, Math.min(10000,
                Number(settings.get("translation.max_chars", 5000))))
        };
    }
'''
          new = '''    function translationSettings() {
        var settings = ClipHub.Settings;
        var provider;
        if (!settings || typeof settings.get !== "function") {
            throw new Error("翻译设置尚未初始化");
