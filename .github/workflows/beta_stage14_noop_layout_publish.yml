name: Beta Stage14 No-op Layout Publish
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/workflows/beta_stage14_noop_layout_publish.yml
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Filter 56
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,glob,hashlib,json,pathlib,re,math
          root=pathlib.Path('.')
          loader_path=root/'src/ch_11_filter.js'
          loader=loader_path.read_text(encoding='utf-8')
          parts=sorted(glob.glob('stage-assets/pagination-stage9/ch11_full_v8s_*.b64'))
          if len(parts)!=8: raise SystemExit('expected 8 v8s parts')
          packed=''.join(pathlib.Path(p).read_text(encoding='utf-8').strip() for p in parts)
          src=gzip.decompress(base64.b64decode(packed)).decode('utf-8')
          expected='420e512787cf6dd223115585f89f7a749fa0687bc1b50700b9cec67e3e541698'
          if hashlib.sha256(src.encode()).hexdigest()!=expected: raise SystemExit('Filter55 source sha mismatch')
          if src.count('MODULE_VERSION: 55')!=1: raise SystemExit('expected Filter55')
          src=src.replace('MODULE_VERSION: 55','MODULE_VERSION: 56',1)

          # Diagnostics for no-op layout suppression.
          anchor='''        alignmentFallbackCount: 0\n'''
          repl='''        alignmentFallbackCount: 0,\n        spacerApplyCount: 0,\n        spacerNoopCount: 0,\n        sameRangeNoLayoutCount: 0,\n        anchorScrollApplyCount: 0,\n        anchorScrollNoopCount: 0,\n        measurePassCount: 0,\n        measureLastMs: 0,\n        measureMaxMs: 0\n'''
          if src.count(anchor)!=1: raise SystemExit('perf metric anchor mismatch')
          src=src.replace(anchor,repl,1)

          anchor='''        scrollPerformanceState.alignmentFallbackCount = 0;\n'''
          repl='''        scrollPerformanceState.alignmentFallbackCount = 0;\n        scrollPerformanceState.spacerApplyCount = 0;\n        scrollPerformanceState.spacerNoopCount = 0;\n        scrollPerformanceState.sameRangeNoLayoutCount = 0;\n        scrollPerformanceState.anchorScrollApplyCount = 0;\n        scrollPerformanceState.anchorScrollNoopCount = 0;\n        scrollPerformanceState.measurePassCount = 0;\n        scrollPerformanceState.measureLastMs = 0;\n        scrollPerformanceState.measureMaxMs = 0;\n'''
          if src.count(anchor)!=1: raise SystemExit('perf reset anchor mismatch')
          src=src.replace(anchor,repl,1)

          anchor='''            alignmentFallbackCount:\n                Number(scrollPerformanceState.alignmentFallbackCount),\n            pendingOrigin: virtualPendingOrigin,\n'''
          repl='''            alignmentFallbackCount:\n                Number(scrollPerformanceState.alignmentFallbackCount),\n            spacerApplyCount:\n                Number(scrollPerformanceState.spacerApplyCount),\n            spacerNoopCount:\n                Number(scrollPerformanceState.spacerNoopCount),\n            sameRangeNoLayoutCount:\n                Number(scrollPerformanceState.sameRangeNoLayoutCount),\n            anchorScrollApplyCount:\n                Number(scrollPerformanceState.anchorScrollApplyCount),\n            anchorScrollNoopCount:\n                Number(scrollPerformanceState.anchorScrollNoopCount),\n            measurePassCount:\n                Number(scrollPerformanceState.measurePassCount),\n            measureLastMs:\n                Number(scrollPerformanceState.measureLastMs),\n            measureMaxMs:\n                Number(scrollPerformanceState.measureMaxMs),\n            pendingOrigin: virtualPendingOrigin,\n'''
          if src.count(anchor)!=1: raise SystemExit('perf copy anchor mismatch')
          src=src.replace(anchor,repl,1)

          old='''    function setVirtualSpacerHeight(view, heightPx) {\n        var params;\n        heightPx = Math.max(0, Math.round(Number(heightPx || 0)));\n        if (view === null) { return heightPx; }\n        params = view.getLayoutParams();\n        if (params === null) {\n            params = new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT, heightPx);\n        } else {\n            params.height = heightPx;\n        }\n        view.setLayoutParams(params);\n        return heightPx;\n    }\n'''
          new='''    function setVirtualSpacerHeight(view, heightPx) {\n        var params;\n        heightPx = Math.max(0, Math.round(Number(heightPx || 0)));\n        if (view === null) { return heightPx; }\n        params = view.getLayoutParams();\n        if (params !== null && Number(params.height) === heightPx) {\n            scrollPerformanceState.spacerNoopCount += 1;\n            return heightPx;\n        }\n        if (params === null) {\n            params = new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT, heightPx);\n        } else {\n            params.height = heightPx;\n        }\n        view.setLayoutParams(params);\n        scrollPerformanceState.spacerApplyCount += 1;\n        return heightPx;\n    }\n'''
          if src.count(old)!=1: raise SystemExit('spacer function mismatch')
          src=src.replace(old,new,1)

          old='''        if (force !== true &&\n                String(origin || "") === "result_scroll" &&\n                range.start === Number(\n                    virtualState.firstRenderedIndex) &&\n                range.end === Number(\n                    virtualState.lastRenderedIndex)) {\n            virtualState.topSpacerPx = setVirtualSpacerHeight(\n                virtualTopSpacer,\n                virtualHeightRange(0, range.start));\n            virtualState.bottomSpacerPx = setVirtualSpacerHeight(\n                virtualBottomSpacer,\n                virtualHeightRange(range.end + 1,\n                    previewRows.length));\n            virtualState.lastOrigin =\n                "result_scroll_same_range_fast";\n            virtualState.lastError = null;\n            return false;\n        }\n'''
          new='''        if (force !== true &&\n                String(origin || "") === "result_scroll" &&\n                range.start === Number(\n                    virtualState.firstRenderedIndex) &&\n                range.end === Number(\n                    virtualState.lastRenderedIndex)) {\n            scrollPerformanceState.sameRangeNoLayoutCount += 1;\n            virtualState.lastOrigin =\n                "result_scroll_same_range_fast";\n            virtualState.lastError = null;\n            return false;\n        }\n'''
          if src.count(old)!=1: raise SystemExit('same-range fast path mismatch')
          src=src.replace(old,new,1)

          old='''        target = Math.max(0, Math.round(target));\n        resultScrollView.scrollTo(0, target);\n        actual = currentResultScrollY();\n        virtualState.anchorRestoreErrorPx = actual - target;\n        virtualState.anchorIndex = index;\n        return true;\n'''
          new='''        target = Math.max(0, Math.round(target));\n        actual = currentResultScrollY();\n        if (Math.abs(actual - target) <= 1) {\n            scrollPerformanceState.anchorScrollNoopCount += 1;\n            virtualState.anchorRestoreErrorPx = actual - target;\n            virtualState.anchorIndex = index;\n            return true;\n        }\n        resultScrollView.scrollTo(0, target);\n        scrollPerformanceState.anchorScrollApplyCount += 1;\n        actual = currentResultScrollY();\n        virtualState.anchorRestoreErrorPx = actual - target;\n        virtualState.anchorIndex = index;\n        return true;\n'''
          if src.count(old)!=1: raise SystemExit('anchor restore mismatch')
          src=src.replace(old,new,1)

          anchor='''    function measureVirtualCards() {\n        var index;\n'''
          repl='''    function measureVirtualCards() {\n        var measureStartedAt = Number(System.currentTimeMillis());\n        var measureElapsed;\n        var index;\n'''
          if src.count(anchor)!=1: raise SystemExit('measure start mismatch')
          src=src.replace(anchor,repl,1)
          anchor='''        return measured > 0;\n    }\n\n    function restoreScrollAnchor() {\n'''
          repl='''        measureElapsed = Math.max(0,\n            Number(System.currentTimeMillis()) - measureStartedAt);\n        scrollPerformanceState.measurePassCount += 1;\n        scrollPerformanceState.measureLastMs = measureElapsed;\n        scrollPerformanceState.measureMaxMs = Math.max(\n            Number(scrollPerformanceState.measureMaxMs), measureElapsed);\n        return measured > 0;\n    }\n\n    function restoreScrollAnchor() {\n'''
          if src.count(anchor)!=1: raise SystemExit('measure end mismatch')
          src=src.replace(anchor,repl,1)

          for token in [
              'var VIRTUAL_BEFORE_SCREENS = 3;',
              'var VIRTUAL_AFTER_SCREENS = 5;',
              'var VIRTUAL_UPDATE_DELAY_MS = 24;',
              'function keyedReconcileVirtualWindow(range, colors)',
              'virtualRenderedSignatures',
              'updateCoalescedCount',
              'forceEscalationCount']:
              if token not in src: raise SystemExit('missing invariant '+token)
          if src.count('.newSingleThreadExecutor();')!=1: raise SystemExit('executor count changed')
          if 'resultTagBadgeViews' in src or 'refreshRenderedTagBadges' in src:
              raise SystemExit('unsafe Filter53 refs reintroduced')

          source_sha=hashlib.sha256(src.encode()).hexdigest()
          gz=gzip.compress(src.encode('utf-8'),compresslevel=9,mtime=0)
          b64=base64.b64encode(gz).decode('ascii')
          packed_sha=hashlib.sha256(b64.encode()).hexdigest()
          chunk=math.ceil(len(b64)/8)
          for i,p in enumerate(parts):
              pathlib.Path(p).write_text(b64[i*chunk:(i+1)*chunk]+'\n',encoding='utf-8')

          old_header='/* ClipHub Stage 13 unified virtual-view update ES5 loader. */'
          if loader.count(old_header)!=1: raise SystemExit('loader header mismatch')
          loader=loader.replace(old_header,
              '/* ClipHub Stage 14 no-op layout optimized ES5 loader. */',1)
          loader,n=re.subn(r'(    var PACKED_SHA256 =\s*\n\s*")[0-9a-f]+(";)',r'\g<1>'+packed_sha+r'\2',loader,count=1)
          if n!=1: raise SystemExit('packed sha replacement failed')
          loader,n=re.subn(r'(    var SOURCE_SHA256 =\s*\n\s*")[0-9a-f]+(";)',r'\g<1>'+source_sha+r'\2',loader,count=1)
          if n!=1: raise SystemExit('source sha replacement failed')
          loader,n=re.subn(r'    var CACHE_NAME = "[^"]+";',
              '    var CACHE_NAME = "ch_11_filter_stage14_v10_noop_layout_full.b64";',loader,count=1)
          if n!=1: raise SystemExit('cache replacement failed')
          if '?stage13v9=' not in loader: raise SystemExit('loader query anchor missing')
          loader=loader.replace('?stage13v9=','?stage14v10=',1)
          loader_path.write_text(loader,encoding='utf-8')

          def blob_sha(path):
              data=pathlib.Path(path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          mp=root/'module-manifest.json'
          manifest=json.loads(mp.read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion')!='20260808.09': raise SystemExit('expected .09 baseline')
          if manifest.get('sourceRef')!='beta-pagination-stage10-20260808': raise SystemExit('wrong sourceRef')
          manifest['moduleSetVersion']='20260808.10'
          found=False
          for m in manifest['modules']:
              if m['name']=='ch_11_filter.js':
                  m['sha']=blob_sha(loader_path)
                  found=True
          if not found: raise SystemExit('filter manifest entry missing')
          mp.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          pathlib.Path('/tmp/filter56.js').write_text(src,encoding='utf-8')
          print('source_sha='+source_sha)
          print('packed_sha='+packed_sha)
          print('loader_blob='+blob_sha(loader_path))
          PY
          node --check /tmp/filter56.js
          node --check src/ch_11_filter.js
          ! grep -Eq '(^|[^A-Za-z0-9_])(let|const|class)[[:space:]]|=>' /tmp/filter56.js
          grep -Fq 'MODULE_VERSION: 56' /tmp/filter56.js
          grep -Fq 'sameRangeNoLayoutCount' /tmp/filter56.js
          grep -Fq 'spacerNoopCount' /tmp/filter56.js
          grep -Fq 'anchorScrollNoopCount' /tmp/filter56.js
          grep -Fq '"moduleSetVersion": "20260808.10"' module-manifest.json
          git diff --check
      - name: Commit Filter 56
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/beta_stage14_noop_layout_publish.yml
          git add src/ch_11_filter.js module-manifest.json stage-assets/pagination-stage9/ch11_full_v8s_*.b64
          git diff --cached --check
          git commit -m "优化 Beta 滚动零变化布局与锚点恢复"
          git push
