name: Inspect Translation Sources

on:
  push:
    branches:
      - cleanup/tokenizer-no-regression-20260817
    paths:
      - .github/workflows/inspect_translation_sources.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand packed modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p expanded
          python3 - <<'PY'
          import base64
          import gzip
          import json
          import re
          from pathlib import Path

          for name in ("ch_12_translation.js", "ch_13_settings.js"):
              path = Path("src") / name
              text = path.read_text(encoding="utf-8")
              match = re.search(r"\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);", text, re.S)
              if match is None:
                  source = text
              else:
                  pieces = re.findall(r'"(?:\\.|[^"\\])*"', match.group(1))
                  encoded = "".join(json.loads(piece) for piece in pieces)
                  source = gzip.decompress(base64.b64decode(encoded)).decode("utf-8")
              (Path("expanded") / name).write_text(source, encoding="utf-8")
          PY

      - name: Upload expanded sources
        uses: actions/upload-artifact@v4
        with:
          name: expanded-translation-sources
          path: expanded/
          if-no-files-found: error
