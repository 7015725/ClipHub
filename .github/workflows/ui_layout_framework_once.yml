name: UI Layout Framework Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/ui_layout_framework_once.yml

permissions:
  contents: write

jobs:
  unify-ui-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Centralize homepage layout metrics and migrate Settings Regex
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import base64
          import gzip
          import hashlib
          import json
          import pathlib
          import re

          root = pathlib.Path('.')
          manifest_path = root / 'module-manifest.json'
          theme_path = root / 'src/ch_07_theme.js'
          filter_path = root / 'src/ch_11_filter.js'
          settings_path = root / 'src/ch_13_settings.js'
          settings_fragment_path = root / 'tools/regex_beta_patches/settings_regex_feature.jsfrag'
          preflight_path = root / 'scripts/release_preflight.sh'

          OLD_SET = '20260815.08'
          NEW_SET = '20260815.09'
          EXPECTED_REF = 'beta-regex-settings-tabs-20260814'
          OLD_THEME = 4
          NEW_THEME = 5
          OLD_FILTER = 82
          NEW_FILTER = 83
          OLD_SETTINGS = 31
          NEW_SETTINGS = 32

          def fail(message):
              raise RuntimeError(message)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  fail('%s: expected exactly one anchor, got %d' % (label, count))
              return text.replace(old, new, 1)

          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          def unpack_loader(path):
              loader = path.read_text(encoding='utf-8')
              assignment = re.search(r'\bvar\s+(PACKED_B64|encoded)\s*=\s*(.*?);', loader, re.S)
              if assignment is None:
                  fail(str(path) + ': packed assignment missing')
              pieces = re.findall(r'"(?:\\.|[^"\\])*"', assignment.group(2))
              if not pieces:
                  fail(str(path) + ': packed chunks missing')
              encoded = ''.join(json.loads(piece) for piece in pieces)
              canonical = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
              expected = re.search(r'\bvar\s+SOURCE_SHA256\s*=\s*[\"\']([0-9a-fA-F]{64})[\"\']', loader)
              if expected is not None:
                  actual = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
                  if actual != expected.group(1).lower():
                      fail(str(path) + ': SOURCE_SHA256 mismatch before patch')
              return loader, assignment.group(1), canonical

          def repack_loader(path, loader, variable, canonical, old_version, new_version, label):
              raw = gzip.compress(canonical.encode('utf-8'), compresslevel=9, mtime=0)
              encoded = base64.b64encode(raw).decode('ascii')
              chunks = [encoded[i:i + 120] for i in range(0, len(encoded), 120)]
              expression = '\n        ' + ' +\n        '.join(json.dumps(chunk) for chunk in chunks) + '\n    '
              pattern = re.compile(r'(\bvar\s+' + re.escape(variable) + r'\s*=\s*)(.*?)(;)', re.S)
              match = pattern.search(loader)
              if match is None:
                  fail(label + ': repack assignment missing')
              loader = loader[:match.start(2)] + expression + loader[match.end(2):]
              source_sha = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
              loader, count = re.subn(
                  r'(\bvar\s+SOURCE_SHA256\s*=\s*[\"\'])[0-9a-fA-F]{64}([\"\'])',
                  lambda m: m.group(1) + source_sha + m.group(2), loader, count=1)
              if count != 1:
                  fail(label + ': SOURCE_SHA256 update failed')
              loader = loader.replace(label + str(old_version) + ' source SHA mismatch',
                                      label + str(new_version) + ' source SHA mismatch')
              if label == 'Filter':
                  loader = loader.replace('Filter%d ES5 loader' % old_version,
                                          'Filter%d ES5 loader' % new_version, 1)
              loader = '\n'.join(line.rstrip() for line in loader.splitlines()) + '\n'
              path.write_text(loader, encoding='utf-8')
              return loader

          def find_function_span(text, name):
              match = re.search(r'(^|\n)([ \t]*)function\s+' + re.escape(name) + r'\s*\(', text, re.M)
              if match is None:
                  fail('function missing: ' + name)
              start = match.start(2)
              brace = text.find('{', match.end())
              if brace < 0:
                  fail('function brace missing: ' + name)
              depth = 0
              quote = None
              escape = False
              line_comment = False
              block_comment = False
              i = brace
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ''
                  if line_comment:
                      if c == '\n':
                          line_comment = False
                  elif block_comment:
                      if c == '*' and n == '/':
                          block_comment = False
                          i += 1
                  elif quote is not None:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == quote:
                          quote = None
                  else:
                      if c == '/' and n == '/':
                          line_comment = True
                          i += 1
                      elif c == '/' and n == '*':
                          block_comment = True
                          i += 1
                      elif c in ('\"', "'"):
                          quote = c
                      elif c == '{':
                          depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              return start, i + 1
                  i += 1
              fail('function unterminated: ' + name)

          def replace_function(text, name, replacement):
              start, end = find_function_span(text, name)
              if re.search(r'(^|\n)[ \t]*function\s+' + re.escape(name) + r'\s*\(', text[end:], re.M):
                  fail('duplicate function: ' + name)
              return text[:start] + replacement.rstrip() + text[end:]

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion') != OLD_SET:
              fail('unexpected moduleSetVersion=' + str(manifest.get('moduleSetVersion')))
          if manifest.get('sourceRef') != EXPECTED_REF:
              fail('unexpected sourceRef=' + str(manifest.get('sourceRef')))
          if len(manifest.get('modules', [])) != 16:
              fail('unexpected module count=' + str(len(manifest.get('modules', []))))
          by_path = {item['path']: item for item in manifest['modules']}
          for item in manifest['modules']:
              p = root / item['path']
              if not p.is_file():
                  fail('manifest path missing: ' + item['path'])
              if blob_sha(p.read_bytes()) != item['sha']:
                  fail('manifest baseline mismatch: ' + item['path'])

          # 1) Theme becomes the single layout-metric contract. Values preserve
          # the already validated homepage geometry and current card frame.
          theme = theme_path.read_text(encoding='utf-8')
          theme = replace_once(
              theme,
              '        searchHeightDp: 44,\n        minTouchDp: 40\n',
              '        searchHeightDp: 44,\n'
              '        minTouchDp: 40,\n'
              '        pageRadiusDp: 24,\n'
              '        pagePaddingTopDp: 8,\n'
              '        pagePaddingBottomDp: 10,\n'
              '        sectionPaddingHorizontalDp: 11,\n'
              '        sectionPaddingVerticalDp: 10,\n'
              '        headerTopOffsetDp: -2,\n'
              '        headerBottomGapDp: 8,\n'
              '        tabMinHeightDp: 38,\n'
              '        tabBottomGapDp: 8\n',
              'theme layout tokens')

          layout_helper = r'''
    function clampNumber(value, minValue, maxValue) {
        return Math.max(minValue, Math.min(maxValue, value));
    }

    function getLayoutMetrics(widthDp, fontScale, touchSlopDp) {
        var width = Number(widthDp || 0);
        var scale = Number(fontScale || 1);
        var touch = Number(touchSlopDp || 1);
        var baseDp;
        var actionSizeDp;
        var controlHeightDp;
        var gapDp;
        var titleSp;
        var iconSp;
        var statusSp;
        var searchSp;
        var radiusDp;
        var inputPaddingDp;
        var badgeSizeDp;
        var badgeSp;
        if (!isFinite(width) || width <= 0) { width = 390; }
        if (!isFinite(scale) || scale <= 0) { scale = 1; }
        if (!isFinite(touch) || touch <= 0) { touch = 1; }
        baseDp = Math.max(touch, width * 0.018);
        actionSizeDp = clampNumber(width * 0.092,
            baseDp * 4.4, width * 0.12);
        controlHeightDp = clampNumber(actionSizeDp * 1.02,
            baseDp * 4.6, width * 0.125);
        gapDp = clampNumber(width * 0.014,
            baseDp * 0.65, actionSizeDp * 0.24);
        titleSp = clampNumber(width / (scale * 23),
            actionSizeDp / (scale * 2.45),
            actionSizeDp / (scale * 1.85));
        iconSp = clampNumber(actionSizeDp / (scale * 2.05),
            titleSp * 0.86, titleSp * 1.18);
        statusSp = clampNumber(titleSp * 0.60,
            iconSp * 0.58, titleSp * 0.72);
        searchSp = clampNumber(titleSp * 0.70,
            statusSp, titleSp * 0.82);
        radiusDp = Math.max(baseDp * 1.3, controlHeightDp * 0.44);
        inputPaddingDp = Math.max(baseDp * 0.65, gapDp);
        badgeSizeDp = Math.max(baseDp * 2.0, actionSizeDp * 0.38);
        badgeSp = Math.max(statusSp * 0.64,
            badgeSizeDp / (scale * 3.4));
        return {
            widthDp: width,
            fontScale: scale,
            baseDp: baseDp,
            actionSizeDp: actionSizeDp,
            controlHeightDp: controlHeightDp,
            gapDp: gapDp,
            titleSp: titleSp,
            iconSp: iconSp,
            statusSp: statusSp,
            searchSp: searchSp,
            radiusDp: radiusDp,
            inputPaddingDp: inputPaddingDp,
            badgeSizeDp: badgeSizeDp,
            badgeSp: badgeSp
        };
    }
'''
          theme = replace_once(theme, '    function configuredMode() {',
                               layout_helper + '\n    function configuredMode() {',
                               'theme responsive layout helper')
          theme = replace_once(theme, '        MODULE_VERSION: 4,',
                               '        MODULE_VERSION: 5,', 'theme module version')
          theme = replace_once(theme,
                               '        getMetrics: function () { return copy(METRICS); },\n',
                               '        getMetrics: function () { return copy(METRICS); },\n'
                               '        getLayoutMetrics: getLayoutMetrics,\n',
                               'theme public layout api')
          theme_path.write_text(theme, encoding='utf-8')

          # 2) Homepage keeps the same formula/result but delegates it to Theme.
          filter_loader, filter_var, filter_source = unpack_loader(filter_path)
          filter_header = r'''    function headerMetrics() {
        var widthDp = Number(state.panelWidthDp || 0);
        var fontScale = resourceFontScale();
        var touchDp = Math.max(1, Number(touchSlop || 1) / density);
        var metrics;
        if (widthDp <= 0 && Number(state.panelWidthPx || 0) > 0) {
            widthDp = Number(state.panelWidthPx) / density;
        }
        if (widthDp <= 0) {
            widthDp = Number(appContext.getResources()
                .getDisplayMetrics().widthPixels) / density;
        }
        metrics = ClipHub.Theme.getLayoutMetrics(
            widthDp, fontScale, touchDp);
        state.headerHeightDp = metrics.actionSizeDp +
            metrics.gapDp + metrics.controlHeightDp;
        state.headerControlHeightDp = metrics.controlHeightDp;
        state.headerActionSizeDp = metrics.actionSizeDp;
        state.headerGapDp = metrics.gapDp;
        return metrics;
    }'''
          filter_source = replace_function(filter_source, 'headerMetrics', filter_header)
          cache_start, cache_end = find_function_span(filter_source, 'createPanelCache')
          cache_fn = filter_source[cache_start:cache_end]
          cache_fn = replace_once(
              cache_fn,
              '    function createPanelCache(size, type, colors) {\n        panelRoot = new LinearLayout(appContext);',
              '    function createPanelCache(size, type, colors) {\n'
              '        var layout = ClipHub.Theme.getMetrics();\n'
              '        panelRoot = new LinearLayout(appContext);',
              'filter panel layout tokens local')
          cache_fn = replace_once(
              cache_fn,
              '        panelRoot.setPadding(dp(12), dp(8), dp(12), dp(10));',
              '        panelRoot.setPadding(dp(layout.screenPaddingDp),\n'
              '            dp(layout.pagePaddingTopDp),\n'
              '            dp(layout.screenPaddingDp),\n'
              '            dp(layout.pagePaddingBottomDp));',
              'filter panel padding token')
          cache_fn = replace_once(
              cache_fn,
              '        panelRoot.setBackground(roundedBackground(colors.surface,\n            colors.stroke, 24));',
              '        panelRoot.setBackground(roundedBackground(colors.surface,\n'
              '            colors.stroke, layout.pageRadiusDp));',
              'filter panel radius token')
          filter_source = filter_source[:cache_start] + cache_fn + filter_source[cache_end:]
          filter_source = replace_once(filter_source,
                                       'MODULE_VERSION: %d' % OLD_FILTER,
                                       'MODULE_VERSION: %d' % NEW_FILTER,
                                       'filter module version')
          filter_loader = repack_loader(filter_path, filter_loader, filter_var,
                                        filter_source, OLD_FILTER, NEW_FILTER, 'Filter')

          # 3) Settings resolves the actual homepage width when available and
          # otherwise uses the homepage 390dp design baseline.
          settings_loader, settings_var, settings_source = unpack_loader(settings_path)
          settings_metrics_helper = r'''    function settingsLayoutMetrics() {
        var widthDp = 390;
        var fontScale = 1;
        var filterState = null;
        try {
            if (ClipHub.Filter && typeof ClipHub.Filter.getState === "function") {
                filterState = ClipHub.Filter.getState();
                if (filterState && Number(filterState.panelWidthDp || 0) > 0) {
                    widthDp = Number(filterState.panelWidthDp);
                }
            }
        } catch (ignoredSettingsFilterMetrics) {}
        try {
            fontScale = Number(appContext.getResources()
                .getConfiguration().fontScale || 1);
        } catch (ignoredSettingsFontScale) { fontScale = 1; }
        return ClipHub.Theme.getLayoutMetrics(widthDp, fontScale, 1);
    }
'''
          tab_start, _ = find_function_span(settings_source, 'makeSettingsTabBar')
          settings_source = settings_source[:tab_start] + settings_metrics_helper + '\n' + settings_source[tab_start:]

          settings_tab_bar = r'''    function makeSettingsTabBar(parent, colors) {
        var bar = new LinearLayout(appContext);
        var metrics = settingsLayoutMetrics();
        var tabHeight = Math.max(ClipHub.Theme.getMetrics().tabMinHeightDp,
            metrics.controlHeightDp);
        var params;
        bar.setOrientation(LinearLayout.HORIZONTAL);
        bar.setGravity(Gravity.CENTER_VERTICAL);
        settingsGeneralTabButton = makeButton("常规", colors, false, false);
        settingsHomeTabButton = makeButton("首页", colors, false, false);
        settingsTranslationTabButton = makeButton("翻译", colors, false, false);
        settingsFilterTabButton = makeButton("筛选", colors, false, false);
        settingsGeneralTabButton.setOnClickListener(new JavaAdapter(
            View.OnClickListener, { onClick: function () {
                setSettingsTab("general", "tab_click");
            }}));
        settingsHomeTabButton.setOnClickListener(new JavaAdapter(
            View.OnClickListener, { onClick: function () {
                setSettingsTab("home", "tab_click");
            }}));
        settingsTranslationTabButton.setOnClickListener(new JavaAdapter(
            View.OnClickListener, { onClick: function () {
                setSettingsTab("translation", "tab_click");
            }}));
        settingsFilterTabButton.setOnClickListener(new JavaAdapter(
            View.OnClickListener, { onClick: function () {
                setSettingsTab("filter", "tab_click");
            }}));
        bar.addView(settingsGeneralTabButton,
            new LinearLayout.LayoutParams(0, dp(tabHeight), 1));
        params = new LinearLayout.LayoutParams(0, dp(tabHeight), 1);
        params.leftMargin = dp(metrics.gapDp);
        bar.addView(settingsHomeTabButton, params);
        params = new LinearLayout.LayoutParams(0, dp(tabHeight), 1);
        params.leftMargin = dp(metrics.gapDp);
        bar.addView(settingsTranslationTabButton, params);
        params = new LinearLayout.LayoutParams(0, dp(tabHeight), 1);
        params.leftMargin = dp(metrics.gapDp);
        bar.addView(settingsFilterTabButton, params);
        params = new LinearLayout.LayoutParams(
            LinearLayout.LayoutParams.MATCH_PARENT, dp(tabHeight + 2));
        params.bottomMargin = dp(ClipHub.Theme.getMetrics().tabBottomGapDp);
        parent.addView(bar, params);
        uiState.settingsTabBarPresent = true;
        return bar;
    }'''
          settings_source = replace_function(settings_source, 'makeSettingsTabBar', settings_tab_bar)

          settings_subpage_header = r'''    function makeSettingsSubpageHeader(content, titleText, colors) {
        var header = new LinearLayout(appContext);
        var metrics = settingsLayoutMetrics();
        var layout = ClipHub.Theme.getMetrics();
        var back = makeText("‹", Math.max(22, metrics.iconSp * 1.25),
            colors.icon, true);
        var title = makeText(titleText, metrics.titleSp,
            colors.textPrimary, true);
        var close = makeText("×", metrics.iconSp, colors.icon, false);
        var params;
        header.setOrientation(LinearLayout.HORIZONTAL);
        header.setGravity(Gravity.CENTER_VERTICAL);
        back.setGravity(Gravity.CENTER);
        back.setClickable(true);
        back.setBackground(roundedBackground(colors.surfaceMuted, null,
            metrics.actionSizeDp / 2));
        back.setOnClickListener(new JavaAdapter(View.OnClickListener, {
            onClick: function () { handleSettingsBack(); }
        }));
        header.addView(back, new LinearLayout.LayoutParams(
            dp(metrics.actionSizeDp), dp(metrics.actionSizeDp)));
        params = new LinearLayout.LayoutParams(
            0, LinearLayout.LayoutParams.WRAP_CONTENT, 1);
        params.leftMargin = dp(metrics.gapDp);
        header.addView(title, params);
        close.setGravity(Gravity.CENTER);
        close.setClickable(true);
        close.setBackground(roundedBackground(colors.surfaceMuted, null,
            metrics.actionSizeDp / 2));
        close.setOnClickListener(new JavaAdapter(View.OnClickListener, {
            onClick: function () { closePage("button"); }
        }));
        header.addView(close, new LinearLayout.LayoutParams(
            dp(metrics.actionSizeDp), dp(metrics.actionSizeDp)));
        params = new LinearLayout.LayoutParams(
            LinearLayout.LayoutParams.MATCH_PARENT,
            dp(metrics.actionSizeDp));
        params.topMargin = dp(layout.headerTopOffsetDp);
        params.bottomMargin = dp(layout.headerBottomGapDp);
        content.addView(header, params);
        return header;
    }'''
          settings_source = replace_function(settings_source, 'makeSettingsSubpageHeader', settings_subpage_header)

          section_fn = r'''    function makeSection(colors) {
        var section = new LinearLayout(appContext);
        var layout = ClipHub.Theme.getMetrics();
        section.setOrientation(LinearLayout.VERTICAL);
        section.setPadding(dp(layout.sectionPaddingHorizontalDp),
            dp(layout.sectionPaddingVerticalDp),
            dp(layout.sectionPaddingHorizontalDp),
            dp(layout.sectionPaddingVerticalDp));
        section.setBackground(roundedBackground(colors.surface,
            colors.stroke, layout.cardRadiusDp));
        return section;
    }'''
          settings_source = replace_function(settings_source, 'makeSection', section_fn)

          root_start, root_end = find_function_span(settings_source, 'buildRootPage')
          root_fn = settings_source[root_start:root_end]
          root_fn = replace_once(
              root_fn,
              '        var title = makeText("ClipHub 设置", 17, colors.textPrimary, true);',
              '        var layoutMetrics = settingsLayoutMetrics();\n'
              '        var layoutTokens = ClipHub.Theme.getMetrics();\n'
              '        var title = makeText("ClipHub 设置", layoutMetrics.titleSp,\n'
              '            colors.textPrimary, true);',
              'settings root title metric')
          root_fn = root_fn.replace(
              'closeView = makeText("×", 17, colors.icon, false);',
              'closeView = makeText("×", layoutMetrics.iconSp, colors.icon, false);', 1)
          root_fn = replace_once(
              root_fn,
              '        header.addView(closeView, new LinearLayout.LayoutParams(dp(36), dp(36)));',
              '        header.addView(closeView, new LinearLayout.LayoutParams(\n'
              '            dp(layoutMetrics.actionSizeDp), dp(layoutMetrics.actionSizeDp)));',
              'settings root close metric')
          root_fn = replace_once(
              root_fn,
              '        params = new LinearLayout.LayoutParams(\n            LinearLayout.LayoutParams.MATCH_PARENT, dp(36));\n        params.topMargin = -dp(2);\n        params.bottomMargin = dp(8);',
              '        params = new LinearLayout.LayoutParams(\n'
              '            LinearLayout.LayoutParams.MATCH_PARENT,\n'
              '            dp(layoutMetrics.actionSizeDp));\n'
              '        params.topMargin = dp(layoutTokens.headerTopOffsetDp);\n'
              '        params.bottomMargin = dp(layoutTokens.headerBottomGapDp);',
              'settings root header metric')
          settings_source = settings_source[:root_start] + root_fn + settings_source[root_end:]
          settings_source = replace_once(settings_source,
                                          'MODULE_VERSION: %d' % OLD_SETTINGS,
                                          'MODULE_VERSION: %d' % NEW_SETTINGS,
                                          'settings module version')
          settings_loader = repack_loader(settings_path, settings_loader, settings_var,
                                          settings_source, OLD_SETTINGS, NEW_SETTINGS, 'Settings')

          # Keep the source fragment in sync so a future Regex rebuild cannot
          # reintroduce the old fixed-size subpage header.
          fragment = settings_fragment_path.read_text(encoding='utf-8')
          fragment = replace_function(fragment, 'makeSettingsSubpageHeader', settings_subpage_header)
          settings_fragment_path.write_text(fragment, encoding='utf-8')

          # 4) Bring settings-tabs preflight up to the actual branch baseline.
          preflight = preflight_path.read_text(encoding='utf-8')
          preflight = replace_once(preflight,
                                   "EXPECTED_MODULE_SET='20260814.05'",
                                   "EXPECTED_MODULE_SET='20260815.09'",
                                   'settings tabs expected module set')
          preflight = replace_once(
              preflight,
              'assert len(manifest.get("modules", [])) == 15, len(manifest.get("modules", []))',
              'expected_module_count = 16 if mode == "--settings-tabs-beta" else 15\n'
              'assert len(manifest.get("modules", [])) == expected_module_count, len(manifest.get("modules", []))',
              'preflight module count')
          preflight = replace_once(
              preflight,
              'assert re.search(r"MODULE_NAME:\\s*\\\"ch_07_theme\\\"\\s*,\\s*MODULE_VERSION:\\s*4", theme, re.S)',
              'expected_theme_version = 5 if mode == "--settings-tabs-beta" else 4\n'
              'assert re.search(\n'
              '    r"MODULE_NAME:\\s*\\\"ch_07_theme\\\"\\s*,\\s*MODULE_VERSION:\\s*" +\n'
              '    str(expected_theme_version), theme, re.S)',
              'preflight theme version')
          preflight = replace_once(preflight,
                                   'print("Theme: 4")',
                                   'print("Theme: " + str(expected_theme_version))',
                                   'preflight theme print')
          preflight = replace_once(preflight,
                                   '"ch_11_filter.js": ("ch_11_filter", 81),',
                                   '"ch_11_filter.js": ("ch_11_filter", 83),',
                                   'preflight settings tabs filter version')
          preflight = replace_once(preflight,
                                   '"ch_13_settings.js": ("ch_13_settings", 30),',
                                   '"ch_13_settings.js": ("ch_13_settings", 32),',
                                   'preflight settings tabs settings version')
          preflight = replace_once(
              preflight,
              '    assert len(manifest.get("modules", [])) == 15\n    if mode == "--settings-tabs-beta":',
              '    assert len(manifest.get("modules", [])) == (16 if mode == "--settings-tabs-beta" else 15)\n'
              '    if mode == "--settings-tabs-beta":',
              'preflight regex module count')
          preflight_path.write_text(preflight, encoding='utf-8')

          # 5) Manifest follows source changes only. No DB/schema/window modules touched.
          manifest['moduleSetVersion'] = NEW_SET
          for rel in ('src/ch_07_theme.js', 'src/ch_11_filter.js', 'src/ch_13_settings.js'):
              by_path[rel]['sha'] = blob_sha((root / rel).read_bytes())
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print('UI layout framework generated')
          print('moduleSetVersion=' + NEW_SET)
          print('Theme=%d Filter=%d Settings=%d' % (NEW_THEME, NEW_FILTER, NEW_SETTINGS))
          PY

      - name: Validate no regression boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check src/ch_07_theme.js
          node --check src/ch_11_filter.js
          node --check src/ch_13_settings.js
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict | tee /tmp/ui-layout-color.txt
          grep '^HIGH=0 WARN=0 ' /tmp/ui-layout-color.txt
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, re, subprocess
          root = pathlib.Path('.')
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def expanded(path):
              text = path.read_text(encoding='utf-8')
              a = re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);', text, re.S)
              if a is None: return text
              pieces = re.findall(r'"(?:\\.|[^"\\])*"', a.group(1))
              return gzip.decompress(base64.b64decode(''.join(json.loads(x) for x in pieces))).decode('utf-8')
          manifest = json.loads((root/'module-manifest.json').read_text(encoding='utf-8'))
          assert manifest['moduleSetVersion'] == '20260815.09'
          assert manifest['sourceRef'] == 'beta-regex-settings-tabs-20260814'
          assert len(manifest['modules']) == 16
          for item in manifest['modules']:
              p = root / item['path']
              assert p.is_file(), p
              assert blob_sha(p.read_bytes()) == item['sha'], item['path']
          theme = expanded(root/'src/ch_07_theme.js')
          filt = expanded(root/'src/ch_11_filter.js')
          settings = expanded(root/'src/ch_13_settings.js')
          assert 'MODULE_VERSION: 5' in theme
          assert 'getLayoutMetrics: getLayoutMetrics' in theme
          assert 'pageRadiusDp: 24' in theme
          assert 'MODULE_VERSION: 83' in filt
          assert 'metrics = ClipHub.Theme.getLayoutMetrics(' in filt
          assert 'baseDp = Math.max(touchDp, widthDp * 0.018);' not in filt
          assert 'layout.pageRadiusDp' in filt
          assert 'MODULE_VERSION: 32' in settings
          assert settings.count('function settingsLayoutMetrics()') == 1
          assert 'filterState.panelWidthDp' in settings
          assert 'metrics = settingsLayoutMetrics();' in settings
          assert 'layoutMetrics = settingsLayoutMetrics();' in settings
          assert 'settingsTabBarPresent: rootTabsActive' in settings
          assert 'function makeSettingsSubpageHeader(' in settings
          assert 'REGEX_TEST_TEXT_CHAR_BUDGET = 786432' in settings
          assert 'function bindRegexRuleDrag(' in settings
          assert 'filterRegexRuleIds' in settings
          assert 'filterRegexMatchMode' in settings
          assert 'function setSettingsTab(tab, origin)' in settings
          fragment = (root/'tools/regex_beta_patches/settings_regex_feature.jsfrag').read_text(encoding='utf-8')
          assert 'metrics = settingsLayoutMetrics();' in fragment
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = {
              'module-manifest.json', 'scripts/release_preflight.sh',
              'src/ch_07_theme.js', 'src/ch_11_filter.js', 'src/ch_13_settings.js',
              'tools/regex_beta_patches/settings_regex_feature.jsfrag'
          }
          assert changed == expected, (changed, expected)
          for untouched in (
              'src/ch_03_database.js', 'src/ch_06_repository.js',
              'src/ch_08_window.js', 'src/ch_09_list.js', 'src/ch_10_editor.js',
              'src/ch_12_translation.js', 'src/ch_15_app.js', 'src/ch_17_tokenizer_ui.js'
          ):
              assert untouched not in changed, untouched
          print('UI layout boundary validation: passed')
          PY

      - name: Commit UI layout framework
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/ui_layout_framework_once.yml
          git rm -f ui_layout_diag_current.txt
          git add module-manifest.json scripts/release_preflight.sh \
                  src/ch_07_theme.js src/ch_11_filter.js src/ch_13_settings.js \
                  tools/regex_beta_patches/settings_regex_feature.jsfrag
          git diff --cached --check
          git commit -m "统一首页与设置Regex布局框架"
          git push origin HEAD:beta-regex-settings-tabs-20260814
