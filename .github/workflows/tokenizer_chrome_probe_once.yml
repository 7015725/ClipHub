name: Tokenizer Chrome Probe Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/tokenizer_chrome_probe_once.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0
      - name: Probe Tokenizer chrome
        run: python3 tools/tokenizer_chrome_probe_tmp.py
      - name: Cleanup temporary probe files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/tokenizer_chrome_probe_tmp.py .github/workflows/tokenizer_chrome_probe_once.yml
          git commit -m "清理Tokenizer Chrome探测临时文件"
          git push origin HEAD:beta-regex-settings-tabs-20260814
