name: Regex Card Density Apply Once
on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/regex_card_density_apply_once.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0
      - name: Guard and apply Regex card density patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('module-manifest.json').read_text(encoding='utf-8'))
          assert m['sourceRef']=='beta-regex-settings-tabs-20260814'
          assert m['moduleSetVersion']=='20260815.20'
          assert m['entryMinVersion']==7
          PY
          python3 tools/regex_card_density_patch_tmp.py
      - name: Validate full beta contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict
          node scripts/test_ui_shell_navigation.js
          node scripts/test_runtime_diagnostics.js
          python3 scripts/test_primary_window_legacy_routes.py
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={'src/ch_13_settings.js','module-manifest.json','scripts/release_preflight.sh'}
          assert changed==expected,(changed,expected)
          PY
      - name: Commit validated production changes and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/regex_card_density_apply_once.yml
          git rm -f tools/regex_card_density_patch_tmp.py
          git add src/ch_13_settings.js module-manifest.json scripts/release_preflight.sh
          git diff --cached --check
          git commit -m "按首页基线收口Regex规则卡密度"
          git push origin HEAD:beta-regex-settings-tabs-20260814
