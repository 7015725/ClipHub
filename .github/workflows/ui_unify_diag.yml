name: UI Unify Diagnostic
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/ui_unify_diag_trigger.txt
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect Filter71 UI anchors
        shell: bash
        run: |
          set -euo pipefail
          python ui_unify_diag.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ui_unify_diag.txt
          git commit -m "记录 UI 统一只读诊断"
          git push
