name: Beta Stage16A Build Diagnostic
# trigger-v3
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/workflows/beta_stage16a_build_diag.yml
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose Stage16A builder
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,subprocess,traceback
          wf=pathlib.Path('.github/workflows/beta_stage16a_cardholder_binding.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          end_marker="\n          PY\n"
          body=wf.split(marker,1)[1].split(end_marker,1)[0]
          lines=[]
          for line in body.splitlines():
              if line.startswith('          '): line=line[10:]
              lines.append(line)
          script='\n'.join(lines)+'\n'
          log=[]
          try:
              exec(compile(script,'stage16a_builder.py','exec'),{'__name__':'__main__'})
              log.append('PYTHON_BUILDER=PASS')
          except Exception:
              log.append('PYTHON_BUILDER=FAIL')
              log.append(traceback.format_exc())
          if log[0]=='PYTHON_BUILDER=PASS':
              hp=pathlib.Path('/tmp/stage16a_harness.js')
              h=hp.read_text(encoding='utf-8')
              old='throw new Error("Stage16A stale row listener binding detected");'
              new='console.log("STALE_INDEXES", source.indexOf("buildCardActionGrid(row, colors, metrics)"), source.indexOf("bindSwipeGesture(row, wrapper"), source.indexOf("inputResultRow(row, \\\"card_click\\\")"), source.indexOf("performSwipeAction(row, direction"));'
              if old not in h:
                  log.append('HARNESS_PATCH=STALE_THROW_MISSING')
              else:
                  h=h.replace(old,new,1)
                  hp.write_text(h,encoding='utf-8')
              commands=[
                  ['node','--check','src/ch_11_filter.js'],
                  ['node','/tmp/stage16a_harness.js'],
                  ['node','--check','/tmp/filter58.js']
              ]
              for cmd in commands:
                  p=subprocess.run(cmd,text=True,capture_output=True)
                  log.append('CMD='+repr(cmd)+' RC='+str(p.returncode))
                  log.append('STDOUT='+p.stdout)
                  log.append('STDERR='+p.stderr)
          pathlib.Path('stage16a_build_error.txt').write_text('\n'.join(log),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage16a_build_error.txt
          git commit -m "更新 Stage16A 构建诊断"
          git push
