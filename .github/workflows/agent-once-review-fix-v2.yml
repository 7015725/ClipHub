name: One-shot review fix v2

# retry: normalize packed wrapper whitespace
on:
  push:
    branches:
      - beta-regex-settings-tabs-20260814
    paths:
      - .github/workflows/agent-once-review-fix-v2.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[review-fix-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0
      - name: Apply fixes
        run: python3 .github/review_fix_v3.py
      - name: Normalize generated wrappers
        run: |
          sed -i 's/[[:blank:]]\+$//' src/ch_06_repository.js src/ch_07_theme.js src/ch_09_list.js src/ch_10_editor.js src/ch_11_filter.js src/ch_12_translation.js src/ch_13_settings.js src/ch_17_tokenizer_ui.js
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('.')
          path = root / 'module-manifest.json'
          manifest = json.loads(path.read_text(encoding='utf-8'))
          for item in manifest['modules']:
              data = (root / item['path']).read_text(encoding='utf-8').encode('utf-8')
              item['sha'] = hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()
          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 scripts/test_review_regressions.py
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check
      - name: Commit and clean one-shot assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/agent-once-review-fix.yml .github/workflows/agent-once-review-fix-v2.yml .github/review_fix_v2.py .github/review_fix_v3.py
          git add src module-manifest.json scripts/release_preflight.sh scripts/test_review_regressions.py
          git status --short
          git commit -m "收口代码审查问题并补齐回归边界 [review-fix-complete]"
          git push origin HEAD:beta-regex-settings-tabs-20260814
