name: One-shot review fix v2

# retry: explicit icon literal and helper adapters
on:
  push:
    branches:
      - beta-regex-settings-tabs-20260814
    paths:
      - .github/workflows/agent-once-review-fix-v2.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[review-fix-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0
      - name: Apply fixes
        run: python3 .github/review_fix_v3.py
      - name: Validate
        run: |
          python3 scripts/test_review_regressions.py
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check
      - name: Commit and clean one-shot assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/agent-once-review-fix.yml .github/workflows/agent-once-review-fix-v2.yml .github/review_fix_v2.py .github/review_fix_v3.py
          git add src module-manifest.json scripts/release_preflight.sh scripts/test_review_regressions.py
          git status --short
          git commit -m "收口代码审查问题并补齐回归边界 [review-fix-complete]"
          git push origin HEAD:beta-regex-settings-tabs-20260814
