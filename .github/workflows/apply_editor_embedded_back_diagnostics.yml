name: Apply Editor Embedded Back Diagnostics

on:
  push:
    branches:
      - fix/editor-embedded-back-capture-20260818
    paths:
      - .github/workflows/apply_editor_embedded_back_diagnostics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/editor-embedded-back-capture-20260818
          fetch-depth: 0

      - name: Expose read-only back diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          branch = "fix/editor-embedded-back-capture-20260818"
          module_set = "20260818.01"
          app_path = Path("src/ch_15_app.js")
          text = app_path.read_text(encoding="utf-8")

          old_decl = '        var editor = safeState(ClipHub.Editor, "getState", {});\n'
          new_decl = (
              old_decl +
              '        var navigation = safeState(ClipHub.Navigation, "getState", {});\n'
          )
          if 'var navigation = safeState(ClipHub.Navigation, "getState", {});' not in text:
              if old_decl not in text:
                  raise SystemExit("editor state declaration anchor missing")
              text = text.replace(old_decl, new_decl, 1)

          old_tail = (
              '            uiShell: uiShell,\n'
              '            runtimeDiagnostics: runtimeDiagnostics\n'
              '        };'
          )
          new_tail = (
              '            uiShell: uiShell,\n'
              '            runtimeDiagnostics: runtimeDiagnostics,\n'
              '            editorState: editor,\n'
              '            navigationState: navigation\n'
              '        };'
          )
          if 'navigationState: navigation' not in text:
              if old_tail not in text:
                  raise SystemExit("uiStatus return anchor missing")
              text = text.replace(old_tail, new_tail, 1)

          if 'MODULE_VERSION: 23,' in text:
              text = text.replace('MODULE_VERSION: 23,', 'MODULE_VERSION: 24,', 1)
          elif 'MODULE_VERSION: 24,' not in text:
              raise SystemExit("App module version anchor missing")

          app_path.write_text(text, encoding="utf-8")
          blob_sha = subprocess.check_output(
              ["git", "hash-object", str(app_path)], text=True
          ).strip()

          manifest_path = Path("module-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["moduleSetVersion"] = module_set
          manifest["sourceRef"] = branch
          found = False
          for item in manifest.get("modules", []):
              if item.get("name") == "ch_15_app.js":
                  item["sha"] = blob_sha
                  found = True
                  break
          if not found:
              raise SystemExit("ch_15_app.js manifest entry missing")
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Validate diagnostic-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'MODULE_VERSION: 24,' src/ch_15_app.js
          grep -F 'editorState: editor' src/ch_15_app.js
          grep -F 'navigationState: navigation' src/ch_15_app.js
          grep -F '"moduleSetVersion": "20260818.01"' module-manifest.json
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'module-manifest.json\nsrc/ch_15_app.js' || {
            echo "Unexpected diagnostic patch scope" >&2
            exit 1
          }

      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No diagnostic changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module-manifest.json src/ch_15_app.js
          git commit -m "chore: expose editor back diagnostics"
          git push origin HEAD:fix/editor-embedded-back-capture-20260818
