name: Beta Stage16C Fix
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/stage16c-fix-trigger.txt
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Filter64
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,glob,hashlib,json,pathlib,re,subprocess
          root=pathlib.Path('.')
          loader_path=root/'src/ch_11_filter.js'
          manifest_path=root/'module-manifest.json'
          loader=loader_path.read_text(encoding='utf-8')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion')!='20260808.17': raise SystemExit('expected .17 baseline')
          if manifest.get('sourceRef')!='beta-pagination-stage10-20260808': raise SystemExit('wrong sourceRef')
          if '/* ClipHub Stage 16B.4 tag-color int rebind and full-refresh samples ES5 loader. */' not in loader:
              raise SystemExit('Stage16B.4 loader baseline missing')
          m=re.search(r'var PATCH_B64 =\n((?:\s*"[A-Za-z0-9+/=]+"\s*\+?\n?)+);',loader)
          if not m: raise SystemExit('PATCH_B64 missing')
          patch=base64.b64decode(''.join(re.findall(r'"([A-Za-z0-9+/=]+)"',m.group(1)))).decode('utf-8')

          stagec=r'''
    function replaceAllStage16C(source, oldText, newText, expectedCount, label) {
        var parts = String(source).split(String(oldText));
        var count = parts.length - 1;
        if (count !== Number(expectedCount)) {
            throw new Error(String(label || "Stage16C replace") +
                " expected " + String(expectedCount) + " got " + String(count));
        }
        return parts.join(String(newText));
    }

    function transformStage16CSource(source) {
        var helperText;
        var oldTake;
        var newTake;

        source = replaceOnceStrict(source,
            "MODULE_VERSION: 63", "MODULE_VERSION: 64",
            "Stage16C module version");

        source = replaceOnceStrict(source,
            "        holderRecycleDiscardCount: 0,\n",
            "        holderRecycleDiscardCount: 0,\n" +
            "        holderRecycleKeyHitCount: 0,\n" +
            "        holderRecycleKeyMissCount: 0,\n" +
            "        holderRecyclePoolScanCount: 0,\n" +
            "        holderRecyclePoolPeakCount: 0,\n",
            "Stage16C metrics");

        source = replaceOnceStrict(source,
            "        scrollPerformanceState.holderRecycleDiscardCount = 0;\n",
            "        scrollPerformanceState.holderRecycleDiscardCount = 0;\n" +
            "        scrollPerformanceState.holderRecycleKeyHitCount = 0;\n" +
            "        scrollPerformanceState.holderRecycleKeyMissCount = 0;\n" +
            "        scrollPerformanceState.holderRecyclePoolScanCount = 0;\n" +
            "        scrollPerformanceState.holderRecyclePoolPeakCount = 0;\n",
            "Stage16C metric reset");

        source = replaceOnceStrict(source,
            "            holderRecycleDiscardCount:\n" +
            "                Number(scrollPerformanceState.holderRecycleDiscardCount),\n" +
            "            holderRebindCount:\n",
            "            holderRecycleDiscardCount:\n" +
            "                Number(scrollPerformanceState.holderRecycleDiscardCount),\n" +
            "            holderRecycleKeyHitCount:\n" +
            "                Number(scrollPerformanceState.holderRecycleKeyHitCount),\n" +
            "            holderRecycleKeyMissCount:\n" +
            "                Number(scrollPerformanceState.holderRecycleKeyMissCount),\n" +
            "            holderRecyclePoolScanCount:\n" +
            "                Number(scrollPerformanceState.holderRecyclePoolScanCount),\n" +
            "            holderRecyclePoolPeakCount:\n" +
            "                Number(scrollPerformanceState.holderRecyclePoolPeakCount),\n" +
            "            holderRebindCount:\n",
            "Stage16C metric copy");

        helperText =
            "    function resultCardRecycleKeyForRow(row) {\n" +
            "        var tags = tagsForResult(row);\n" +
            "        var selected = SELECTION_ENABLED && selectedItemId !== null &&\n" +
            "            Number(selectedItemId) === Number(row.id);\n" +
            "        return [\n" +
            "            String(row.source_package || \"\"),\n" +
            "            Number(row.is_pinned || 0) === 1 ? \"1\" : \"0\",\n" +
            "            selected ? \"1\" : \"0\",\n" +
            "            tags.length > 0 ? \"1\" : \"0\"\n" +
            "        ].join(\"\\u001f\");\n" +
            "    }\n\n" +
            "    function resultCardRecycleKeyForHolder(holder) {\n" +
            "        var row;\n" +
            "        var tags;\n" +
            "        if (holder === null || holder === undefined ||\n" +
            "                holder.row === null || holder.row === undefined) {\n" +
            "            return \"\";\n" +
            "        }\n" +
            "        row = holder.row;\n" +
            "        tags = tagsForResult(row);\n" +
            "        return [\n" +
            "            String(holder.sourcePackage || row.source_package || \"\"),\n" +
            "            holder.pinned === true ? \"1\" : \"0\",\n" +
            "            holder.selected === true ? \"1\" : \"0\",\n" +
            "            tags.length > 0 ? \"1\" : \"0\"\n" +
            "        ].join(\"\\u001f\");\n" +
            "    }\n\n" +
            "    function takeCompatibleRecycleHolder(pool, row) {\n" +
            "        var key = resultCardRecycleKeyForRow(row);\n" +
            "        var index;\n" +
            "        if (pool === null || pool === undefined || pool.length === 0) {\n" +
            "            return null;\n" +
            "        }\n" +
            "        for (index = pool.length - 1; index >= 0; index -= 1) {\n" +
            "            scrollPerformanceState.holderRecyclePoolScanCount += 1;\n" +
            "            if (resultCardRecycleKeyForHolder(pool[index]) === key) {\n" +
            "                return pool.splice(index, 1)[0];\n" +
            "            }\n" +
            "        }\n" +
            "        return null;\n" +
            "    }\n\n";

        source = replaceOnceStrict(source,
            "    function rebuildVirtualWindow(origin, force, preferredIndex) {",
            helperText + "    function rebuildVirtualWindow(origin, force, preferredIndex) {",
            "Stage16C recycle helpers");

        source = replaceOnceStrict(source,
            "        var rebuildReusedBefore;\n",
            "        var rebuildReusedBefore;\n" +
            "        var rebuildRecycleBefore =\n" +
            "            Number(scrollPerformanceState.holderRecycleReuseCount);\n",
            "Stage16C slow sample baseline");

        oldTake =
            "                    if (recycleEnabled && recyclePool.length > 0) {\n" +
            "                        holderRef = recyclePool.pop();\n" +
            "                        if (rebindResultCardHolder(holderRef,\n" +
            "                                previewRows[index], colors)) {\n" +
            "                            wrapper = holderRef.wrapper;\n" +
            "                            cardRef = holderRef.card;\n" +
            "                            actionRef = cardHolderActionRefs(holderRef);\n" +
            "                            scrollPerformanceState.holderRecycleReuseCount += 1;\n" +
            "                        } else {\n" +
            "                            scrollPerformanceState.holderRecycleDiscardCount += 1;\n" +
            "                            holderRef = null;\n" +
            "                        }\n" +
            "                    }\n";

        newTake =
            "                    if (recycleEnabled && recyclePool.length > 0) {\n" +
            "                        scrollPerformanceState.holderRecyclePoolPeakCount = Math.max(\n" +
            "                            Number(scrollPerformanceState.holderRecyclePoolPeakCount),\n" +
            "                            Number(recyclePool.length));\n" +
            "                        holderRef = takeCompatibleRecycleHolder(\n" +
            "                            recyclePool, previewRows[index]);\n" +
            "                        if (holderRef !== null && holderRef !== undefined) {\n" +
            "                            scrollPerformanceState.holderRecycleKeyHitCount += 1;\n" +
            "                            if (rebindResultCardHolder(holderRef,\n" +
            "                                    previewRows[index], colors)) {\n" +
            "                                wrapper = holderRef.wrapper;\n" +
            "                                cardRef = holderRef.card;\n" +
            "                                actionRef = cardHolderActionRefs(holderRef);\n" +
            "                                scrollPerformanceState.holderRecycleReuseCount += 1;\n" +
            "                            } else {\n" +
            "                                scrollPerformanceState.holderRecycleDiscardCount += 1;\n" +
            "                                holderRef = null;\n" +
            "                            }\n" +
            "                        } else {\n" +
            "                            scrollPerformanceState.holderRecycleKeyMissCount += 1;\n" +
            "                        }\n" +
            "                    }\n";

        source = replaceAllStage16C(source, oldTake, newTake, 2,
            "Stage16C compatible holder take");

        source = replaceOnceStrict(source,
            "                reused: Number(scrollPerformanceState.sameIdReuseCount) -\n" +
            "                    rebuildReusedBefore,\n" +
            "                measureMs: Number(scrollPerformanceState.measureLastMs),\n",
            "                reused: Number(scrollPerformanceState.sameIdReuseCount) -\n" +
            "                    rebuildReusedBefore,\n" +
            "                recycled: Number(scrollPerformanceState.holderRecycleReuseCount) -\n" +
            "                    rebuildRecycleBefore,\n" +
            "                newBuilt: Math.max(0,\n" +
            "                    Number(scrollPerformanceState.createdViewCount) -\n" +
            "                    rebuildCreatedBefore -\n" +
            "                    (Number(scrollPerformanceState.holderRecycleReuseCount) -\n" +
            "                        rebuildRecycleBefore)),\n" +
            "                measureMs: Number(scrollPerformanceState.measureLastMs),\n",
            "Stage16C slow sample breakdown");

        if (source.indexOf("MODULE_VERSION: 64") < 0 ||
                source.indexOf("takeCompatibleRecycleHolder") < 0 ||
                source.indexOf("holderRecycleKeyHitCount") < 0 ||
                source.indexOf("holderRecycleKeyMissCount") < 0 ||
                source.indexOf("holderRecyclePoolScanCount") < 0 ||
                source.indexOf("recycled: Number(scrollPerformanceState.holderRecycleReuseCount)") < 0 ||
                source.indexOf("newBuilt: Math.max(0") < 0 ||
                source.indexOf(oldTake) >= 0) {
            throw new Error("Stage16C wiring incomplete");
        }
        return source;
    }
'''
          patch=patch.rstrip()+"\n\n"+stagec.strip()+"\n"
          enc=base64.b64encode(patch.encode()).decode()
          pieces=[enc[i:i+120] for i in range(0,len(enc),120)]
          assignment='var PATCH_B64 =\n'+''.join('        '+json.dumps(p)+(' +\n' if i<len(pieces)-1 else ';\n') for i,p in enumerate(pieces))
          loader=loader[:m.start()]+assignment+loader[m.end():]

          start=loader.index('        var newEval =\n')
          end=loader.index('        loader = replaceOnce(loader, oldEval, newEval, "baseline eval");',start)
          new_block='''        var newEval =
            patchSourceText() + "\\n" +
            "    try {\\n" +
            "        eval(transformStage16CSource(\\n" +
            "            transformStage16B4Source(\\n" +
            "                transformStage16B3Source(\\n" +
            "                    transformStage16B2Source(\\n" +
            "                        transformRecycleFixSource(\\n" +
            "                            transformRecycleSource(\\n" +
            "                                transformCardHolderSource(\\n" +
            "                                    transformSource(decodeSource(loadPackedSource()))))))))));\\n";
'''
          loader=loader[:start]+new_block+loader[end:]
          loader=loader.replace('/* ClipHub Stage 16B.4 tag-color int rebind and full-refresh samples ES5 loader. */','/* ClipHub Stage 16C compatibility-key recycle selection ES5 loader. */',1)
          loader=loader.replace('?stage16b4v17=','?stage16cv18=',1)
          loader=loader.replace('ch_11_filter.js Stage 16B.4 loader failed:','ch_11_filter.js Stage 16C loader failed:',1)
          loader=loader.replace('ch_11_filter.js Stage 16B.4 wrapper failed:','ch_11_filter.js Stage 16C wrapper failed:',1)
          loader_path.write_text(loader,encoding='utf-8')

          # Generate actual Filter64 for static validation.
          baseline=subprocess.check_output(['git','show','338a811e538ab526b59eed05102d4f4b66f19953:src/ch_11_filter.js'],text=True)
          s=baseline.index('    function replaceOnceStrict('); e=baseline.index('\n    try {',s)
          pure=baseline[s:e]
          packed=''.join(pathlib.Path(p).read_text(encoding='utf-8').strip() for p in sorted(glob.glob('stage-assets/pagination-stage9/ch11_full_v8s_*.b64')))
          stable=gzip.decompress(base64.b64decode(packed)).decode('utf-8')
          harness='var __source='+json.dumps(stable)+';\n'+pure+'\n'+patch+'\nvar __out=transformStage16CSource(transformStage16B4Source(transformStage16B3Source(transformStage16B2Source(transformRecycleFixSource(transformRecycleSource(transformCardHolderSource(transformSource(__source))))))));\nrequire("fs").writeFileSync("/tmp/filter64.js",__out);\n'
          pathlib.Path('/tmp/stage16c_build.js').write_text(harness,encoding='utf-8')
          subprocess.check_call(['node','/tmp/stage16c_build.js'])
          src=pathlib.Path('/tmp/filter64.js').read_text(encoding='utf-8')
          if src.count('MODULE_VERSION: 64')!=1: raise SystemExit('Filter64 version mismatch')
          for required in ['takeCompatibleRecycleHolder','holderRecycleKeyHitCount','holderRecycleKeyMissCount','holderRecyclePoolScanCount','holderRecyclePoolPeakCount','recycled: Number(scrollPerformanceState.holderRecycleReuseCount)','newBuilt: Math.max(0']:
              if required not in src: raise SystemExit('missing '+required)
          if src.count('holderRef = recyclePool.pop();')!=0: raise SystemExit('old top-pop selection remains')
          if 'VIRTUAL_BEFORE_SCREENS = 3' not in src or 'VIRTUAL_AFTER_SCREENS = 5' not in src or 'VIRTUAL_UPDATE_DELAY_MS = 24' not in src: raise SystemExit('virtual constants changed')
          if src.count('.newSingleThreadExecutor();')!=1: raise SystemExit('worker invariant changed')
          if re.search(r'(^|[^A-Za-z0-9_])(let|const|class)[\s]+|=>',src): raise SystemExit('non-ES5 syntax in Filter64')
          subprocess.check_call(['node','--check','/tmp/filter64.js'])
          subprocess.check_call(['node','--check',str(loader_path)])

          data=loader_path.read_bytes()
          blob_sha=hashlib.sha1(('blob %d\0' % len(data)).encode()+data).hexdigest()
          manifest['moduleSetVersion']='20260808.18'
          found=False
          for mod in manifest.get('modules',[]):
              if mod.get('name')=='ch_11_filter.js': mod['sha']=blob_sha; found=True
          if not found: raise SystemExit('filter manifest entry missing')
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Filter64 blob',blob_sha)
          PY
      - name: Commit Stage16C atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/stage16c-diag-trigger.txt .github/stage16c-fix-trigger.txt
          rm -f .github/workflows/beta_stage16c_diag.yml .github/workflows/beta_stage16c_fix.yml
          rm -f stage16c_diag.txt
          git add -A
          git diff --cached --check
          git commit -m "优化 Beta Holder 兼容键复用命中率"
          git push
