name: Regex Drag Reorder Hotfix

on:
  push:
    branches: [beta-regex-filter-20260813]
    paths:
      - .github/regex-drag-hotfix-trigger.txt

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Settings drag ownership and repack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import base64
          import gzip
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path.cwd()
          fragment_path = root / "tools/regex_beta_patches/settings_regex_feature.jsfrag"
          settings_path = root / "src/ch_13_settings.js"
          manifest_path = root / "module-manifest.json"
          preflight_path = root / "scripts/release_preflight.sh"

          new_drag = '''    function setRegexRuleDragParentIntercept(view, disallow) {
              var parent = null;
              try {
                  parent = view === null || view === undefined ? null : view.getParent();
                  if (parent !== null) {
                      parent.requestDisallowInterceptTouchEvent(disallow === true);
                  }
              } catch (ignoredRegexDragParent) {}
              return true;
          }

          function resetRegexRuleDragVisual(rowRoot) {
              try { rowRoot.setTranslationY(0); } catch (ignoredRegexDragTranslation) {}
              try { rowRoot.setAlpha(1); } catch (ignoredRegexDragAlpha) {}
              return true;
          }

          function bindRegexRuleDrag(handle, rowRoot, ruleId) {
              var startY = 0;
              var dragging = false;
              handle.setOnTouchListener(new JavaAdapter(View.OnTouchListener, {
                  onTouch: function (view, event) {
                      var action = Number(event.getActionMasked());
                      var delta;
                      if (action === MotionEvent.ACTION_DOWN) {
                          startY = Number(event.getRawY());
                          dragging = true;
                          setRegexRuleDragParentIntercept(view, true);
                          rowRoot.setAlpha(0.92);
                          return true;
                      }
                      if (action === MotionEvent.ACTION_MOVE && dragging) {
                          setRegexRuleDragParentIntercept(view, true);
                          delta = Math.max(-dp(64), Math.min(dp(64),
                              Number(event.getRawY()) - startY));
                          rowRoot.setTranslationY(delta);
                          return true;
                      }
                      if (action === MotionEvent.ACTION_CANCEL && dragging) {
                          dragging = false;
                          setRegexRuleDragParentIntercept(view, false);
                          resetRegexRuleDragVisual(rowRoot);
                          return true;
                      }
                      if (action === MotionEvent.ACTION_UP && dragging) {
                          delta = Number(event.getRawY()) - startY;
                          dragging = false;
                          setRegexRuleDragParentIntercept(view, false);
                          resetRegexRuleDragVisual(rowRoot);
                          if (Math.abs(delta) >= dp(28)) {
                              return moveRegexRule(Number(ruleId), delta > 0 ? 1 : -1);
                          }
                          return true;
                      }
                      return false;
                  }
              }));
          }
          '''

          def replace_drag_block(text: str, label: str) -> str:
              start_marker = "    function bindRegexRuleDrag(handle, rowRoot, ruleId) {"
              end_marker = "\n    function deleteRegexRuleConfirmed(ruleId, deleteView) {"
              start = text.find(start_marker)
              if start < 0:
                  raise RuntimeError(label + ": bindRegexRuleDrag start missing")
              end = text.find(end_marker, start)
              if end < 0:
                  raise RuntimeError(label + ": deleteRegexRuleConfirmed boundary missing")
              if text.find(start_marker, start + 1) >= 0:
                  raise RuntimeError(label + ": duplicate bindRegexRuleDrag")
              return text[:start] + new_drag.rstrip() + "\n" + text[end:]

          def replace_once(text: str, before: str, after: str, label: str) -> str:
              count = text.count(before)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 anchor, got {count}")
              return text.replace(before, after, 1)

          fragment = fragment_path.read_text(encoding="utf-8")
          fragment = replace_drag_block(fragment, "settings fragment")
          fragment_path.write_text(fragment, encoding="utf-8")

          loader = settings_path.read_text(encoding="utf-8")
          assignment = re.search(r"\bvar\s+(PACKED_B64|encoded)\s*=\s*(.*?);", loader, re.S)
          if assignment is None:
              raise RuntimeError("settings packed assignment missing")
          pieces = re.findall(r'"(?:\\.|[^"\\])*"', assignment.group(2))
          encoded = "".join(json.loads(piece) for piece in pieces)
          canonical = gzip.decompress(base64.b64decode(encoded)).decode("utf-8")
          canonical = replace_drag_block(canonical, "settings canonical")
          canonical = replace_once(canonical, "MODULE_VERSION: 26", "MODULE_VERSION: 27",
                                   "settings module version")

          raw = gzip.compress(canonical.encode("utf-8"), compresslevel=9, mtime=0)
          packed = base64.b64encode(raw).decode("ascii")
          chunks = [packed[i:i + 120] for i in range(0, len(packed), 120)]
          expression = "\n        " + " +\n        ".join(json.dumps(chunk) for chunk in chunks) + "\n    "
          loader = loader[:assignment.start(2)] + expression + loader[assignment.end(2):]
          source_sha = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          loader, n = re.subn(
              r"(\bvar\s+SOURCE_SHA256\s*=\s*[\"'])[0-9a-fA-F]{64}([\"'])",
              lambda m: m.group(1) + source_sha + m.group(2), loader, count=1)
          if n != 1:
              raise RuntimeError("settings SOURCE_SHA256 update failed")
          loader = "\n".join(line.rstrip() for line in loader.splitlines()) + "\n"
          settings_path.write_text(loader, encoding="utf-8")

          def git_blob_sha(text: str) -> str:
              data = text.encode("utf-8")
              return hashlib.sha1(f"blob {len(data)}\0".encode("utf-8") + data).hexdigest()

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("moduleSetVersion") != "20260813.06":
              raise RuntimeError("unexpected moduleSetVersion: " + str(manifest.get("moduleSetVersion")))
          manifest["moduleSetVersion"] = "20260813.07"
          settings_blob = git_blob_sha(loader)
          entries = [item for item in manifest.get("modules", [])
                     if item.get("name") == "ch_13_settings.js"]
          if len(entries) != 1:
              raise RuntimeError("manifest settings entry mismatch")
          entries[0]["sha"] = settings_blob
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
                                   encoding="utf-8")

          preflight = preflight_path.read_text(encoding="utf-8")
          if preflight.count("EXPECTED_MODULE_SET='20260813.06'") != 2:
              raise RuntimeError("regex preflight moduleSet anchors changed")
          preflight = preflight.replace("EXPECTED_MODULE_SET='20260813.06'",
                                        "EXPECTED_MODULE_SET='20260813.07'")
          preflight = replace_once(
              preflight,
              '"ch_13_settings.js": ("ch_13_settings", 26),',
              '"ch_13_settings.js": ("ch_13_settings", 27),',
              "regex preflight settings version")
          preflight_path.write_text(preflight, encoding="utf-8")

          assert canonical.count("function bindRegexRuleDrag(") == 1
          assert canonical.count("function setRegexRuleDragParentIntercept(") == 1
          assert "requestDisallowInterceptTouchEvent(disallow === true)" in canonical
          assert "ACTION_CANCEL && dragging" in canonical
          assert "MODULE_VERSION: 27" in canonical
          assert manifest["moduleSetVersion"] == "20260813.07"
          print("Regex drag patch generated")
          print("Settings blob SHA:", settings_blob)
          PY

          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict | tee /tmp/regex-drag-color.txt
          grep '^HIGH=0 WARN=0 ' /tmp/regex-drag-color.txt
          bash scripts/release_preflight.sh --regex-beta
          git diff --check

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/regex_beta_patches/settings_regex_feature.jsfrag \
                  src/ch_13_settings.js module-manifest.json scripts/release_preflight.sh
          git diff --cached --stat
          git commit -m "修复 Regex 规则拖动排序触摸拦截"
          git push origin HEAD:beta-regex-filter-20260813
