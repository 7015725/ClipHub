name: Stage7.1 Dual Transport Once
on:
  push:
    branches:
      - beta-regex-settings-tabs-20260814
    paths:
      - 'tools/stage7_1_dual_transport_20260815.py'
      - '.github/workflows/stage7_1_dual_transport_once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply Stage7.1 dual transport
        run: python3 tools/stage7_1_dual_transport_20260815.py
      - name: Remove one-time tooling
        run: |
          rm -f .github/workflows/stage7_1_dual_transport_once.yml
          rm -f tools/stage7_1_dual_transport_20260815.py
      - name: Validate Stage7.1
        run: |
          node --check ClipHub.js
          python3 scripts/validate_es5.py .
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check
      - name: Validate persistent boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=40f2fc3095f97ef805fe690bb4508eaf7001d5bd
          expected=$(printf '%s\n' \
            ClipHub.js \
            module-manifest.json \
            scripts/release_preflight.sh | sort)
          actual=$(git diff --name-only "$BASE" | sort)
          printf '%s\n' "$actual"
          test "$actual" = "$expected"

          for path in src/ch_*.js tasks/ClipHub_全局剪贴板开关.js; do
            git diff --quiet "$BASE" -- "$path"
          done

          test ! -e .github/workflows/stage7_1_dual_transport_once.yml
          test ! -e tools/stage7_1_dual_transport_20260815.py
          grep -q 'var ENTRY_VERSION = 7;' ClipHub.js
          grep -q 'https://api.github.com/repos/' ClipHub.js
          grep -q 'application/vnd.github.raw+json' ClipHub.js
          grep -q 'function fetchRemoteFile(path, ref)' ClipHub.js
          grep -q '"moduleSetVersion": "20260815.17"' module-manifest.json
          grep -q '"entryMinVersion": 7' module-manifest.json
          echo 'Stage7.1 persistent boundary: passed'
      - name: Commit and push final tree
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "Stage7.1增加GitHub API同步备用通道"
          git push origin HEAD:beta-regex-settings-tabs-20260814
