name: Temporary advanced filter search removal

on:
  push:
    branches:
      - agent/unify-window-geometry
    paths:
      - .github/workflows/temporary_remove_advanced_filter_search.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary_remove_advanced_filter_search.yml

permissions:
  contents: write

concurrency:
  group: cliphub-remove-advanced-filter-search
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/unify-window-geometry
          fetch-depth: 0

      - name: Apply removal
        run: python3 scripts/temporary_remove_advanced_filter_search.py

      - name: Validate filter loader
        run: |
          node --check src/ch_11_filter.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess

          text = Path('src/ch_11_filter.js').read_text(encoding='utf-8')
          for pattern in [r'\b(?:let|const)\b', r'=>', r'`', r'\?\.', r'\?\?']:
              if re.search(pattern, text):
                  raise SystemExit('Rhino ES5 violation: ' + pattern)
          for marker in [
              'var CACHE_VERSION = "v31";',
              'MODULE_VERSION: 31',
              'var oldAdvancedSearch =',
              'state.advancedKeywordInputPresent = false;',
              'Advanced filter search contract site mismatch',
              'function createImeController(windowOptions)',
              'filter.FILTER_IME_AVOIDANCE = CACHE_VERSION;'
          ]:
              if marker not in text:
                  raise SystemExit('missing marker: ' + marker)
          manifest = json.loads(Path('module-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion') != '20260724.26':
              raise SystemExit('unexpected module set version')
          expected = subprocess.check_output(
              ['git', 'hash-object', 'src/ch_11_filter.js'], text=True
          ).strip()
          actual = next(item.get('sha') for item in manifest['modules']
              if item.get('path') == 'src/ch_11_filter.js')
          if actual != expected:
              raise SystemExit('manifest filter blob mismatch')
          PY
          git diff --check

      - name: Commit change and remove temporary files
        run: |
          rm -f scripts/temporary_remove_advanced_filter_search.py
          rm -f .github/workflows/temporary_remove_advanced_filter_search.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ui: remove advanced filter search field"
          git push origin HEAD:agent/unify-window-geometry
