name: Beta Stage16 CardHolder Diagnostic
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/workflows/beta_stage16_cardholder_diag.yml
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract stable Filter56 card sections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,glob,pathlib
          parts=sorted(glob.glob('stage-assets/pagination-stage9/ch11_full_v8s_*.b64'))
          packed=''.join(pathlib.Path(p).read_text(encoding='utf-8').strip() for p in parts)
          src=gzip.decompress(base64.b64decode(packed)).decode('utf-8')
          names=['buildCardActionGrid','bindSwipeGesture','makeResultCard','inputResultRow','editResultRow','translateResultRow','copyResultRow','deleteResultRow','pinResultRow']
          out=[]
          for name in names:
              marker='    function '+name+'('
              start=src.find(marker)
              if start<0:
                  out.append('===== '+name+' MISSING =====\n')
                  continue
              end=src.find('\n    function ',start+len(marker))
              if end<0: end=min(len(src),start+18000)
              out.append('===== '+name+' =====\n'+src[start:end]+'\n')
          pathlib.Path('stage16_cardholder_diag.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage16_cardholder_diag.txt
          git commit -m "生成 Stage16 CardHolder 只读诊断"
          git push
