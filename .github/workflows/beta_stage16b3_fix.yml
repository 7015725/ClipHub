name: Beta Stage16B3 Fix
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/stage16b3-fix-trigger.txt
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Filter62
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,glob,hashlib,json,pathlib,re,subprocess
          root=pathlib.Path('.')
          loader_path=root/'src/ch_11_filter.js'
          manifest_path=root/'module-manifest.json'
          loader=loader_path.read_text(encoding='utf-8')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion')!='20260808.15': raise SystemExit('expected .15 baseline')
          if manifest.get('sourceRef')!='beta-pagination-stage10-20260808': raise SystemExit('wrong sourceRef')
          if '/* ClipHub Stage 16B.2 Holder rebind fix and alignment diagnostics ES5 loader. */' not in loader:
              raise SystemExit('Stage16B.2 loader baseline missing')
          m=re.search(r'var PATCH_B64 =\n((?:\s*"[A-Za-z0-9+/=]+"\s*\+?\n?)+);',loader)
          if not m: raise SystemExit('PATCH_B64 missing')
          patch=base64.b64decode(''.join(re.findall(r'"([A-Za-z0-9+/=]+)"',m.group(1)))).decode('utf-8')
          if patch.count('oldTagls')!=0: raise SystemExit('oldTagls regression present')
          if patch.count('newTagls')!=2: raise SystemExit('expected exactly two newTagls typos, got %d' % patch.count('newTagls'))
          patch=patch.replace('newTagls','newTags')

          stage3=r'''
    function transformStage16B3Source(source) {
        var info;
        var value;
        var finishInfo;
        var finishValue;
        var finishPos;

        source = replaceOnceStrict(source,
            "MODULE_VERSION: 61", "MODULE_VERSION: 62",
            "Stage16B3 module version");

        source = replaceOnceStrict(source,
            "        fullRefreshLastChildCount: 0,\n",
            "        fullRefreshLastChildCount: 0,\n" +
            "        fullRefreshRequestCount: 0,\n" +
            "        fullRefreshDuplicateSuppressedCount: 0,\n" +
            "        fullRefreshLastDataKey: \"\",\n" +
            "        fullRefreshPendingDataKey: \"\",\n" +
            "        fullRefreshLastAppliedDataKey: \"\",\n" +
            "        virtualBookkeepingAtomicClearCount: 0,\n",
            "Stage16B3 metrics");

        source = replaceOnceStrict(source,
            "        scrollPerformanceState.fullRefreshLastChildCount = 0;\n",
            "        scrollPerformanceState.fullRefreshLastChildCount = 0;\n" +
            "        scrollPerformanceState.fullRefreshRequestCount = 0;\n" +
            "        scrollPerformanceState.fullRefreshDuplicateSuppressedCount = 0;\n" +
            "        scrollPerformanceState.fullRefreshLastDataKey = \"\";\n" +
            "        scrollPerformanceState.fullRefreshPendingDataKey = \"\";\n" +
            "        scrollPerformanceState.fullRefreshLastAppliedDataKey = \"\";\n" +
            "        scrollPerformanceState.virtualBookkeepingAtomicClearCount = 0;\n",
            "Stage16B3 metric reset");

        source = replaceOnceStrict(source,
            "            fullRefreshLastChildCount:\n" +
            "                Number(scrollPerformanceState.fullRefreshLastChildCount),\n" +
            "            spacerApplyCount:\n",
            "            fullRefreshLastChildCount:\n" +
            "                Number(scrollPerformanceState.fullRefreshLastChildCount),\n" +
            "            fullRefreshRequestCount:\n" +
            "                Number(scrollPerformanceState.fullRefreshRequestCount),\n" +
            "            fullRefreshDuplicateSuppressedCount:\n" +
            "                Number(scrollPerformanceState.fullRefreshDuplicateSuppressedCount),\n" +
            "            fullRefreshLastDataKey:\n" +
            "                String(scrollPerformanceState.fullRefreshLastDataKey || \"\"),\n" +
            "            fullRefreshPendingDataKey:\n" +
            "                String(scrollPerformanceState.fullRefreshPendingDataKey || \"\"),\n" +
            "            fullRefreshLastAppliedDataKey:\n" +
            "                String(scrollPerformanceState.fullRefreshLastAppliedDataKey || \"\"),\n" +
            "            virtualBookkeepingAtomicClearCount:\n" +
            "                Number(scrollPerformanceState.virtualBookkeepingAtomicClearCount),\n" +
            "            spacerApplyCount:\n",
            "Stage16B3 metric copy");

        info = section(source,
            "    function refreshResultsOnMain() {",
            "\n    function ",
            "Stage16B3 refresh results");
        value = info.text;
        value = replaceOnceStrict(value,
            "        var preferredIndex;\n" +
            "        if (resultContainer === null) { return false; }\n",
            "        var preferredIndex;\n" +
            "        var fullRefreshDataKey;\n" +
            "        if (resultContainer === null) { return false; }\n" +
            "        scrollPerformanceState.fullRefreshRequestCount += 1;\n" +
            "        fullRefreshDataKey = [\n" +
            "            String(Number(panelDataVersion || 0)),\n" +
            "            String(Number(paginationState.queryGeneration || 0)),\n" +
            "            String(Number(searchGeneration || 0)),\n" +
            "            String(Number(previewRows.length || 0)),\n" +
            "            previewRows.length > 0 ? String(Number(previewRows[0].id)) : \"-\",\n" +
            "            previewRows.length > 0 ? String(Number(previewRows[previewRows.length - 1].id)) : \"-\",\n" +
            "            rootMode ? \"1\" : \"0\"\n" +
            "        ].join(\"|\");\n" +
            "        scrollPerformanceState.fullRefreshLastDataKey = fullRefreshDataKey;\n" +
            "        if (String(performance.lastRefreshOrigin || \"\") === \"panel_first_content\" &&\n" +
            "                state.contentReady === true &&\n" +
            "                virtualCardHost !== null &&\n" +
            "                Number(virtualCardHost.getChildCount()) > 0 &&\n" +
            "                String(scrollPerformanceState.fullRefreshLastAppliedDataKey || \"\") ===\n" +
            "                    fullRefreshDataKey) {\n" +
            "            scrollPerformanceState.fullRefreshDuplicateSuppressedCount += 1;\n" +
            "            return false;\n" +
            "        }\n" +
            "        scrollPerformanceState.fullRefreshPendingDataKey = fullRefreshDataKey;\n",
            "Stage16B3 duplicate guard");

        value = replaceOnceStrict(value,
            "        resultCardViews = [];\n" +
            "        resultCardHolders = [];\n" +
            "        resultActionViews = [];\n" +
            "        resultTagMap = {};\n",
            "        resultCardViews = [];\n" +
            "        resultCardHolders = [];\n" +
            "        resultActionViews = [];\n" +
            "        virtualRenderedItemIds = [];\n" +
            "        virtualRenderedSignatures = [];\n" +
            "        virtualState.firstRenderedIndex = 0;\n" +
            "        virtualState.lastRenderedIndex = -1;\n" +
            "        scrollPerformanceState.virtualBookkeepingAtomicClearCount += 1;\n" +
            "        resultTagMap = {};\n",
            "Stage16B3 atomic virtual clear");
        source = replaceSection(source, info, value);

        finishInfo = section(source,
            "    function finishResultRender(generation, colors) {",
            "\n    function ",
            "Stage16B3 finish render");
        finishValue = finishInfo.text;
        finishPos = finishValue.lastIndexOf("        return true;");
        if (finishPos < 0) {
            throw new Error("Stage16B3 finish success return missing");
        }
        finishValue = finishValue.substring(0, finishPos) +
            "        if (String(scrollPerformanceState.fullRefreshPendingDataKey || \"\").length > 0) {\n" +
            "            scrollPerformanceState.fullRefreshLastAppliedDataKey =\n" +
            "                String(scrollPerformanceState.fullRefreshPendingDataKey);\n" +
            "            scrollPerformanceState.fullRefreshPendingDataKey = \"\";\n" +
            "        }\n" +
            finishValue.substring(finishPos);
        source = replaceSection(source, finishInfo, finishValue);

        if (source.indexOf("oldTagls") >= 0 ||
                source.indexOf("newTagls") >= 0 ||
                source.indexOf("MODULE_VERSION: 62") < 0 ||
                source.indexOf("virtualBookkeepingAtomicClearCount") < 0 ||
                source.indexOf("fullRefreshDuplicateSuppressedCount") < 0 ||
                source.indexOf("virtualRenderedItemIds = [];\n        virtualRenderedSignatures = [];\n        virtualState.firstRenderedIndex = 0;\n        virtualState.lastRenderedIndex = -1;") < 0) {
            throw new Error("Stage16B3 wiring incomplete");
        }
        return source;
    }
'''
          patch=patch.rstrip()+"\n\n"+stage3.strip()+"\n"
          enc=base64.b64encode(patch.encode()).decode()
          pieces=[enc[i:i+120] for i in range(0,len(enc),120)]
          assignment='var PATCH_B64 =\n'+''.join('        '+json.dumps(p)+(' +\n' if i<len(pieces)-1 else ';\n') for i,p in enumerate(pieces))
          loader=loader[:m.start()]+assignment+loader[m.end():]

          start=loader.index('        var newEval =\n')
          end=loader.index('        loader = replaceOnce(loader, oldEval, newEval, "baseline eval");',start)
          new_block='''        var newEval =
            patchSourceText() + "\\n" +
            "    try {\\n" +
            "        eval(transformStage16B3Source(\\n" +
            "            transformStage16B2Source(\\n" +
            "                transformRecycleFixSource(\\n" +
            "                    transformRecycleSource(\\n" +
            "                        transformCardHolderSource(\\n" +
            "                            transformSource(decodeSource(loadPackedSource()))))))));\\n";
'''
          loader=loader[:start]+new_block+loader[end:]
          loader=loader.replace('/* ClipHub Stage 16B.2 Holder rebind fix and alignment diagnostics ES5 loader. */','/* ClipHub Stage 16B.3 atomic virtual clear and full-refresh dedupe ES5 loader. */',1)
          loader=loader.replace('?stage16b2v15=','?stage16b3v16=',1)
          loader=loader.replace('ch_11_filter.js Stage 16B.2 loader failed:','ch_11_filter.js Stage 16B.3 loader failed:',1)
          loader=loader.replace('ch_11_filter.js Stage 16B.2 wrapper failed:','ch_11_filter.js Stage 16B.3 wrapper failed:',1)
          loader_path.write_text(loader,encoding='utf-8')

          # Generate actual Filter62 for static validation.
          baseline=subprocess.check_output(['git','show','338a811e538ab526b59eed05102d4f4b66f19953:src/ch_11_filter.js'],text=True)
          s=baseline.index('    function replaceOnceStrict('); e=baseline.index('\n    try {',s)
          pure=baseline[s:e]
          packed=''.join(pathlib.Path(p).read_text(encoding='utf-8').strip() for p in sorted(glob.glob('stage-assets/pagination-stage9/ch11_full_v8s_*.b64')))
          stable=gzip.decompress(base64.b64decode(packed)).decode('utf-8')
          harness='var __source='+json.dumps(stable)+';\n'+pure+'\n'+patch+'\nvar __out=transformStage16B3Source(transformStage16B2Source(transformRecycleFixSource(transformRecycleSource(transformCardHolderSource(transformSource(__source))))));\nrequire("fs").writeFileSync("/tmp/filter62.js",__out);\n'
          pathlib.Path('/tmp/stage16b3_build.js').write_text(harness,encoding='utf-8')
          subprocess.check_call(['node','/tmp/stage16b3_build.js'])
          src=pathlib.Path('/tmp/filter62.js').read_text(encoding='utf-8')
          if src.count('MODULE_VERSION: 62')!=1: raise SystemExit('Filter62 version mismatch')
          if 'oldTagls' in src or 'newTagls' in src: raise SystemExit('tag typo remains in Filter62')
          if 'fullRefreshDuplicateSuppressedCount' not in src: raise SystemExit('full refresh dedupe missing')
          if 'virtualBookkeepingAtomicClearCount' not in src: raise SystemExit('atomic clear metric missing')
          if 'String(performance.lastRefreshOrigin || "") === "panel_first_content"' not in src: raise SystemExit('dedupe scope missing')
          if 'String(scrollPerformanceState.fullRefreshLastAppliedDataKey || "")' not in src: raise SystemExit('applied data key guard missing')
          if 'VIRTUAL_BEFORE_SCREENS = 3' not in src or 'VIRTUAL_AFTER_SCREENS = 5' not in src or 'VIRTUAL_UPDATE_DELAY_MS = 24' not in src: raise SystemExit('virtual constants changed')
          if src.count('.newSingleThreadExecutor();')!=1: raise SystemExit('worker invariant changed')
          if re.search(r'(^|[^A-Za-z0-9_])(let|const|class)[\s]+|=>',src): raise SystemExit('non-ES5 syntax in Filter62')
          subprocess.check_call(['node','--check','/tmp/filter62.js'])
          subprocess.check_call(['node','--check',str(loader_path)])

          # Update manifest only after all validation succeeds.
          data=loader_path.read_bytes()
          header=('blob %d\0' % len(data)).encode()
          blob_sha=hashlib.sha1(header+data).hexdigest()
          manifest['moduleSetVersion']='20260808.16'
          found=False
          for mod in manifest.get('modules',[]):
              if mod.get('name')=='ch_11_filter.js':
                  mod['sha']=blob_sha; found=True
          if not found: raise SystemExit('filter manifest entry missing')
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Filter62 blob',blob_sha)
          PY
      - name: Commit Stage16B3 atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/stage16b3-diag-trigger.txt .github/stage16b3-fix-trigger.txt
          rm -f .github/workflows/beta_stage16b3_diag.yml .github/workflows/beta_stage16b3_fix.yml
          rm -f stage16b3_diag.txt
          git add -A
          git diff --cached --check
          git commit -m "修复 Beta 虚拟列表清理并抑制重复完整刷新"
          git push
