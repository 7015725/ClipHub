name: apply-active-regex-source-fix
on:
  push:
    branches: [beta-regex-filter-20260813]
    paths:
      - '.github/workflows/apply-active-regex-source-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-regex-filter-20260813
          fetch-depth: 0
      - name: Patch active regex criteria refresh
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, re

          ROOT = pathlib.Path('.')
          FILTER = ROOT / 'src/ch_11_filter.js'

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError('%s: expected 1 anchor, got %d' % (label, count))
              return text.replace(old, new, 1)

          def git_blob_sha_text(text):
              raw = text.encode('utf-8')
              return hashlib.sha1(('blob %d\0' % len(raw)).encode('utf-8') + raw).hexdigest()

          loader = FILTER.read_text(encoding='utf-8')
          m = re.search(r'\bvar\s+(PACKED_B64|encoded)\s*=\s*(.*?);', loader, re.S)
          if not m:
              raise RuntimeError('packed filter assignment missing')
          pieces = re.findall(r'"(?:\\.|[^"\\])*"', m.group(2))
          encoded = ''.join(json.loads(piece) for piece in pieces)
          canonical = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')

          old = '''        if (options.apply === false || !ready) {
              return copyValue(value);
          }
          if (mutationRefreshPlan !== null &&'''
          new = '''        if (options.apply === false || !ready) {
              return copyValue(value);
          }
          if (regexActive()) {
              cancelMutationRefresh("regex_criteria_apply");
              startRegexScan({
                  origin: options.origin || "criteria",
                  fromEvent: options.fromEvent === true
              });
              return copyValue(value);
          }
          if (mutationRefreshPlan !== null &&'''
          canonical = replace_once(canonical, old, new,
                                   'active regex criteria route')
          canonical = replace_once(canonical,
                                   'MODULE_VERSION: 75',
                                   'MODULE_VERSION: 76',
                                   'filter module version')

          raw = gzip.compress(canonical.encode('utf-8'), compresslevel=9, mtime=0)
          enc = base64.b64encode(raw).decode('ascii')
          chunks = [enc[i:i+120] for i in range(0, len(enc), 120)]
          expression = '\n        ' + ' +\n        '.join(json.dumps(x) for x in chunks) + '\n    '
          pattern = re.compile(r'(\bvar\s+' + re.escape(m.group(1)) + r'\s*=\s*)(.*?)(;)', re.S)
          mm = pattern.search(loader)
          if not mm:
              raise RuntimeError('cannot repack filter')
          loader = loader[:mm.start(2)] + expression + loader[mm.end(2):]
          source_sha = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          loader, count = re.subn(
              r'(\bvar\s+SOURCE_SHA256\s*=\s*[\"\'])[0-9a-fA-F]{64}([\"\'])',
              lambda x: x.group(1) + source_sha + x.group(2), loader, count=1)
          if count != 1:
              raise RuntimeError('SOURCE_SHA256 update failed')
          loader = '\n'.join(line.rstrip() for line in loader.splitlines()) + '\n'
          FILTER.write_text(loader, encoding='utf-8')

          # Keep the reproducible beta generator aligned with the production fix.
          gen_path = ROOT / 'tools/apply_regex_filter_beta.py'
          gen = gen_path.read_text(encoding='utf-8')
          gen = replace_once(gen, 'MODULE_SET = "20260813.03"',
                             'MODULE_SET = "20260813.04"', 'generator module set')
          gen = replace_once(gen,
              'canonical = replace_once(canonical, "MODULE_VERSION: 74",\n                             "MODULE_VERSION: 75", "filter version")',
              'canonical = replace_once(canonical, "MODULE_VERSION: 74",\n                             "MODULE_VERSION: 76", "filter version")',
              'generator filter version')
          anchor = '    canonical = finalize_filter_canonical(canonical)\n    repack_loader(path, loader, variable, canonical)'
          addition = '''    canonical = replace_once(
              canonical,
              ''' + "'''" + '''        if (options.apply === false || !ready) {
              return copyValue(value);
          }
          if (mutationRefreshPlan !== null &&''' + "'''" + ''',
              ''' + "'''" + '''        if (options.apply === false || !ready) {
              return copyValue(value);
          }
          if (regexActive()) {
              cancelMutationRefresh("regex_criteria_apply");
              startRegexScan({
                  origin: options.origin || "criteria",
                  fromEvent: options.fromEvent === true
              });
              return copyValue(value);
          }
          if (mutationRefreshPlan !== null &&''' + "'''" + ''',
              "filter active regex base criteria route",
          )
          canonical = finalize_filter_canonical(canonical)
          repack_loader(path, loader, variable, canonical)'''
          gen = replace_once(gen, anchor, addition, 'generator active regex patch')
          gen = gen.replace("EXPECTED_MODULE_SET='20260813.03'", "EXPECTED_MODULE_SET='20260813.04'")
          gen = gen.replace('"ch_11_filter.js": ("ch_11_filter", 75)',
                            '"ch_11_filter.js": ("ch_11_filter", 76)')
          gen_path.write_text(gen, encoding='utf-8')

          # Formal manifest stays schema v2 / 15 modules; only module set and hashes change.
          manifest_path = ROOT / 'module-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('sourceRef') != 'beta-regex-filter-20260813':
              raise RuntimeError('unexpected sourceRef')
          if len(manifest.get('modules', [])) != 15:
              raise RuntimeError('unexpected module count')
          manifest['moduleSetVersion'] = '20260813.04'
          for item in manifest['modules']:
              p = ROOT / str(item['path'])
              item['sha'] = git_blob_sha_text(p.read_text(encoding='utf-8'))
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          preflight_path = ROOT / 'scripts/release_preflight.sh'
          preflight = preflight_path.read_text(encoding='utf-8')
          preflight = replace_once(preflight,
                                   "EXPECTED_MODULE_SET='20260813.03'",
                                   "EXPECTED_MODULE_SET='20260813.04'",
                                   'preflight module set')
          preflight = replace_once(preflight,
                                   '"ch_11_filter.js": ("ch_11_filter", 75)',
                                   '"ch_11_filter.js": ("ch_11_filter", 76)',
                                   'preflight filter version')
          preflight_path.write_text(preflight, encoding='utf-8')

          # Static postconditions.
          check = FILTER.read_text(encoding='utf-8')
          mm = re.search(r'\bvar\s+(PACKED_B64|encoded)\s*=\s*(.*?);', check, re.S)
          pieces = re.findall(r'"(?:\\.|[^"\\])*"', mm.group(2))
          expanded = gzip.decompress(base64.b64decode(''.join(json.loads(x) for x in pieces))).decode('utf-8')
          assert 'MODULE_NAME: "ch_11_filter", MODULE_VERSION: 76' in expanded
          assert 'cancelMutationRefresh("regex_criteria_apply")' in expanded
          assert 'startRegexScan({' in expanded
          assert 'var SCHEMA_VERSION = 2;' in (ROOT / 'src/ch_03_database.js').read_text(encoding='utf-8')
          print('patched filter v76 / moduleSet 20260813.04')
          PY
      - name: Run regex beta preflight
        run: bash scripts/release_preflight.sh --regex-beta
      - name: Commit fix and remove temporary workflows
        run: |
          rm -f .github/workflows/apply-active-regex-source-fix.yml
          rm -f .github/workflows/inspect-regex-ui-beta.yml
          rm -f .github/workflows/inspect-regex-ui-beta-2.yml
          git config user.name '7015725'
          git config user.email '62368672+7015725@users.noreply.github.com'
          git add src/ch_11_filter.js tools/apply_regex_filter_beta.py module-manifest.json scripts/release_preflight.sh .github/workflows
          git commit -m 'fix active regex source refresh'
          git push origin HEAD:beta-regex-filter-20260813
