name: Stage4 Detail Migration Once

on:
  push:
    branches:
      - beta-regex-settings-tabs-20260814
    paths:
      - tools/stage4_detail_migration_20260815.py
      - tools/stage4_detail_migration_retry.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply Stage4 Detail migration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage4_detail_migration_20260815.py
          rm -f .github/workflows/ui_shell_stage4_probe_once.yml
          rm -f tools/stage4_detail_migration_retry.trigger

      - name: Validate Rhino ES5 and release contracts
        run: bash scripts/release_preflight.sh --settings-tabs-beta

      - name: Validate Stage4 boundaries
        shell: bash
        run: |
          set -euo pipefail
          BASE=2719739e6ccc809b59ba7555dc01e7f73f610742
          expected=$(printf '%s\n' \
            module-manifest.json \
            scripts/release_preflight.sh \
            src/ch_09_list.js \
            src/ch_16_ui_shell.js | sort)
          actual=$(git diff --name-only "$BASE" | sort)
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          for path in \
            src/ch_03_database.js \
            src/ch_06_repository.js \
            src/ch_07_theme.js \
            src/ch_08_window.js \
            src/ch_10_editor.js \
            src/ch_11_filter.js \
            src/ch_12_translation.js \
            src/ch_13_settings.js \
            src/ch_15_app.js \
            src/ch_17_tokenizer_ui.js; do
            git diff --quiet "$BASE" -- "$path"
          done
          test ! -e .github/workflows/ui_shell_stage4_probe_once.yml
          test ! -e tools/stage4_runtime_probe_20260815.py
          test ! -e .github/workflows/stage4_detail_migration_once.yml
          test ! -e tools/stage4_detail_migration_20260815.py
          test ! -e tools/stage4_detail_migration_retry.trigger
          grep -q 'MODULE_VERSION: 22' src/ch_09_list.js
          grep -q 'MODULE_VERSION: 4' src/ch_16_ui_shell.js
          grep -q 'ClipHub.UIShell.canEmbed("detail")' src/ch_09_list.js
          grep -q 'ClipHub.UIShell.mountPage("detail"' src/ch_09_list.js
          grep -q 'TYPE_APPLICATION_OVERLAY' src/ch_09_list.js
          grep -q 'legacySurface: "detail", shellReady: true' src/ch_16_ui_shell.js
          grep -q '"moduleSetVersion": "20260815.15"' module-manifest.json
          echo 'Stage4 boundary validation: passed'

      - name: Commit and push final Stage4 tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "Stage4迁移Detail到PrimaryWindow"
          git push origin HEAD:beta-regex-settings-tabs-20260814
