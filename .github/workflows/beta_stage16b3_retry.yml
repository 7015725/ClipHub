name: Beta Stage16B3 Retry
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/stage16b3-retry-trigger.txt
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute corrected Stage16B3 builder
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          text=pathlib.Path('.github/workflows/beta_stage16b3_fix.yml').read_text(encoding='utf-8')
          start_marker='      - name: Build Filter62\n        shell: bash\n        run: |\n'
          end_marker='      - name: Commit Stage16B3 atomically\n'
          body=text.split(start_marker,1)[1].split(end_marker,1)[0]
          lines=[]
          for line in body.splitlines():
              if line.startswith('          '): line=line[10:]
              lines.append(line)
          script='\n'.join(lines)+'\n'
          bad="          if patch.count('oldTagls')!=0: raise SystemExit('oldTagls regression present')\n"
          bad2="if patch.count('oldTagls')!=0: raise SystemExit('oldTagls regression present')\n"
          if bad in script:
              script=script.replace(bad,'',1)
          elif bad2 in script:
              script=script.replace(bad2,'',1)
          else:
              raise SystemExit('oldTagls preflight line missing')
          pathlib.Path('/tmp/stage16b3_retry.sh').write_text(script,encoding='utf-8')
          PY
          set +e
          bash /tmp/stage16b3_retry.sh > /tmp/stage16b3_retry.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            cp /tmp/stage16b3_retry.log stage16b3_fix_debug.txt
            printf '\nEXIT_CODE=%s\n' "$rc" >> stage16b3_fix_debug.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add stage16b3_fix_debug.txt
            git commit -m "更新 Stage16B.3 构建失败诊断"
            git push
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/stage16b3-diag-trigger.txt .github/stage16b3-fix-trigger.txt .github/stage16b3-debug-trigger.txt .github/stage16b3-retry-trigger.txt
          rm -f .github/workflows/beta_stage16b3_diag.yml .github/workflows/beta_stage16b3_fix.yml .github/workflows/beta_stage16b3_debug.yml .github/workflows/beta_stage16b3_retry.yml
          rm -f stage16b3_diag.txt stage16b3_fix_debug.txt
          git add -A
          git diff --cached --check
          git commit -m "修复 Beta 虚拟列表清理并抑制重复完整刷新"
          git push
