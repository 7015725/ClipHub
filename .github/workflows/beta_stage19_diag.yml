name: Beta Stage19 Diagnostic
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/stage19_diag_trigger.txt
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract Filter68 Stage19 anchors
        shell: bash
        run: |
          set -euo pipefail
          python stage19_diag.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage19_*.txt
          git commit -m "记录 Stage19 keyed 与 AJAX fallback 诊断"
          git push
