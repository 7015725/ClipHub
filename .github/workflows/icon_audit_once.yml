name: Icon Audit Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/icon_audit_once.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
      - name: Build precise icon source report
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, re
          from pathlib import Path

          def unpack(path):
              text = Path(path).read_text(encoding='utf-8')
              m = re.search(r'var\s+(PACKED_[A-Z0-9_]+)\s*=\s*"([A-Za-z0-9+/=]+)";', text)
              if not m:
                  return text
              raw = gzip.decompress(base64.b64decode(m.group(2))).decode('utf-8')
              sm = re.search(r'var\s+SOURCE_SHA256\s*=\s*"([0-9a-f]{64})";', text)
              if sm:
                  assert hashlib.sha256(raw.encode('utf-8')).hexdigest() == sm.group(1)
              return raw

          paths = [
              'src/ch_09_list.js', 'src/ch_10_editor.js', 'src/ch_11_filter.js',
              'src/ch_12_translation.js', 'src/ch_13_settings.js', 'src/ch_17_tokenizer_ui.js'
          ]
          glyphs = ['×','‹','›','✓','✔','✕','✖','＋','+','−','▣','?','⚙','🔍','⌕','⋮','…','☰','✎','✏','🗑','📋','⧉','←','→','▲','▼','●','○','⌗','↵','⇩','◇']
          report = []
          for path in paths:
              src = unpack(path)
              lines = src.splitlines()
              hits = set()
              for i, line in enumerate(lines):
                  low = line.lower()
                  if any(g in line for g in glyphs): hits.add(i)
                  if ('function ' in line and any(k in low for k in ['icon','header','action'])): hits.add(i)
                  if any(k in line for k in ['makeIcon(', 'makeHeaderAction(', 'makeEditorHeaderAction(', 'setCompoundDrawables', 'setText("×"', 'setText("‹"']): hits.add(i)
              ranges = []
              for i in sorted(hits):
                  a=max(0,i-4); b=min(len(lines),i+7)
                  if ranges and a <= ranges[-1][1]+1: ranges[-1]=(ranges[-1][0],max(ranges[-1][1],b))
                  else: ranges.append((a,b))
              report.append('\n===== %s =====\n' % path)
              for a,b in ranges:
                  for j in range(a,b): report.append('%5d | %s\n' % (j+1, lines[j]))
                  report.append('-----\n')
          Path('.github/icon_probe_report.txt').write_text(''.join(report), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/icon_probe_report.txt
          git commit -m '临时记录Icon源码上下文'
          git push
