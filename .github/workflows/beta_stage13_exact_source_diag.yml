name: Beta Stage13 Exact Source Diag
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/workflows/beta_stage13_exact_source_diag.yml
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact source boundaries
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,glob,pathlib,hashlib
          parts=sorted(glob.glob('stage-assets/pagination-stage9/ch11_full_v8s_*.b64'))
          packed=''.join(pathlib.Path(p).read_text(encoding='utf-8').strip() for p in parts)
          src=gzip.decompress(base64.b64decode(packed)).decode('utf-8')
          if hashlib.sha256(src.encode()).hexdigest()!='90847cd5694f436d93305c5d1b14d0564de29a3cf522c5ecb89f5224c9c5e669':
              raise SystemExit('source sha mismatch')
          out=[]
          for label,needle,size in [
              ('SCHEDULE','    function scheduleVirtualUpdate(origin, force) {',3200),
              ('REBUILD_FALLBACK','            scrollPerformanceState.removedViewCount += oldCount;',2600),
              ('SOURCE_ICON','    function makeSourceIcon(row, colors) {',1800)]:
              pos=src.index(needle)
              out.append('===== '+label+' @ '+str(pos)+' =====\n')
              out.append(src[pos:pos+size])
              out.append('\n\n')
          pathlib.Path('stage13_exact_source_diag.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/beta_stage13_exact_source_diag.yml
          git add stage13_exact_source_diag.txt
          git commit -m "记录 Stage13 精确源码边界"
          git push
