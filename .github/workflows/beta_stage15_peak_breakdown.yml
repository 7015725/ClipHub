name: Beta Stage15 Peak Breakdown
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/workflows/beta_stage15_peak_breakdown.yml
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Filter 57 peak diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,glob,hashlib,json,pathlib,re,math
          root=pathlib.Path('.')
          loader_path=root/'src/ch_11_filter.js'
          loader=loader_path.read_text(encoding='utf-8')
          parts=sorted(glob.glob('stage-assets/pagination-stage9/ch11_full_v8s_*.b64'))
          if len(parts)!=8: raise SystemExit('expected 8 packed parts')
          packed=''.join(pathlib.Path(p).read_text(encoding='utf-8').strip() for p in parts)
          src=gzip.decompress(base64.b64decode(packed)).decode('utf-8')
          expected='328608b7fa357c9262079f43289d692ea7ddf79d9416e6135023d55f4bff6940'
          if hashlib.sha256(src.encode()).hexdigest()!=expected: raise SystemExit('Filter56 source sha mismatch')
          if src.count('MODULE_VERSION: 56')!=1: raise SystemExit('expected Filter56')
          src=src.replace('MODULE_VERSION: 56','MODULE_VERSION: 57',1)

          # Metrics state: diagnostic-only, no behavior changes.
          anchor='''        measureMaxMs: 0\n'''
          repl='''        measureMaxMs: 0,\n        signatureCallCount: 0,\n        signatureTotalMs: 0,\n        signatureMaxMs: 0,\n        keyedReconcileLastMs: 0,\n        keyedReconcileMaxMs: 0,\n        cardCreateCount: 0,\n        cardCreateTotalMs: 0,\n        cardCreateMaxMs: 0,\n        slowRebuildCount: 0,\n        slowRebuildSamples: []\n'''
          if src.count(anchor)!=1: raise SystemExit('metric state anchor mismatch')
          src=src.replace(anchor,repl,1)

          anchor='''        scrollPerformanceState.measureMaxMs = 0;\n'''
          repl='''        scrollPerformanceState.measureMaxMs = 0;\n        scrollPerformanceState.signatureCallCount = 0;\n        scrollPerformanceState.signatureTotalMs = 0;\n        scrollPerformanceState.signatureMaxMs = 0;\n        scrollPerformanceState.keyedReconcileLastMs = 0;\n        scrollPerformanceState.keyedReconcileMaxMs = 0;\n        scrollPerformanceState.cardCreateCount = 0;\n        scrollPerformanceState.cardCreateTotalMs = 0;\n        scrollPerformanceState.cardCreateMaxMs = 0;\n        scrollPerformanceState.slowRebuildCount = 0;\n        scrollPerformanceState.slowRebuildSamples = [];\n'''
          if src.count(anchor)!=1: raise SystemExit('metric reset anchor mismatch')
          src=src.replace(anchor,repl,1)

          anchor='''            measureMaxMs:\n                Number(scrollPerformanceState.measureMaxMs),\n            pendingOrigin: virtualPendingOrigin,\n'''
          repl='''            measureMaxMs:\n                Number(scrollPerformanceState.measureMaxMs),\n            signatureCallCount:\n                Number(scrollPerformanceState.signatureCallCount),\n            signatureTotalMs:\n                Number(scrollPerformanceState.signatureTotalMs),\n            signatureMaxMs:\n                Number(scrollPerformanceState.signatureMaxMs),\n            keyedReconcileLastMs:\n                Number(scrollPerformanceState.keyedReconcileLastMs),\n            keyedReconcileMaxMs:\n                Number(scrollPerformanceState.keyedReconcileMaxMs),\n            cardCreateCount:\n                Number(scrollPerformanceState.cardCreateCount),\n            cardCreateTotalMs:\n                Number(scrollPerformanceState.cardCreateTotalMs),\n            cardCreateMaxMs:\n                Number(scrollPerformanceState.cardCreateMaxMs),\n            slowRebuildCount:\n                Number(scrollPerformanceState.slowRebuildCount),\n            slowRebuildSamples:\n                scrollPerformanceState.slowRebuildSamples.slice(0),\n            pendingOrigin: virtualPendingOrigin,\n'''
          if src.count(anchor)!=1: raise SystemExit('metric copy anchor mismatch')
          src=src.replace(anchor,repl,1)

          # Instrument render signature within its exact function boundary.
          sig_start=src.index('    function virtualRenderSignature(row, colors) {')
          sig_end=src.index('\n    function syncRenderedResultCounters(',sig_start)
          sig=src[sig_start:sig_end]
          if 'var signatureStartedAt' in sig: raise SystemExit('signature already instrumented')
          sig=sig.replace('    function virtualRenderSignature(row, colors) {\n',
              '    function virtualRenderSignature(row, colors) {\n        var signatureStartedAt = Number(System.nanoTime());\n        var signatureElapsed;\n        var signatureValue;\n',1)
          if '        return [\n' not in sig: raise SystemExit('signature return anchor missing')
          sig=sig.replace('        return [\n','        signatureValue = [\n',1)
          tail='''        ].join("\\u001f");\n    }\n'''
          if tail not in sig: raise SystemExit('signature tail mismatch')
          sig=sig.replace(tail,'''
        ].join("\\u001f");
        signatureElapsed = Math.max(0,
            (Number(System.nanoTime()) - signatureStartedAt) / 1000000);
        scrollPerformanceState.signatureCallCount += 1;
        scrollPerformanceState.signatureTotalMs += signatureElapsed;
        scrollPerformanceState.signatureMaxMs = Math.max(
            Number(scrollPerformanceState.signatureMaxMs),
            signatureElapsed);
        return signatureValue;
    }
''',1)
          src=src[:sig_start]+sig+src[sig_end:]

          # Instrument Card construction as one whole function; no listener/data changes.
          card_start=src.index('    function makeResultCard(row, colors) {')
          card_end=src.index('\n    function ',card_start+10)
          card=src[card_start:card_end]
          card=card.replace('    function makeResultCard(row, colors) {\n',
              '    function makeResultCard(row, colors) {\n        var cardCreateStartedAt = Number(System.nanoTime());\n        var cardCreateElapsed;\n',1)
          return_pos=card.rfind('        return wrapper;')
          if return_pos<0: raise SystemExit('card return wrapper missing')
          card=card[:return_pos]+'''        cardCreateElapsed = Math.max(0,
            (Number(System.nanoTime()) - cardCreateStartedAt) / 1000000);
        scrollPerformanceState.cardCreateCount += 1;
        scrollPerformanceState.cardCreateTotalMs += cardCreateElapsed;
        scrollPerformanceState.cardCreateMaxMs = Math.max(
            Number(scrollPerformanceState.cardCreateMaxMs),
            cardCreateElapsed);
        return wrapper;'''+card[return_pos+len('        return wrapper;'):]
          src=src[:card_start]+card+src[card_end:]

          # Instrument keyed reconcile total time.
          key_start=src.index('    function keyedReconcileVirtualWindow(range, colors) {')
          key_end=src.index('\n    function ',key_start+10)
          key=src[key_start:key_end]
          key=key.replace('    function keyedReconcileVirtualWindow(range, colors) {\n',
              '    function keyedReconcileVirtualWindow(range, colors) {\n        var keyedStartedAt = Number(System.nanoTime());\n        var keyedElapsed;\n',1)
          return_pos=key.rfind('        return true;')
          if return_pos<0: raise SystemExit('keyed return missing')
          key=key[:return_pos]+'''        keyedElapsed = Math.max(0,
            (Number(System.nanoTime()) - keyedStartedAt) / 1000000);
        scrollPerformanceState.keyedReconcileLastMs = keyedElapsed;
        scrollPerformanceState.keyedReconcileMaxMs = Math.max(
            Number(scrollPerformanceState.keyedReconcileMaxMs),
            keyedElapsed);
        return true;'''+key[return_pos+len('        return true;'):]
          src=src[:key_start]+key+src[key_end:]

          # Slow rebuild samples. Use deltas so each sample describes only that rebuild.
          rebuild_start=src.index('    function rebuildVirtualWindow(origin, force, preferredIndex) {')
          rebuild_end=src.index('\n    function scheduleVirtualUpdate(',rebuild_start)
          rb=src[rebuild_start:rebuild_end]
          decl='''        var recycledCount;\n'''
          repl='''        var recycledCount;\n        var rebuildCreatedBefore;\n        var rebuildRemovedBefore;\n        var rebuildReusedBefore;\n        var rebuildSignatureBefore;\n        var rebuildCardCreateBefore;\n'''
          if rb.count(decl)!=1: raise SystemExit('rebuild decl anchor mismatch')
          rb=rb.replace(decl,repl,1)
          start_anchor='''        var viewRebuildStartedAt =\n            Number(System.currentTimeMillis());\n'''
          start_repl='''        var viewRebuildStartedAt =\n            Number(System.currentTimeMillis());\n        rebuildCreatedBefore = Number(scrollPerformanceState.createdViewCount);\n        rebuildRemovedBefore = Number(scrollPerformanceState.removedViewCount);\n        rebuildReusedBefore = Number(scrollPerformanceState.sameIdReuseCount);\n        rebuildSignatureBefore = Number(scrollPerformanceState.signatureTotalMs);\n        rebuildCardCreateBefore = Number(scrollPerformanceState.cardCreateTotalMs);\n'''
          if rb.count(start_anchor)!=1: raise SystemExit('rebuild timer anchor mismatch')
          rb=rb.replace(start_anchor,start_repl,1)
          elapsed_anchor='''        scrollPerformanceState.viewRebuildMaxMs = Math.max(\n            Number(scrollPerformanceState.viewRebuildMaxMs),\n            viewRebuildElapsed);\n'''
          elapsed_repl='''        scrollPerformanceState.viewRebuildMaxMs = Math.max(\n            Number(scrollPerformanceState.viewRebuildMaxMs),\n            viewRebuildElapsed);\n        if (viewRebuildElapsed > 32) {\n            scrollPerformanceState.slowRebuildCount += 1;\n            scrollPerformanceState.slowRebuildSamples.push({\n                origin: String(origin || "virtual_rebuild"),\n                force: force === true,\n                elapsedMs: viewRebuildElapsed,\n                rangeStart: Number(range.start),\n                rangeEnd: Number(range.end),\n                oldCount: oldCount,\n                newCount: Number(virtualCardHost.getChildCount()),\n                created: Number(scrollPerformanceState.createdViewCount) -\n                    rebuildCreatedBefore,\n                removed: Number(scrollPerformanceState.removedViewCount) -\n                    rebuildRemovedBefore,\n                reused: Number(scrollPerformanceState.sameIdReuseCount) -\n                    rebuildReusedBefore,\n                signatureMs: Number(scrollPerformanceState.signatureTotalMs) -\n                    rebuildSignatureBefore,\n                cardCreateMs: Number(scrollPerformanceState.cardCreateTotalMs) -\n                    rebuildCardCreateBefore,\n                keyedLastMs: Number(scrollPerformanceState.keyedReconcileLastMs)\n            });\n            while (scrollPerformanceState.slowRebuildSamples.length > 8) {\n                scrollPerformanceState.slowRebuildSamples.shift();\n            }\n        }\n'''
          if rb.count(elapsed_anchor)!=1: raise SystemExit('rebuild elapsed anchor mismatch')
          rb=rb.replace(elapsed_anchor,elapsed_repl,1)
          src=src[:rebuild_start]+rb+src[rebuild_end:]

          # Frozen boundaries and safety invariants.
          for token in [
              'var VIRTUAL_BEFORE_SCREENS = 3;',
              'var VIRTUAL_AFTER_SCREENS = 5;',
              'var VIRTUAL_UPDATE_DELAY_MS = 24;',
              'function keyedReconcileVirtualWindow(range, colors)',
              'sameRangeNoLayoutCount',
              'spacerNoopCount',
              'anchorScrollNoopCount']:
              if token not in src: raise SystemExit('missing invariant '+token)
          if src.count('.newSingleThreadExecutor();')!=1: raise SystemExit('executor count changed')
          if 'resultTagBadgeViews' in src or 'refreshRenderedTagBadges' in src:
              raise SystemExit('unsafe Filter53 refs reintroduced')

          source_sha=hashlib.sha256(src.encode()).hexdigest()
          gz=gzip.compress(src.encode('utf-8'),compresslevel=9,mtime=0)
          b64=base64.b64encode(gz).decode('ascii')
          packed_sha=hashlib.sha256(b64.encode()).hexdigest()
          chunk=math.ceil(len(b64)/8)
          for i,p in enumerate(parts):
              pathlib.Path(p).write_text(b64[i*chunk:(i+1)*chunk]+'\n',encoding='utf-8')

          old_header='/* ClipHub Stage 14 no-op layout optimized ES5 loader. */'
          if loader.count(old_header)!=1: raise SystemExit('loader header mismatch')
          loader=loader.replace(old_header,
              '/* ClipHub Stage 15 rebuild peak diagnostics ES5 loader. */',1)
          loader,n=re.subn(r'(    var PACKED_SHA256 =\s*\n\s*")[0-9a-f]+(";)',r'\g<1>'+packed_sha+r'\2',loader,count=1)
          if n!=1: raise SystemExit('packed sha replacement failed')
          loader,n=re.subn(r'(    var SOURCE_SHA256 =\s*\n\s*")[0-9a-f]+(";)',r'\g<1>'+source_sha+r'\2',loader,count=1)
          if n!=1: raise SystemExit('source sha replacement failed')
          loader,n=re.subn(r'    var CACHE_NAME = "[^"]+";',
              '    var CACHE_NAME = "ch_11_filter_stage15_v11_peak_diag_full.b64";',loader,count=1)
          if n!=1: raise SystemExit('cache replacement failed')
          if '?stage14v10=' not in loader: raise SystemExit('loader query anchor missing')
          loader=loader.replace('?stage14v10=','?stage15v11=',1)
          loader_path.write_text(loader,encoding='utf-8')

          def blob_sha(path):
              data=pathlib.Path(path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          mp=root/'module-manifest.json'
          manifest=json.loads(mp.read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion')!='20260808.10': raise SystemExit('expected .10 baseline')
          if manifest.get('sourceRef')!='beta-pagination-stage10-20260808': raise SystemExit('wrong sourceRef')
          manifest['moduleSetVersion']='20260808.11'
          found=False
          for m in manifest['modules']:
              if m['name']=='ch_11_filter.js':
                  m['sha']=blob_sha(loader_path); found=True
          if not found: raise SystemExit('filter manifest entry missing')
          mp.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          pathlib.Path('/tmp/filter57.js').write_text(src,encoding='utf-8')
          print('source_sha='+source_sha)
          print('packed_sha='+packed_sha)
          print('loader_blob='+blob_sha(loader_path))
          PY
          node --check /tmp/filter57.js
          node --check src/ch_11_filter.js
          ! grep -Eq '(^|[^A-Za-z0-9_])(let|const|class)[[:space:]]|=>' /tmp/filter57.js
          grep -Fq 'MODULE_VERSION: 57' /tmp/filter57.js
          grep -Fq 'slowRebuildSamples' /tmp/filter57.js
          grep -Fq 'signatureTotalMs' /tmp/filter57.js
          grep -Fq 'cardCreateTotalMs' /tmp/filter57.js
          grep -Fq 'keyedReconcileMaxMs' /tmp/filter57.js
          grep -Fq '"moduleSetVersion": "20260808.11"' module-manifest.json
          git diff --check
      - name: Commit Filter 57
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/beta_stage15_peak_breakdown.yml
          git add src/ch_11_filter.js module-manifest.json stage-assets/pagination-stage9/ch11_full_v8s_*.b64
          git diff --cached --check
          git commit -m "增加 Beta 重建峰值分段诊断"
          git push
