name: Header Alignment Implementation

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/settings_header_diag.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded header alignment patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, re

          root = pathlib.Path('.')
          manifest_path = root / 'module-manifest.json'
          editor_path = root / 'src/ch_10_editor.js'
          translation_path = root / 'src/ch_12_translation.js'
          settings_path = root / 'src/ch_13_settings.js'

          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit('%s anchor count=%d' % (label, count))
              return text.replace(old, new, 1)

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion') != '20260815.03':
              raise SystemExit('unexpected moduleSetVersion=' + str(manifest.get('moduleSetVersion')))
          if manifest.get('sourceRef') != 'beta-regex-settings-tabs-20260814':
              raise SystemExit('unexpected sourceRef')
          by_path = {item['path']: item for item in manifest['modules']}
          for rel in ['src/ch_10_editor.js', 'src/ch_12_translation.js', 'src/ch_13_settings.js']:
              actual = blob_sha((root / rel).read_bytes())
              if by_path[rel]['sha'] != actual:
                  raise SystemExit('baseline manifest mismatch ' + rel)

          # Editor: keep the main title exactly where it is. Move only the close control
          # upward by 3dp so its visual center matches the home header action row.
          editor = editor_path.read_text(encoding='utf-8')
          editor = replace_once(editor,
              '        header.setOrientation(LinearLayout.HORIZONTAL);\n        header.setGravity(Gravity.CENTER_VERTICAL);\n        titleStack.setOrientation(LinearLayout.VERTICAL);',
              '        header.setOrientation(LinearLayout.HORIZONTAL);\n        header.setGravity(Gravity.CENTER_VERTICAL);\n        header.setClipChildren(false);\n        titleStack.setOrientation(LinearLayout.VERTICAL);',
              'editor header clip')
          editor = replace_once(editor,
              '        headerCloseView.setGravity(Gravity.CENTER);\n        headerCloseView.setContentDescription("关闭编辑窗口");',
              '        headerCloseView.setGravity(Gravity.CENTER);\n        headerCloseView.setTranslationY(-dp(3));\n        headerCloseView.setContentDescription("关闭编辑窗口");',
              'editor close vertical alignment')
          m = re.search(r'MODULE_NAME:\s*"ch_10_editor",\s*\n\s*MODULE_VERSION:\s*(\d+),', editor)
          if not m or int(m.group(1)) != 26:
              raise SystemExit('unexpected editor module version')
          editor = editor[:m.start(1)] + '27' + editor[m.end(1):]
          editor_path.write_text(editor, encoding='utf-8')

          # Translation: title and close button are a single-line header. Shift the
          # entire header box up 4dp; do not touch provider/result/action handlers.
          translation = translation_path.read_text(encoding='utf-8')
          translation = replace_once(translation,
              '        params = new LinearLayout.LayoutParams(\n            LinearLayout.LayoutParams.MATCH_PARENT, dp(36));\n        params.bottomMargin = dp(6);\n        root.addView(header, params);',
              '        params = new LinearLayout.LayoutParams(\n            LinearLayout.LayoutParams.MATCH_PARENT, dp(36));\n        params.topMargin = -dp(4);\n        params.bottomMargin = dp(6);\n        root.addView(header, params);',
              'translation header vertical alignment')
          m = re.search(r'MODULE_NAME:\s*"ch_12_translation",\s*\n\s*MODULE_VERSION:\s*(\d+),', translation)
          if not m or int(m.group(1)) != 15:
              raise SystemExit('unexpected translation module version')
          translation = translation[:m.start(1)] + '16' + translation[m.end(1):]
          translation_path.write_text(translation, encoding='utf-8')

          # Settings is packed. Verify current source SHA, patch only buildRootPage's
          # title/header geometry, bump the module version, then repack with integrity.
          loader = settings_path.read_text(encoding='utf-8')
          expected = re.search(r'var\s+SOURCE_SHA256\s*=\s*"([0-9a-f]+)";', loader)
          assignment = re.search(r'var\s+PACKED_B64\s*=\s*(.*?);\s*\n\s*function\s+bytesToHex', loader, re.S)
          if not expected or not assignment:
              raise SystemExit('settings packed loader contract missing')
          pieces = re.findall(r'"(?:\\.|[^"\\])*"', assignment.group(1))
          encoded = ''.join(json.loads(piece) for piece in pieces)
          source = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          source_sha = hashlib.sha256(source.encode('utf-8')).hexdigest()
          if source_sha != expected.group(1):
              raise SystemExit('settings source SHA mismatch')

          source = replace_once(source,
              '        var title = makeText("ClipHub 设置", 18, colors.textPrimary, true);',
              '        var title = makeText("ClipHub 设置", 17, colors.textPrimary, true);',
              'settings root title size')
          source = replace_once(source,
              '        header.addView(closeView, new LinearLayout.LayoutParams(dp(38), dp(38)));\n        params = new LinearLayout.LayoutParams(\n            LinearLayout.LayoutParams.MATCH_PARENT, dp(42));\n        params.bottomMargin = dp(8);\n        content.addView(header, params);',
              '        header.addView(closeView, new LinearLayout.LayoutParams(dp(36), dp(36)));\n        params = new LinearLayout.LayoutParams(\n            LinearLayout.LayoutParams.MATCH_PARENT, dp(36));\n        params.topMargin = -dp(2);\n        params.bottomMargin = dp(8);\n        content.addView(header, params);',
              'settings root header geometry')
          m = re.search(r'MODULE_NAME:\s*"ch_13_settings",\s*\n\s*MODULE_VERSION:\s*(\d+),', source)
          if not m or int(m.group(1)) != 27:
              raise SystemExit('unexpected settings module version')
          source = source[:m.start(1)] + '28' + source[m.end(1):]

          new_source_sha = hashlib.sha256(source.encode('utf-8')).hexdigest()
          packed = gzip.compress(source.encode('utf-8'), compresslevel=9, mtime=0)
          b64 = base64.b64encode(packed).decode('ascii')
          chunks = [b64[i:i + 120] for i in range(0, len(b64), 120)]
          new_assignment = 'var PACKED_B64 =\n' + ' +\n'.join('        ' + json.dumps(c) for c in chunks) + '\n    ;'
          loader = re.sub(r'var\s+SOURCE_SHA256\s*=\s*"[0-9a-f]+";',
                          'var SOURCE_SHA256 = "%s";' % new_source_sha,
                          loader, count=1)
          loader, count = re.subn(r'var\s+PACKED_B64\s*=\s*.*?;\s*\n(?=\s*function\s+bytesToHex)',
                                  new_assignment + '\n\n', loader, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('settings packed assignment replacement failed')
          loader = loader.replace('Settings27 source SHA mismatch', 'Settings28 source SHA mismatch', 1)
          settings_path.write_text(loader, encoding='utf-8')
          pathlib.Path('/tmp/settings_header_source.js').write_text(source, encoding='utf-8')

          manifest['moduleSetVersion'] = '20260815.04'
          for item in manifest['modules']:
              if item['path'] in ('src/ch_10_editor.js', 'src/ch_12_translation.js', 'src/ch_13_settings.js'):
                  item['sha'] = blob_sha((root / item['path']).read_bytes())
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print('moduleSetVersion=20260815.04')
          print('settings_source_sha256=' + new_source_sha)
          PY

      - name: Validate syntax integrity and boundaries
        shell: bash
        run: |
          set -euo pipefail
          node --check src/ch_10_editor.js
          node --check src/ch_12_translation.js
          node --check src/ch_13_settings.js
          node --check /tmp/settings_header_source.js
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict | tee /tmp/header-color.txt
          grep '^HIGH=0 WARN=0 ' /tmp/header-color.txt
          git diff --check

          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, re, subprocess
          root = pathlib.Path('.')
          manifest = json.loads((root / 'module-manifest.json').read_text(encoding='utf-8'))
          assert manifest.get('schemaVersion') == 1
          assert manifest.get('moduleSetVersion') == '20260815.04'
          assert manifest.get('entryMinVersion') == 6
          assert manifest.get('sourceRef') == 'beta-regex-settings-tabs-20260814'
          assert len(manifest.get('modules', [])) == 16

          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          for item in manifest['modules']:
              path = root / item['path']
              assert path.is_file(), path
              assert blob_sha(path.read_bytes()) == item['sha'], item['name']

          loader = (root / 'src/ch_13_settings.js').read_text(encoding='utf-8')
          expected = re.search(r'var\s+SOURCE_SHA256\s*=\s*"([0-9a-f]+)";', loader)
          assignment = re.search(r'var\s+PACKED_B64\s*=\s*(.*?);\s*\n\s*function\s+bytesToHex', loader, re.S)
          assert expected and assignment
          pieces = re.findall(r'"(?:\\.|[^"\\])*"', assignment.group(1))
          encoded = ''.join(json.loads(piece) for piece in pieces)
          source = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          assert hashlib.sha256(source.encode('utf-8')).hexdigest() == expected.group(1)

          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == {
              'module-manifest.json',
              'src/ch_10_editor.js',
              'src/ch_12_translation.js',
              'src/ch_13_settings.js',
          }, changed
          print('manifest_integrity_and_change_boundary=passed')
          PY

          test -z "$(git diff -- src/ch_03_database.js src/ch_06_repository.js src/ch_07_theme.js src/ch_08_window.js src/ch_11_filter.js src/ch_15_app.js src/ch_17_tokenizer_ui.js)"
          grep -Fq 'MODULE_VERSION: 27' src/ch_10_editor.js
          grep -Fq 'headerCloseView.setTranslationY(-dp(3));' src/ch_10_editor.js
          grep -Fq 'requestExit("cancel_button")' src/ch_10_editor.js
          grep -Fq 'MODULE_VERSION: 16' src/ch_12_translation.js
          grep -Fq 'params.topMargin = -dp(4);' src/ch_12_translation.js
          grep -Fq 'closeTranslationPanel("button")' src/ch_12_translation.js
          grep -Fq 'MODULE_VERSION: 28' /tmp/settings_header_source.js
          grep -Fq 'var title = makeText("ClipHub 设置", 17' /tmp/settings_header_source.js
          grep -Fq 'new LinearLayout.LayoutParams(dp(36), dp(36))' /tmp/settings_header_source.js
          grep -Fq 'params.topMargin = -dp(2);' /tmp/settings_header_source.js
          grep -Fq 'closePage("button")' /tmp/settings_header_source.js

      - name: Commit verified header alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/settings_header_diag.yml
          git add module-manifest.json src/ch_10_editor.js src/ch_12_translation.js src/ch_13_settings.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m "统一顶部标题与右侧按钮垂直基线"
          git push origin HEAD:beta-regex-settings-tabs-20260814
