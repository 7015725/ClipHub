name: Settings Module Version Diagnostic

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/settings_header_diag.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect packed settings module declaration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, re
          loader = pathlib.Path('src/ch_13_settings.js').read_text(encoding='utf-8')
          expected = re.search(r'var\s+SOURCE_SHA256\s*=\s*"([0-9a-f]+)";', loader)
          assignment = re.search(r'var\s+PACKED_B64\s*=\s*(.*?);\s*\n\s*function\s+bytesToHex', loader, re.S)
          assert expected and assignment
          pieces = re.findall(r'"(?:\\.|[^"\\])*"', assignment.group(1))
          source = gzip.decompress(base64.b64decode(''.join(json.loads(p) for p in pieces))).decode('utf-8')
          assert hashlib.sha256(source.encode('utf-8')).hexdigest() == expected.group(1)
          for i, line in enumerate(source.splitlines(), 1):
              if 'MODULE_NAME' in line or 'MODULE_VERSION' in line:
                  print('%05d: %s' % (i, line))
          PY
