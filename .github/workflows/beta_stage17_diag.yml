        info = section(source,
            "    function startAjaxAppendRender(appendedRows) {",
            "\n    function ",
            "Stage17 start AJAX render");
        source = replaceSection(source, info,
            stage17DecodeText("__START_FUNC__").replace(/\n$/, ""));
        info = section(source,
            "    function rebuildVirtualWindow(origin, force, preferredIndex) {",
            "\n    function ",
            "Stage17 rebuild guard");
        value = info.text;
        value = replaceOnceStrict(value,
            "        if (virtualCardHost === null || !state.panelAttached) {\n" +
            "            return false;\n" +
            "        }\n",
            "        if (virtualCardHost === null || !state.panelAttached) {\n" +
            "            return false;\n" +
            "        }\n" + stage17DecodeText("__REBUILD_GUARD__"),
            "Stage17 defer virtual update");
        source = replaceSection(source, info, value);
        source = replaceOnceStrict(source,
            "    function resetVirtualState(clearHeights) {\n" +
            "        virtualGeneration += 1;\n",
            "    function resetVirtualState(clearHeights) {\n" +
            "        cancelStagedAjaxAttach(\"virtual_reset\");\n" +
            "        virtualGeneration += 1;\n",
