name: Beta Stage17 Build Debug
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/stage17-diag-trigger.txt
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute previous Stage17 builder and persist result
        shell: bash
        run: |
          set -euo pipefail
          git show 34db82d66cd1dbdaf2b3b81720190a74ee78ca01:.github/workflows/beta_stage17_diag.yml > /tmp/stage17_builder.yml
          python - <<'PY'
          import pathlib
          text=pathlib.Path('/tmp/stage17_builder.yml').read_text(encoding='utf-8')
          start_marker='      - name: Build Filter65\n        shell: bash\n        run: |\n'
          end_marker='      - name: Commit Stage17 atomically\n'
          if start_marker not in text or end_marker not in text:
              raise SystemExit('builder block markers missing')
          body=text.split(start_marker,1)[1].split(end_marker,1)[0]
          lines=[]
          for line in body.splitlines():
              if line.startswith('          '): line=line[10:]
              lines.append(line)
          pathlib.Path('/tmp/stage17_build.sh').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          set +e
          bash /tmp/stage17_build.sh > stage17_build_debug.txt 2>&1
          rc=$?
          set -e
          printf '\nEXIT_CODE=%s\n' "$rc" >> stage17_build_debug.txt
          git restore src/ch_11_filter.js module-manifest.json || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage17_build_debug.txt
          git commit -m "记录 Stage17 构建失败诊断"
          git push
