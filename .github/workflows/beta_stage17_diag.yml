name: Beta Stage17 Build
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/stage17-diag-trigger.txt
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Stage17 builder
        run: python stage17_build_runner.py
