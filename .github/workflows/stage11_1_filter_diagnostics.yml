name: Stage 11.1 Filter v50 build

on:
  push:
    branches:
      - agent/beta-list-preview-on-demand-20260808
  pull_request:
    branches:
      - beta-pagination-stage10-20260808

permissions:
  contents: write

jobs:
  build-filter-v50:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beta-list-preview-on-demand-20260808
          fetch-depth: 1

      - name: Build v50 source and v5 packed assets
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/stage11_1_patch_builder.py
          python3 .github/stage11_1_build.py
          cat /tmp/stage11_1_build_report.json

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/ch11_filter_v50_source.js
          node --check src/ch_11_filter.js
          node --check 'ClipHub_Stage11.1数据窗口Worker测试入口.txt'
          node --check 'ClipHub_分页阶段11首页预览按需正文测试入口.txt'
          if grep -En '\b(let|const|class)\b|=>' /tmp/ch11_filter_v50_source.js; then
            echo 'Rhino ES5 boundary violation'
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json
          manifest=json.loads(Path('module-manifest.json').read_text())
          assert manifest['moduleSetVersion']=='20260808.03'
          assert len(manifest['modules'])==15
          packed=''.join(''.join(Path('stage-assets/pagination-stage9/ch11_full_v5_%02d.b64'%i).read_text().split()) for i in range(8))
          source=gzip.decompress(base64.b64decode(packed)).decode()
          assert 'MODULE_VERSION: 50' in source
          assert 'PAGINATION_STAGE = 9' in source
          assert source.count('newSingleThreadExecutor') == 1
          assert 'VIRTUAL_UPDATE_DELAY_MS = 24' in source
          assert 'VIRTUAL_BEFORE_SCREENS = 3' in source
          assert 'VIRTUAL_AFTER_SCREENS = 5' in source
          assert 'getHydrationWorkerState' in source
          assert 'getScrollPerformanceState' in source
          print(json.dumps({'ok':True,'sourceSha256':hashlib.sha256(source.encode()).hexdigest(),'sourceLines':len(source.splitlines())}))
          PY
          git diff --check

      - name: Commit deterministic Stage 11.1 output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/stage11_1_build.py .github/stage11_1_patch_builder.py .github/workflows/stage11_1_filter_diagnostics.yml
          git add src/ch_11_filter.js module-manifest.json \
            'ClipHub_分页阶段11首页预览按需正文测试入口.txt' \
            stage-assets/pagination-stage9/ch11_full_v5_*.b64
          git status --short
          git commit -m '实现 Stage11.1 单线程异步数据窗口水合'
          git push origin HEAD:agent/beta-list-preview-on-demand-20260808
