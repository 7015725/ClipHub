name: Stage 11.1 Filter diagnostics

on:
  push:
    branches:
      - agent/beta-list-preview-on-demand-20260808

permissions:
  contents: read

jobs:
  inspect-filter-v49:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode Filter v49 and print implementation anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          parts = [Path('stage-assets/pagination-stage9/ch11_full_v4_%02d.b64' % i) for i in range(8)]
          packed = ''.join(p.read_text(encoding='utf-8') for p in parts)
          packed = ''.join(packed.split())
          assert hashlib.sha256(packed.encode()).hexdigest() == '77deb0225545af17da7f9a0eac6f43ce4a623440d1e053e4276441deb18b01f4'
          source = gzip.decompress(base64.b64decode(packed)).decode('utf-8')
          assert hashlib.sha256(source.encode()).hexdigest() == '6d85719de45449ac1d029081a50554b8592bf21e7717fa3ecbfce18c8aa913e7'
          lines = source.splitlines()
          patterns = [
              'function performDataWindowMaintenance',
              'function performVirtualUpdate',
              'function scheduleVirtualUpdate',
              'function closePanel',
              'shutdown: function',
              'var previewRows',
              'var paginationState',
              'var mainHandler',
              'function runOnMain',
              'function runOnMainSync',
              'MODULE_VERSION: 49',
              '__clipHubDehydrated',
              'listItemsByIds(',
              'listItemTagMap(',
              'queryGeneration',
              'renderGeneration',
              'refreshGeneration'
          ]
          hits = []
          for pat in patterns:
              found = [i for i, line in enumerate(lines) if pat in line]
              print('ANCHOR', repr(pat), [i + 1 for i in found])
              hits.extend(found)
          ranges = []
          for i in sorted(set(hits)):
              start = max(0, i - 18)
              end = min(len(lines), i + 45)
              if ranges and start <= ranges[-1][1] + 8:
                  ranges[-1] = (ranges[-1][0], max(ranges[-1][1], end))
              else:
                  ranges.append((start, end))
          for start, end in ranges:
              print('\n===== FILTER SOURCE LINES %d-%d =====' % (start + 1, end))
              for idx in range(start, end):
                  print('%05d|%s' % (idx + 1, lines[idx]))
          print('\nSOURCE_LINES', len(lines))
          PY
