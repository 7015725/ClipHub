name: Beta Stage16B3 Debug
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/stage16b3-debug-trigger.txt
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute builder and persist failure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          text=pathlib.Path('.github/workflows/beta_stage16b3_fix.yml').read_text(encoding='utf-8')
          start_marker='      - name: Build Filter62\n        shell: bash\n        run: |\n'
          end_marker='      - name: Commit Stage16B3 atomically\n'
          if start_marker not in text or end_marker not in text:
              raise SystemExit('builder block markers missing')
          body=text.split(start_marker,1)[1].split(end_marker,1)[0]
          lines=[]
          for line in body.splitlines():
              if line.startswith('          '): line=line[10:]
              lines.append(line)
          pathlib.Path('/tmp/stage16b3_build.sh').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          set +e
          bash /tmp/stage16b3_build.sh > stage16b3_fix_debug.txt 2>&1
          rc=$?
          set -e
          printf '\nEXIT_CODE=%s\n' "$rc" >> stage16b3_fix_debug.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage16b3_fix_debug.txt
          git commit -m "记录 Stage16B.3 构建失败诊断"
          git push
