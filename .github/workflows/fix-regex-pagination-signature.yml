name: fix-regex-pagination-signature
on:
  push:
    branches: [beta-regex-filter-20260813]
    paths: ['.github/workflows/fix-regex-pagination-signature.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-regex-filter-20260813
          fetch-depth: 0
      - name: Patch regex pagination criteria sync
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, re
          ROOT=pathlib.Path('.')
          FILTER=ROOT/'src/ch_11_filter.js'
          def fail(msg): raise RuntimeError(msg)
          def blob_sha(text):
              raw=text.encode('utf-8')
              return hashlib.sha1(('blob %d\0'%len(raw)).encode('utf-8')+raw).hexdigest()
          def replace_once(text,old,new,label):
              n=text.count(old)
              if n!=1: fail('%s expected 1 got %d'%(label,n))
              return text.replace(old,new,1)
          loader=FILTER.read_text(encoding='utf-8')
          m=re.search(r'\bvar\s+(PACKED_B64|encoded)\s*=\s*(.*?);',loader,re.S)
          if not m: fail('packed filter missing')
          pieces=re.findall(r'"(?:\\.|[^"\\])*"',m.group(2))
          canonical=gzip.decompress(base64.b64decode(''.join(json.loads(x) for x in pieces))).decode('utf-8')
          canonical=replace_once(canonical,
              '        if (regexActive()) {\n            cancelMutationRefresh("regex_criteria_apply");',
              '        if (regexActive()) {\n            ensurePaginationCriteria();\n            cancelMutationRefresh("regex_criteria_apply");',
              'active regex pagination criteria sync')
          canonical=replace_once(canonical,'MODULE_VERSION: 76','MODULE_VERSION: 77','filter version')
          raw=gzip.compress(canonical.encode('utf-8'),compresslevel=9,mtime=0)
          enc=base64.b64encode(raw).decode('ascii')
          chunks=[enc[i:i+120] for i in range(0,len(enc),120)]
          expr='\n        '+' +\n        '.join(json.dumps(x) for x in chunks)+'\n    '
          pat=re.compile(r'(\bvar\s+'+re.escape(m.group(1))+r'\s*=\s*)(.*?)(;)',re.S)
          mm=pat.search(loader)
          loader=loader[:mm.start(2)]+expr+loader[mm.end(2):]
          sha=hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          loader,n=re.subn(r'(\bvar\s+SOURCE_SHA256\s*=\s*["\'])[0-9a-fA-F]{64}(["\'])',lambda x:x.group(1)+sha+x.group(2),loader,count=1)
          if n!=1: fail('source sha update')
          FILTER.write_text('\n'.join(x.rstrip() for x in loader.splitlines())+'\n',encoding='utf-8')

          genp=ROOT/'tools/apply_regex_filter_beta.py'
          gen=genp.read_text(encoding='utf-8')
          gen=replace_once(gen,'MODULE_SET = "20260813.04"','MODULE_SET = "20260813.05"','generator module set')
          gen=replace_once(gen,'"MODULE_VERSION: 76", "filter version")','"MODULE_VERSION: 77", "filter version")','generator output version')
          gen=replace_once(gen,'"ch_11_filter.js": ("ch_11_filter", 76)','"ch_11_filter.js": ("ch_11_filter", 77)','generator required version')
          escaped='        "        if (regexActive()) {\\n"\n        "            cancelMutationRefresh(\\\"regex_criteria_apply\\\");\\n"'
          escaped_new='        "        if (regexActive()) {\\n"\n        "            ensurePaginationCriteria();\\n"\n        "            cancelMutationRefresh(\\\"regex_criteria_apply\\\");\\n"'
          gen=replace_once(gen,escaped,escaped_new,'generator criteria sync line')
          gen=gen.replace("EXPECTED_MODULE_SET='20260813.04'","EXPECTED_MODULE_SET='20260813.05'")
          genp.write_text(gen,encoding='utf-8')

          manifestp=ROOT/'module-manifest.json'
          manifest=json.loads(manifestp.read_text(encoding='utf-8'))
          if manifest.get('sourceRef')!='beta-regex-filter-20260813': fail('source ref')
          if len(manifest.get('modules',[]))!=15: fail('module count')
          manifest['moduleSetVersion']='20260813.05'
          for item in manifest['modules']:
              p=ROOT/str(item['path'])
              item['sha']=blob_sha(p.read_text(encoding='utf-8'))
          manifestp.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          pre=ROOT/'scripts/release_preflight.sh'
          s=pre.read_text(encoding='utf-8')
          s=replace_once(s,"EXPECTED_MODULE_SET='20260813.04'","EXPECTED_MODULE_SET='20260813.05'",'preflight set')
          s=replace_once(s,'"ch_11_filter.js": ("ch_11_filter", 76)','"ch_11_filter.js": ("ch_11_filter", 77)','preflight version')
          pre.write_text(s,encoding='utf-8')

          assert 'ensurePaginationCriteria();\n            cancelMutationRefresh("regex_criteria_apply")' in canonical
          assert re.search(r'MODULE_NAME:\s*"ch_11_filter"\s*,\s*MODULE_VERSION:\s*77',canonical,re.S)
          assert 'var SCHEMA_VERSION = 2;' in (ROOT/'src/ch_03_database.js').read_text(encoding='utf-8')
          print('Filter v77 / moduleSet 20260813.05 patched')
          PY
      - name: Run regex beta preflight
        run: bash scripts/release_preflight.sh --regex-beta
      - name: Commit fix and cleanup temporary inspection
        shell: bash
        run: |
          rm -f .github/workflows/fix-regex-pagination-signature.yml
          rm -f .github/workflows/inspect-pagination-signature.yml
          rm -f tmp_filter_pagination_snippets.txt
          git config user.name 7015725
          git config user.email 62368672+7015725@users.noreply.github.com
          git add src/ch_11_filter.js tools/apply_regex_filter_beta.py module-manifest.json scripts/release_preflight.sh .github/workflows tmp_filter_pagination_snippets.txt
          git commit -m "fix regex pagination criteria signature"
          git push origin HEAD:beta-regex-filter-20260813
