name: ClipHub Phase 2 Diagnostic

on:
  push:
    branches:
      - agent/unify-window-geometry
    paths:
      - .github/workflows/phase2-retire-content-types.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/unify-window-geometry
          fetch-depth: 0

      - name: Collect exact contract counts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess

          app = Path('src/ch_15_app.js').read_text(encoding='utf-8')
          repo = Path('src/ch_06_repository.js').read_text(encoding='utf-8')
          flt = Path('src/ch_11_filter.js').read_text(encoding='utf-8')
          manifest = json.loads(Path('module-manifest.json').read_text(encoding='utf-8'))

          lines = []
          lines.append('head=' + subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True).strip())
          lines.append('moduleSetVersion=' + str(manifest.get('moduleSetVersion')))
          lines.append('moduleCount=' + str(len(manifest.get('modules', []))))

          checks = {
              'app.order': app.count('"Log", "Database", "Classifier", "Repository"'),
              'app.version11': app.count('MODULE_VERSION: 11'),
              'repo.var_types': repo.count('var types;'),
              'repo.function': len(re.findall(r'(?m)^    function listContentTypeOptions\(', repo)),
              'repo.export': repo.count('listContentTypeOptions: listContentTypeOptions'),
              'repo.version9': repo.count('MODULE_VERSION: 9'),
              'filter.toggleType.function': len(re.findall(r'(?m)^    function toggleType\(', flt)),
              'filter.optionKey.function': len(re.findall(r'(?m)^    function optionKey\(', flt)),
              'filter.optionLabel.function': len(re.findall(r'(?m)^    function optionLabel\(', flt)),
              'filter.selectedList.function': len(re.findall(r'(?m)^    function selectedList\(', flt)),
              'filter.clearKind.function': len(re.findall(r'(?m)^    function clearKind\(', flt)),
              'filter.optionClick.function': len(re.findall(r'(?m)^    function optionClick\(', flt)),
              'filter.setContentTypes.object': len(re.findall(r'(?m)^        setContentTypes: function \(', flt)),
              'filter.getContentTypeOptions.object': len(re.findall(r'(?m)^        getContentTypeOptions: function \(', flt)),
              'filter.performTypeClick.object': len(re.findall(r'(?m)^        performTypeClick: function \(', flt)),
              'filter.contentTypes.lines': len(re.findall(r'(?m)^\s*contentTypes: \[\],$', flt)),
              'filter.contentTypes.token': flt.count('contentTypes'),
              'filter.typeViews.token': flt.count('typeViews'),
              'filter.typeToggleCount.token': flt.count('typeToggleCount'),
              'filter.typeWrapRowCount.token': flt.count('typeWrapRowCount'),
              'filter.contentTypeOptionCount.token': flt.count('contentTypeOptionCount'),
              'filter.typeChipCount.token': flt.count('typeChipCount'),
              'filter.kind_type.token': flt.count('kind === "type"'),
              'filter.counts_types.token': flt.count('counts.types'),
              'filter.ui_type.token': flt.count('ui_type'),
              'filter.version32': flt.count('MODULE_VERSION: 32'),
              'filter.ime32': flt.count('formal_v32'),
          }
          for key in sorted(checks):
              lines.append(key + '=' + str(checks[key]))

          Path('.phase2-content-type-diagnostic.txt').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .phase2-content-type-diagnostic.txt
          git commit -m "诊断阶段2内容类型清理契约"
          git push origin HEAD:agent/unify-window-geometry
