name: ClipHub Phase 2 Retire Content Types

on:
  push:
    branches:
      - agent/unify-window-geometry
    paths:
      - .github/workflows/phase2-retire-content-types.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/unify-window-geometry
          fetch-depth: 0

      - name: Apply bounded cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit("%s replacement count=%d" % (label, count))
              return text.replace(old, new, 1)

          manifest_path = Path("module-manifest.json")
          app_path = Path("src/ch_15_app.js")
          repository_path = Path("src/ch_06_repository.js")
          filter_path = Path("src/ch_11_filter.js")
          classifier_path = Path("src/ch_05_classifier.js")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("moduleSetVersion") != "20260724.29":
              raise SystemExit("unexpected module set: %r" %
                               manifest.get("moduleSetVersion"))
          if not classifier_path.exists():
              raise SystemExit("classifier file already missing")

          app = app_path.read_text(encoding="utf-8")
          app = replace_once(
              app,
              '        "Log", "Database", "Classifier", "Repository",\n',
              '        "Log", "Database", "Repository",\n',
              "app classifier order"
          )
          app = replace_once(
              app,
              '        MODULE_VERSION: 11,\n',
              '        MODULE_VERSION: 12,\n',
              "app module version"
          )
          app_path.write_text(app, encoding="utf-8")

          repository = repository_path.read_text(encoding="utf-8")
          repository = replace_once(
              repository,
              '        var types;\n',
              '',
              "repository unused types variable"
          )
          repository = replace_once(
              repository,
              '''    function listContentTypeOptions() {
                  requireReady();
                  return [];
              }

          ''',
              '',
              "repository content type options"
          )
          repository = replace_once(
              repository,
              '        listContentTypeOptions: listContentTypeOptions,\n',
              '',
              "repository content type export"
          )
          repository = replace_once(
              repository,
              '        MODULE_VERSION: 9,\n',
              '        MODULE_VERSION: 10,\n',
              "repository module version"
          )
          repository_path.write_text(repository, encoding="utf-8")

          source = filter_path.read_text(encoding="utf-8")

          simple_removals = [
              ('    var typeViews = {};\n', "filter type views"),
              ('        typeToggleCount: 0,\n', "filter type toggle state"),
              ('        typeWrapRowCount: 0,\n', "filter type row state"),
              ('        contentTypeOptionCount: 0,\n',
               "filter type option state"),
              ('        typeChipCount: 0,\n', "filter type chip state"),
              ('            contentTypes: [],\n',
               "filter empty value content types"),
              ('                types: copyList(value.contentTypes),\n',
               "filter event criteria types"),
              ('        if (kind === "type") { state.typeWrapRowCount = rowCount; }\n',
               "filter type row update"),
              ('        if (value.contentTypes && value.contentTypes.length > 0) {\n'
               '            count += 1;\n'
               '        }\n',
               "filter active type count"),
              ('        typeViews = {};\n', "filter render type view reset"),
              ('        state.typeWrapRowCount = 0;\n',
               "filter render type row reset"),
              ('        state.contentTypeOptionCount = counts.types.length;\n',
               "filter render type option count"),
              ('        state.typeChipCount = Object.keys(typeViews).length;\n',
               "filter render type chip count"),
              ('                typeViews = {};\n',
               "filter close type view reset"),
              ('            contentTypeOptionCount:\n'
               '                Number(state.contentTypeOptionCount),\n',
               "filter panel type option diagnostic"),
              ('            typeChipCount: Object.keys(typeViews).length,\n',
               "filter panel type chip diagnostic"),
              ('            typeWrapRowCount: Number(state.typeWrapRowCount),\n',
               "filter panel type row diagnostic"),
              ('            typeToggleCount: Number(state.typeToggleCount),\n',
               "filter panel type toggle diagnostic"),
              ('        state.typeToggleCount = 0;\n',
               "filter reset type toggle"),
              ('        state.typeWrapRowCount = 0;\n',
               "filter reset type row"),
              ('        state.contentTypeOptionCount = 0;\n',
               "filter reset type options"),
              ('        state.typeChipCount = 0;\n',
               "filter reset type chips"),
          ]
          for old, label in simple_removals:
              source = replace_once(source, old, '', label)

          source = replace_once(
              source,
              '''        if (patch.hasOwnProperty("contentTypes")) {
                  value.contentTypes = normalizeList(patch.contentTypes);
              }
          ''',
              '',
              "filter set content types"
          )

          source = replace_once(
              source,
              '''    function toggleType(type) {
                  markUiThread();
                  state.typeToggleCount += 1;
                  setValue({
                      contentTypes: toggle(value.contentTypes, type, false)
                  }, { origin: "ui_type" });
                  buildPanelContent(false);
                  return true;
              }

          ''',
              '',
              "filter toggle type"
          )

          source = replace_once(
              source,
              '''        if (kind === "type") {
                  return String(option.content_type);
              }
          ''',
              '',
              "filter option key type branch"
          )

          source = replace_once(
              source,
              '''        if (kind === "type") {
                  return typeLabel(option.content_type);
              }
          ''',
              '',
              "filter option label type branch"
          )

          source = replace_once(
              source,
              '''        if (kind === "type") {
                  return value.contentTypes;
              }
          ''',
              '',
              "filter selected type list"
          )

          source = replace_once(
              source,
              '''    function clearKind(kind) {
                  if (kind === "source") {
                      state.sourceToggleCount += 1;
                      setValue({ sourcePackages: [] }, {
                          origin: "ui_source_all"
                      });
                  } else if (kind === "type") {
                      state.typeToggleCount += 1;
                      setValue({ contentTypes: [] }, {
                          origin: "ui_type_all"
                      });
                  } else {
                      state.tagToggleCount += 1;
                      setValue({ tagIds: [] }, {
                          origin: "ui_tag_all"
                      });
                  }
              }
          ''',
              '''    function clearKind(kind) {
                  if (kind === "source") {
                      state.sourceToggleCount += 1;
                      setValue({ sourcePackages: [] }, {
                          origin: "ui_source_all"
                      });
                  } else {
                      state.tagToggleCount += 1;
                      setValue({ tagIds: [] }, {
                          origin: "ui_tag_all"
                      });
                  }
              }
          ''',
              "filter clear kind"
          )

          source = replace_once(
              source,
              '''    function optionClick(kind, key, chip) {
                  if (kind === "source") {
                      (function (target, view) {
                          view.setOnClickListener(new JavaAdapter(
                              View.OnClickListener, {
                                  onClick: function () { toggleSource(target); }
                              }));
                          sourceViews[target] = view;
                      }(key, chip));
                  } else if (kind === "type") {
                      (function (target, view) {
                          view.setOnClickListener(new JavaAdapter(
                              View.OnClickListener, {
                                  onClick: function () { toggleType(target); }
                              }));
                          typeViews[target] = view;
                      }(key, chip));
                  } else {
                      (function (target, view) {
                          view.setOnClickListener(new JavaAdapter(
                              View.OnClickListener, {
                                  onClick: function () { toggleTag(Number(target)); }
                              }));
                          tagViews[target] = view;
                      }(key, chip));
                  }
              }
          ''',
              '''    function optionClick(kind, key, chip) {
                  if (kind === "source") {
                      (function (target, view) {
                          view.setOnClickListener(new JavaAdapter(
                              View.OnClickListener, {
                                  onClick: function () { toggleSource(target); }
                              }));
                          sourceViews[target] = view;
                      }(key, chip));
                  } else {
                      (function (target, view) {
                          view.setOnClickListener(new JavaAdapter(
                              View.OnClickListener, {
                                  onClick: function () { toggleTag(Number(target)); }
                              }));
                          tagViews[target] = view;
                      }(key, chip));
                  }
              }
          ''',
              "filter option click"
          )

          source = replace_once(
              source,
              '        return { sources: sources, types: [], tags: tags };\n',
              '        return { sources: sources, tags: tags };\n',
              "filter option counts"
          )

          source = replace_once(
              source,
              '''        setContentTypes: function (types, options) {
                  return setValue({ contentTypes: types }, options);
              },

          ''',
              '',
              "filter public set content types"
          )

          source = replace_once(
              source,
              '''        getContentTypeOptions: function () {
                  return ClipHub.Repository.listContentTypeOptions();
              },

          ''',
              '',
              "filter public get type options"
          )

          source = replace_once(
              source,
              '''        performTypeClick: function (type) {
                  type = String(type || "");
                  return requireMain(runOnMainSync(function () {
                      return typeViews[type] ?
                          typeViews[type].performClick() : false;
                  }, 2500));
              },

          ''',
              '',
              "filter type click probe"
          )

          source = replace_once(
              source,
              '        MODULE_VERSION: 32,\n',
              '        MODULE_VERSION: 33,\n',
              "filter module version"
          )
          source = replace_once(
              source,
              '        FILTER_IME_AVOIDANCE: "formal_v32",\n',
              '        FILTER_IME_AVOIDANCE: "formal_v33",\n',
              "filter IME contract version"
          )

          forbidden = [
              "contentTypes",
              "typeViews",
              "typeToggleCount",
              "typeWrapRowCount",
              "contentTypeOptionCount",
              "typeChipCount",
              "setContentTypes",
              "getContentTypeOptions",
              "performTypeClick",
              "listContentTypeOptions",
              "toggleType",
              'kind === "type"',
              "counts.types",
              "ui_type"
          ]
          for token in forbidden:
              if token in source:
                  raise SystemExit("filter retired token remains: " + token)

          filter_path.write_text(source, encoding="utf-8")

          modules = manifest.get("modules", [])
          before_count = len(modules)
          modules = [
              item for item in modules
              if item.get("path") != "src/ch_05_classifier.js"
          ]
          if len(modules) != before_count - 1:
              raise SystemExit("classifier manifest removal mismatch")
          manifest["modules"] = modules
          manifest["moduleSetVersion"] = "20260724.30"

          for path in [
              "src/ch_06_repository.js",
              "src/ch_11_filter.js",
              "src/ch_15_app.js"
          ]:
              blob = subprocess.check_output(
                  ["git", "hash-object", path], text=True
              ).strip()
              matches = [item for item in modules if item.get("path") == path]
              if len(matches) != 1:
                  raise SystemExit("manifest entry mismatch: " + path)
              matches[0]["sha"] = blob

          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          classifier_path.unlink()
          PY

      - name: Validate syntax and boundaries
        shell: bash
        run: |
          set -euo pipefail
          node --check src/ch_06_repository.js
          node --check src/ch_11_filter.js
          node --check src/ch_15_app.js
          for file in src/*.js; do
            node --check "$file"
          done
          python3 -m json.tool module-manifest.json >/dev/null
          test ! -e src/ch_05_classifier.js
          ! grep -R -n -E 'ClipHub\.Classifier|"Classifier"|ch_05_classifier' \
            src module-manifest.json
          ! grep -R -n -E \
            'contentTypes|typeViews|typeToggleCount|typeWrapRowCount|contentTypeOptionCount|typeChipCount|setContentTypes|getContentTypeOptions|performTypeClick|listContentTypeOptions|toggleType|ui_type' \
            src/ch_06_repository.js src/ch_11_filter.js
          grep -q 'content_type TEXT NOT NULL DEFAULT' src/ch_03_database.js
          grep -q 'idx_clipboard_items_type' src/ch_03_database.js
          grep -q '"text",' src/ch_06_repository.js
          grep -q 'function typeLabel' src/ch_11_filter.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          manifest = json.loads(
              Path("module-manifest.json").read_text(encoding="utf-8")
          )
          if manifest["moduleSetVersion"] != "20260724.30":
              raise SystemExit("module version mismatch")
          if len(manifest["modules"]) != 14:
              raise SystemExit("unexpected module count")
          for item in manifest["modules"]:
              path = item["path"]
              actual = subprocess.check_output(
                  ["git", "hash-object", path], text=True
              ).strip()
              if actual != item["sha"]:
                  raise SystemExit("blob mismatch: " + path)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module-manifest.json \
            src/ch_05_classifier.js \
            src/ch_06_repository.js \
            src/ch_11_filter.js \
            src/ch_15_app.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "清理失效的内容类型筛选链路"
          git push origin HEAD:agent/unify-window-geometry
