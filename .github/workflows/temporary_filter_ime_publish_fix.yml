name: Temporary filter IME publish correction

on:
  push:
    branches:
      - agent/unify-window-geometry
    paths:
      - .github/workflows/temporary_filter_ime_publish_fix.yml

permissions:
  contents: write

concurrency:
  group: cliphub-filter-ime-publish-correction
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/unify-window-geometry
          fetch-depth: 0

      - name: Apply correction
        run: python3 scripts/temporary_filter_ime_publish_fix.py

      - name: Validate filter loader
        run: |
          node --check src/ch_11_filter.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess

          text = Path('src/ch_11_filter.js').read_text(encoding='utf-8')
          for pattern in [r'\b(?:let|const)\b', r'=>', r'`', r'\?\.', r'\?\?']:
              if re.search(pattern, text):
                  raise SystemExit('Rhino ES5 violation: ' + pattern)
          for marker in [
              'var CACHE_VERSION = "v30";',
              'function createImeController(windowOptions)',
              'function hasFocusedEditText(rootView)',
              'filter.getImeAvoidanceState = function ()',
              'filter.FILTER_IME_AVOIDANCE = CACHE_VERSION;',
              'MODULE_VERSION: 30'
          ]:
              if marker not in text:
                  raise SystemExit('missing marker: ' + marker)
          malformed = 'String(activeAdvancedFilterCount()) + "" :'
          if malformed in text:
              raise SystemExit('malformed compact probe remains')
          intended = 'String(activeAdvancedFilterCount()) + ")" :'
          if intended not in text:
              raise SystemExit('correct compact probe missing')
          manifest = json.loads(Path('module-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion') != '20260724.25':
              raise SystemExit('unexpected module set version')
          expected = subprocess.check_output(
              ['git', 'hash-object', 'src/ch_11_filter.js'], text=True
          ).strip()
          actual = next(item.get('sha') for item in manifest['modules']
              if item.get('path') == 'src/ch_11_filter.js')
          if actual != expected:
              raise SystemExit('manifest filter blob mismatch')
          PY
          git diff --check

      - name: Commit fix and remove temporary files
        run: |
          rm -f scripts/temporary_filter_ime_publish_fix.py
          rm -f .github/workflows/temporary_filter_ime_publish_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: publish reversible filter IME avoidance"
          git push origin HEAD:agent/unify-window-geometry
