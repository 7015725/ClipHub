name: Regex Beta Finalize

on:
  push:
    branches:
      - beta-regex-filter-20260813
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-regex-filter-20260813
          fetch-depth: 0

      - name: Apply final boundary fixes
        run: |
          python3 tools/finalize_regex_filter_beta.py
          python3 tools/fix_regex_beta_preflight_contract.py

      - name: Validate Rhino ES5
        run: python3 scripts/validate_es5.py .

      - name: Run formal regex beta preflight
        run: bash scripts/release_preflight.sh --regex-beta

      - name: Verify main remains untouched
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "79d7051e6c858ee68747b5e2f4cea67d13daf189"
          git diff --check

      - name: Commit final beta
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No final changes"
            exit 0
          fi
          git commit -m "finalize regex advanced filter beta"
          git push origin HEAD:beta-regex-filter-20260813
