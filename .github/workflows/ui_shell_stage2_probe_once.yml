name: UI Shell Stage2 Probe Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/ui_shell_stage2_probe_once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe packed UI sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, json, re
          from pathlib import Path

          def expand(path):
              source = Path(path).read_text(encoding='utf-8')
              m = re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);', source, re.S)
              if not m:
                  return source
              pieces = re.findall(r'"(?:\\.|[^"\\])*"', m.group(1))
              encoded = ''.join(json.loads(p) for p in pieces)
              return gzip.decompress(base64.b64decode(encoded)).decode('utf-8')

          def func(source, name):
              m = re.search(r'\bfunction\s+' + re.escape(name) + r'\s*\(', source)
              if not m:
                  return None
              start = m.start(); brace = source.find('{', m.end())
              depth = 0; quote = None; esc = False; i = brace
              while i >= 0 and i < len(source):
                  ch = source[i]
                  if quote:
                      if esc: esc = False
                      elif ch == '\\': esc = True
                      elif ch == quote: quote = None
                  else:
                      if ch in ('"', "'"): quote = ch
                      elif ch == '{': depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0: return source[start:i+1]
                  i += 1
              return None

          targets = {
              'FILTER': ('src/ch_11_filter.js', [
                  'createPanelCache','attachPanelCache','destroyPanelCache','buildPanelContent',
                  'makePanelContent','buildRootContent','showPanel','openSettings',
                  'translateResultRow','getPanelState'
              ]),
              'SETTINGS': ('src/ch_13_settings.js', [
                  'installSettingsContent','makeSettingsSubpageHeader','handleSettingsBack',
                  'buildPage','openRegexRules','openRegexEditor','openPage','closePage','getState'
              ]),
              'TRANSLATION': ('src/ch_12_translation.js', [
                  'buildTranslationPanel','openTranslationForItem','closeTranslationPanel',
                  'getTranslationState','refreshTranslationButtons'
              ]),
          }
          for label, (path, names) in targets.items():
              source = expand(path)
              print('\n' + '='*24 + ' ' + label + ' ' + '='*24)
              for name in names:
                  body = func(source, name)
                  if body:
                      print('\n--- FUNCTION', name, '---')
                      print(body[:18000])
              for needle in [
                  'settingsButton.setOnClickListener',
                  'ClipHub.Settings.openPage(',
                  'ClipHub.UIShell',
                  'panelRoot =',
                  'panelRoot.addView(',
                  'panelManagedFrame =',
                  'translationRoot = buildTranslationPanel()'
              ]:
                  pos = 0; count = 0
                  while True:
                      idx = source.find(needle, pos)
                      if idx < 0: break
                      count += 1
                      print('\n--- AROUND', needle, '#'+str(count), '---')
                      print(source[max(0,idx-1800):idx+3500])
                      pos = idx + len(needle)
                      if count >= 4: break
          PY
