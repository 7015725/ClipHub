name: UI Shell Stage2 Probe Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/ui_shell_stage2_probe_once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Settings embed anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,json,re
          from pathlib import Path
          s=Path('src/ch_13_settings.js').read_text(encoding='utf-8')
          m=re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);',s,re.S)
          if m:
              p=re.findall(r'"(?:\\.|[^"\\])*"',m.group(1))
              s=gzip.decompress(base64.b64decode(''.join(json.loads(x) for x in p))).decode('utf-8')
          for needle in ['buildPage =','function buildPage','addSettingsDragHandle','makeRegexRulesPage','makeRegexEditorPage','makeRegexTestPage','settingsPage = "regex_rules"']:
              print('\n### '+needle+' count='+str(s.count(needle))+' ###')
              pos=0
              for i in range(min(5,s.count(needle))):
                  idx=s.find(needle,pos)
                  print(s[max(0,idx-1200):idx+4200])
                  pos=idx+len(needle)
          PY
