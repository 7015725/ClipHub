name: UI Shell Stage2 Probe Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/ui_shell_stage2_probe_once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lifecycle anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,json,re
          from pathlib import Path
          def expand(path):
              s=Path(path).read_text(encoding='utf-8')
              m=re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);',s,re.S)
              if m:
                  p=re.findall(r'"(?:\\.|[^"\\])*"',m.group(1))
                  s=gzip.decompress(base64.b64decode(''.join(json.loads(x) for x in p))).decode('utf-8')
              return s
          def get_func(s,name):
              m=re.search(r'\bfunction\s+'+re.escape(name)+r'\s*\(',s)
              if not m: return ''
              b=s.find('{',m.end()); d=0; q=None; e=False; i=b
              while i<len(s):
                  c=s[i]
                  if q:
                      if e:e=False
                      elif c=='\\':e=True
                      elif c==q:q=None
                  else:
                      if c in ('"',"'"):q=c
                      elif c=='{':d+=1
                      elif c=='}':
                          d-=1
                          if d==0:return s[m.start():i+1]
                  i+=1
              return ''
          for label,path,names in [
              ('SETTINGS','src/ch_13_settings.js',['openPage','closePage','startSettingsImeMonitor','stopSettingsImeMonitor','getState']),
              ('TRANSLATION','src/ch_12_translation.js',['openTranslationForItem','closeTranslationPanel','getTranslationState'])
          ]:
              s=expand(path)
              print('\n========== '+label+' ==========')
              for name in names:
                  print('\n### '+name+' ###')
                  print(get_func(s,name))
          PY
