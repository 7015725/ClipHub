name: UI Shell Stage4 Probe Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/ui_shell_stage4_probe_once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect remaining legacy surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,json,re
          from pathlib import Path
          def unpack(path):
              text=Path(path).read_text(encoding='utf-8')
              m=re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);',text,re.S)
              if not m: return text
              parts=re.findall(r'"(?:\\.|[^"\\])*"',m.group(1))
              return gzip.decompress(base64.b64decode(''.join(json.loads(x) for x in parts))).decode('utf-8')
          def dump(name, src, pats):
              lines=src.splitlines(); hits=[]
              print('\n===== '+name+' =====')
              for pat in pats:
                  found=[]
                  for i,line in enumerate(lines,1):
                      if pat in line:
                          found.append(i); hits.append(i)
                  print(pat+': '+','.join(map(str,found)))
              for n in sorted(set(hits)):
                  a=max(1,n-14); b=min(len(lines),n+45)
                  print('\n--- %s %d-%d ---'%(name,a,b))
                  for j in range(a,b+1): print('%05d: %s'%(j,lines[j-1]))
          dump('FILTER',unpack('src/ch_11_filter.js'),[
              'function showPanel','function showRoot','showPanel(','showRoot(',
              'mountPrimaryChildPage','unmountPrimaryChildPage','primaryChild',
              'showAdvanced','advanced','createManagedFrame','windowManager.addView'])
          dump('NAV',unpack('src/ch_12_translation.js'),[
              'function dispatchBack','UIShell.dispatchBack','activePageId',
              'detail','dispatchBackForOwner','owner === "detail"','closeDetail'])
          dump('APP',unpack('src/ch_15_app.js'),[
              'showPanel(','showRoot(','openDetail(','Filter.showPanel','Filter.showRoot'])
          PY
