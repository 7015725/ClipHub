name: Integrate Regex and Settings Tabs

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/integrate_regex_settings_tabs.yml

jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0

      - name: Verify Regex final baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/ch_11_filter.js)" = "bcbfb6692380021d211cf5c10981f1e54de4152e"
          test "$(git hash-object src/ch_13_settings.js)" = "a0175f5e1b3a5751996d385981e200c6644a4380"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('module-manifest.json').read_text(encoding='utf-8'))
          assert m['moduleSetVersion'] == '20260813.09', m['moduleSetVersion']
          assert m['sourceRef'] == 'beta-regex-filter-20260813', m['sourceRef']
          print('regex-final baseline verified')
          PY

      - name: Import deterministic Tabs patchers
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin beta-settings-tabs-20260814
          git show origin/beta-settings-tabs-20260814:tools/apply_settings_tabs_beta.py > tools/_integration_settings_tabs_beta.py
          git show origin/beta-settings-tabs-20260814:tools/apply_settings_tabs_review_fix.py > tools/_integration_settings_tabs_review_fix.py
          git show c5ea26c89dba5861b5e10e41e2ed568cf0ea60ac:probes/cliphub_settings_tabs_probe_071.js > probes/cliphub_settings_tabs_probe_071.js
          git show origin/beta-settings-tabs-20260814:.github/workflows/settings_tabs_validate.yml > .github/workflows/settings_tabs_validate.yml

      - name: Adapt patchers to integration branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          branch = 'beta-regex-settings-tabs-20260814'

          p = Path('tools/_integration_settings_tabs_beta.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('beta-settings-tabs-20260814', branch)
          s = s.replace('20260814.01', '20260814.03')
          s = s.replace('20260813.07', '20260813.09')
          p.write_text(s, encoding='utf-8')

          p = Path('tools/_integration_settings_tabs_review_fix.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('beta-settings-tabs-20260814', branch)
          s = s.replace('20260814.01', '20260814.03')
          s = s.replace('20260814.02', '20260814.04')
          s = s.replace('    cleanup_one_shot_generator()\n', '    # integration branch has no one-shot generator\n')
          p.write_text(s, encoding='utf-8')
          print('integration patchers adapted')
          PY

      - name: Apply Tabs on top of Regex final Settings27
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/_integration_settings_tabs_beta.py
          test "$(git hash-object src/ch_11_filter.js)" = "bcbfb6692380021d211cf5c10981f1e54de4152e"
          python3 tools/_integration_settings_tabs_review_fix.py
          test "$(git hash-object src/ch_11_filter.js)" = "bcbfb6692380021d211cf5c10981f1e54de4152e"
          rm -f tools/_integration_settings_tabs_beta.py tools/_integration_settings_tabs_review_fix.py

      - name: Validate integrated runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict | tee /tmp/integration-color.txt
          grep '^HIGH=0 WARN=0 ' /tmp/integration-color.txt
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('module-manifest.json').read_text(encoding='utf-8'))
          assert m['moduleSetVersion'] == '20260814.04', m['moduleSetVersion']
          assert m['sourceRef'] == 'beta-regex-settings-tabs-20260814', m['sourceRef']
          mods = {x['name']: x['sha'] for x in m['modules']}
          assert mods['ch_11_filter.js'] == 'bcbfb6692380021d211cf5c10981f1e54de4152e'
          assert mods['ch_13_settings.js'] != 'a0175f5e1b3a5751996d385981e200c6644a4380'
          print('integrated manifest verified')
          PY

      - name: Commit integrated beta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ch_13_settings.js \
                  ClipHub.js \
                  module-manifest.json \
                  scripts/release_preflight.sh \
                  ClipHub_Beta浮窗开关.txt \
                  ClipHub_Beta状态查询.txt \
                  probes/cliphub_settings_tabs_probe_071.js \
                  .github/workflows/settings_tabs_validate.yml
          git diff --cached --stat
          git commit -m "整合 Regex 高级筛选与设置页 Tabs"
          git push origin HEAD:beta-regex-settings-tabs-20260814
