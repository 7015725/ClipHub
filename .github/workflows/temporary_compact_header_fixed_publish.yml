name: Temporary compact header fixed publish

on:
  push:
    branches:
      - agent/unify-window-geometry
    paths:
      - .github/workflows/temporary_compact_header_fixed_publish.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary_compact_header_fixed_publish.yml

permissions:
  contents: write

concurrency:
  group: cliphub-compact-header-fixed-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/unify-window-geometry
          fetch-depth: 0

      - name: Restore compact implementation and repair runtime contract
        run: |
          git show 84a008ada8f681c16a7326fded0bd07d06fc8029:src/ch_11_filter.js > src/ch_11_filter.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          target = Path('src/ch_11_filter.js')
          manifest_path = Path('module-manifest.json')
          text = target.read_text(encoding='utf-8')

          old = '''            advancedButtonText: advancedView !== null ?
                String(advancedView.getText()) : "",
'''
          new = '''            advancedButtonText: advancedView !== null ?
                (activeAdvancedFilterCount() > 0 ?
                    "筛选(" + String(activeAdvancedFilterCount()) + ")" :
                    "筛选") : "",
'''
          if text.count(old) != 1:
              raise SystemExit('unsafe advancedView text access site mismatch')
          text = text.replace(old, new, 1)

          if '        MODULE_VERSION: 28,\n' not in text:
              raise SystemExit('unexpected compact filter module version')
          text = text.replace('        MODULE_VERSION: 28,\n',
                              '        MODULE_VERSION: 29,\n', 1)

          if 'advancedView.getText()' in text:
              raise SystemExit('unsafe advancedView.getText remains')
          target.write_text(text, encoding='utf-8')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['moduleSetVersion'] = '20260724.22'
          manifest['sourceRef'] = 'agent/unify-window-geometry'
          blob = subprocess.check_output(
              ['git', 'hash-object', str(target)], text=True
          ).strip()
          for item in manifest.get('modules', []):
              if item.get('path') == str(target):
                  item['sha'] = blob
                  break
          else:
              raise SystemExit('filter module missing from manifest')
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Validate JavaScript, Rhino ES5 and view contracts
        run: |
          node --check src/ch_11_filter.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess

          text = Path('src/ch_11_filter.js').read_text(encoding='utf-8')
          for pattern in [r'\b(?:let|const)\b', r'=>', r'`', r'\?\.', r'\?\?']:
              if re.search(pattern, text):
                  raise SystemExit('Rhino ES5 violation: ' + pattern)

          forbidden = [
              'advancedView.getText()',
              'String(advancedView.getText())',
          ]
          for marker in forbidden:
              if marker in text:
                  raise SystemExit('unsafe view contract remains: ' + marker)

          required = [
              'advancedView = statusFilter;',
              'activeAdvancedFilterCount() > 0 ?',
              'MODULE_VERSION: 29',
              'reference_search_v12_compact_header',
              'function headerMetrics()',
              'function setSearchExpanded(expanded, requestKeyboard)',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit('missing compact recovery marker: ' + marker)

          manifest = json.loads(Path('module-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion') != '20260724.22':
              raise SystemExit('moduleSetVersion mismatch')
          if manifest.get('sourceRef') != 'agent/unify-window-geometry':
              raise SystemExit('sourceRef mismatch')
          expected = subprocess.check_output(
              ['git', 'hash-object', 'src/ch_11_filter.js'], text=True
          ).strip()
          actual = next(
              item.get('sha') for item in manifest.get('modules', [])
              if item.get('path') == 'src/ch_11_filter.js'
          )
          if actual != expected:
              raise SystemExit('manifest blob mismatch')
          PY

      - name: Remove temporary workflow and publish
        run: |
          rm -f .github/workflows/temporary_compact_header_fixed_publish.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore compact header without FrameLayout text crash"
          git push origin HEAD:agent/unify-window-geometry
