          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('module-manifest.json').read_text(encoding='utf-8'))
          assert manifest['sourceRef'] == 'beta-regex-settings-tabs-20260814'
          assert manifest['moduleSetVersion'] == '20260815.19'
          assert manifest['entryMinVersion'] == 7
          print('Home baseline guard: passed')
          PY

