name: Stage6 Primary Navigation Probe Once

on:
  push:
    branches:
      - beta-regex-settings-tabs-20260814
    paths:
      - tools/stage6_primary_navigation_probe_20260815.py
      - .github/workflows/stage6_primary_navigation_probe_once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0

      - name: Probe embedded navigation contracts
        run: python3 tools/stage6_primary_navigation_probe_20260815.py

      - name: Simulate UIShell state machine
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync('src/ch_16_ui_shell.js', 'utf8');
          let mounted = null;
          const sandbox = {
            console,
            ClipHub: {
              Filter: {
                getPrimaryHostState: function () {
                  return {
                    ready: true,
                    attached: true,
                    rootMode: true,
                    childAttached: mounted !== null
                  };
                },
                mountPrimaryChildPage: function (spec) {
                  mounted = spec;
                  return true;
                },
                unmountPrimaryChildPage: function () {
                  mounted = null;
                  return true;
                }
              }
            }
          };
          vm.createContext(sandbox);
          vm.runInContext(source, sandbox, { filename: 'ch_16_ui_shell.js' });
          const ui = sandbox.ClipHub.UIShell;
          function eq(actual, expected, label) {
            const a = JSON.stringify(actual);
            const e = JSON.stringify(expected);
            if (a !== e) throw new Error(label + ': ' + a + ' != ' + e);
          }
          function ok(value, label) {
            if (!value) throw new Error(label);
          }
          ui.init({});
          let state = ui.getState();
          eq(state.registeredPageIds,
            ['home','detail','editor','tags','settings','regex_rules','regex_editor','regex_test','translation','tokenizer'],
            'registered pages');
          eq(state.pageStack, ['home'], 'initial stack');
          ok(ui.canEmbed('detail') === true, 'detail embed from home');

          ui.mountPage('detail', { id: 'detailView' }, {
            title: '内容详情', showBack: true,
            onBack: function () { return ui.unmountPage('detail', 'test_detail_back'); },
            onClose: function () { return ui.unmountPage('detail', 'test_detail_close'); }
          });
          eq(ui.getState().pageStack, ['home','detail'], 'detail stack');
          ok(ui.dispatchBack('test') === true, 'detail back');
          eq(ui.getState().pageStack, ['home'], 'detail back home');

          ui.mountPage('editor', { id: 'editorView' }, {
            title: '编辑剪贴板', showBack: true,
            onBack: function () { return ui.unmountPage('editor', 'test_editor_back'); },
            onClose: function () { return ui.unmountPage('editor', 'test_editor_close'); }
          });
          ok(ui.syncEmbeddedPage({
            pageId: 'tags', path: ['editor','tags'], title: '标签', showBack: true,
            view: { id: 'tagsView' }, onBack: function () { return true; }
          }) === true, 'sync tags');
          eq(ui.getState().pageStack, ['home','editor','tags'], 'tags stack');
          ok(ui.syncEmbeddedPage({
            pageId: 'tokenizer', path: ['editor','tokenizer'], title: '分词', showBack: true,
            view: { id: 'tokenizerView' }, onBack: function () { return true; }
          }) === true, 'sync tokenizer');
          eq(ui.getState().pageStack, ['home','editor','tokenizer'], 'tokenizer stack');
          ok(ui.unmountPage('editor', 'test_editor_family_close') === true, 'editor family unmount');
          eq(ui.getState().pageStack, ['home'], 'editor family home');

          ui.mountPage('settings', { id: 'settingsView' }, {
            title: 'ClipHub 设置', showBack: true,
            onBack: function () { return ui.unmountPage('settings', 'test_settings_back'); },
            onClose: function () { return ui.unmountPage('settings', 'test_settings_close'); }
          });
          for (const step of [
            ['regex_rules', ['settings','regex_rules']],
            ['regex_editor', ['settings','regex_rules','regex_editor']],
            ['regex_test', ['settings','regex_rules','regex_editor','regex_test']]
          ]) {
            ok(ui.syncEmbeddedPage({
              pageId: step[0], path: step[1], title: step[0], showBack: true,
              view: { id: step[0] }, onBack: function () { return true; }
            }) === true, 'sync ' + step[0]);
            eq(ui.getState().pageStack, ['home'].concat(step[1]), step[0] + ' stack');
          }
          ok(ui.unmountPage('settings', 'test_settings_family_close') === true, 'settings family unmount');
          eq(ui.getState().pageStack, ['home'], 'settings family home');

          ui.mountPage('translation', { id: 'translationView' }, {
            title: '翻译结果', showBack: true,
            onBack: function () { return ui.unmountPage('translation', 'test_translation_back'); },
            onClose: function () { return ui.unmountPage('translation', 'test_translation_close'); }
          });
          eq(ui.getState().pageStack, ['home','translation'], 'translation stack');
          ok(ui.dispatchClose('test') === true, 'translation close');
          eq(ui.getState().pageStack, ['home'], 'translation close home');

          let nestedRejected = false;
          try {
            ui.mountPage('regex_rules', { id: 'bad' }, {});
          } catch (error) {
            nestedRejected = true;
          }
          ok(nestedRejected, 'nested page direct mount must reject');
          eq(ui.getState().pageStack, ['home'], 'final stack');
          console.log('UIShell state-machine simulation: passed');
          NODE

      - name: Run release preflight
        run: bash scripts/release_preflight.sh --settings-tabs-beta
