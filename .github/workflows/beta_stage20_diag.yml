name: Beta Stage20 Diagnostic
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/stage20_diag_trigger.txt
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract Filter69 Stage20 anchors
        shell: bash
        run: |
          set -euo pipefail
          python stage20_diag.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage20_diag.txt
          git commit -m "记录 Stage20 首次 virtual window 诊断"
          git push
