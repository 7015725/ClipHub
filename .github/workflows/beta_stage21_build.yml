name: Beta Stage21 Build
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/stage21_build_trigger.txt
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Filter71
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('stage21_build.py')
          s=p.read_text(encoding='utf-8')
          old="""    if out.count('Executors.newSingleThreadExecutor')!=1:\n        raise RuntimeError('hydration executor count='+str(out.count('Executors.newSingleThreadExecutor')))\n"""
          new="""    executor_matches=re.findall(r'Executors\\s*\\.newSingleThreadExecutor\\s*\\(\\s*\\)',out)\n    if len(executor_matches)!=1:\n        raise RuntimeError('hydration executor count='+str(len(executor_matches)))\n"""
          if old not in s:
              raise SystemExit('executor validator anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python stage21_build.py
