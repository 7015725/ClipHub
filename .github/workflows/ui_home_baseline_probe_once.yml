name: UI Home Baseline Probe Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/ui_home_baseline_probe_once.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0

      - name: Probe current primary host and regex embedding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, json, re
          from pathlib import Path

          def expanded(path):
              text = Path(path).read_text(encoding='utf-8')
              m = re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);', text, re.S)
              if m is None:
                  return text
              pieces = re.findall(r'"(?:\\.|[^"\\])*"', m.group(1))
              return gzip.decompress(base64.b64decode(''.join(json.loads(p) for p in pieces))).decode('utf-8')

          def fn_span(text, name):
              m = re.search(r'(^|\n)([ \t]*)function\s+' + re.escape(name) + r'\s*\(', text, re.M)
              if m is None:
                  return None
              start = m.start(2)
              brace = text.find('{', m.end())
              depth = 0; quote = None; escaped = False; line = False; block = False
              i = brace
              while i < len(text):
                  c = text[i]; n = text[i+1] if i + 1 < len(text) else ''
                  if line:
                      if c == '\n': line = False
                  elif block:
                      if c == '*' and n == '/': block = False; i += 1
                  elif quote is not None:
                      if escaped: escaped = False
                      elif c == '\\': escaped = True
                      elif c == quote: quote = None
                  else:
                      if c == '/' and n == '/': line = True; i += 1
                      elif c == '/' and n == '*': block = True; i += 1
                      elif c in ('"', "'"): quote = c
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0: return text[start:i+1]
                  i += 1
              return None

          f = expanded('src/ch_11_filter.js')
          s = expanded('src/ch_13_settings.js')
          print('=== FILTER MODULE ===')
          mm = re.search(r'MODULE_NAME:\s*"ch_11_filter"\s*,\s*MODULE_VERSION:\s*(\d+)', f, re.S)
          print(mm.group(1) if mm else 'unknown')
          for name in ('mountPrimaryChildPage','unmountPrimaryChildPage','getPrimaryHostState','createPanelCache','buildHeader','createHeader','syncPrimaryHostHeader','applyPrimaryHostHeader'):
              body = fn_span(f, name)
              if body:
                  print('\n=== FILTER FUNCTION ' + name + ' ===\n' + body)
          print('\n=== FILTER PRIMARY/DRAG FUNCTION NAMES ===')
          for m in re.finditer(r'function\s+([A-Za-z0-9_$]*(?:Primary|primary|Header|header|Drag|drag)[A-Za-z0-9_$]*)\s*\(', f):
              print(m.group(1))
          print('\n=== FILTER DRAG HANDLE CONTEXT ===')
          lines = f.splitlines()
          for idx, line in enumerate(lines):
              low = line.lower()
              if 'draghandle' in low or 'drag handle' in low or 'drag_handle' in low:
                  a=max(0,idx-8); b=min(len(lines),idx+14)
                  print('\n'.join('%05d %s' % (j+1, lines[j]) for j in range(a,b)))

          print('\n=== SETTINGS MODULE ===')
          mm = re.search(r'MODULE_NAME:\s*"ch_13_settings"\s*,\s*MODULE_VERSION:\s*(\d+)', s, re.S)
          print(mm.group(1) if mm else 'unknown')
          for name in ('syncSettingsShellPage','openEmbeddedSettingsPage','setSettingsPage','handleSettingsBack','makeSettingsSubpageHeader','buildRegexRulesPage','buildPage'):
              body = fn_span(s, name)
              if body:
                  print('\n=== SETTINGS FUNCTION ' + name + ' ===\n' + body)
          print('\n=== SETTINGS EMBED CONTEXT ===')
          lines = s.splitlines()
          for idx, line in enumerate(lines):
              if 'embeddedInPrimary' in line or 'syncSettingsShellPage' in line or 'openEmbeddedSettingsPage' in line:
                  a=max(0,idx-4); b=min(len(lines),idx+8)
                  print('\n'.join('%05d %s' % (j+1, lines[j]) for j in range(a,b)))
          PY

      - name: Remove probe workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/ui_home_baseline_probe_once.yml
          git commit -m "清理首页基线探测工作流"
          git push origin HEAD:beta-regex-settings-tabs-20260814
