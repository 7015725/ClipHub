name: Icon System Apply Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/icon_system_apply_once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0

      - name: Guard production baseline
        run: |
          python3 - <<'PY'
          import subprocess
          baseline = '06dbeac91b0d27fdcefa73e4f1f37f5d403520dd'
          allowed = {
              '.github/workflows/icon_audit_once.yml',
              '.github/icon_probe_report.txt',
              '.github/icon_system_patch_once.py',
              '.github/workflows/icon_system_apply_once.yml',
          }
          changed = set(filter(None, subprocess.check_output(
              ['git','diff','--name-only',baseline + '..HEAD'], text=True).splitlines()))
          assert not (changed - allowed), ('production baseline moved', sorted(changed - allowed))
          print('Baseline guard passed:', sorted(changed))
          PY

      - name: Apply semantic icon system
        run: |
          python3 - <<'PY'
          import textwrap
          from pathlib import Path
          p = Path('.github/icon_system_patch_once.py')
          text = p.read_text(encoding='utf-8')
          start = text.index('def inject_make_text_bridge(source, path):')
          end = text.index('\n\nICON_CODE =', start)
          replacement = textwrap.dedent('''
          def inject_make_text_bridge(source, path):
              if "panel_icon_text_bridge_v1" in source:
                  return source
              candidates = ["makeText", "makeIcon", "makeEditorHeaderAction", "makeHeaderAction", "makeCloseButton"]
              found = None
              helper_name = None
              for candidate in candidates:
                  found = find_function(source, candidate)
                  if found is not None:
                      helper_name = candidate
                      break
              if found is None:
                  for candidate_match in re.finditer(r"\\bfunction\\s+([A-Za-z_$][\\w$]*)\\s*\\(", source):
                      candidate = candidate_match.group(1)
                      candidate_found = find_function(source, candidate)
                      if candidate_found is None:
                          continue
                      candidate_block = source[candidate_found[1]:candidate_found[2]]
                      if "TextView" in candidate_block and ".setText(" in candidate_block and re.search(r"\\breturn\\s+[A-Za-z_$][\\w$]*\\s*;", candidate_block):
                          helper_name = candidate
                          found = candidate_found
                          break
              assert found is not None, path
              match, brace, function_end = found
              params = [item.strip() for item in match.group(1).split(",") if item.strip()]
              block = source[brace:function_end]
              returns = list(re.finditer(r"\\breturn\\s+([A-Za-z_$][\\w$]*)\\s*;", block))
              assert returns, (path, helper_name)
              last = returns[-1]
              view_name = last.group(1)
              insert_at = brace + last.start()
              token_name = None
              size_name = None
              for param in params:
                  low = param.lower()
                  if token_name is None and ("text" in low or "icon" in low or "symbol" in low or "glyph" in low):
                      token_name = param
                  if size_name is None and ("size" in low or low.endswith("sp")):
                      size_name = param
              if token_name is None:
                  for param in params:
                      if re.search(r"\\.setText\\(\\s*(?:String\\(\\s*)?" + re.escape(param) + r"(?:\\s*\\))?\\s*\\)", block):
                          token_name = param
                          break
              if token_name is None:
                  low_helper = str(helper_name or "").lower()
                  if "close" in low_helper:
                      token_expr = "\\\"×\\\""
                  elif "back" in low_helper:
                      token_expr = "\\\"‹\\\""
                  elif "help" in low_helper:
                      token_expr = "\\\"?\\\""
                  elif "add" in low_helper:
                      token_expr = "\\\"+\\\""
                  else:
                      assert params, (path, helper_name)
                      token_expr = params[0]
              else:
                  token_expr = token_name
              size_expr = size_name if size_name is not None else "18"
              indent_match = re.search(r"(^[ \\t]*)return\\s+" + re.escape(view_name) + r"\\s*;", source[insert_at:function_end], re.M)
              indent = indent_match.group(1) if indent_match else "    "
              bridge = (
                  indent + "/* panel_icon_text_bridge_v1 */\\n" +
                  indent + "if (ClipHub.Theme && typeof ClipHub.Theme.decoratePanelIcon === \\\"function\\\") {\\n" +
                  indent + "    ClipHub.Theme.decoratePanelIcon(" + view_name + ", " + token_expr + ", " + view_name + ".getCurrentTextColor(), " + size_expr + ");\\n" +
                  indent + "}\\n" + indent
              )
              source = source[:insert_at] + bridge + source[insert_at:]
              assert "panel_icon_text_bridge_v1" in source
              return source
          ''').lstrip()
          p.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          python3 .github/icon_system_patch_once.py
          git checkout -- .github/icon_system_patch_once.py

      - name: Validate ES5 and release contracts
        run: |
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict
          node scripts/test_ui_shell_navigation.js
          node scripts/test_runtime_diagnostics.js
          python3 scripts/test_primary_window_legacy_routes.py
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check

      - name: Verify exact production boundary
        run: |
          python3 - <<'PY'
          import subprocess
          expected = {
              'src/ch_07_theme.js', 'src/ch_09_list.js', 'src/ch_10_editor.js',
              'src/ch_11_filter.js', 'src/ch_12_translation.js', 'src/ch_13_settings.js',
              'src/ch_17_tokenizer_ui.js', 'module-manifest.json', 'scripts/release_preflight.sh',
          }
          changed = set(filter(None, subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()))
          assert changed == expected, {'expected': sorted(expected), 'actual': sorted(changed)}
          print('Production allowlist passed:', sorted(changed))
          PY

      - name: Commit production and clean temporary files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ch_07_theme.js src/ch_09_list.js src/ch_10_editor.js src/ch_11_filter.js src/ch_12_translation.js src/ch_13_settings.js src/ch_17_tokenizer_ui.js module-manifest.json scripts/release_preflight.sh
          git rm -f .github/workflows/icon_audit_once.yml .github/icon_probe_report.txt .github/icon_system_patch_once.py .github/workflows/icon_system_apply_once.yml
          git commit -m '统一全局语义Icon绘制体系'
          git push
