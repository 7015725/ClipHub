name: Temporary settings IME legacy fallback fix

on:
  push:
    branches:
      - agent/unify-window-geometry
    paths:
      - .github/workflows/temporary_settings_ime_legacy_fallback_fix.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary_settings_ime_legacy_fallback_fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-window-geometry
          fetch-depth: 0
      - name: Preserve fallback and publish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          path = Path('src/ch_13_settings.js')
          text = path.read_text(encoding='utf-8')
          old = ('        } else if (!rootAvailable && !frameAvailable &&\n'
                 '                immHeight >= thresholdPx) {\n')
          new = ('        } else if (!rootAvailable &&\n'
                 '                immHeight >= thresholdPx) {\n')
          if text.count(old) != 1:
              raise SystemExit('legacy fallback condition mismatch')
          text = text.replace(old, new, 1)
          if text.count('        MODULE_VERSION: 18,\n') != 1:
              raise SystemExit('settings version mismatch')
          text = text.replace('        MODULE_VERSION: 18,\n',
                              '        MODULE_VERSION: 19,\n', 1)
          path.write_text(text, encoding='utf-8')

          manifest_path = Path('module-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion') != '20260724.23':
              raise SystemExit('module set version mismatch')
          manifest['moduleSetVersion'] = '20260724.24'
          blob = subprocess.check_output(
              ['git', 'hash-object', str(path)], text=True).strip()
          for item in manifest['modules']:
              if item.get('path') == str(path):
                  item['sha'] = blob
                  break
          else:
              raise SystemExit('settings module not found')
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8')
          PY
          node --check src/ch_13_settings.js
          git diff --check
          rm -f .github/workflows/temporary_settings_ime_legacy_fallback_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve legacy IME visibility fallback"
          git push origin HEAD:agent/unify-window-geometry
