name: Expanded JS Syntax Probe Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/expanded_js_syntax_probe_once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and inspect Settings syntax after first repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,json,re
          from pathlib import Path
          targets=['src/ch_11_filter.js','src/ch_12_translation.js','src/ch_13_settings.js']
          out=Path('/tmp/expanded'); out.mkdir(exist_ok=True)
          for path in targets:
              s=Path(path).read_text(encoding='utf-8')
              m=re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);',s,re.S)
              expanded=s
              if m:
                  parts=re.findall(r'"(?:\\.|[^"\\])*"',m.group(1))
                  expanded=gzip.decompress(base64.b64decode(''.join(json.loads(x) for x in parts))).decode('utf-8')
              if path.endswith('ch_13_settings.js'):
                  broken='''            content.addView(handleRow, new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT, dp(16)));\n        }());'''
                  fixed='''            content.addView(handleRow, new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT, dp(16)));\n            }\n        }());'''
                  assert expanded.count(broken)==1
                  expanded=expanded.replace(broken,fixed,1)
                  lines=expanded.splitlines()
                  print('===== SETTINGS AFTER FIX1 3190-3260 =====')
                  for n in range(3190, min(3261,len(lines)+1)):
                      print('%04d: %s' % (n, lines[n-1]))
              (out/Path(path).name).write_text(expanded,encoding='utf-8')
          PY
          for f in /tmp/expanded/*.js; do
            echo "===== $f ====="
            node --check "$f"
          done
