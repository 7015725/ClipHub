name: Expanded JS Syntax Probe Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/expanded_js_syntax_probe_once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff Settings32 vs Settings33 buildRootPage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,difflib,gzip,json,re,subprocess
          from pathlib import Path

          def unpack(text):
              m=re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);',text,re.S)
              if not m: return text
              parts=re.findall(r'"(?:\\.|[^"\\])*"',m.group(1))
              return gzip.decompress(base64.b64decode(''.join(json.loads(x) for x in parts))).decode('utf-8')

          old_loader=subprocess.check_output(['git','show','c183eee8a17d9212140cabfe88c9cf53bd6b91ad:src/ch_13_settings.js'],text=True)
          new_loader=Path('src/ch_13_settings.js').read_text(encoding='utf-8')
          old=unpack(old_loader)
          new=unpack(new_loader)

          # Apply known first repair in-memory so the remaining structural diff is easier to read.
          broken='''            content.addView(handleRow, new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT, dp(16)));\n        }());'''
          fixed='''            content.addView(handleRow, new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT, dp(16)));\n            }\n        }());'''
          assert new.count(broken)==1
          new=new.replace(broken,fixed,1)

          def section(src):
              a=src.index('    function buildRootPage() {')
              b=src.index('    /* REGEX_BETA_SETTINGS_BEGIN */',a)
              return src[a:b]

          old_sec=section(old).splitlines()
          new_sec=section(new).splitlines()
          print('===== BUILD ROOT PAGE DIFF =====')
          print('\n'.join(difflib.unified_diff(old_sec,new_sec,fromfile='Settings32',tofile='Settings33-fix1',lineterm='')))
          print('===== NEW BUILD ROOT PAGE =====')
          for i,line in enumerate(new_sec,1):
              print('%03d: %s' % (i,line))
          PY
