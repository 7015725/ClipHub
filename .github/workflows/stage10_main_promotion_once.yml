name: Stage10 Main Promotion Once

on:
  push:
    branches:
      - rc-main-20260815
    paths:
      - '.github/workflows/stage10_main_promotion_once.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v4
        with:
          ref: rc-main-20260815
          fetch-depth: 0

      - name: Configure git and fetch refs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          git fetch origin beta-regex-settings-tabs-20260814:refs/remotes/origin/beta-regex-settings-tabs-20260814

      - name: Apply atomic main promotion fields
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          beta = 'beta-regex-settings-tabs-20260814'

          entry = Path('ClipHub.js')
          text = entry.read_text(encoding='utf-8')
          old = 'var DEFAULT_REF = "' + beta + '";'
          new = 'var DEFAULT_REF = "main";'
          if text.count(old) != 1:
              raise SystemExit('ClipHub DEFAULT_REF anchor mismatch')
          entry.write_text(text.replace(old, new, 1), encoding='utf-8')

          manifest = Path('module-manifest.json')
          text = manifest.read_text(encoding='utf-8')
          old = '"sourceRef": "' + beta + '"'
          new = '"sourceRef": "main"'
          if text.count(old) != 1:
              raise SystemExit('Manifest sourceRef anchor mismatch')
          manifest.write_text(text.replace(old, new, 1), encoding='utf-8')

          preflight = Path('scripts/release_preflight.sh')
          text = preflight.read_text(encoding='utf-8')

          replacements = [
              ("    EXPECTED_MODULE_SET='20260809.05'\n    EXPECTED_ENTRY_VERSION='6'\n    EXPECTED_APP_MODULE_VERSION='20'",
               "    EXPECTED_MODULE_SET='20260815.17'\n    EXPECTED_ENTRY_VERSION='7'\n    EXPECTED_APP_MODULE_VERSION='22'", 1),
              ("if [ \"$MODE\" = '--settings-tabs-beta' ]; then",
               "if [ \"$MODE\" = '--settings-tabs-beta' ] || [ \"$MODE\" = '--main' ]; then", 1),
              ('expected_module_count = 17 if mode == "--settings-tabs-beta" else 15',
               'expected_module_count = 17 if mode in ("--settings-tabs-beta", "--main") else 15', 1),
              ('expected_theme_version = 5 if mode == "--settings-tabs-beta" else 4',
               'expected_theme_version = 5 if mode in ("--settings-tabs-beta", "--main") else 4', 1),
              ('if mode in ("--current", "--main"):',
               'if mode == "--current":', 2),
              ('if mode in ("--regex-beta", "--regex-rc", "--settings-tabs-beta"):',
               'if mode in ("--regex-beta", "--regex-rc", "--settings-tabs-beta", "--main"):', 1),
              ('if mode == "--settings-tabs-beta":',
               'if mode in ("--settings-tabs-beta", "--main"):', 3),
              ('assert len(manifest.get("modules", [])) == (17 if mode == "--settings-tabs-beta" else 15)',
               'assert len(manifest.get("modules", [])) == (17 if mode in ("--settings-tabs-beta", "--main") else 15)', 1),
          ]
          for old, new, expected_count in replacements:
              count = text.count(old)
              if count != expected_count:
                  raise SystemExit('Preflight anchor mismatch: %r expected %d got %d' % (old, expected_count, count))
              text = text.replace(old, new)

          preflight.write_text(text, encoding='utf-8')
          PY

      - name: Keep beta helper files out of main promotion diff
        run: |
          set -euo pipefail
          git checkout origin/main -- 'ClipHub_Beta浮窗开关.txt' 'ClipHub_Beta状态查询.txt'

      - name: Remove one-time workflow
        run: rm -f .github/workflows/stage10_main_promotion_once.yml

      - name: Validate promotion boundary before commit
        run: |
          set -euo pipefail
          BETA=origin/beta-regex-settings-tabs-20260814
          expected=$(printf '%s\n' \
            ClipHub.js \
            'ClipHub_Beta浮窗开关.txt' \
            'ClipHub_Beta状态查询.txt' \
            module-manifest.json \
            scripts/release_preflight.sh | sort)
          actual=$(git -c core.quotePath=false diff --name-only "$BETA" | sort)
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          for path in src/ch_*.js; do
            git diff --quiet "$BETA" -- "$path"
          done
          git diff --check
          echo 'Stage10 promotion boundary: passed'

      - name: Commit promotion candidate locally
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "Stage10准备ClipHub 20260815.17 Main Promotion RC"

      - name: Run formal main preflight on clean commit
        run: |
          set -euo pipefail
          test -z "$(git status --short)"
          python3 scripts/validate_es5.py .
          bash scripts/release_preflight.sh --main
          git diff --check origin/main...HEAD

      - name: Verify promotion contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path('module-manifest.json').read_text(encoding='utf-8'))
          entry = Path('ClipHub.js').read_text(encoding='utf-8')
          preflight = Path('scripts/release_preflight.sh').read_text(encoding='utf-8')

          assert manifest['moduleSetVersion'] == '20260815.17'
          assert manifest['entryMinVersion'] == 7
          assert manifest['sourceRef'] == 'main'
          assert re.search(r'var ENTRY_VERSION = 7;', entry)
          assert re.search(r'var DEFAULT_REF = "main";', entry)
          assert "EXPECTED_REF='main'" in preflight
          assert "EXPECTED_MODULE_SET='20260815.17'" in preflight
          assert "EXPECTED_ENTRY_VERSION='7'" in preflight
          assert "EXPECTED_APP_MODULE_VERSION='22'" in preflight
          assert '[ "$MODE" = \'--main\' ]' in preflight

          p = subprocess.run(
              ['git','-c','core.quotePath=false','grep','-l','beta-regex-settings-tabs-20260814','--','.'],
              stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
              text=True, check=False)
          found = {x.strip() for x in p.stdout.splitlines() if x.strip()}
          assert found <= {'scripts/release_preflight.sh'}, found
          print('Main promotion contracts: passed')
          print('Remaining current-beta literal files:', sorted(found))
          PY

      - name: Verify ancestry and runtime identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor origin/main HEAD
          git merge-base --is-ancestor origin/beta-regex-settings-tabs-20260814 HEAD
          test "$(git rev-list --count HEAD..origin/main)" = '0'
          for path in src/ch_*.js; do
            git diff --quiet origin/beta-regex-settings-tabs-20260814 -- "$path"
          done
          echo 'Main and beta ancestry/runtime identity: passed'

      - name: Push validated promotion RC
        run: git push origin HEAD:rc-main-20260815
