name: Beta Stage16A CardHolder Safe Binding
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/workflows/beta_stage16a_cardholder_binding.yml
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Filter58 CardHolder binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,glob,hashlib,json,pathlib,re
          root=pathlib.Path('.')
          loader_path=root/'src/ch_11_filter.js'
          loader=loader_path.read_text(encoding='utf-8')
          manifest_path=root/'module-manifest.json'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion')!='20260808.11': raise SystemExit('expected .11 baseline')
          if manifest.get('sourceRef')!='beta-pagination-stage10-20260808': raise SystemExit('wrong sourceRef')
          if '/* ClipHub Stage 15 rebuild peak diagnostics ES5 loader. */' not in loader:
              raise SystemExit('Stage15 loader baseline missing')
          if 'eval(transformSource(decodeSource(loadPackedSource())))' not in loader:
              raise SystemExit('Stage15 eval baseline missing')

          card_transform=r'''
    function transformCardHolderSource(source) {
        var info;
        var value;

        source = replaceOnceStrict(source,
            "MODULE_VERSION: 57", "MODULE_VERSION: 58",
            "Stage16A module version");

        source = replaceOnceStrict(source,
            "    function buildCardActionGrid(row, colors, metrics) {\n",
            "    function currentCardHolderRow(holder) {\n" +
            "        if (holder === null || holder === undefined ||\n" +
            "                holder.row === null || holder.row === undefined) {\n" +
            "            return null;\n" +
            "        }\n" +
            "        holder.itemId = Number(holder.row.id);\n" +
            "        return holder.row;\n" +
            "    }\n\n" +
            "    function buildCardActionGrid(holder, colors, metrics) {\n",
            "Stage16A holder helper");

        info = section(source,
            "    function buildCardActionGrid(holder, colors, metrics) {",
            "\n    function ",
            "Stage16A card actions");
        value = info.text;
        value = replaceOnceStrict(value,
            "                editResultRow(row, \"card_action_edit\");\n",
            "                editResultRow(currentCardHolderRow(holder),\n" +
            "                    \"card_action_edit\");\n",
            "Stage16A edit action");
        value = replaceOnceStrict(value,
            "                translateResultRow(row, \"card_action_translate\");\n",
            "                translateResultRow(currentCardHolderRow(holder),\n" +
            "                    \"card_action_translate\");\n",
            "Stage16A translate action");
        value = replaceOnceStrict(value,
            "                copyResultRow(row, \"card_action_copy\");\n",
            "                copyResultRow(currentCardHolderRow(holder),\n" +
            "                    \"card_action_copy\");\n",
            "Stage16A copy action");
        value = replaceOnceStrict(value,
            "                deleteResultRow(row, \"card_action_delete\");\n",
            "                deleteResultRow(currentCardHolderRow(holder),\n" +
            "                    \"card_action_delete\");\n",
            "Stage16A delete action");
        value = replaceOnceStrict(value,
            "        resultActionViews.push({\n" +
            "            edit: edit,\n" +
            "            translate: translate,\n" +
            "            copy: copy,\n" +
            "            delete: remove\n" +
            "        });\n",
            "        holder.editButton = edit;\n" +
            "        holder.translateButton = translate;\n" +
            "        holder.copyButton = copy;\n" +
            "        holder.deleteButton = remove;\n" +
            "        resultActionViews.push({\n" +
            "            edit: edit,\n" +
            "            translate: translate,\n" +
            "            copy: copy,\n" +
            "            delete: remove\n" +
            "        });\n",
            "Stage16A holder action refs");
        source = replaceSection(source, info, value);

        info = section(source,
            "    function bindSwipeGesture(row, wrapper, foreground, deleteAction,",
            "\n    function ",
            "Stage16A swipe binding");
        value = info.text;
        value = replaceOnceStrict(value,
            "    function bindSwipeGesture(row, wrapper, foreground, deleteAction,\n" +
            "            pinAction, metrics) {\n",
            "    function bindSwipeGesture(holder, wrapper, foreground, deleteAction,\n" +
            "            pinAction, metrics) {\n",
            "Stage16A swipe signature");
        value = replaceOnceStrict(value,
            "                            performSwipeAction(row, direction, foreground);\n",
            "                            performSwipeAction(\n" +
            "                                currentCardHolderRow(holder),\n" +
            "                                direction, foreground);\n",
            "Stage16A swipe action");
        source = replaceSection(source, info, value);

        info = section(source,
            "    function makeResultCard(row, colors) {",
            "\n    function ",
            "Stage16A result card");
        value = info.text;
        value = replaceOnceStrict(value,
            "        var actionGrid = buildCardActionGrid(row, colors, metrics);\n",
            "        var holder = {\n" +
            "            itemId: Number(row.id),\n" +
            "            row: row,\n" +
            "            wrapper: wrapper,\n" +
            "            actionLayer: actionLayer,\n" +
            "            deleteAction: deleteAction,\n" +
            "            pinAction: pinAction,\n" +
            "            card: card,\n" +
            "            iconView: icon,\n" +
            "            center: center,\n" +
            "            contentRow: contentRow,\n" +
            "            contentView: content,\n" +
            "            metaRow: metaRow,\n" +
            "            tagBadge: tagBadge,\n" +
            "            sourceView: source,\n" +
            "            pinBadge: null,\n" +
            "            actionGrid: null,\n" +
            "            selected: selected,\n" +
            "            pinned: pinned,\n" +
            "            metrics: metrics\n" +
            "        };\n" +
            "        var actionGrid = buildCardActionGrid(holder, colors, metrics);\n" +
            "        holder.actionGrid = actionGrid;\n",
            "Stage16A holder creation");
        value = replaceOnceStrict(value,
            "                onClick: function () { inputResultRow(row, \"card_click\"); }\n",
            "                onClick: function () {\n" +
            "                    inputResultRow(currentCardHolderRow(holder),\n" +
            "                        \"card_click\");\n" +
            "                }\n",
            "Stage16A card click");
        value = replaceOnceStrict(value,
            "            pinBadge = makePinnedBadge(colors, metrics);\n",
            "            pinBadge = makePinnedBadge(colors, metrics);\n" +
            "            holder.pinBadge = pinBadge;\n",
            "Stage16A pin badge ref");
        value = replaceOnceStrict(value,
            "        bindSwipeGesture(row, wrapper, card, deleteAction, pinAction, metrics);\n",
            "        bindSwipeGesture(holder, wrapper, card, deleteAction, pinAction, metrics);\n",
            "Stage16A swipe holder");
        source = replaceSection(source, info, value);

        if (source.indexOf("buildCardActionGrid(row, colors, metrics)") >= 0 ||
                source.indexOf("bindSwipeGesture(row, wrapper") >= 0 ||
                source.indexOf("inputResultRow(row, \"card_click\")") >= 0 ||
                source.indexOf("performSwipeAction(row, direction") >= 0) {
            throw new Error("Stage16A stale row listener binding detected");
        }
        if (source.indexOf("function currentCardHolderRow(holder)") < 0 ||
                source.indexOf("var holder = {") < 0 ||
                source.indexOf("holder.editButton = edit;") < 0 ||
                source.indexOf("holder.pinBadge = pinBadge;") < 0) {
            throw new Error("Stage16A holder wiring incomplete");
        }
        return source;
    }
'''
          anchor='''    try {
        eval(transformSource(decodeSource(loadPackedSource())));
'''
          if loader.count(anchor)!=1: raise SystemExit('eval insertion anchor mismatch')
          loader=loader.replace(anchor,card_transform+'\n    try {\n        eval(transformCardHolderSource(\n            transformSource(decodeSource(loadPackedSource()))));\n',1)
          loader=loader.replace('/* ClipHub Stage 15 rebuild peak diagnostics ES5 loader. */',
                                '/* ClipHub Stage 16A CardHolder safe-binding ES5 loader. */',1)
          loader=loader.replace('?stage15v11=','?stage16av12=',1)
          loader=loader.replace('ch_11_filter.js Stage 15 loader failed:',
                                'ch_11_filter.js Stage 16A loader failed:',1)
          loader_path.write_text(loader,encoding='utf-8')

          # Build a pure-JS harness and verify the transformed Filter58 source parses.
          parts=sorted(glob.glob('stage-assets/pagination-stage9/ch11_full_v8s_*.b64'))
          packed=''.join(pathlib.Path(p).read_text(encoding='utf-8').strip() for p in parts)
          stable=gzip.decompress(base64.b64decode(packed)).decode('utf-8')
          if hashlib.sha256(stable.encode()).hexdigest()!='328608b7fa357c9262079f43289d692ea7ddf79d9416e6135023d55f4bff6940':
              raise SystemExit('stable Filter56 source sha changed')
          text=loader_path.read_text(encoding='utf-8')
          start=text.index('    function replaceOnceStrict(')
          end=text.index('\n    try {',start)
          pure=text[start:end]
          harness='var __source='+json.dumps(stable)+';\n'+pure+'\nvar __out=transformCardHolderSource(transformSource(__source));\nrequire("fs").writeFileSync("/tmp/filter58.js",__out);\n'
          pathlib.Path('/tmp/stage16a_harness.js').write_text(harness,encoding='utf-8')

          data=loader_path.read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          manifest['moduleSetVersion']='20260808.12'
          found=False
          for m in manifest['modules']:
              if m['name']=='ch_11_filter.js':
                  m['sha']=blob; found=True
          if not found: raise SystemExit('filter manifest entry missing')
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('loader_blob='+blob)
          PY
          node --check src/ch_11_filter.js
          node /tmp/stage16a_harness.js
          node --check /tmp/filter58.js
          ! grep -Eq '(^|[^A-Za-z0-9_])(let|const|class)[[:space:]]|=>' /tmp/filter58.js
          grep -Fq 'MODULE_VERSION: 58' /tmp/filter58.js
          grep -Fq 'function currentCardHolderRow(holder)' /tmp/filter58.js
          grep -Fq 'buildCardActionGrid(holder, colors, metrics)' /tmp/filter58.js
          grep -Fq 'bindSwipeGesture(holder, wrapper' /tmp/filter58.js
          grep -Fq 'sameRangeNoLayoutCount' /tmp/filter58.js
          grep -Fq 'slowRebuildSamples' /tmp/filter58.js
          grep -Fq 'var VIRTUAL_BEFORE_SCREENS = 3;' /tmp/filter58.js
          grep -Fq 'var VIRTUAL_AFTER_SCREENS = 5;' /tmp/filter58.js
          grep -Fq 'var VIRTUAL_UPDATE_DELAY_MS = 24;' /tmp/filter58.js
          test "$(grep -Fo '.newSingleThreadExecutor();' /tmp/filter58.js | wc -l)" -eq 1
          ! grep -Fq 'resultTagBadgeViews' /tmp/filter58.js
          ! grep -Fq 'refreshRenderedTagBadges' /tmp/filter58.js
          grep -Fq '"moduleSetVersion": "20260808.12"' module-manifest.json
          git diff --check
      - name: Commit Filter58
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/beta_stage16a_cardholder_binding.yml .github/workflows/beta_stage16_cardholder_diag.yml stage16_cardholder_diag.txt
          git add src/ch_11_filter.js module-manifest.json
          git diff --cached --check
          git commit -m "安全化 Beta CardHolder 动作绑定"
          git push
