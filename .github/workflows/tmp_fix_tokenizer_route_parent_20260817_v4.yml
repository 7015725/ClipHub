name: Temp Fix Tokenizer Route Parent 20260817 V4

on:
  push:
    branches:
      - cleanup/tokenizer-no-regression-20260817
    paths:
      - .github/workflows/tmp_fix_tokenizer_route_parent_20260817_v4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/tokenizer-no-regression-20260817
          fetch-depth: 0

      - name: Apply corrected route fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/tmp_fix_tokenizer_route_parent_20260817.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply logical parent fix\n'
          start = source.index(marker)
          run_marker = '        run: |\n'
          start = source.index(run_marker, start) + len(run_marker)
          end = source.index('\n      - name: Validate route fix', start)
          script = textwrap.dedent(source[start:end])
          old = "packed_expr = '    var PACKED_B64 =\\n' + '\\n'.join(packed_expr_lines) + ';'"
          new = "packed_expr = '    var PACKED_B64 =\\n' + '\\n'.join(packed_expr_lines) + '\\n    ;'"
          if old not in script:
              raise AssertionError('packed expression line not found')
          script = script.replace(old, new, 1)
          Path('/tmp/apply_tokenizer_route_fix.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply_tokenizer_route_fix.sh
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/test_primary_window_system_back.py')
          text = path.read_text(encoding='utf-8')
          old = "assert 'MODULE_VERSION: 10' in nav"
          if old not in text:
              raise AssertionError('Navigation version assertion was not changed by base patch')
          path.write_text(text.replace(old, "assert 'MODULE_VERSION: 9' in nav", 1),
                          encoding='utf-8')

          path = Path('scripts/test_tokenizer_copy_ingest_contract.js')
          text = path.read_text(encoding='utf-8')
          old = "tokenizer.indexOf('MODULE_VERSION: 26')"
          if old not in text:
              raise AssertionError('copy-ingest TokenizerUI v26 assertion missing')
          path.write_text(text.replace(old, "tokenizer.indexOf('MODULE_VERSION: 27')", 1),
                          encoding='utf-8')
          PY

      - name: Validate route fix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_es5.py .
          node --check src/ch_16_ui_shell.js
          node scripts/test_ui_shell_navigation.js
          node scripts/test_child_back_route_contract.js
          node scripts/test_system_back_gesture_contract.js
          bash scripts/run_tokenizer_regression_suite.sh
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ch_16_ui_shell.js src/ch_17_tokenizer_ui.js \
            module-manifest.json scripts/manifest_contract.py \
            scripts/release_preflight.sh scripts/run_tokenizer_regression_suite.sh \
            scripts/test_primary_window_system_back.py \
            scripts/test_system_back_gesture_contract.js \
            scripts/test_tokenizer_rule_drawer_contract.js \
            scripts/test_tokenizer_layout_contract.js \
            scripts/test_tokenizer_copy_ingest_contract.js \
            scripts/test_child_back_route_contract.js \
            scripts/test_ui_shell_navigation.js
          git diff --cached --quiet && { echo 'No fix changes to commit'; exit 1; }
          git commit -m 'fix: model tokenizer home route explicitly'
          git push origin HEAD:cleanup/tokenizer-no-regression-20260817
