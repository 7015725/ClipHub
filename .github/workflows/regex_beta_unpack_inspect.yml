name: Regex Beta Unpack Inspect

on:
  push:
    branches:
      - beta-regex-filter-20260813

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-regex-filter-20260813
          fetch-depth: 0
      - name: Unpack canonical sources
        run: python3 tools/regex_beta_unpack_inspect.py
      - name: Commit inspection outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stage-assets/regex-beta-inspect
          if git diff --cached --quiet; then
            echo "No inspection changes"
            exit 0
          fi
          git commit -m "export regex beta canonical sources"
          git push origin HEAD:beta-regex-filter-20260813
