name: Settings Tabs Review Fix

on:
  push:
    branches: [beta-settings-tabs-20260814]
    paths:
      - .github/settings-tabs-beta-trigger.txt

concurrency:
  group: settings-tabs-review-fix-beta-settings-tabs-20260814
  cancel-in-progress: false

jobs:
  review-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded review fix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_settings_tabs_review_fix.py

          # GITHUB_TOKEN lacks workflows permission. Keep workflow/trigger cleanup
          # for the connector after the bounded source patch is committed.
          git restore --source=HEAD -- \
            .github/settings-tabs-beta-trigger.txt \
            .github/workflows/settings_tabs_beta.yml \
            .github/workflows/settings_tabs_validate.yml

          python3 - <<'PY'
          import subprocess
          allowed = {
              'module-manifest.json',
              'probes/cliphub_settings_tabs_probe_071.js',
              'scripts/release_preflight.sh',
              'src/ch_13_settings.js',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          missing = sorted(allowed - changed)
          if unexpected:
              raise SystemExit('review fix escaped boundary: ' + repr(unexpected))
          if missing:
              raise SystemExit('review fix missing expected changes: ' + repr(missing))
          print('Review-fix source path boundary: passed')
          PY

          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict | tee /tmp/settings-tabs-color.txt
          grep '^HIGH=0 WARN=0 ' /tmp/settings-tabs-color.txt
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check

      - name: Commit review fix source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            module-manifest.json \
            probes/cliphub_settings_tabs_probe_071.js \
            scripts/release_preflight.sh \
            src/ch_13_settings.js
          git diff --cached --stat
          git commit -m "修复设置页 Tab Beta 审查问题"
          git push origin HEAD:beta-settings-tabs-20260814
