name: One-shot review fix

on:
  push:
    branches:
      - beta-regex-settings-tabs-20260814
    paths:
      - .github/workflows/agent-once-review-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[review-fix-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0

      - name: Apply bounded review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import re
          from pathlib import Path

          ROOT = Path('.')
          SRC = ROOT / 'src'

          def git_blob_sha(text):
              data = text.encode('utf-8')
              return hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()

          def packed_info(text):
              m = re.search(r'\bvar\s+(PACKED_B64|encoded)\s*=\s*(.*?);', text, re.S)
              if not m:
                  return None
              pieces = re.findall(r'"(?:\\.|[^"\\])*"', m.group(2))
              encoded = ''.join(json.loads(piece) for piece in pieces)
              source = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
              return {'name': m.group(1), 'match': m, 'source': source}

          def packed_expr(encoded, indent='        ', width=120):
              chunks = [encoded[i:i + width] for i in range(0, len(encoded), width)]
              lines = []
              for i, chunk in enumerate(chunks):
                  suffix = ' +' if i + 1 < len(chunks) else ''
                  lines.append(indent + json.dumps(chunk) + suffix)
              return '\n' + '\n'.join(lines) + '\n    '

          def repack(text, source):
              info = packed_info(text)
              if not info:
                  return source
              payload = base64.b64encode(gzip.compress(source.encode('utf-8'), compresslevel=9, mtime=0)).decode('ascii')
              m = info['match']
              text = text[:m.start(2)] + packed_expr(payload) + text[m.end(2):]
              digest = hashlib.sha256(source.encode('utf-8')).hexdigest()
              if re.search(r'\bvar\s+SOURCE_SHA256\s*=\s*"[0-9a-fA-F]{64}";', text):
                  text = re.sub(
                      r'(\bvar\s+SOURCE_SHA256\s*=\s*")[0-9a-fA-F]{64}(";)',
                      r'\g<1>' + digest + r'\2', text, count=1)
              return text

          def load_source(path):
              text = path.read_text(encoding='utf-8')
              info = packed_info(text)
              return text, (info['source'] if info else text), bool(info)

          def write_source(path, wrapper, source, was_packed):
              final = repack(wrapper, source) if was_packed else source
              path.write_text(final, encoding='utf-8')

          def bump_module(source, module_name, old, new):
              pattern = (
                  r'(MODULE_NAME:\s*"' + re.escape(module_name) +
                  r'"\s*,\s*MODULE_VERSION:\s*)' + str(old) + r'\b'
              )
              updated, count = re.subn(pattern, r'\g<1>' + str(new), source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit('module version anchor mismatch: %s %s->%s' % (module_name, old, new))
              return updated

          def matching_brace(source, open_index):
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = open_index
              while i < len(source):
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < len(source) else ''
                  if line_comment:
                      if ch == '\n': line_comment = False
                      i += 1
                      continue
                  if block_comment:
                      if ch == '*' and nxt == '/':
                          block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch == '/' and nxt == '/':
                      line_comment = True
                      i += 2
                      continue
                  if ch == '/' and nxt == '*':
                      block_comment = True
                      i += 2
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                      i += 1
                      continue
                  if ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0: return i
                  i += 1
              raise SystemExit('unbalanced function body')

          BRIDGE_RE = re.compile(
              r'\s*/\*\s*panel_icon_text_bridge_v1\s*\*/\s*'
              r'if\s*\(ClipHub\.Theme\s*&&\s*typeof\s+ClipHub\.Theme\.decoratePanelIcon\s*===\s*"function"\)\s*\{\s*'
              r'ClipHub\.Theme\.decoratePanelIcon\(view,\s*text,\s*view\.getCurrentTextColor\(\),\s*sizeSp\);\s*\}\s*',
              re.S
          )

          EXPLICIT_BLOCK = '''\n        /* panel_icon_explicit_v2 */\n        if (ClipHub.Theme && typeof ClipHub.Theme.decoratePanelIcon === "function") {\n            ClipHub.Theme.decoratePanelIcon(\n                view, String(view.getText()), view.getCurrentTextColor(),\n                Number(view.getTextSize()) / Number(\n                    view.getResources().getDisplayMetrics().scaledDensity || 1\n                ), true\n            );\n        }'''

          def patch_icon_helpers(source, path_name):
              source, removed = BRIDGE_RE.subn('\n', source)
              if removed == 0:
                  return source, 0, 0
              candidates = list(re.finditer(r'function\s+(makeIcon[A-Za-z0-9_]*)\s*\([^)]*\)\s*\{', source))
              inserted = 0
              offset = 0
              for original in candidates:
                  start = original.start() + offset
                  open_brace = source.find('{', start)
                  end = matching_brace(source, open_brace)
                  body = source[open_brace + 1:end]
                  if 'panel_icon_explicit_v2' in body or 'makeText(' not in body:
                      continue
                  m = re.search(r'var\s+view\s*=\s*makeText\(.*?\);', body, re.S)
                  if m:
                      pos = open_brace + 1 + m.end()
                      source = source[:pos] + EXPLICIT_BLOCK + source[pos:]
                      offset += len(EXPLICIT_BLOCK)
                      inserted += 1
                      continue
                  m = re.search(r'return\s+makeText\((.*?)\);', body, re.S)
                  if m:
                      replacement = (
                          'var view = makeText(' + m.group(1) + ');' +
                          EXPLICIT_BLOCK + '\n        return view;'
                      )
                      a = open_brace + 1 + m.start()
                      b = open_brace + 1 + m.end()
                      source = source[:a] + replacement + source[b:]
                      offset += len(replacement) - (b - a)
                      inserted += 1
              if inserted == 0:
                  raise SystemExit('icon bridge removed but no explicit icon helper patched: ' + path_name)
              return source, removed, inserted

          versions = {
              'ch_06_repository.js': ('ch_06_repository', 19, 20),
              'ch_07_theme.js': ('ch_07_theme', 9, 10),
              'ch_09_list.js': ('ch_09_list', 24, 25),
              'ch_10_editor.js': ('ch_10_editor', 35, 36),
              'ch_11_filter.js': ('ch_11_filter', 86, 87),
              'ch_12_translation.js': ('ch_12_translation', 20, 21),
              'ch_13_settings.js': ('ch_13_settings', 40, 41),
              'ch_17_tokenizer_ui.js': ('ch_17_tokenizer_ui', 5, 6),
          }

          changed_icon_files = []
          for filename in ('ch_09_list.js', 'ch_10_editor.js', 'ch_11_filter.js',
                           'ch_12_translation.js', 'ch_13_settings.js', 'ch_17_tokenizer_ui.js'):
              path = SRC / filename
              wrapper, source, was_packed = load_source(path)
              source, removed, inserted = patch_icon_helpers(source, filename)
              if removed < 1:
                  raise SystemExit('expected panel icon bridge not found: ' + filename)
              source = bump_module(source, versions[filename][0], versions[filename][1], versions[filename][2])
              write_source(path, wrapper, source, was_packed)
              changed_icon_files.append((filename, removed, inserted))

          # Theme: require an explicit icon intent instead of inferring intent from arbitrary text.
          path = SRC / 'ch_07_theme.js'
          wrapper, source, was_packed = load_source(path)
          old_sig = 'function decoratePanelIcon(viewObj, value, colorValue, sizeDp) {'
          new_sig = 'function decoratePanelIcon(viewObj, value, colorValue, sizeDp, explicitIcon) {'
          if source.count(old_sig) != 1:
              raise SystemExit('Theme decoratePanelIcon signature anchor mismatch')
          source = source.replace(old_sig, new_sig, 1)
          old_guard = 'if (viewObj === null || viewObj === undefined || !isPanelIconToken(value)) { return false; }'
          new_guard = ('if (viewObj === null || viewObj === undefined || explicitIcon !== true ||\n'
                       '                !isPanelIconToken(value)) { return false; }')
          if source.count(old_guard) != 1:
              raise SystemExit('Theme decoratePanelIcon guard anchor mismatch')
          source = source.replace(old_guard, new_guard, 1)
          source = bump_module(source, 'ch_07_theme', 9, 10)
          write_source(path, wrapper, source, was_packed)

          # Regex oversize scans: visible, once-per-generation completion warning.
          path = SRC / 'ch_11_filter.js'
          wrapper, source, was_packed = load_source(path)
          needle = '        regexScanState.oversizeSkipped = Number(oversizeSkipped || 0);'
          if source.count(needle) != 1:
              raise SystemExit('Filter oversize publish anchor mismatch')
          notice = needle + '''\n        if (complete === true && regexScanState.oversizeSkipped > 0 &&\n                Number(regexScanState.oversizeNoticeGeneration || -1) !==\n                Number(generation)) {\n            regexScanState.oversizeNoticeGeneration = Number(generation);\n            try {\n                Packages.android.widget.Toast.makeText(\n                    androidContext,\n                    "有 " + regexScanState.oversizeSkipped +\n                        " 条超大内容未参与正则扫描",\n                    Packages.android.widget.Toast.LENGTH_LONG\n                ).show();\n            } catch (ignoredOversizeNotice) {}\n        }'''
          source = source.replace(needle, notice, 1)
          write_source(path, wrapper, source, was_packed)

          # Repository packed canonical source integrity and indirect eval.
          path = SRC / 'ch_06_repository.js'
          wrapper, source, was_packed = load_source(path)
          if not was_packed:
              raise SystemExit('Repository expected to remain packed')
          source = bump_module(source, 'ch_06_repository', 19, 20)
          wrapper = repack(wrapper, source)
          digest = hashlib.sha256(source.encode('utf-8')).hexdigest()
          if 'var SOURCE_SHA256' not in wrapper:
              java_anchor = '    var JavaString = Packages.java.lang.String;\n'
              if wrapper.count(java_anchor) != 1:
                  raise SystemExit('Repository JavaString anchor mismatch')
              wrapper = wrapper.replace(
                  java_anchor,
                  java_anchor + '    var MessageDigest = Packages.java.security.MessageDigest;\n' +
                  '    var SOURCE_SHA256 = "' + digest + '";\n',
                  1
              )
              helper_anchor = '    var input = null;\n'
              helper = '''    function bytesToHex(bytes) {\n        var parts = [];\n        var index;\n        var value;\n        var hex;\n        for (index = 0; index < bytes.length; index += 1) {\n            value = Number(bytes[index]);\n            if (value < 0) { value += 256; }\n            hex = value.toString(16);\n            parts.push(hex.length === 1 ? "0" + hex : hex);\n        }\n        return parts.join("");\n    }\n\n'''
              if wrapper.count(helper_anchor) != 1:
                  raise SystemExit('Repository input anchor mismatch')
              wrapper = wrapper.replace(helper_anchor, helper + helper_anchor, 1)
              wrapper = wrapper.replace('    var source;\n', '    var source;\n    var expandedBytes;\n', 1)
              old_eval = '        source = String(new JavaString(output.toByteArray(), "UTF-8"));\n        eval(source);'
              new_eval = '''        expandedBytes = output.toByteArray();\n        if (bytesToHex(MessageDigest.getInstance("SHA-256").digest(expandedBytes)) !==\n                SOURCE_SHA256) {\n            throw new Error("ch_06_repository.js source SHA mismatch");\n        }\n        source = String(new JavaString(expandedBytes, "UTF-8"));\n        (0, eval)(source);'''
              if wrapper.count(old_eval) != 1:
                  raise SystemExit('Repository eval anchor mismatch')
              wrapper = wrapper.replace(old_eval, new_eval, 1)
          path.write_text(wrapper, encoding='utf-8')

          # Add focused regression test.
          test_path = ROOT / 'scripts/test_review_regressions.py'
          test_path.write_text(r'''#!/usr/bin/env python3
          import base64, gzip, hashlib, json, re
          from pathlib import Path

          def expanded(path):
              text = Path(path).read_text(encoding="utf-8")
              m = re.search(r"\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);", text, re.S)
              if not m:
                  return text, text
              pieces = re.findall(r'"(?:\\.|[^"\\])*"', m.group(1))
              raw = gzip.decompress(base64.b64decode("".join(json.loads(x) for x in pieces)))
              return text, raw.decode("utf-8")

          theme_loader, theme = expanded("src/ch_07_theme.js")
          assert "explicitIcon !== true" in theme
          assert "panel_icon_text_bridge_v1" not in theme
          for name in ("ch_09_list.js", "ch_10_editor.js", "ch_11_filter.js",
                       "ch_12_translation.js", "ch_13_settings.js", "ch_17_tokenizer_ui.js"):
              loader, source = expanded("src/" + name)
              assert "panel_icon_text_bridge_v1" not in source, name
              assert "panel_icon_explicit_v2" in source, name

          _, list_source = expanded("src/ch_09_list.js")
          _, editor_source = expanded("src/ch_10_editor.js")
          assert "makeText(String(row.content)" in list_source
          assert "makeText(String(tag.name)" in editor_source

          repo_loader, repo = expanded("src/ch_06_repository.js")
          expected = re.search(r'var SOURCE_SHA256 = "([0-9a-f]{64})";', repo_loader)
          assert expected, "repository SOURCE_SHA256 missing"
          assert hashlib.sha256(repo.encode("utf-8")).hexdigest() == expected.group(1)
          assert "MessageDigest.getInstance(\"SHA-256\")" in repo_loader
          assert "(0, eval)(source);" in repo_loader

          _, filter_source = expanded("src/ch_11_filter.js")
          assert "条超大内容未参与正则扫描" in filter_source
          assert "oversizeNoticeGeneration" in filter_source
          print("Review regression checks: passed")
          ''', encoding='utf-8')

          # Release preflight: new versions and explicit-icon safety assertions.
          preflight = ROOT / 'scripts/release_preflight.sh'
          text = preflight.read_text(encoding='utf-8')
          text = text.replace("EXPECTED_MODULE_SET='20260815.26'", "EXPECTED_MODULE_SET='20260815.27'", 1)
          replacements = {
              '"ch_06_repository.js": ("ch_06_repository", 19),': '"ch_06_repository.js": ("ch_06_repository", 20),',
              '"ch_09_list.js": ("ch_09_list", 24),': '"ch_09_list.js": ("ch_09_list", 25),',
              '"ch_10_editor.js": ("ch_10_editor", 35),': '"ch_10_editor.js": ("ch_10_editor", 36),',
              '"ch_11_filter.js": ("ch_11_filter", 86),': '"ch_11_filter.js": ("ch_11_filter", 87),',
              '"ch_13_settings.js": ("ch_13_settings", 40),': '"ch_13_settings.js": ("ch_13_settings", 41),',
              '"ch_12_translation.js": ("ch_12_translation", 20),': '"ch_12_translation.js": ("ch_12_translation", 21),',
              '"ch_17_tokenizer_ui.js": ("ch_17_tokenizer_ui", 5),': '"ch_17_tokenizer_ui.js": ("ch_17_tokenizer_ui", 6),',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit('preflight version anchor mismatch: ' + old)
              text = text.replace(old, new, 1)
          text = text.replace('expected_theme_version = 9 if mode == "--settings-tabs-beta" else 4',
                              'expected_theme_version = 10 if mode == "--settings-tabs-beta" else 4', 1)
          old_bridge_check = '''        for icon_bridge_file in (\n            "ch_09_list.js", "ch_10_editor.js", "ch_11_filter.js",\n            "ch_12_translation.js", "ch_13_settings.js", "ch_17_tokenizer_ui.js",\n        ):\n            assert "panel_icon_text_bridge_v1" in actual_sources[icon_bridge_file], icon_bridge_file\n'''
          new_bridge_check = '''        for icon_bridge_file in (\n            "ch_09_list.js", "ch_10_editor.js", "ch_11_filter.js",\n            "ch_12_translation.js", "ch_13_settings.js", "ch_17_tokenizer_ui.js",\n        ):\n            assert "panel_icon_explicit_v2" in actual_sources[icon_bridge_file], icon_bridge_file\n            assert "panel_icon_text_bridge_v1" not in actual_sources[icon_bridge_file], icon_bridge_file\n        assert "explicitIcon !== true" in theme\n        assert "条超大内容未参与正则扫描" in filter_source\n        repository_loader = (root / "src/ch_06_repository.js").read_text(encoding="utf-8")\n        assert "var SOURCE_SHA256" in repository_loader\n        assert "MessageDigest.getInstance(\\\"SHA-256\\\")" in repository_loader\n'''
          if text.count(old_bridge_check) != 1:
              raise SystemExit('preflight icon bridge block mismatch')
          text = text.replace(old_bridge_check, new_bridge_check, 1)
          runtime_test = '  python3 scripts/test_primary_window_legacy_routes.py\n'
          if text.count(runtime_test) != 1:
              raise SystemExit('preflight runtime test anchor mismatch')
          text = text.replace(runtime_test, runtime_test + '  python3 scripts/test_review_regressions.py\n', 1)
          preflight.write_text(text, encoding='utf-8')

          # Manifest module set and all module blob SHAs.
          manifest_path = ROOT / 'module-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('sourceRef') != 'beta-regex-settings-tabs-20260814':
              raise SystemExit('manifest sourceRef changed unexpectedly')
          manifest['moduleSetVersion'] = '20260815.27'
          for item in manifest['modules']:
              module_path = ROOT / item['path']
              item['sha'] = git_blob_sha(module_path.read_text(encoding='utf-8'))
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print('Icon patches:', changed_icon_files)
          PY

      - name: Validate final tree
        shell: bash
        run: |
          python3 scripts/test_review_regressions.py
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check

      - name: Commit bounded fixes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-once-review-fix.yml
          git add src module-manifest.json scripts/release_preflight.sh scripts/test_review_regressions.py
          git status --short
          git commit -m "收口代码审查问题并补齐回归边界 [review-fix-complete]"
          git push origin HEAD:beta-regex-settings-tabs-20260814
