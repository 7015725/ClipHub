name: Regex Card Density Probe Once
on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/regex_card_density_probe_once.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0
      - name: Probe Regex card builder
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,json,re
          from pathlib import Path
          text=Path('src/ch_13_settings.js').read_text(encoding='utf-8')
          m=re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);',text,re.S)
          parts=re.findall(r'"(?:\\.|[^"\\])*"',m.group(1))
          src=gzip.decompress(base64.b64decode(''.join(json.loads(x) for x in parts))).decode('utf-8')
          def span(name):
              mm=re.search(r'(^|\n)([ \t]*)function\s+'+re.escape(name)+r'\s*\(',src,re.M)
              start=mm.start(2); b=src.find('{',mm.end()); d=0; q=None; esc=False; line=False; block=False; i=b
              while i<len(src):
                  c=src[i]; n=src[i+1] if i+1<len(src) else ''
                  if line:
                      if c=='\n': line=False
                  elif block:
                      if c=='*' and n=='/': block=False; i+=1
                  elif q is not None:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==q: q=None
                  else:
                      if c=='/' and n=='/': line=True; i+=1
                      elif c=='/' and n=='*': block=True; i+=1
                      elif c in ('"',"'"): q=c
                      elif c=='{': d+=1
                      elif c=='}':
                          d-=1
                          if d==0: return src[start:i+1]
                  i+=1
          print(span('makeRegexTouchWrapper'))
          print('\n=== ROW ===')
          print(span('makeRegexRuleRow'))
          PY
      - name: Remove probe
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/regex_card_density_probe_once.yml
          git commit -m "清理Regex卡片密度探测工作流"
          git push origin HEAD:beta-regex-settings-tabs-20260814
