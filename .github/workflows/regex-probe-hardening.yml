name: Harden Regex runtime probes

on:
  push:
    branches:
      - beta-regex-filter-20260813-rc-impl

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: beta-regex-filter-20260813-rc-impl
      - name: Create honest durable probes on target Beta
        shell: bash
        run: |
          set -euo pipefail
          TARGET=beta-regex-filter-20260813
          EXPECTED=499636d6195366972f2725172f232b18934572ee
          BASE=b23543f816fbeb777e5ceded12557433fd6aeae5
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "$TARGET"
          test "$(git rev-parse origin/$TARGET)" = "$EXPECTED"
          git checkout -B regex-probe-hardening origin/$TARGET

          cat > probes/cliphub_regex_066.js <<'EOF'
          /* ClipHub Regex Tester lifecycle probe 066 static smoke only. Rhino ES5.
           * Full lifecycle PASS requires cliphub_regex_tester_lifecycle_probe_066.md
           * on Android / ShortX; this script intentionally does not report ok:true.
           */
          (function (global) {
              var C = global.ClipHub;
              var state = C.Settings.getState();
              if (Number(C.Settings.MODULE_VERSION) < 26) {
                  throw new Error("Regex tester lifecycle module version failed");
              }
              if (String(state.settingsPage || "").length < 1) {
                  throw new Error("Regex tester lifecycle state unavailable");
              }
              ({ probe: 66, smokeOnly: true, manualRequired: true,
                  gate: "cliphub_regex_tester_lifecycle_probe_066.md",
                  settingsPage: state.settingsPage,
                  regexTestRunning: state.regexTestRunning === true });
          }((function () { return this; }())));
          EOF

          cat > probes/cliphub_regex_tester_lifecycle_probe_066.md <<'EOF'
          # ClipHub Regex Probe 066：Tester 生命周期 / 迟到 Callback

          > **门禁级别：Android / ShortX / Rhino ES5 实机 UI Probe。静态脚本只做 API smoke，不得将本 Probe 标记为 PASS。**

          ## 前置条件

          - 使用 `beta-regex-filter-20260813`。
          - Settings `MODULE_VERSION >= 26`。
          - 准备一个可编辑 Regex 规则；不要保存测试过程中用于验证 Draft 的 Pattern B。
          - 记录进入 Tester 前后的 `Settings.getState()`，至少关注 `settingsPage`、`regexTestRunning`、`renderCount`、测试结果相关字段。

          ## 主场景：迟到 Callback 不得污染 Editor

          1. 打开 Settings → Regex Rules → Regex Editor。
          2. 输入 **Pattern A**。
          3. 进入 Regex Tester。
          4. 使用足够大的手动文本启动测试 A，使任务有机会跨页面返回；确认测试进入 running 状态。
          5. **立即系统返回**到 Regex Editor。
          6. 把 Pattern 改成 **Pattern B**，但不要保存。
          7. 记录此时 `renderCount` 与 Pattern B 文本。
          8. 等待超过测试 A 正常返回所需时间，再读取页面和状态。

          ## 必须断言

          - `settingsPage === "regex_editor"`。
          - Editor 中 Pattern 仍为 **B**，未被旧 Draft / Tester 重建覆盖。
          - 旧测试 A 的 callback 不得使 `renderCount` 再增加。
          - `regexTestRunning === false`。
          - 旧 generation 不得写入测试结果、错误状态或重新 `buildPage()`。
          - 无崩溃、无悬空 Tester 页面。
          - 随后的系统返回优先级保持原逻辑。
          - IME 收起与窗口恢复保持原行为。

          ## Cancellation 调用点覆盖

          分别重复一次正在运行的测试，并从下列路径离开 Tester：

          1. `regex_test → regex_editor` 的 managed back。
          2. `setSettingsPage()` 从 `regex_test` 切到其它页。
          3. 关闭 Settings / `closePage()`。
          4. Settings `shutdown()`。
          5. 在 Tester 内启动新的测试 B，覆盖旧测试 A。

          每条路径都必须满足：旧 generation 永久 stale，不得在目标页面执行旧 callback 的 UI rebuild。

          ## PASS 记录

          只有以上主场景和 5 条 cancellation 路径全部在实机完成，且所有断言成立，才能记录 **Probe 066 PASS**。任何步骤未执行只能记 **NOT RUN**。
          EOF

          cat > probes/cliphub_regex_067.js <<'EOF'
          /* ClipHub Regex delete-confirm rebuild probe 067 static smoke only. Rhino ES5.
           * Full visible-view lifecycle PASS requires
           * cliphub_regex_delete_confirm_rebuild_probe_067.md on Android / ShortX.
           */
          (function (global) {
              var C = global.ClipHub;
              var state = C.Settings.getState();
              if (Number(C.Settings.MODULE_VERSION) < 26) {
                  throw new Error("Regex delete-confirm module version failed");
              }
              ({ probe: 67, smokeOnly: true, manualRequired: true,
                  gate: "cliphub_regex_delete_confirm_rebuild_probe_067.md",
                  settingsPage: state.settingsPage,
                  deleteConfirmCount: Number(state.regexDeleteConfirmCount || 0) });
          }((function () { return this; }())));
          EOF

          cat > probes/cliphub_regex_delete_confirm_rebuild_probe_067.md <<'EOF'
          # ClipHub Regex Probe 067：删除确认与 View 重建边界

          > **门禁级别：Android / ShortX 实机 UI Probe。静态 smoke 不得将本 Probe 标记为 PASS。**

          ## A. 同一可见 View 内二次点击仍可删除

          1. 新建一条仅用于 Probe 的 Regex 规则，并记录其 id。
          2. 在当前 `regex_rules` 页面第一次点击“删除”。
          3. 确认按钮文字变为“确认删除”，数据库中的该 id 仍存在。
          4. **不触发任何页面 rebuild**，在同一 View 第二次点击。
          5. 断言该规则被删除且 `regexDeleteConfirmCount` 只在第一次确认阶段增加。

          ## B. 任意规则页重建都必须使确认失效

          对每一种 rebuild 路径分别创建新的临时规则并执行：

          1. 第一次点击“删除”，进入“确认删除”状态。
          2. 触发一种 rebuild：
             - enable/disable toggle；
             - reorder/move；
             - 打开 Editor 后返回 Rules；
             - 离开 `regex_rules` 再重新进入；
             - 关闭 Settings 后重新打开。
          3. 回到新的 `regex_rules` View 后，按钮必须恢复普通“删除”。
          4. 此时第一次点击只能重新进入“确认删除”，**不得直接删除**。
          5. 查询数据库确认该 id 仍存在。
          6. 只有在该新 View 上再次点击才允许真正删除。

          ## C. 生命周期边界

          - 离开 `regex_rules` 的 managed back 必须清空 pending confirm。
          - `openRegexEditor()`、`moveRegexRule()`、`toggleRegexRuleEnabledFromSettings()` 必须清空。
          - `closePage()` 与 Settings `shutdown()` 必须清空。
          - 删除确认状态不得写入 SQLite、settings、EventBus 或其它持久化状态。

          ## PASS 记录

          A、B 的全部 rebuild 路径和 C 的生命周期检查全部通过后，才能记录 **Probe 067 PASS**。未在真实 View 生命周期执行时只能记 **NOT RUN**。
          EOF

          cat > probes/cliphub_regex_068.js <<'EOF'
          /* ClipHub regex title+note search probe 068. Rhino ES5. */
          (function (global) {
              var C = global.ClipHub;
              var marker = "probe-note-068-" + String(C.Base.now());
              var title = "Probe068-" + String(C.Base.now());
              var id = null;
              var byNote;
              var oldTitleOnly;
              try {
                  id = C.Repository.createRegexRule({
                      title: title, note: marker, pattern: "probe068", flags: 0,
                      enabled: true
                  });
                  byNote = C.Repository.listRegexRules({ searchKeyword: marker });
                  oldTitleOnly = C.Repository.listRegexRules({ titleKeyword: marker });
                  if (byNote.length !== 1 || Number(byNote[0].id) !== Number(id)) {
                      throw new Error("searchKeyword note search failed");
                  }
                  if (oldTitleOnly.length !== 0) {
                      throw new Error("titleKeyword legacy semantics regressed");
                  }
                  ({ probe: 68, ok: true });
              } finally {
                  if (id !== null) { try { C.Repository.deleteRegexRule(id); } catch (ignored) {} }
              }
          }((function () { return this; }())));
          EOF

          cat > probes/cliphub_regex_069.js <<'EOF'
          /* ClipHub regex 64-char duplicate probe 069. Rhino ES5. */
          (function (global) {
              var C = global.ClipHub;
              var stamp = String(C.Base.now());
              var prefix = stamp.substring(Math.max(0, stamp.length - 6));
              var base = ("Probe069-" + prefix + "-" +
                  "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789")
                  .substring(0, 64);
              var id = null;
              var copy = null;
              var row = null;
              try {
                  id = C.Repository.createRegexRule({ title: base, note: "",
                      pattern: "probe069", flags: 0, enabled: true });
                  copy = C.Repository.duplicateRegexRule(id);
                  row = C.Repository.getRegexRule(copy);
                  if (row === null || String(row.title).length > 64 ||
                          String(row.title).indexOf("副本") < 0) {
                      throw new Error("64-char duplicate title failed");
                  }
                  ({ probe: 69, ok: true, length: String(row.title).length });
              } finally {
                  if (copy !== null) { try { C.Repository.deleteRegexRule(copy); } catch (ignoredCopy) {} }
                  if (id !== null) { try { C.Repository.deleteRegexRule(id); } catch (ignoredId) {} }
              }
          }((function () { return this; }())));
          EOF

          cat > probes/cliphub_regex_070.js <<'EOF'
          /* ClipHub pathological regex guard probe 070. Rhino ES5. */
          (function (global) {
              var C = global.ClipHub;
              var risky = C.Repository.assessRegexRisk("(a+)+$");
              var safe = C.Repository.assessRegexRisk("a+b+");
              var stamp = String(C.Base.now());
              var blocked = false;
              var id = null;
              if (!risky.risky || safe.risky) {
                  throw new Error("Regex risk assessment failed");
              }
              try {
                  C.Repository.createRegexRule({
                      title: "Probe070-on-" + stamp, note: "",
                      pattern: "(a+)+$", flags: 0, enabled: true
                  });
              } catch (error) {
                  blocked = String(error).indexOf("regex_pattern_risky") >= 0;
              }
              if (!blocked) { throw new Error("Risky enabled rule was not blocked"); }
              try {
                  id = C.Repository.createRegexRule({
                      title: "Probe070-off-" + stamp, note: "",
                      pattern: "(a+)+$", flags: 0, enabled: false
                  });
                  ({ probe: 70, ok: true });
              } finally {
                  if (id !== null) { try { C.Repository.deleteRegexRule(id); } catch (ignored) {} }
              }
          }((function () { return this; }())));
          EOF

          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict
          git diff --check
          git add probes/cliphub_regex_066.js probes/cliphub_regex_067.js \
            probes/cliphub_regex_068.js probes/cliphub_regex_069.js probes/cliphub_regex_070.js \
            probes/cliphub_regex_tester_lifecycle_probe_066.md \
            probes/cliphub_regex_delete_confirm_rebuild_probe_067.md
          git commit -m 'test(regex): harden lifecycle and boundary probes'

          test -z "$(git diff "$BASE" -- src/ch_03_database.js src/ch_08_window.js src/ch_09_list.js src/ch_10_editor.js src/ch_12_translation.js src/ch_15_app.js ClipHub.js tasks)"
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict
          git diff --check
          bash scripts/release_preflight.sh --regex-rc

          git fetch origin "$TARGET"
          test "$(git rev-parse origin/$TARGET)" = "$EXPECTED"
          git push origin HEAD:"$TARGET"
      - name: Verify promoted probe-only commit
        shell: bash
        run: |
          set -euo pipefail
          TARGET=beta-regex-filter-20260813
          BASE=b23543f816fbeb777e5ceded12557433fd6aeae5
          git fetch origin "$TARGET"
          git checkout -B verify-probe origin/$TARGET
          test "$(git log -1 --format=%s)" = 'test(regex): harden lifecycle and boundary probes'
          test -z "$(git diff "$BASE" -- src/ch_03_database.js src/ch_08_window.js src/ch_09_list.js src/ch_10_editor.js src/ch_12_translation.js src/ch_15_app.js ClipHub.js tasks)"
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict
          git diff --check
          bash scripts/release_preflight.sh --regex-rc
      - name: Remove temporary staging workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout beta-regex-filter-20260813-rc-impl
          rm -f .github/workflows/regex-probe-hardening.yml
          git add -A
          git commit -m 'chore: remove regex probe hardening harness'
          git push origin HEAD:beta-regex-filter-20260813-rc-impl
