name: ClipHub Stage11 Preview Build

on:
  push:
    branches:
      - agent/beta-list-preview-on-demand-20260808
    paths:
      - tools/cliphub_stage11_preview_build.py
      - .github/workflows/cliphub_stage11_preview_build.yml
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - beta-pagination-stage10-20260808

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Align builder with actual Filter query-options shape
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('tools/cliphub_stage11_preview_build.py')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'    def patch_query_options\(block: str\) -> str:\n.*?\n    source = mutate_function\(source, "paginationQueryOptions", patch_query_options\)', re.S)
          replacement = '''    def patch_query_options(block: str) -> str:
              if "previewOnly" in block:
                  return block
              marker = "        return options;\\n"
              if block.count(marker) != 1:
                  raise RuntimeError("paginationQueryOptions return options anchor missing\\n" + block[:2400])
              return block.replace(
                  marker,
                  "        options.previewOnly = true;\\n" + marker,
                  1,
              )

          source = mutate_function(source, "paginationQueryOptions", patch_query_options)'''
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('builder patch_query_options replacement failed')
          p.write_text(s2, encoding='utf-8', newline='\n')
          PY

      - name: Build preview-on-demand implementation
        run: python tools/cliphub_stage11_preview_build.py

      - name: Rhino ES5 validation
        run: python scripts/validate_es5.py .

      - name: JavaScript syntax validation
        run: |
          node --check src/ch_06_repository.js
          node --check src/ch_09_list.js
          node --check src/ch_11_filter.js
          node --check ClipHub.js

      - name: Commit generated implementation
        run: |
          rm -f .github/workflows/cliphub_stage11_preview_build.yml
          rm -f tools/cliphub_stage11_preview_build.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "实现首页200字符预览与正文按需读取"
          BRANCH="${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          git push origin HEAD:${BRANCH}
