name: Temporary settings IME restore fix

on:
  push:
    branches:
      - agent/unify-window-geometry
    paths:
      - .github/workflows/temporary_settings_ime_restore_fix.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary_settings_ime_restore_fix.yml

permissions:
  contents: write

concurrency:
  group: cliphub-settings-ime-restore-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/unify-window-geometry
          fetch-depth: 0

      - name: Apply settings IME restore patch
        run: python3 scripts/temporary_settings_ime_restore_fix.py

      - name: Validate implementation
        run: |
          node --check src/ch_13_settings.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess

          text = Path('src/ch_13_settings.js').read_text(encoding='utf-8')
          for pattern in [r'\b(?:let|const)\b', r'=>', r'`', r'\?\.', r'\?\?']:
              if re.search(pattern, text):
                  raise SystemExit('Rhino ES5 violation: ' + pattern)
          for marker in [
              'var imeRestoreLayout = null;',
              'function imeVisibilityThresholdPx(metrics)',
              'root_window_insets_hidden',
              'imeStaleSignalIgnoredCount',
              'imeRestoreSnapshotCount',
              'MODULE_VERSION: 18'
          ]:
              if marker not in text:
                  raise SystemExit('missing marker: ' + marker)
          if 'ClipHub.Window.refreshWindow(panelWindowRoot' in text:
              raise SystemExit('legacy self-derived restore remains')
          manifest = json.loads(Path('module-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion') != '20260724.23':
              raise SystemExit('unexpected module set version')
          expected = subprocess.check_output(
              ['git', 'hash-object', 'src/ch_13_settings.js'], text=True
          ).strip()
          actual = next(item.get('sha') for item in manifest['modules']
              if item.get('path') == 'src/ch_13_settings.js')
          if actual != expected:
              raise SystemExit('manifest settings blob mismatch')
          PY
          git diff --check

      - name: Commit fix and clean temporary files
        run: |
          rm -f scripts/temporary_settings_ime_restore_fix.py
          rm -f .github/workflows/temporary_settings_ime_restore_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore settings geometry after IME closes"
          git push origin HEAD:agent/unify-window-geometry
