name: Tokenizer Regression Gate

on:
  push:
    branches:
      - cleanup/tokenizer-no-regression-20260817
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Assert guarded runtime cleanup scope
        if: github.event_name == 'push' || github.base_ref == 'cleanup/tokenizer-no-regression-20260817'
        shell: bash
        run: |
          set -euo pipefail
          base=622bf132da368d758d8a166cd9df284cae4bd5f6
          expected="$(printf '%s\n' \
            ClipHub.js \
            module-manifest.json \
            src/ch_10_editor.js \
            src/ch_11_filter.js \
            src/ch_12_translation.js \
            src/ch_13_settings.js \
            src/ch_16_ui_shell.js \
            src/ch_17_tokenizer_ui.js | sort)"
          actual="$(git diff --name-only "$base" HEAD -- ClipHub.js module-manifest.json src tasks | sort)"
          printf 'Expected guarded runtime scope:\n%s\n' "$expected"
          printf 'Actual guarded runtime scope:\n%s\n' "$actual"
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")

      - name: Rhino ES5 validation
        run: python3 scripts/validate_es5.py .

      - name: Color API release audit
        run: python3 scripts/audit_color_api.py --release-strict

      - name: Manifest contract
        run: python3 scripts/manifest_contract.py validate --settings-tabs-beta

      - name: Unified regression suite
        run: bash scripts/run_tokenizer_regression_suite.sh

      - name: Release preflight
        run: bash scripts/release_preflight.sh --settings-tabs-beta
