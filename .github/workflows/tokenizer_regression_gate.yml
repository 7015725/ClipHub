name: Tokenizer Regression Gate

on:
  push:
    branches:
      - cleanup/tokenizer-no-regression-20260817
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Google hide-after-launch patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/ch_12_translation.js')
          text = path.read_text(encoding='utf-8')
          old = '''    function startGoogleTranslateIntent(intent, method) {
        googleKeepVisibleUntil = now() + 3000;
        appContext.startActivity(intent);
        googleLastLaunchMethod = String(method || "unknown");
        googleLaunchSuccessCount += 1;
        googleLastError = null;
        return {
'''
          new = '''    function startGoogleTranslateIntent(intent, method) {
        appContext.startActivity(intent);
        googleLastLaunchMethod = String(method || "unknown");
        googleLaunchSuccessCount += 1;
        googleLastError = null;
        if (mainHandler !== null) {
            try {
                mainHandler.post(new Packages.java.lang.Runnable({
                    run: function () {
                        try {
                            if (ClipHub.Navigation &&
                                    typeof ClipHub.Navigation.hideUi ===
                                        "function") {
                                ClipHub.Navigation.hideUi(
                                    "google_translation_launched");
                            }
                        } catch (ignoredGoogleLaunchHide) {}
                    }
                }));
            } catch (ignoredGoogleHidePost) {}
        }
        return {
'''
          if old not in text:
              raise SystemExit('startGoogleTranslateIntent anchor missing or already changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          export CH12_SHA="$(git hash-object src/ch_12_translation.js)"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('module-manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          found = False
          for item in data.get('modules', []):
              if str(item.get('name', '')) == 'ch_12_translation.js':
                  item['sha'] = os.environ['CH12_SHA']
                  found = True
                  break
          if not found:
              raise SystemExit('translation manifest entry missing')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('ch12 sha=' + os.environ['CH12_SHA'])
          PY

          git show a61131b243562c79e6436074b30a1d272403f166:.github/workflows/tokenizer_regression_gate.yml > .github/workflows/tokenizer_regression_gate.yml
          rm -f .github/workflows/apply_google_hide_after_launch.yml
          rm -f .github/trigger_google_hide_once.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate guarded implementation
        shell: bash
        run: |
          set -euo pipefail
          node --check src/ch_12_translation.js
          python3 scripts/validate_es5.py .
          python3 scripts/manifest_contract.py validate --settings-tabs-beta
          bash scripts/run_tokenizer_regression_suite.sh
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check

      - name: Commit implementation and restore gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ch_12_translation.js module-manifest.json .github/workflows/tokenizer_regression_gate.yml
          git add -u .github/workflows/apply_google_hide_after_launch.yml .github/trigger_google_hide_once.txt || true
          git commit -m 'fix: hide ClipHub after Google translation launch'
          git push origin HEAD:cleanup/tokenizer-no-regression-20260817
