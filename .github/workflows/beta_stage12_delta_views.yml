name: Beta Stage12 Delta Views
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/workflows/beta_stage12_delta_views.yml
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Filter 52 delta view window
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,glob,hashlib,json,pathlib,re,math
          base_sha='88e0accc4842ab4c873245a9e46c1fce0d9c4e920dc96624d0dac63c8a3a25fd'
          part_paths=sorted(glob.glob('stage-assets/pagination-stage9/ch11_full_v6_*.b64'))
          if len(part_paths)!=8: raise SystemExit('expected 8 v6 parts, got %d'%len(part_paths))
          packed=''.join(pathlib.Path(p).read_text(encoding='utf-8').strip() for p in part_paths)
          source=gzip.decompress(base64.b64decode(packed)).decode('utf-8')
          if hashlib.sha256(source.encode()).hexdigest()!=base_sha: raise SystemExit('v6 source sha mismatch')
          if source.count('MODULE_VERSION: 51')!=1: raise SystemExit('Filter 51 identity mismatch')
          source=source.replace('MODULE_VERSION: 51','MODULE_VERSION: 52')
          decl='''        var generation;\n        var hydration;\n'''
          decl_new='''        var generation;\n        var hydration;\n        var oldStart;\n        var oldEnd;\n        var overlap;\n        var removeTop;\n        var removeBottom;\n        var removeIndex;\n        var wrapper;\n        var cardRef;\n        var actionRef;\n        var recycledCount;\n'''
          if source.count(decl)!=1: raise SystemExit('declaration anchor mismatch')
          source=source.replace(decl,decl_new)
          old='''        var viewRebuildStartedAt =\n            Number(System.currentTimeMillis());\n        var viewRebuildElapsed;\n        scrollPerformanceState.viewRebuildCount += 1;\n        measureVirtualCards();\n        oldCount = Number(virtualCardHost.getChildCount());\n        scrollPerformanceState.removedViewCount += oldCount;\n        virtualCardHost.removeAllViews();\n        virtualRenderedItemIds = [];\n        resultCardViews = [];\n        resultActionViews = [];\n        state.resultCardCount = 0;\n        state.resultSourceIconCount = 0;\n        state.renderedTagLabelCount = 0;\n        state.cardActionButtonCount = 0;\n        state.pinnedBadgeCount = 0;\n        for (index = range.start; index <= range.end; index += 1) {\n            params = new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT,\n                LinearLayout.LayoutParams.WRAP_CONTENT);\n            params.bottomMargin = dp(6);\n            virtualCardHost.addView(makeResultCard(\n                previewRows[index], colors), params);\n            scrollPerformanceState.createdViewCount += 1;\n            virtualRenderedItemIds.push(\n                Number(previewRows[index].id));\n        }\n'''
          new='''        var viewRebuildStartedAt =\n            Number(System.currentTimeMillis());\n        var viewRebuildElapsed;\n        scrollPerformanceState.viewRebuildCount += 1;\n        measureVirtualCards();\n        oldCount = Number(virtualCardHost.getChildCount());\n        oldStart = Number(virtualState.firstRenderedIndex);\n        oldEnd = Number(virtualState.lastRenderedIndex);\n        recycledCount = oldCount;\n        overlap = force !== true && oldCount > 0 &&\n            oldEnd >= oldStart && range.start <= oldEnd &&\n            range.end >= oldStart &&\n            virtualRenderedItemIds.length === oldCount &&\n            resultCardViews.length === oldCount &&\n            resultActionViews.length === oldCount;\n        if (overlap) {\n            recycledCount = 0;\n            removeTop = Math.max(0, range.start - oldStart);\n            for (removeIndex = 0;\n                    removeIndex < removeTop; removeIndex += 1) {\n                virtualCardHost.removeViewAt(0);\n                virtualRenderedItemIds.shift();\n                resultCardViews.shift();\n                resultActionViews.shift();\n                recycledCount += 1;\n            }\n            removeBottom = Math.max(0, oldEnd - range.end);\n            for (removeIndex = 0;\n                    removeIndex < removeBottom; removeIndex += 1) {\n                virtualCardHost.removeViewAt(\n                    Number(virtualCardHost.getChildCount()) - 1);\n                virtualRenderedItemIds.pop();\n                resultCardViews.pop();\n                resultActionViews.pop();\n                recycledCount += 1;\n            }\n            scrollPerformanceState.removedViewCount += recycledCount;\n            if (range.start < oldStart) {\n                for (index = oldStart - 1;\n                        index >= range.start; index -= 1) {\n                    params = new LinearLayout.LayoutParams(\n                        LinearLayout.LayoutParams.MATCH_PARENT,\n                        LinearLayout.LayoutParams.WRAP_CONTENT);\n                    params.bottomMargin = dp(6);\n                    wrapper = makeResultCard(previewRows[index], colors);\n                    cardRef = resultCardViews.pop();\n                    actionRef = resultActionViews.pop();\n                    virtualCardHost.addView(wrapper, 0, params);\n                    resultCardViews.unshift(cardRef);\n                    resultActionViews.unshift(actionRef);\n                    virtualRenderedItemIds.unshift(\n                        Number(previewRows[index].id));\n                    scrollPerformanceState.createdViewCount += 1;\n                }\n            }\n            if (range.end > oldEnd) {\n                for (index = oldEnd + 1;\n                        index <= range.end; index += 1) {\n                    params = new LinearLayout.LayoutParams(\n                        LinearLayout.LayoutParams.MATCH_PARENT,\n                        LinearLayout.LayoutParams.WRAP_CONTENT);\n                    params.bottomMargin = dp(6);\n                    virtualCardHost.addView(makeResultCard(\n                        previewRows[index], colors), params);\n                    virtualRenderedItemIds.push(\n                        Number(previewRows[index].id));\n                    scrollPerformanceState.createdViewCount += 1;\n                }\n            }\n            state.resultCardCount = Number(\n                virtualCardHost.getChildCount());\n        } else {\n            scrollPerformanceState.removedViewCount += oldCount;\n            virtualCardHost.removeAllViews();\n            virtualRenderedItemIds = [];\n            resultCardViews = [];\n            resultActionViews = [];\n            state.resultCardCount = 0;\n            state.resultSourceIconCount = 0;\n            state.renderedTagLabelCount = 0;\n            state.cardActionButtonCount = 0;\n            state.pinnedBadgeCount = 0;\n            for (index = range.start; index <= range.end; index += 1) {\n                params = new LinearLayout.LayoutParams(\n                    LinearLayout.LayoutParams.MATCH_PARENT,\n                    LinearLayout.LayoutParams.WRAP_CONTENT);\n                params.bottomMargin = dp(6);\n                virtualCardHost.addView(makeResultCard(\n                    previewRows[index], colors), params);\n                scrollPerformanceState.createdViewCount += 1;\n                virtualRenderedItemIds.push(\n                    Number(previewRows[index].id));\n            }\n        }\n'''
          if source.count(old)!=1: raise SystemExit('full rebuild anchor mismatch')
          source=source.replace(old,new)
          old_recycle='''        virtualState.recycleCount += oldCount;\n'''
          if source.count(old_recycle)!=1: raise SystemExit('recycle anchor mismatch')
          source=source.replace(old_recycle,'        virtualState.recycleCount += recycledCount;\n')
          for token in ['var VIRTUAL_BEFORE_SCREENS = 3;','var VIRTUAL_AFTER_SCREENS = 5;','var VIRTUAL_UPDATE_DELAY_MS = 24;','result_scroll_same_range_fast']:
              if token not in source: raise SystemExit('missing invariant '+token)
          if source.count('.newSingleThreadExecutor();')!=1: raise SystemExit('executor count changed')
          if source.count('virtualCardHost.removeAllViews();')<1: raise SystemExit('force/full fallback removed')
          if source.count('virtualCardHost.removeViewAt(')<2: raise SystemExit('delta remove path missing')
          source_sha=hashlib.sha256(source.encode()).hexdigest()
          gz=gzip.compress(source.encode('utf-8'),compresslevel=9,mtime=0)
          b64=base64.b64encode(gz).decode('ascii')
          packed_sha=hashlib.sha256(b64.encode()).hexdigest()
          chunk=math.ceil(len(b64)/8)
          v7=[]
          for i in range(8):
              path='stage-assets/pagination-stage9/ch11_full_v7_%02d.b64'%i
              pathlib.Path(path).write_text(b64[i*chunk:(i+1)*chunk]+'\n',encoding='utf-8')
              v7.append(path)
          loader_path=pathlib.Path('src/ch_11_filter.js')
          loader=loader_path.read_text(encoding='utf-8')
          loader=loader.replace('/* ClipHub Stage 12 same-range scroll fast-path ES5 loader. */','/* ClipHub Stage 12 delta virtual-card window ES5 loader. */')
          parts='    var PARTS = [\n'+',\n'.join('        "'+p+'"' for p in v7)+'\n    ];'
          loader,n=re.subn(r'    var PARTS = \[.*?\n    \];',parts,loader,count=1,flags=re.S)
          if n!=1: raise SystemExit('loader PARTS anchor mismatch')
          loader,n=re.subn(r'(    var PACKED_SHA256 =\n        ")[0-9a-f]+(";)',r'\g<1>'+packed_sha+r'\2',loader,count=1)
          if n!=1: raise SystemExit('loader packed sha anchor mismatch')
          loader,n=re.subn(r'(    var SOURCE_SHA256 =\n        ")[0-9a-f]+(";)',r'\g<1>'+source_sha+r'\2',loader,count=1)
          if n!=1: raise SystemExit('loader source sha anchor mismatch')
          loader,n=re.subn(r'    var CACHE_NAME = "[^"]+";','    var CACHE_NAME = "ch_11_filter_stage12_v7_delta_views_full.b64";',loader,count=1)
          if n!=1: raise SystemExit('loader cache anchor mismatch')
          loader=loader.replace('?stage12v6=','?stage12v7=')
          loader_path.write_text(loader,encoding='utf-8')
          def blob_sha(path):
              data=pathlib.Path(path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          mp=pathlib.Path('module-manifest.json')
          manifest=json.loads(mp.read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion')!='20260808.05': raise SystemExit('expected moduleSet .05')
          manifest['moduleSetVersion']='20260808.06'
          manifest['sourceRef']='beta-pagination-stage10-20260808'
          for m in manifest['modules']:
              if m['name']=='ch_11_filter.js': m['sha']=blob_sha('src/ch_11_filter.js')
          mp.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          pathlib.Path('/tmp/ch11_filter_v52.js').write_text(source,encoding='utf-8')
          print('source_sha='+source_sha)
          print('packed_sha='+packed_sha)
          print('loader_blob='+blob_sha('src/ch_11_filter.js'))
          PY
          node --check /tmp/ch11_filter_v52.js
          node --check src/ch_11_filter.js
          ! grep -Eq '(^|[^A-Za-z0-9_])(let|const|class)[[:space:]]|=>' /tmp/ch11_filter_v52.js
          grep -Fq 'MODULE_VERSION: 52' /tmp/ch11_filter_v52.js
          grep -Fq 'virtualCardHost.removeViewAt(' /tmp/ch11_filter_v52.js
          grep -Fq 'resultCardViews.unshift(cardRef);' /tmp/ch11_filter_v52.js
          grep -Fq 'var VIRTUAL_BEFORE_SCREENS = 3;' /tmp/ch11_filter_v52.js
          grep -Fq 'var VIRTUAL_AFTER_SCREENS = 5;' /tmp/ch11_filter_v52.js
          grep -Fq 'var VIRTUAL_UPDATE_DELAY_MS = 24;' /tmp/ch11_filter_v52.js
          grep -Fq '"moduleSetVersion": "20260808.06"' module-manifest.json
          git diff --check
      - name: Commit Beta Filter 52
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/beta_stage12_delta_views.yml
          git add src/ch_11_filter.js module-manifest.json stage-assets/pagination-stage9/ch11_full_v7_*.b64
          git commit -m "优化 Beta 虚拟列表差量 View 更新"
          git push
