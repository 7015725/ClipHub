name: UI Home Baseline Alignment V2 Once

on:
  push:
    branches:
      - beta-regex-settings-tabs-20260814
    paths:
      - .github/workflows/ui_home_baseline_alignment_v2_once.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0

      - name: Guard baseline and apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('module-manifest.json').read_text(encoding='utf-8'))
          assert manifest['sourceRef'] == 'beta-regex-settings-tabs-20260814'
          assert manifest['moduleSetVersion'] == '20260815.19'
          assert manifest['entryMinVersion'] == 7
          print('baseline guard passed')
          PY
          python3 .github/ui_home_baseline_patch_once.py

      - name: Validate full beta contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict
          node scripts/test_ui_shell_navigation.js
          node scripts/test_runtime_diagnostics.js
          python3 scripts/test_primary_window_legacy_routes.py
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {
              'src/ch_10_editor.js',
              'src/ch_13_settings.js',
              'module-manifest.json',
              'scripts/release_preflight.sh'
          }
          assert changed == expected, (changed, expected)
          print('production allowlist passed')
          PY

      - name: Commit validated changes and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/ui_home_baseline_alignment_once.yml
          git rm -f .github/workflows/ui_home_baseline_alignment_retry.yml
          git rm -f .github/workflows/ui_home_baseline_alignment_v2_once.yml
          git rm -f .github/ui_home_baseline_patch_once.py
          git add src/ch_10_editor.js src/ch_13_settings.js module-manifest.json scripts/release_preflight.sh
          git diff --cached --check
          git commit -m "按首页基线收口Regex与编辑页视觉"
          git push origin HEAD:beta-regex-settings-tabs-20260814
