name: Beta Stage18 Diagnostic
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/stage18_diag_trigger.txt
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract Filter67 Stage18 anchors
        shell: bash
        run: |
          set -euo pipefail
          python stage18_diag.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage18_diag.txt
          git commit -m "记录 Stage18 overlap 分帧诊断"
          git push
