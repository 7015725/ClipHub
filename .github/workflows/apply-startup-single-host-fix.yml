name: Apply ClipHub startup single-host boundary fix

on:
  push:
    branches:
      - agent/optimize-cliphub-window-startup-v1-20260805
    paths:
      - .github/workflows/apply-startup-single-host-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optimize-cliphub-window-startup-v1-20260805
          fetch-depth: 0

      - name: Decode boundary patcher
        shell: bash
        run: |
          mkdir -p tools
          cat <<'PAYLOAD' | base64 -d | gzip -d > tools/apply_cliphub_single_host_fix.py
          
          PAYLOAD
          python -m py_compile tools/apply_cliphub_single_host_fix.py

      - name: Apply boundary fix
        run: python tools/apply_cliphub_single_host_fix.py

      - name: Validate changes
        shell: bash
        run: |
          node --check src/ch_08_window.js
          node --check src/ch_11_filter.js
          python -m json.tool module-manifest.json >/dev/null
          grep -q "preservePreparedFrame" src/ch_08_window.js
          grep -q "preservePreparedFrame" src/ch_11_filter.js

      - name: Commit boundary fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve single-host window cache metadata"
          git push origin HEAD:agent/optimize-cliphub-window-startup-v1-20260805
