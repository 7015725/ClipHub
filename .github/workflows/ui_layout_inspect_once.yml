name: UI Layout Inspect Once

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/ui_layout_inspect_once.yml

permissions:
  contents: write

jobs:
  inspect-ui-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract current packed UI functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, json, pathlib, re

          root = pathlib.Path('.')

          def expanded(path):
              text = path.read_text(encoding='utf-8')
              assignment = re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);', text, re.S)
              if assignment is None:
                  return text
              pieces = re.findall(r'"(?:\\.|[^"\\])*"', assignment.group(1))
              encoded = ''.join(json.loads(piece) for piece in pieces)
              return gzip.decompress(base64.b64decode(encoded)).decode('utf-8')

          def extract_function(text, name):
              pattern = re.compile(r'(^|\n)([ \t]*)function\s+' + re.escape(name) + r'\s*\(', re.M)
              match = pattern.search(text)
              if match is None:
                  return None
              start = match.start(2)
              brace = text.find('{', match.end())
              if brace < 0:
                  return None
              depth = 0
              quote = None
              escape = False
              line_comment = False
              block_comment = False
              i = brace
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ''
                  if line_comment:
                      if c == '\n': line_comment = False
                  elif block_comment:
                      if c == '*' and n == '/':
                          block_comment = False
                          i += 1
                  elif quote is not None:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == quote:
                          quote = None
                  else:
                      if c == '/' and n == '/':
                          line_comment = True
                          i += 1
                      elif c == '/' and n == '*':
                          block_comment = True
                          i += 1
                      elif c in ('\"', "'"):
                          quote = c
                      elif c == '{':
                          depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              return text[start:i + 1]
                  i += 1
              return None

          manifest = json.loads((root / 'module-manifest.json').read_text(encoding='utf-8'))
          print('=== MANIFEST ===')
          print('moduleSetVersion=' + str(manifest.get('moduleSetVersion')))
          print('sourceRef=' + str(manifest.get('sourceRef')))
          print('moduleCount=' + str(len(manifest.get('modules', []))))

          sources = {
              'filter': expanded(root / 'src/ch_11_filter.js'),
              'settings': expanded(root / 'src/ch_13_settings.js'),
              'theme': expanded(root / 'src/ch_07_theme.js')
          }
          for label, source in sources.items():
              m = re.search(r'MODULE_NAME:\s*[\"\']([^\"\']+)[\"\']\s*,\s*MODULE_VERSION:\s*(\d+)', source, re.S)
              print('MODULE ' + label + '=' + (m.group(1) + ':' + m.group(2) if m else 'unknown'))

          targets = {
              'filter': ['headerMetrics', 'buildSearchHeader', 'createPanelCache'],
              'settings': [
                  'makeSettingsTabBar', 'makeSettingsSubpageHeader',
                  'makeSection', 'makeSectionTitle', 'buildPage',
                  'settingsRootTabsActive', 'setSettingsTab'
              ]
          }
          for label, names in targets.items():
              print('\n=== ' + label.upper() + ' FUNCTIONS ===')
              source = sources[label]
              for name in names:
                  fn = extract_function(source, name)
                  print('\n--- ' + name + ' ---')
                  print(fn if fn is not None else '<missing>')

          print('\n=== SETTINGS HEADER LITERALS ===')
          settings = sources['settings']
          for needle in ['全局剪切板', '设置', '通用', '首页', '翻译', '筛选']:
              positions = [m.start() for m in re.finditer(re.escape(needle), settings)]
              print(needle + ': ' + str(positions[:12]))
          PY

      - name: Remove inspect workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/ui_layout_inspect_once.yml
          git commit -m "清理UI布局诊断工作流"
          git push origin HEAD:beta-regex-settings-tabs-20260814
