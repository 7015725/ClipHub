name: Stage9 RC Cleanup Once

on:
  push:
    branches:
      - beta-regex-settings-tabs-20260814
    paths:
      - '.github/workflows/stage9_rc_cleanup_once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: beta-regex-settings-tabs-20260814
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Remove beta implementation residue
        run: |
          set -euo pipefail
          rm -f \
            .github/regex-filter-layout-cleanup-trigger.txt \
            .github/regex-inline-sourcegrid-publish-trigger.txt \
            .github/workflows/regex_drag_hotfix.yml \
            .github/workflows/regex_filter_layout_cleanup.yml \
            .github/workflows/regex_inline_sourcegrid_publish.yml \
            probes/cliphub_comprehensive_performance_probe_076.js \
            probes/cliphub_comprehensive_performance_probe_077.js \
            probes/cliphub_regex_066.js \
            probes/cliphub_regex_067.js \
            probes/cliphub_regex_068.js \
            probes/cliphub_regex_069.js \
            probes/cliphub_regex_070.js \
            probes/cliphub_regex_database_probe_052.js \
            probes/cliphub_regex_delete_confirm_rebuild_probe_067.md \
            probes/cliphub_regex_dynamic_consistency_probe_065.md \
            probes/cliphub_regex_feature_schema_probe_075.js \
            probes/cliphub_regex_filter_probe_056.js \
            probes/cliphub_regex_generation_probe_058.js \
            probes/cliphub_regex_inline_more_probe_074.js \
            probes/cliphub_regex_oversize_scan_probe_073.js \
            probes/cliphub_regex_pagination_probe_059.js \
            probes/cliphub_regex_repository_probe_053.js \
            probes/cliphub_regex_rollback_probe_060.md \
            probes/cliphub_regex_safety_policy_probe_072.js \
            probes/cliphub_regex_scan_probe_057.js \
            probes/cliphub_regex_settings_ime_probe_055.js \
            probes/cliphub_regex_settings_probe_054.js \
            probes/cliphub_regex_tester_lifecycle_probe_066.md \
            probes/cliphub_settings_tabs_probe_071.js \
            tools/apply_regex_filter_beta.py \
            tools/apply_regex_filter_layout_cleanup_v1.py \
            tools/apply_regex_inline_filter_layout.py \
            tools/apply_regex_inline_source_grid_v2.py \
            tools/apply_regex_inline_source_grid_v3.py \
            tools/apply_regex_inline_source_grid_v4.py \
            tools/apply_regex_inline_source_grid_v5.py \
            tools/regex_beta_patches/filter_regex_feature.jsfrag \
            tools/regex_beta_patches/filter_regex_inline_source_grid.jsfrag \
            tools/regex_beta_patches/repository_regex_feature.jsfrag \
            tools/regex_beta_patches/settings_regex_feature.jsfrag
          rmdir tools/regex_beta_patches 2>/dev/null || true

      - name: Remove Stage9 temporary workflows
        run: |
          rm -f .github/workflows/stage9_rc_audit_once.yml
          rm -f .github/workflows/stage9_rc_cleanup_once.yml

      - name: Validate runtime unchanged from Stage8
        run: |
          set -euo pipefail
          BASE=c3ded43bcc4dcee6095f9e5ce2051b4f6e772f34
          git diff --quiet "$BASE" -- ClipHub.js module-manifest.json tasks/
          for path in src/ch_*.js; do
            git diff --quiet "$BASE" -- "$path"
          done
          echo 'Stage9 runtime boundary: unchanged'

      - name: Validate no beta implementation residue remains
        run: |
          set -euo pipefail
          residue=$(find . -type f | sed 's#^./##' | grep -E '^(\.github/(regex-filter-layout-cleanup-trigger\.txt|regex-inline-sourcegrid-publish-trigger\.txt)|\.github/workflows/regex_.*\.yml|probes/cliphub_(regex|comprehensive_performance_probe_07[67])|tools/apply_regex_|tools/regex_beta_patches/)' || true)
          if [ -n "$residue" ]; then
            echo "$residue"
            exit 1
          fi
          test ! -e .github/workflows/stage9_rc_audit_once.yml
          test ! -e .github/workflows/stage9_rc_cleanup_once.yml
          echo 'Stage9 residue cleanup: passed'

      - name: Run formal beta preflight
        run: |
          python3 scripts/validate_es5.py .
          bash scripts/release_preflight.sh --settings-tabs-beta
          git diff --check

      - name: Verify remaining beta branch literals
        run: |
          set -euo pipefail
          git grep -n 'beta-regex-settings-tabs-20260814' -- . || true
          python3 - <<'PY'
          import subprocess
          allowed = {
              'ClipHub.js',
              'ClipHub_Beta浮窗开关.txt',
              'ClipHub_Beta状态查询.txt',
              'module-manifest.json',
              'scripts/release_preflight.sh',
          }
          p = subprocess.run(
              ['git','grep','-l','beta-regex-settings-tabs-20260814','--','.'],
              stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
              text=True, check=False)
          found = {line.strip() for line in p.stdout.splitlines() if line.strip()}
          unexpected = sorted(found - allowed)
          if unexpected:
              raise SystemExit('Unexpected beta branch hardcodes: ' + ', '.join(unexpected))
          print('Remaining beta hardcodes are release/promotion controlled:', ', '.join(sorted(found)))
          PY

      - name: Commit and push cleanup
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No cleanup changes'
            exit 0
          fi
          git commit -m "Stage9清理RC前Beta实施残留"
          git push origin HEAD:beta-regex-settings-tabs-20260814
