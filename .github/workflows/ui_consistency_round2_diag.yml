name: UI Consistency Round2 Implementation

on:
  push:
    branches: [beta-regex-settings-tabs-20260814]
    paths:
      - .github/workflows/ui_consistency_round2_diag.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded UI consistency round2 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ui_consistency_round2_runner.py

      - name: Validate syntax integrity and boundaries
        shell: bash
        run: |
          set -euo pipefail
          node --check src/ch_10_editor.js
          node --check src/ch_12_translation.js
          node --check src/ch_17_tokenizer_ui.js
          node --check /tmp/tokenizer_ui_round2_source.js
          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict | tee /tmp/ui-round2-color.txt
          grep '^HIGH=0 WARN=0 ' /tmp/ui-round2-color.txt
          git diff --check

          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, re, subprocess
          root = pathlib.Path('.')
          manifest = json.loads((root / 'module-manifest.json').read_text(encoding='utf-8'))
          assert manifest.get('schemaVersion') == 1
          assert manifest.get('moduleSetVersion') == '20260815.03'
          assert manifest.get('entryMinVersion') == 6
          assert manifest.get('sourceRef') == 'beta-regex-settings-tabs-20260814'
          assert len(manifest.get('modules', [])) == 16

          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          for item in manifest['modules']:
              path = root / item['path']
              assert path.is_file(), path
              assert blob_sha(path.read_bytes()) == item['sha'], item['name']

          loader = (root / 'src/ch_17_tokenizer_ui.js').read_text(encoding='utf-8')
          expected = re.search(r'var\s+SOURCE_SHA256\s*=\s*"([0-9a-f]+)";', loader)
          assignment = re.search(r'var\s+PACKED_B64\s*=\s*(.*?);\s*\n\s*function\s+hexSha256', loader, re.S)
          assert expected is not None and assignment is not None
          pieces = re.findall(r'"(?:\\.|[^"\\])*"', assignment.group(1))
          encoded = ''.join(json.loads(piece) for piece in pieces)
          source = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          assert hashlib.sha256(source.encode('utf-8')).hexdigest() == expected.group(1)

          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == {
              'module-manifest.json',
              'src/ch_10_editor.js',
              'src/ch_12_translation.js',
              'src/ch_17_tokenizer_ui.js',
          }, changed
          print('manifest_integrity_and_change_boundary=passed')
          PY

          test -z "$(git diff -- src/ch_03_database.js src/ch_06_repository.js src/ch_07_theme.js src/ch_08_window.js src/ch_11_filter.js src/ch_13_settings.js src/ch_15_app.js)"

          grep -Fq 'MODULE_VERSION: 26' src/ch_10_editor.js
          grep -Fq 'new LinearLayout.LayoutParams(dp(36), dp(36))' src/ch_10_editor.js
          grep -Fq 'params.rightMargin = dp(6);' src/ch_10_editor.js
          grep -Fq 'requestExit("cancel_button")' src/ch_10_editor.js
          grep -Fq 'saveFromInput();' src/ch_10_editor.js

          grep -Fq 'MODULE_VERSION: 15' src/ch_12_translation.js
          grep -Fq 'var view = translationText(text, 12,' src/ch_12_translation.js
          grep -Fq 'new LinearLayout.LayoutParams(dp(36), dp(36))' src/ch_12_translation.js
          grep -Fq 'new LinearLayout.LayoutParams(0, dp(42), 1)' src/ch_12_translation.js
          grep -Fq 'copyTranslatedText' src/ch_12_translation.js
          grep -Fq 'replaceOriginalText' src/ch_12_translation.js
          grep -Fq 'saveTranslationAsNew' src/ch_12_translation.js
          grep -Fq 'beginTranslation' src/ch_12_translation.js

          grep -Fq 'var title = makeText("分词", 17' /tmp/tokenizer_ui_round2_source.js
          grep -Fq 'new LinearLayout.LayoutParams(dp(36), dp(36))' /tmp/tokenizer_ui_round2_source.js
          grep -Fq 'var labelView = makeText(label, 12,' /tmp/tokenizer_ui_round2_source.js
          grep -Fq 'danger ? colors.danger : colors.stroke, 13);' /tmp/tokenizer_ui_round2_source.js
          grep -Fq 'returnToEditor("header_back")' /tmp/tokenizer_ui_round2_source.js
          grep -Fq 'emitAction("rule", {})' /tmp/tokenizer_ui_round2_source.js
          grep -Fq 'emitAction("help", {})' /tmp/tokenizer_ui_round2_source.js
          grep -Fq 'emitAction(action, {})' /tmp/tokenizer_ui_round2_source.js
          grep -Fq 'makeTokenTouchListener(index)' /tmp/tokenizer_ui_round2_source.js
          grep -Fq 'performToolbarClick(action)' /tmp/tokenizer_ui_round2_source.js
          grep -Fq 'performPopupActionClick(action)' /tmp/tokenizer_ui_round2_source.js

      - name: Commit verified round2 patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/ui_consistency_round2_diag.yml ui_consistency_round2_diag.txt tools/ui_consistency_round2_20260815.py tools/ui_consistency_round2_runner.py
          git add src/ch_10_editor.js src/ch_12_translation.js src/ch_17_tokenizer_ui.js module-manifest.json
          git diff --cached --check
          git diff --cached --stat
          git commit -m "统一编辑翻译分词页面按钮与文字尺寸"
          git push origin HEAD:beta-regex-settings-tabs-20260814
