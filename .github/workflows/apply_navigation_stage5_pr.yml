name: Apply Navigation Stage 5 PR

on:
  pull_request:
    branches:
      - fix/editor-embedded-back-capture-20260818

permissions:
  contents: write

jobs:
  apply-stage5:
    if: github.head_ref == 'refactor/navigation-contract-v2-20260818'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/navigation-contract-v2-20260818
          fetch-depth: 0
      - name: Apply Stage 5 if pending
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'function consumeImeBackFirst()' src/ch_16_ui_shell.js; then
            echo 'Stage 5 already applied'
            exit 0
          fi
          python3 scripts/apply_navigation_stage5.py
      - name: Regression gates
        shell: bash
        run: |
          set -euo pipefail
          node --check src/ch_16_ui_shell.js
          node scripts/test_navigation_contract_v1.js
          node scripts/test_navigation_stage2_3_contract.js
          node scripts/test_navigation_stage4_back_dispatcher.js
          node scripts/test_navigation_stage5_ime_priority.js
          node scripts/test_child_back_route_contract.js
          node scripts/test_editor_ime_back_rearm.js
          node scripts/test_runtime_diagnostics.js
          python3 scripts/test_primary_window_system_back.py
          python3 scripts/test_primary_window_legacy_routes.py
          python3 scripts/test_manifest_contract.py
          git diff --check
      - name: Commit Stage 5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ch_16_ui_shell.js module-manifest.json scripts/test_navigation_stage5_ime_priority.js docs/Navigation_Stage5_IME_Back_20260818.md
          if git diff --cached --quiet; then
            echo 'No Stage 5 changes'
            exit 0
          fi
          git commit -m 'refactor: centralize IME-first Back priority'
          git push origin HEAD:refactor/navigation-contract-v2-20260818
