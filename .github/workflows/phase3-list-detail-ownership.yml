name: ClipHub Phase 3 List Detail Ownership Active

on:
  push:
    branches:
      - agent/unify-window-geometry
    paths:
      - .github/workflows/phase3-list-detail-ownership.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/unify-window-geometry
          fetch-depth: 0

      - name: Apply bounded ownership cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/phase3_list_detail_ownership.py

      - name: Validate JavaScript and ownership boundary
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.js; do
            node --check "$file"
          done
          python3 -m json.tool module-manifest.json >/dev/null
          test -f src/ch_05_classifier.js
          grep -q 'MODULE_VERSION: 17' src/ch_09_list.js
          grep -q 'getDetailState: getDetailState' src/ch_09_list.js
          ! grep -n -E 'Translation\.close\("(list_hide|navigation)"\)|Settings\.close\("(list_hide|navigation)"\)|Translation\.getState\(\)|Settings\.getState\(\)' src/ch_09_list.js
          grep -q 'ClipHub\.Translation\.close("app_hide")' src/ch_15_app.js
          grep -q 'ClipHub\.Settings\.close("app_hide")' src/ch_15_app.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          manifest = json.loads(
              Path('module-manifest.json').read_text(encoding='utf-8')
          )
          assert manifest['moduleSetVersion'] == '20260724.32'
          assert len(manifest['modules']) == 15
          assert any(item['path'] == 'src/ch_05_classifier.js'
                     for item in manifest['modules'])
          for item in manifest['modules']:
              actual = subprocess.check_output(
                  ['git', 'hash-object', item['path']], text=True
              ).strip()
              assert actual == item['sha'], item['path']
          PY
          git diff --check

      - name: Commit phase 3 and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/phase3_list_detail_ownership.py
          rm -f .github/workflows/phase3-list-detail-ownership.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/ch_09_list.js module-manifest.json \
            scripts/phase3_list_detail_ownership.py \
            .github/workflows/phase3-list-detail-ownership.yml
          git diff --cached --stat
          git commit -m "明确 List 详情窗口所有权"
          git push origin HEAD:agent/unify-window-geometry
