name: Temporary filter module formalization

on:
  push:
    branches:
      - agent/unify-window-geometry
    paths:
      - .github/workflows/temporary_finalize_filter_module.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary_finalize_filter_module.yml

permissions:
  contents: write

concurrency:
  group: cliphub-finalize-filter-module
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/unify-window-geometry
          fetch-depth: 0

      - name: Relax temporary builder self-check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/temporary_finalize_filter_module.py')
          text = path.read_text(encoding='utf-8')
          old = "for forbidden in [\n    'advancedKeywordInput',"
          new = "for forbidden in [\n    'buildAdvancedKeywordInput',"
          if text.count(old) != 1:
              raise SystemExit('temporary builder forbidden-list site mismatch')
          text = text.replace(old, new, 1)
          old_loader = "    'compactCache',\n    'stableCache',\n    '.pending',\n    '.disabled',\n    '.failure.txt'"
          new_loader = "    'compactCache',\n    'stableCache',\n    'pendingFile',\n    'disabledFile',\n    'failureFile'"
          if text.count(old_loader) != 1:
              raise SystemExit('temporary builder loader-list site mismatch')
          path.write_text(text.replace(old_loader, new_loader, 1),
              encoding='utf-8')
          PY

      - name: Build direct filter module
        run: |
          set -o pipefail
          python3 scripts/temporary_finalize_filter_module.py 2>&1 | tee formalization.log

      - name: Validate direct module
        run: |
          node --check src/ch_11_filter.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess

          text = Path('src/ch_11_filter.js').read_text(encoding='utf-8')
          for pattern in [r'\b(?:let|const)\b', r'=>', r'`', r'\?\.', r'\?\?']:
              if re.search(pattern, text):
                  raise SystemExit('Rhino ES5 violation: ' + pattern)
          forbidden = [
              'var advancedKeywordInput',
              'advancedKeywordInput =',
              'advancedKeywordInput !==',
              'advancedKeywordInput ===',
              'advancedKeywordInput.get',
              'buildAdvancedKeywordInput',
              'performAdvancedKeywordFromInput',
              'performAdvancedKeywordSearch',
              '在筛选结果中搜索',
              'COMPACT_COMMIT',
              'COMPACT_BLOB',
              'fetchSource(',
              'eval(String(source))',
              'compactCache',
              'stableCache',
              'pendingFile',
              'disabledFile',
              'failureFile'
          ]
          for marker in forbidden:
              if marker in text:
                  lines = [line for line in text.splitlines() if marker in line]
                  raise SystemExit('forbidden marker remains: ' + marker +
                      ' :: ' + ' | '.join(lines[:8]))
          required = [
              'MODULE_VERSION: 32',
              'reference_search_v13_formal_filter',
              'function createFilterImeController(rootView, params)',
              'function startFilterImeAvoidance()',
              'function stopFilterImeAvoidance(restoreBeforeStop)',
              'startFilterImeAvoidance();',
              'getImeAvoidanceState: getFilterImeAvoidanceState',
              'FILTER_IME_AVOIDANCE: "formal_v32"',
              'advancedKeywordInputPresent: false',
              '"筛选(" + String(activeAdvancedFilterCount()) + ")"'
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit('required marker missing: ' + marker)
          if text.count('function showPanel(options)') != 1:
              raise SystemExit('showPanel definition count mismatch')
          if text.count('function closePanel(options)') != 1:
              raise SystemExit('closePanel definition count mismatch')
          if text.count('startFilterImeAvoidance();') != 1:
              raise SystemExit('IME start call count mismatch')
          manifest = json.loads(Path('module-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion') != '20260724.27':
              raise SystemExit('unexpected module set version')
          expected = subprocess.check_output(
              ['git', 'hash-object', 'src/ch_11_filter.js'], text=True
          ).strip()
          actual = next(item.get('sha') for item in manifest['modules']
              if item.get('path') == 'src/ch_11_filter.js')
          if actual != expected:
              raise SystemExit('manifest filter blob mismatch')
          PY
          git diff --check

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: filter-formalization-diagnostics
          path: |
            formalization.log
            src/ch_11_filter.js
          if-no-files-found: warn

      - name: Commit final module and remove temporary files
        run: |
          rm -f formalization.log
          rm -f scripts/temporary_finalize_filter_module.py
          rm -f .github/workflows/temporary_finalize_filter_module.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: formalize direct filter module"
          git push origin HEAD:agent/unify-window-geometry
