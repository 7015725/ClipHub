name: ClipHub Stage11 Final Validation

on:
  push:
    branches:
      - agent/beta-list-preview-on-demand-20260808
    paths:
      - .github/workflows/cliphub_stage11_final_validation.yml
      - ClipHub_分页阶段11首页预览按需正文测试入口.txt
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - beta-pagination-stage10-20260808

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rhino ES5 validation
        run: python scripts/validate_es5.py .

      - name: JavaScript syntax validation
        run: |
          node --check ClipHub.js
          node --check src/ch_06_repository.js
          node --check src/ch_09_list.js
          node --check src/ch_11_filter.js
          cp "ClipHub_分页阶段11首页预览按需正文测试入口.txt" /tmp/cliphub_stage11_test.js
          node --check /tmp/cliphub_stage11_test.js

      - name: Manifest and packed-source validation
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root / 'module-manifest.json').read_text(encoding='utf-8'))
          assert manifest['moduleSetVersion'] == '20260808.02'
          assert manifest['entryMinVersion'] == 6
          assert manifest['sourceRef'] == 'agent/beta-list-preview-on-demand-20260808'
          assert len(manifest['modules']) == 15

          def blob_sha(path):
              data = path.read_bytes()
              return hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()

          for item in manifest['modules']:
              assert blob_sha(root / item['path']) == item['sha'], item['name']

          frozen = {
              'ch_08_window.js': '4ccff8067656ae51602290c884081795ec0f65ea',
              'ch_10_editor.js': 'a6ef71e9f08302473a06eb1628cd471dd118d084',
              'ch_12_translation.js': '88d2bdc4658434ef9eb97fd25c3f3cab5ee14ec8',
              'ch_13_settings.js': '7826055348bfce1682e6191a29dd34cdc1bdf2f3',
              'ch_15_app.js': 'ff60665e8ddd34bd96fa276cc7b632ca73a56845',
          }
          manifest_map = {x['name']: x['sha'] for x in manifest['modules']}
          for name, expected in frozen.items():
              assert manifest_map[name] == expected, name

          repo_wrapper = (root / 'src/ch_06_repository.js').read_text(encoding='utf-8')
          encoded_match = re.search(r'(?s)\bvar\s+encoded\s*=\s*(.*?);\s*\n', repo_wrapper)
          assert encoded_match
          chunks = re.findall(r'"([A-Za-z0-9+/=]+)"', encoded_match.group(1))
          repo_source = gzip.decompress(base64.b64decode(''.join(chunks))).decode('utf-8')
          assert 'var LIST_PREVIEW_CHAR_LIMIT = 200;' in repo_source
          assert 'function itemSelectColumns(previewOnly)' in repo_source
          assert 'itemSelectColumns(options.previewOnly === true)' in repo_source
          assert 'function listItemsByIds(itemIds, previewOnly)' in repo_source
          assert 'itemSelectColumns(previewOnly === true)' in repo_source
          assert 'clipboard_items.content LIKE ?' in repo_source
          assert 'function getItem(id, includeDeleted)' in repo_source
          assert 'MODULE_VERSION: 16' in repo_source
          assert 'LIST_PREVIEW_CHAR_LIMIT: LIST_PREVIEW_CHAR_LIMIT' in repo_source

          loader = (root / 'src/ch_11_filter.js').read_text(encoding='utf-8')
          packed_sha = re.search(r'var PACKED_SHA256\s*=\s*\n?\s*"([0-9a-f]{64})"', loader).group(1)
          source_sha = re.search(r'var SOURCE_SHA256\s*=\s*\n?\s*"([0-9a-f]{64})"', loader).group(1)
          packed = ''.join(
              (root / ('stage-assets/pagination-stage9/ch11_full_v4_%02d.b64' % i))
              .read_text(encoding='utf-8')
              for i in range(8)
          )
          packed = re.sub(r'\s+', '', packed)
          assert hashlib.sha256(packed.encode('utf-8')).hexdigest() == packed_sha
          filter_source = gzip.decompress(base64.b64decode(packed)).decode('utf-8')
          assert hashlib.sha256(filter_source.encode('utf-8')).hexdigest() == source_sha
          assert 'MODULE_VERSION: 49' in filter_source
          assert 'options.previewOnly = true;' in filter_source
          assert 'listItemsByIds(rowIds, true)' in filter_source
          assert 'function fullResultRowById(row, origin)' in filter_source
          assert 'function resultPreviewText(row)' in filter_source
          assert 'fullContentLoaded: false' in filter_source
          assert 'VIRTUAL_BEFORE_SCREENS = 3' in filter_source
          assert 'VIRTUAL_AFTER_SCREENS = 5' in filter_source
          assert 'VIRTUAL_UPDATE_DELAY_MS = 24' in filter_source
          assert 'PAGINATION_STAGE = 9' in filter_source

          list_source = (root / 'src/ch_09_list.js').read_text(encoding='utf-8')
          assert 'MODULE_VERSION: 20' in list_source
          assert 'ClipHub.Repository.getItem(Number(row.id), false)' in list_source
          assert 'ClipHub.List.openDetail(Number(items[index].id))' in list_source
          assert 'previewOnly: true, limit: limit' in list_source

          print('ClipHub Stage11 final validation: PASS')
          print('moduleSetVersion=20260808.02 modules=15')
          print('Repository=16 List=20 Filter=49 PAGINATION_STAGE=9')
          print('virtualBuffer=3/5 virtualUpdateDelayMs=24')
          PY
