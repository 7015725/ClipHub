name: Apply Navigation Stage 8 PR
on:
  pull_request:
    branches: [fix/editor-embedded-back-capture-20260818]
permissions:
  contents: write
jobs:
  apply-stage8:
    if: github.head_ref == 'refactor/navigation-contract-v2-20260818'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/navigation-contract-v2-20260818
          fetch-depth: 0
      - name: Apply
        run: |
          if grep -Fq 'function runtimePageUsesModule(pageId, moduleName)' src/ch_16_ui_shell.js; then exit 0; fi
          python3 scripts/apply_navigation_stage8.py
      - name: Gate
        run: |
          set -e
          node --check src/ch_16_ui_shell.js
          node scripts/test_navigation_contract_v1.js
          node scripts/test_navigation_stage2_3_contract.js
          node scripts/test_navigation_stage4_back_dispatcher.js
          node scripts/test_navigation_stage5_ime_priority.js
          node scripts/test_navigation_stage6_page_registry.js
          node scripts/test_navigation_stage7_page_contract.js
          node scripts/test_navigation_stage8_no_page_hardcoding.js
          node scripts/test_child_back_route_contract.js
          node scripts/test_editor_ime_back_rearm.js
          node scripts/test_runtime_diagnostics.js
          python3 scripts/test_primary_window_system_back.py
          python3 scripts/test_primary_window_legacy_routes.py
          python3 scripts/test_manifest_contract.py
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ch_16_ui_shell.js module-manifest.json scripts/test_navigation_stage8_no_page_hardcoding.js docs/Navigation_Stage8_Core_Hardcoding_20260818.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: remove page-id branching from navigation core'
          git push origin HEAD:refactor/navigation-contract-v2-20260818
