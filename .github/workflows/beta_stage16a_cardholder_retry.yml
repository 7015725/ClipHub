name: Beta Stage16A CardHolder Retry
# trigger-v2
on:
  push:
    branches: [beta-pagination-stage10-20260808]
    paths:
      - .github/workflows/beta_stage16a_cardholder_retry.yml
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run corrected Stage16A builder
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          wf=pathlib.Path('.github/workflows/beta_stage16a_cardholder_binding.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          end_marker="\n          PY\n"
          body=wf.split(marker,1)[1].split(end_marker,1)[0]
          lines=[]
          for line in body.splitlines():
              if line.startswith('          '): line=line[10:]
              lines.append(line)
          script='\n'.join(lines)+'\n'
          old='source.indexOf("performSwipeAction(row, direction") >= 0)'
          new='source.indexOf("                            performSwipeAction(row, direction, foreground);") >= 0)'
          if old not in script:
              raise SystemExit('stale check patch anchor missing')
          script=script.replace(old,new,1)
          exec(compile(script,'stage16a_builder_corrected.py','exec'),{'__name__':'__main__'})
          PY
          node --check src/ch_11_filter.js
          node /tmp/stage16a_harness.js
          node --check /tmp/filter58.js
          ! grep -Eq '(^|[^A-Za-z0-9_])(let|const|class)[[:space:]]|=>' /tmp/filter58.js
          grep -Fq 'MODULE_VERSION: 58' /tmp/filter58.js
          grep -Fq 'function currentCardHolderRow(holder)' /tmp/filter58.js
          grep -Fq 'editResultRow(currentCardHolderRow(holder),' /tmp/filter58.js
          grep -Fq 'translateResultRow(currentCardHolderRow(holder),' /tmp/filter58.js
          grep -Fq 'copyResultRow(currentCardHolderRow(holder),' /tmp/filter58.js
          grep -Fq 'deleteResultRow(currentCardHolderRow(holder),' /tmp/filter58.js
          grep -Fq 'inputResultRow(currentCardHolderRow(holder),' /tmp/filter58.js
          grep -Fq 'bindSwipeGesture(holder, wrapper' /tmp/filter58.js
          grep -Fq 'currentCardHolderRow(holder),' /tmp/filter58.js
          ! grep -Fq '                            performSwipeAction(row, direction, foreground);' /tmp/filter58.js
          grep -Fq 'sameRangeNoLayoutCount' /tmp/filter58.js
          grep -Fq 'slowRebuildSamples' /tmp/filter58.js
          grep -Fq 'var VIRTUAL_BEFORE_SCREENS = 3;' /tmp/filter58.js
          grep -Fq 'var VIRTUAL_AFTER_SCREENS = 5;' /tmp/filter58.js
          grep -Fq 'var VIRTUAL_UPDATE_DELAY_MS = 24;' /tmp/filter58.js
          test "$(grep -Fo '.newSingleThreadExecutor();' /tmp/filter58.js | wc -l)" -eq 1
          ! grep -Fq 'resultTagBadgeViews' /tmp/filter58.js
          ! grep -Fq 'refreshRenderedTagBadges' /tmp/filter58.js
          grep -Fq '"moduleSetVersion": "20260808.12"' module-manifest.json
          git diff --check
      - name: Commit Filter58 atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/beta_stage16a_cardholder_binding.yml .github/workflows/beta_stage16a_cardholder_retry.yml .github/workflows/beta_stage16a_build_diag.yml .github/workflows/beta_stage16_cardholder_diag.yml stage16_cardholder_diag.txt stage16a_build_error.txt
          git add src/ch_11_filter.js module-manifest.json
          git diff --cached --check
          git commit -m "安全化 Beta CardHolder 动作绑定"
          git push
