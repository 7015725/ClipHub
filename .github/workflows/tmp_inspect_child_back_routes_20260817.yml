name: Temp Inspect Child Back Routes 20260817

on:
  push:
    branches:
      - cleanup/tokenizer-no-regression-20260817
    paths:
      - .github/workflows/tmp_inspect_child_back_routes_20260817.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/tokenizer-no-regression-20260817
      - name: Expand and print nested Back targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, json, re
          def expand(path):
              text = Path(path).read_text(encoding='utf-8')
              m = re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);', text, re.S)
              if not m: return text
              pieces = re.findall(r'"(?:\\.|[^"\\])*"', m.group(1))
              return gzip.decompress(base64.b64decode(''.join(json.loads(x) for x in pieces))).decode('utf-8')
          def body(source, name):
              start = source.find('function ' + name + '(')
              if start < 0: return '<missing ' + name + '>'
              brace = source.find('{', start); depth = 0; quote = None; esc = False
              for i in range(brace, len(source)):
                  c = source[i]
                  if quote:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == quote: quote = None
                      continue
                  if c in ('"', "'"): quote = c; continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0: return source[start:i+1]
              return '<unterminated ' + name + '>'
          cases = [
              ('SETTINGS', 'src/ch_13_settings.js', [
                  'handleSettingsBack', 'settingsShellPath', 'settingsShellPageId',
                  'setSettingsPage', 'openRegexRulesPage', 'openRegexRuleEditorPage',
                  'openRegexTestPage'
              ]),
              ('TOKENIZER', 'src/ch_17_tokenizer_ui.js', [
                  'returnToEditor', 'returnToTokenizerRulesDrawer',
                  'tokenizerPagePath', 'openTokenizerRulesDrawer',
                  'openFromHomeItem', 'mountFromEditor'
              ])
          ]
          for label, path, names in cases:
              source = expand(path)
              print('\n===== ' + label + ' =====')
              for name in names:
                  print('\n--- ' + name + ' ---')
                  print(body(source, name)[:16000])
          PY
