name: ClipHub Phase 4 List Renderer Cleanup

on:
  push:
    branches:
      - agent/unify-window-geometry
    paths:
      - .github/workflows/phase4-list-renderer-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/unify-window-geometry
          fetch-depth: 0

      - name: Apply guarded cleanup
        run: python3 scripts/phase4_list_renderer_cleanup.py

      - name: Validate JavaScript syntax
        run: |
          for file in src/*.js; do
            node --check "$file"
          done

      - name: Validate List boundary
        run: |
          grep -q 'MODULE_VERSION: 18' src/ch_09_list.js
          grep -q 'getDetailState: getDetailState' src/ch_09_list.js
          grep -q 'deleteItem: function' src/ch_09_list.js
          grep -q 'undoLastDelete: undoLastDelete' src/ch_09_list.js
          grep -q 'togglePinned: function' src/ch_09_list.js
          grep -q 'performReorder: function' src/ch_09_list.js
          ! grep -q 'function buildContent(rows)' src/ch_09_list.js
          ! grep -q 'function renderRows(rows)' src/ch_09_list.js
          ! grep -q 'selectionMode' src/ch_09_list.js
          ! grep -q 'filterPanelSuspended' src/ch_09_list.js
          ! grep -q 'reorderViews' src/ch_09_list.js
          ! grep -q 'cardContainers' src/ch_09_list.js
          ! grep -q 'detailRestoreList' src/ch_09_list.js
          grep -q 'ClipHub.Repository.softDeleteItem' src/ch_11_filter.js
          grep -q 'ClipHub.Clipboard.writeText' src/ch_11_filter.js
          grep -q 'ClipHub.Editor.openItem' src/ch_11_filter.js

      - name: Validate manifest
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          manifest = json.loads(Path('module-manifest.json').read_text())
          assert manifest['moduleSetVersion'] == '20260724.33'
          assert len(manifest['modules']) == 15
          for module in manifest['modules']:
              actual = subprocess.check_output(
                  ['git', 'hash-object', module['path']], text=True).strip()
              assert actual == module['sha'], (module['path'], actual, module['sha'])
          PY
          git diff --check

      - name: Commit final cleanup
        run: |
          rm -f scripts/phase4_list_renderer_cleanup.py
          rm -f .github/workflows/phase4-list-renderer-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '清理 List 旧首页渲染残留'
          git push origin HEAD:agent/unify-window-geometry

