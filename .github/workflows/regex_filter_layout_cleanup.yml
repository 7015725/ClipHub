name: Regex Filter Layout Cleanup

on:
  push:
    branches: [beta-regex-filter-20260813]
    paths:
      - .github/regex-filter-layout-cleanup-trigger.txt

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify locked Filter79 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('.')
          manifest = json.loads((root / 'module-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion') != '20260813.08':
              raise SystemExit('unexpected moduleSetVersion: ' + str(manifest.get('moduleSetVersion')))
          if manifest.get('sourceRef') != 'beta-regex-filter-20260813':
              raise SystemExit('unexpected sourceRef')
          data = (root / 'src/ch_11_filter.js').read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          if blob != '80f1761089a9728e8e3ccbae7246dc175ab9cd2e':
              raise SystemExit('unexpected Filter79 baseline blob: ' + blob)
          print('baseline_ok')
          PY

      - name: Generate Filter80 advanced-filter cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_regex_filter_layout_cleanup_v1.py

      - name: Verify target and regression boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, re

          root = pathlib.Path('.')
          loader_path = root / 'src/ch_11_filter.js'
          loader = loader_path.read_text(encoding='utf-8')
          data = loader.encode('utf-8')
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assignment = re.search(r'\bvar\s+(?:PACKED_B64|encoded)\s*=\s*(.*?);', loader, re.S)
          if assignment is None:
              raise SystemExit('packed Filter assignment missing')
          pieces = re.findall(r'"(?:\\.|[^"\\])*"', assignment.group(1))
          encoded = ''.join(json.loads(piece) for piece in pieces)
          source = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')

          title_only = (
              '    function regexRulePickerLabel(rule) {\n'
              '        return String(rule && rule.title || "");\n'
              '    }'
          )
          latest_only = (
              '    function validateSortMode(mode) {\n'
              '        return "latest";\n'
              '    }'
          )

          required = [
              'MODULE_VERSION: 80',
              title_only,
              latest_only,
              'sortMode: validateSortMode(input.sortMode)',
              'setSortMode: function (mode, options)',
              'addRegexInlineSection(content, colors, bundle);',
              '正则规则（多选）',
              '任意规则 OR',
              '全部规则 AND',
              '来源应用（多选）',
              '置顶状态',
              '敏感内容',
              'function startRegexScan(',
              'function regexResultPageResult(',
              'MAX_REGEX_CACHE_ENTRIES = 8',
              'MAX_REGEX_CACHE_IDS = 16000',
              'enabledOnly: true, titleKeyword: keyword || ""'
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit('required contract missing: ' + marker)

          forbidden = [
              'addChoiceSection(content, "排序方式"',
              '        sortRow = makeChoiceChipRow(['
          ]
          for marker in forbidden:
              if marker in source:
                  raise SystemExit('removed sort UI still present: ' + marker)

          label_start = source.find('    function regexRulePickerLabel(rule) {')
          label_end = source.find('\n    function ', label_start + 1)
          label_block = source[label_start:label_end]
          if 'rule.note' in label_block or ' · ' in label_block:
              raise SystemExit('Regex label still exposes note/description')

          fragment = (root / 'tools/regex_beta_patches/filter_regex_feature.jsfrag').read_text(encoding='utf-8')
          if title_only not in fragment:
              raise SystemExit('Regex fragment title-only contract missing')
          frag_start = fragment.find('    function regexRulePickerLabel(rule) {')
          frag_end = fragment.find('\n    function ', frag_start + 1)
          if 'rule.note' in fragment[frag_start:frag_end]:
              raise SystemExit('Regex fragment still exposes note')

          manifest = json.loads((root / 'module-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('moduleSetVersion') != '20260813.09':
              raise SystemExit('manifest did not advance to .09')
          if manifest.get('sourceRef') != 'beta-regex-filter-20260813':
              raise SystemExit('manifest sourceRef changed')
          entries = [x for x in manifest.get('modules', []) if x.get('name') == 'ch_11_filter.js']
          if len(entries) != 1 or entries[0].get('sha') != blob:
              raise SystemExit('manifest Filter SHA mismatch')

          print('generated_filter_blob=' + blob)
          print('generated_source_sha256=' + hashlib.sha256(source.encode('utf-8')).hexdigest())
          print('filter80_boundary_contracts_ok')
          PY

          python3 scripts/validate_es5.py .
          python3 scripts/audit_color_api.py --release-strict | tee /tmp/regex-layout-cleanup-color.txt
          grep '^HIGH=0 WARN=0 ' /tmp/regex-layout-cleanup-color.txt
          bash scripts/release_preflight.sh --regex-beta
          git diff --check

      - name: Enforce changed-file boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
              'module-manifest.json',
              'scripts/release_preflight.sh',
              'src/ch_11_filter.js',
              'tools/regex_beta_patches/filter_regex_feature.jsfrag',
          }
          changed = set(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True).splitlines()))
          if changed != expected:
              raise SystemExit('changed-file boundary mismatch: ' + repr(sorted(changed)))
          print('changed_file_boundary_ok')
          PY

      - name: Commit verified Filter80 module set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ch_11_filter.js \
                  module-manifest.json \
                  scripts/release_preflight.sh \
                  tools/regex_beta_patches/filter_regex_feature.jsfrag
          git diff --cached --check
          git diff --cached --stat
          git commit -m "收口高级筛选布局并简化 Regex 标题"
          git push origin HEAD:beta-regex-filter-20260813
